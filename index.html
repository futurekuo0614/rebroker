供役地所有權本質上的限縮", "若甲在A 地上蓋房子，因為土地測量單位的疏失，該建築有30 公分越界到B 地，此時乙得知此狀況，若沒有馬上阻止，則之後仍可請求甲拆屋還地"], "R11301", "因土地所有人「任意行為」（自築高牆）造成的袋地，不享有法定通行權，須經鄰地同意（第 789 條意旨／第 787 條但書）。(D) 知越界而不即提出異議者不得請求移去（第 796 條）。", "", ""], ["C", "甲、乙結婚後未約定夫妻財產制時，下列有關甲、乙間之配偶財產關係之論述，何者錯誤？", ["甲所有之婚前購買之有價證券，於甲、乙婚後，甲取得該有價證券分配之股息或利息，於甲、乙離婚時，乙得主張該分配之股息或利息，納入剩餘財產為分配計算之標的", "甲於婚後以自己之財產清償乙所負之債務後，即使在婚姻關係中，仍得請求乙償還", "甲、乙離婚時，對於婚後乙受贈之財產，如未經贈與人以書面聲明為乙之特有財產時，即應納入乙之婚後財產，成為剩餘財產分配計算之標的", "甲、乙離婚時，乙知悉剩餘財產分配計算之差額，僅得自法定財產關係消滅時起2 年內，向甲主張給付該差額之二分之一"], "R11401", "因繼承或其他「無償取得」的財產，本來就不列入剩餘財產分配（第 1030-1 條），不需要贈與人書面聲明。(D) 請求權自知悉差額起 2 年。", "", ""], ["D", "民法對於法定繼承人及其順序，於第1138 條設有明文規定。下列相關之說明，何者正確？", ["被繼承人死亡時之配偶，於被繼承人死亡後2 年內再婚者，喪失其原已取得之繼承權", "被繼承人死亡時，其已出家之子女，無繼承之資格與地位", "養子女與養父母之親生子女，雖因法律擬制而為旁系親屬，然因欠缺真實血緣關係，非屬民法第1138 條第3 順位之法定繼承人", "父再婚之後妻，與前妻之子女，僅為直系姻親關係，因此後妻對於前妻子女之死亡，無繼承其遺產之權利"], "R11402", "姻親（後母與前妻子女）沒有繼承權。(A) 配偶再婚不喪失已取得的繼承權；(B) 出家仍有繼承權；(C) 養子女與養父母的親生子女屬兄弟姊妹，是第 3 順序繼承人。", "", ""], ["A", "我國現行民法對於繼承制度，原則上採取概括繼承有限責任之規範型態。下列何者屬於正確之敘述？", ["概括繼承人如對於被繼承人生前享有權利或負擔義務，不因被繼承人之死亡而隨之消滅", "第1138 條所定第1 順序之繼承人中有拋棄繼承權者，其應繼分應由其直系血親卑親屬代位繼承之", "繼承人對於被繼承人所遺留之債務，對於被繼承人之債權人，負連帶清償之責任", "拋棄繼承者，就自己所管理之遺產，於其他繼承人或遺產管理人開始管理前，應以善良管理人之注意義務，繼續管理該遺產"], "R11402", "繼承人自繼承開始承受被繼承人財產上一切權利義務（第 1148 條）。(B) 拋棄繼承的應繼分歸其他同順序繼承人，不是代位繼承；(C) 連帶責任以所得遺產為限（第 1153 條）；(D) 拋棄者管理遺產只須盡「與處理自己事務同一」之注意（第 1176-1 條）。", "", ""], ["A", "依我國民法有關遺囑之規定，下列敘述何者錯誤？", ["甲立遺囑，遺囑中將A 地贈與好友乙。乙於甲之遺囑生效前意外死亡，其後甲重病身亡，乙之繼承人丙得向甲之繼承人丁請求移轉交付A 地所有權予自己", "甲遺囑中遺贈予乙之A 車，因丙之過失毀損，甲之遺囑生效時，推定對丙之權利成為遺贈之客體，乙得向甲之繼承人丁請求移轉該權利予自己", "甲以遺囑贈與A 屋予好友乙，遺囑生效時，甲之繼承人丙寄存證信函請求乙30 日內回函確認，乙置之不理，期限屆滿時，該遺囑中之遺贈，仍然確定生效", "甲以遺囑贈與A 屋予好友乙，遺囑生效前，甲將A 屋出賣予丙取得價金1 千萬元之債權，甲請求丙將該價金1 千萬元直接捐贈予丁慈善基金會。甲之遺囑生效時，遺囑中A 屋之遺贈應屬無效"], "R11402", "受遺贈人於遺囑生效前死亡，遺贈不生效力（第 1201 條），乙的繼承人丙不能請求。", "", ""], ["D", "關於生前特種贈與的歸扣，下列何者錯誤？", ["生前特種贈與，包括因結婚、分居、營業所為之贈與", "須有其他繼承人行使歸扣權，始須歸扣", "一般認為，生前特種贈與之被繼承人有應繼分前付之意思", "即使被繼承人於贈與時有反對意思表示，仍應歸扣"], "R11402", "被繼承人於贈與時有反對意思表示的，就不必歸扣（第 1173 條但書），(D) 錯。歸扣對象是因結婚、分居、營業所為的贈與。", "", ""], ["B", "甲夫乙妻，一起到夏威夷旅遊，租車亂跑，不幸墜入山谷。下列何者錯誤？", ["甲、乙被發現時，由屍體的腐壞程度可以斷定甲比乙早10 小時死亡，則乙為甲的繼承人", "甲、乙被發現時，即使經過法醫相驗，也無法確定誰先死，則雙方互為繼承人", "3 年前，甲的家人為了擔心乙分家產，要求甲把全部的財產贈與給甲母，才允許雙方登記結婚此次事故甲死乙傷，乙無法對甲母主張詐害債權的撤銷", "該事故實則是乙為了取得甲大筆的遺產所製造的車禍，若甲死乙傷，乙將喪失對甲的繼承權"], "R11101", "同時遇難不能證明死亡先後，推定「同時死亡」（第 11 條），彼此不互為繼承人。", "", ""]]}, {"id": "p113c", "label": "113年・民法概要", "year": 113, "subj": "R11", "qs": [["C", "甲就其所有之A 地，先與乙訂立買賣契約，後與丙訂立買賣契約，均未辦理所有權移轉登記。關於二個買賣契約之效力，下列敘述，何者正確？", ["前契約有效，後契約無效", "前契約無效，後契約有效", "前契約有效，後契約有效", "前契約無效，後契約無效"], "R11201", "買賣是債權契約，一物二賣時兩個契約都有效（債權具相容性）；誰取得所有權看誰先完成移轉登記，未履行的一方只能向出賣人請求債務不履行賠償。", "", ""], ["B", "有關行為能力之敘述，下列何者正確？", ["年滿30 歲患有精神疾病致無法處理自己事務之甲，當然沒有行為能力", "年滿19 歲之乙可以獨自訂立買賣汽車之契約", "受輔助宣告之丙可以不經輔助人丁之同意贈與使用過之筆電給戊", "15 歲之庚可以不經法定代理人允許擅自丟棄自有之平板電腦"], "R11101", "民法 112 年起 18 歲成年，19 歲的乙有完全行為能力。(A) 精神疾病須經法院監護宣告才無行為能力；(C) 受輔助宣告者為贈與須經輔助人同意（第 15-2 條）；(D) 拋棄所有權屬單獨行為，限制行為能力人須得允許。", "", ""], ["B", "甲將其所有之名畫出租於乙，並未將代理權授與乙。詎料，乙竟以甲之代理人名義，與善意之丙訂立買賣契約，將名畫出賣並交付於丙。甲不承認乙之無權代理行為，下列敘述，何者正確？", ["丙善意取得名畫之所有權", "丙得請求乙損害賠償", "乙與丙之買賣契約有效", "乙與丙之物權契約有效"], "R11103", "無權代理人對善意相對人負損害賠償責任（第 110 條）。(A) 名畫是丙從無處分權的乙「以甲名義」受讓，屬無權代理而非無權處分，不適用善意取得；買賣與物權契約均因甲不承認而對甲不生效力。", "", ""], ["B", "甲對乙有新臺幣（下同）100 萬元之債權，將該債權讓與丙，甲與丙均未通知乙債權讓與之事情。嗣後，乙因不知債權讓與之事情，對甲清償100 萬元，經甲受領，下列敘述，何者正確？", ["甲與丙之債權讓與無效", "乙之債務因清償而消滅", "應經丙承認，乙之債務始消滅", "甲與丙之債權讓與應經乙承認始生效"], "R11201", "債權讓與非經讓與人或受讓人通知債務人，對債務人不生效力（第 297 條）；乙不知情向原債權人甲清償，債務消滅，丙只能向甲請求。讓與本身不需債務人同意。", "", ""], ["B", "甲申請之建案因違法無法取得建造許可，遂與乙約定，由甲贈與乙之妻丙100 萬元後，乙須幫助甲取得建造許可，後來乙收賄之行為經法院判決有罪確定。問甲可否向丙請求返還100 萬元？", ["可以，依據不當得利", "不可，100 萬元為不法原因之給付", "可以，100 萬為違背公序良俗之給付", "可以，依據無因管理"], "R11201", "因不法原因而為給付者，不得請求返還（第 180 條第 4 款）；行賄給付屬不法原因給付。", "", ""], ["B", "甲無權占有乙所有已登記之A 地15 年後，乙對甲提起所有物返還請求之訴訟，下列敘述，何者正確？", ["甲得對乙為消滅時效之抗辯", "乙之回復請求權不罹於消滅時效", "甲得對乙主張時效取得A 地所有權", "乙之A 地所有權因罹於時效而消滅"], "R11103", "已登記不動產的所有物返還請求權不適用消滅時效（司法院釋字第 107、164 號）。已登記土地也不能因時效取得所有權（第 769 條以未登記為要件）。", "", ""], ["C", "甲與乙訂立租賃契約，將丙所有之A 屋出租於乙，並交付於乙。嗣後，丙對乙起訴，請求乙返還A 屋，致乙不能為約定之使用，下列敘述，何者正確？", ["甲與乙訂立之租賃契約無效", "甲與乙訂立之租賃契約得撤銷", "乙得終止與甲訂立之租賃契約", "乙得以與甲之租賃契約對抗丙"], "R11202", "出租人的權利瑕疵致承租人不能為約定使用收益，承租人得終止契約（第 436 條準用）。出租他人之物的租約仍有效（債權契約），但不能對抗真正所有人丙。", "", ""], ["D", "甲將其所有之A 屋出租於乙，乙未經甲之同意，將A 屋全部轉租於丙。下列敘述，何者正確？", ["乙與丙訂立之租賃契約無效", "甲與乙訂立之租賃契約無效", "乙得終止乙與丙之租賃契約", "甲得終止甲與乙之租賃契約"], "R11202", "承租人未經同意將房屋全部轉租，出租人得終止租約（第 443 條第 2 項）；乙丙間的轉租契約本身仍有效。", "", ""], ["A", "甲在其所有之A 地上興建B 屋後，將B 屋出售並移轉所有權登記於乙。下列敘述，何者正確？", ["推定甲與乙在房屋得使用期限內有租賃關係", "視為甲與乙在房屋得使用期限內有租賃關係", "推定乙在房屋得使用期限內對A 地有普通地上權", "視為乙在房屋得使用期限內對A 地有普通地上權"], "R11302", "土地與房屋同屬一人，只將房屋讓與他人時，「推定」在房屋得使用期限內有租賃關係（第 425-1 條）。注意與第 838-1 條拍賣情形的「視為」地上權區分。", "", ""], ["C", "有關意思表示之敘述，下列何者正確？", ["甲與乙本為夫妻，為逃避債務，通謀虛偽離婚，並辦理離婚登記完畢，甲乙間已無婚姻關係", "甲無欲為其意思表示之拘束，而向乙表示將贈與新款手機一部，乙雖明知甲心中之真意，贈與契約仍有效", "甲誤將丙誤認為乙，與之訂立買賣契約，該契約有效，但甲得撤銷其之意思表示", "甲受丙脅迫而與之訂立互易契約，該契約當然無效"], "R11102", "對「人」的錯誤屬意思表示內容錯誤，契約有效但可撤銷（第 88 條）。(A) 通謀虛偽離婚無效；(B) 單獨虛偽（心中保留）相對人明知時無效（第 86 條但書）；(D) 被脅迫的意思表示是「得撤銷」，不是當然無效。", "", ""], ["C", "甲與其20 歲之兒子乙訂立贈與契約，將甲所有之A 屋贈與乙，並完成所有權移轉登記。嗣後，乙竟不履行對甲之法定扶養義務。下列敘述，何者正確？", ["甲得解除贈與契約", "甲得終止贈與契約", "甲得撤銷贈與契約", "甲得撤回贈與契約"], "R11202", "受贈人對贈與人有扶養義務而不履行，贈與人得撤銷贈與（第 416 條第 1 項第 2 款）。", "", ""], ["C", "甲於自有土地上建造房屋一棟，因積欠乙銀行巨款，土地及房屋遭乙向法院聲請查封拍賣，土地為丙所拍得，房屋為丁所拍得。下列敘述，何者正確？", ["丙可以請求丁拆屋還地", "丁必須承租丙之土地", "視為丁於土地上有地上權", "推定丙與丁間有使用借貸契約"], "R11302", "土地及其上建物同屬一人，經強制執行拍賣致所有人不同，「視為」已有地上權之設定（第 838-1 條）。", "", ""], ["C", "甲與乙訂立買賣契約，向乙購買A 地。下列關於甲何時取得A 地所有權之敘述，何者正確？", ["買賣契約有效成立時", "甲付清買賣價金之時", "完成所有權移轉登記時", "乙將A 地交付於甲之時"], "R11301", "不動產物權依法律行為取得，非經登記不生效力（第 758 條），所以是完成移轉登記時。", "", ""], ["A", "甲乙丙丁分別共有A 地，甲以乙丙丁為被告提起分割共有物之訴，獲得勝訴確定判決。下列敘述，何者正確？", ["甲乙丙丁於判決確定時，各自取得分得部分之所有權", "甲根據確定判決，請求乙丙丁辦理登記，始取得分得部分之所有權", "共有物分割之判決是確認判決，僅在確認甲乙丙丁之權利義務法律關係", "共有物分割之判決是給付判決，甲有權請求乙丙丁給付分得部分之所有權"], "R11301", "分割共有物判決屬形成判決，判決確定時各共有人即取得分得部分所有權（第 759 條，登記是處分要件）。", "", ""], ["B", "甲以行使普通地上權之意思，二十年間和平、公然、繼續在乙已登記之A 地上有B 屋，下列敘述，何者正確？", ["甲已經取得普通地上權", "甲得請求登記為普通地上權人", "因乙之A 地已辦理登記，故甲無法時效取得", "甲得直接以乙為被告，起訴請求乙同意甲登記為普通地上權人"], "R11302", "時效取得地上權（第 772 條準用第 769 條）只是取得「請求登記」的權利，須向地政機關申請登記為地上權人，不是直接取得，也不是起訴請求所有人同意。", "", ""], ["B", "甲以自有土地設定抵押權予乙，以擔保其債權，該債權之請求權於113 年3 月1 日因時效而消滅。下列敘述，何者正確？", ["因從屬於擔保債權，故抵押權隨之消滅", "抵押權人須於消滅時效完成後，5 年間實行其抵押權", "抵押權無消滅時效，可一直存續", "從此之後，抵押權之實行須經債務人同意"], "R11302", "抵押權擔保的債權請求權已罹於時效，抵押權人於時效完成後 5 年間不實行抵押權者，抵押權消滅（第 880 條）。", "", ""], ["D", "甲向乙銀行貸款新臺幣500 萬元，並以甲所有之A 地為乙設定普通抵押權，雙方約定債權已屆清償期而未為清償時，A 地之所有權移屬於乙。就該流押契約之效力，下列敘述，何者正確？", ["絕對無效", "相對無效", "非經登記，不生效力", "非經登記，不得對抗第三人"], "R11302", "流抵約款現行法有效，但非經登記不得對抗第三人（第 873-1 條）；實行時仍須清算差額。", "", ""], ["B", "甲向乙銀行借貸新臺幣1000 萬元，並以甲所有之A 屋為乙設定普通抵押權。嗣後，因第三人丙之過失，致A 屋滅失，下列敘述，何者正確？", ["乙之抵押權因A 屋滅失而消滅", "乙就甲對丙所得行使之賠償請求權有權利質權", "乙就甲對丙所得行使之賠償請求權有動產質權", "乙就甲對丙所得行使之賠償請求權有普通抵押權"], "R11302", "抵押物滅失得受賠償金者，抵押權人就該賠償請求權取得「權利質權」（第 881 條物上代位）。", "", ""], ["C", "著有數本暢銷理財專書之甲，某日遭汽車駕駛人丙撞傷，卻於與丙損害賠償協議達成前，突發心肌梗塞猝死，留有土地一筆及尚未繳清貸款之房屋一棟，某上市電子公司股份100 萬股，銀行存款30 萬元，尚欠有乙銀行之信用貸款20 萬元。下列何者非屬繼承之標的？", ["尚未繳清貸款之房屋", "甲所著理財專書之著作權", "甲對丙依據民法第195 條規定可主張之非財產上損害賠償請求權", "甲積欠乙銀行之20 萬信用貸款"], "R11402", "專屬於被繼承人本身的權利不得繼承（第 1148 條但書）；非財產上損害賠償請求權在未經契約承諾或起訴前不得讓與或繼承（第 195 條第 2 項）。考選部更正 B 或 C 均給分（著作人格權部分有爭議）。", "BC", "考選部更正：本題答 B 或 C 均給分。"], ["D", "民法就夫妻財產制採類型法定原則，下列何者並非我國現行民法規定之夫妻財產制類型？", ["法定財產制", "共同財產制", "分別財產制", "統一財產制"], "R11401", "我國約定財產制只有「共同財產制」與「分別財產制」，加上法定財產制；沒有統一財產制（已於 91 年刪除）。", "", ""], ["B", "夫妻得於結婚前或結婚後，以契約就民法所定之約定財產制中，選擇其一，為其夫妻財產制。關於夫妻財產制契約，下列敘述，何者錯誤？", ["應以書面為之", "非經登記，不生效力", "非經登記，不得以之對抗第三人", "夫妻未以契約訂立夫妻財產制者，原則上以法定財產制，為其夫妻財產制"], "R11401", "夫妻財產制契約應以書面為之（第 1007 條），登記是「對抗要件」不是生效要件（第 1008 條）。", "", ""], ["C", "甲男與乙女結婚後，乙女與丙男發生婚外情，並生下丁。下列敘述，何者錯誤？", ["丁係在甲與乙婚姻關係存續中受胎，推定為甲乙之婚生子女", "甲自知悉丁非其婚生子女時起二年內，得對丁提起否認之訴", "丙得以甲與丁為被告，提起否認甲與丁間具有親子關係之訴", "丁與乙之關係，視為婚生子女，乙無須出面從事認領之動作"], "R11401", "否認子女之訴只能由夫、妻或子女提起（第 1063 條第 2 項），生父丙不能提起。", "", ""], ["B", "甲男與乙女結婚後，並無任何子女。嗣後，甲男死亡，繼承人為乙與甲之父母丙丁。關於乙女之應繼分，下列敘述，何者正確？", ["乙與丙丁平均繼承，各三分之一", "乙女之應繼分為遺產之二分之一", "乙女之應繼分為遺產之三分之二", "乙女之應繼分為遺產之四分之三"], "R11402", "配偶與第二順序（父母）同為繼承時，配偶應繼分為遺產 1/2（第 1144 條第 2 款）。", "", ""], ["C", "民法關於特留分比例之規定，下列敘述，何者錯誤？", ["直系血親卑親屬之特留分為其應繼分二分之一", "父母之特留分為其應繼分二分之一", "兄弟姊妹之特留分為其應繼分二分之一", "配偶之特留分為其應繼分二分之一"], "R11402", "兄弟姊妹的特留分是應繼分的 1/3（第 1223 條）；直系血親卑親屬、父母、配偶都是 1/2，祖父母也是 1/3。", "", ""], ["D", "甲死亡後留有土地一筆，由其妻乙、兒子丙及女兒丁及戊繼承，因丙不想繼承該筆土地，故向法院以書面聲明拋棄繼承，並通知其他應繼承之人，戊知悉後，則向乙、丙、丁表明，其也要拋棄繼承，並拒絕繳納遺產稅及辦理繼承登記。下列敘述，何者正確？", ["丙收到法院寄發之「台端拋棄繼承，准予備查」的函件時，拋棄繼承才生效", "丙拋棄繼承時，其子女可代位繼承", "戊亦已經拋棄繼承，不得繼承土地所有權", "甲之繼承人有乙、丁、戊等三人，應繼分均等"], "R11402", "丙拋棄繼承溯及生效，且拋棄者的子女不得代位繼承；戊只是口頭表示，未於 3 個月內以書面向法院聲明，不生拋棄效力。所以繼承人為乙、丁、戊，三人均分。", "", ""]]}, {"id": "p112c", "label": "112年・民法概要", "year": 112, "subj": "R11", "qs": [["A", "有關權利能力之敘述，下列何者錯誤？", ["人的權利能力始於出生終於死亡，因此胎兒尚未出生所以沒有權利能力", "人的權利能力不得拋棄，更不得轉讓", "法人除於法令或性質上之限制外，仍享有權利能力", "植物人仍享有權利能力"], "R11101", "胎兒以將來非死產為限，關於其個人利益之保護視為既已出生（第 7 條），所以胎兒仍有部分權利能力。", "", ""], ["C", "有關權利客體之敘述，下列何者錯誤？", ["甲未經乙的同意在乙的土地上種植樹木，該樹木為乙土地上之部分", "甲飼養一頭母牛，後來該母牛生下一頭小牛，小牛所有權仍屬於甲所有", "為收容災民而臨時拼裝之貨櫃屋，仍為定著物，性質上為不動產", "主物之處分效力及於從物，所以購買汽車之契約效力及於備胎"], "R11102", "臨時拼裝、可移動的貨櫃屋不具繼續附著性，不是定著物。(A) 未經同意種植的樹木屬土地的部分；(B) 小牛是天然孳息歸母牛所有人；(D) 主物處分及於從物（第 68 條）。", "", ""], ["B", "有關限制行為能力之敘述，下列何者正確？", ["滿16 歲之未成年人寫遺囑時，仍須經法定代理人同意，否則效力未定", "16 歲之甲偽造身分證，使相對人乙誤信甲已滿18 歲，而與甲簽訂買賣契約，該買賣契約有效", "限制行為能力人為代理人時，代理人受領代理權仍須經法定代理人之同意", "法定代理人可以概括允許限制行為能力人為法律行為"], "R11101", "限制行為能力人用詐術使人信其為有行為能力人或已得允許，其法律行為有效（第 83 條）。(A) 滿 16 歲可獨立立遺囑；(C) 代理人不必有完全行為能力（第 104 條）；(D) 法定代理人只能就特定財產或營業為允許，不能概括允許。", "", ""], ["D", "下列情形，那一行為需向法院聲請撤銷，才會發生撤銷之效力？", ["通謀虛偽意思表示所為之法律行為", "因錯誤或誤傳之意思表示而為法律行為", "被詐欺而為意思表示之法律行為", "因暴利行為所為之法律行為"], "R11102", "暴利行為須向法院聲請撤銷（第 74 條）；錯誤、被詐欺只要向相對人以意思表示撤銷即可；通謀虛偽本來就無效。", "", ""], ["C", "甲向乙推銷一只古董錶，甲出價新臺幣（下同）10 萬元問乙要不要買，乙答覆說：「如果8 萬元我就買」，請問乙的答覆性質上為何？", ["要約之引誘", "承諾", "要約", "意思實現"], "R11201", "將要約擴張、限制或變更而承諾者，視為拒絕原要約而為新要約（第 160 條第 2 項），乙的「8 萬元就買」是新要約。", "", ""], ["C", "甲向乙購買乙對於丙的債權，但丙已於買賣前清償系爭債權而使該債權消滅，請問該買賣契約之效力如何？", ["債權不得作為買賣之標的所以無效", "該買賣標的權利自始不存在，屬於標的不能而無效", "該買賣標的權利雖然不存在，但契約仍有效，甲可對乙主張權利瑕疵擔保", "甲可依締約上過失向乙請求損害賠償"], "R11202", "債權出賣人應擔保其權利確係存在（第 350 條），標的權利不存在不是「自始客觀不能」使契約無效，而是負權利瑕疵擔保責任。", "", ""], ["B", "依民法之規定，約定利率超過週年百分之多少，則超過之部分會無效？", ["12", "16", "20", "25"], "R11201", "約定利率超過週年 16% 者，超過部分之約定無效（第 205 條，110 年 7 月起由 20% 降為 16%）。", "", ""], ["A", "下列何種契約性質上屬於要物契約？", ["消費借貸契約", "房屋租賃契約", "贈與契約", "合會契約"], "R11202", "消費借貸以金錢或代替物之交付為成立要件，屬要物契約（第 474 條）。租賃、贈與、合會均為諾成契約（合會須書面）。", "", ""], ["A", "依民法之規定，有關租賃契約之效力，下列何者錯誤？", ["租賃物有修繕之必要時，原則上承租人可直接自行修繕後再請求出租人給付修繕費用", "如租賃物是房屋時，倘出租人無反對之約定，承租人可以將房屋一部轉租", "租賃物因承租人失火而造成損害，承租人僅就重大過失負賠償責任", "租賃物應納之一切稅捐，由出租人負擔"], "R11202", "租賃物修繕原則由出租人負擔；出租人經催告仍不修繕，承租人才得自行修繕並請求償還或扣除租金（第 430 條），不能直接先修。(C) 失火僅就重大過失負責（第 434 條）。", "", ""], ["C", "為動產物權讓與之交付，倘受讓人已先占有動產，於讓與合意時即生動產所有權取得之效力，學理上稱之為何？", ["現實交付", "占有改定", "簡易交付", "指示交付"], "R11301", "受讓人已占有動產者，於讓與合意時即生效力，稱「簡易交付」（第 761 條第 1 項但書）。", "", ""], ["C", "果實自落於鄰地者，果實之所有權為鄰地所有權人所有，倘鄰地係公有用地時，該自落之果實為何人所有？", ["國家所有", "該果實為無主物，誰先占即取得所有", "為該果實之果樹所有權人所有", "由國家及果樹所有權人所共有"], "R11301", "果實自落於鄰地視為屬於鄰地，但鄰地為公用地者不在此限（第 798 條但書），仍歸果樹所有人。", "", ""], ["B", "有關遺失物拾得之敘述，下列何者錯誤？", ["遺失物自通知或最後招領日起逾6 個月，未有受領人認領者，由拾得人取得遺失物之所有權", "受領權人認領遺失物時，拾得人原則上可以請求報酬，但不得超過遺失物價值之十分之三", "拾得人之報酬請求權因6 個月不行使而消滅", "倘受領權人為低收入戶時，依法可以拒絕拾得人之報酬請求"], "R11301", "拾得人報酬不得超過遺失物價值「十分之一」（第 805 條第 2 項），不是十分之三。", "", ""], ["D", "抵押權人僅就土地設定抵押權，因債權已屆清償期而未清償而實行抵押權，下列何者錯誤？", ["於設定抵押權時，該土地上已存在房屋，實行抵押權之範圍僅限於土地本身，不得就房屋併付拍賣", "於設定抵押權時，土地上並無房屋，於實行抵押權時土地所有人已營造房屋，抵押權人必要時得聲請併付拍賣", "抵押權人聲請併付拍賣時，如房屋有存在他人之租賃權，抵押權人得聲請法院除去房屋之租賃權後再執行拍賣", "抵押權人將土地與房屋併付拍賣後，對於土地及房屋賣得之價金，抵押權人均有優先受償之權利"], "R11302", "併付拍賣（第 877 條）時，抵押權人對房屋賣得價金「無」優先受償權，只能就土地價金優先受償。", "", ""], ["B", "民法關於死亡宣告的規定，下列何者正確？", ["失蹤人失蹤滿三年後，法院得因利害關係人之聲請，為死亡之宣告", "受死亡宣告者，以判決內所確定死亡之時，推定其為死亡", "遺產稅捐徵收機關得為失蹤人向法院聲請死亡宣告", "死亡宣告會剝奪失蹤人之權利能力"], "R11101", "受死亡宣告者，以判決內確定死亡之時推定其為死亡（第 9 條）。(A) 一般失蹤須滿 7 年；(C) 檢察官或利害關係人才可聲請；(D) 死亡宣告不剝奪權利能力。", "", ""], ["D", "甲於民國（下同）107 年9 月間向乙租車公司租用自小客車環島，然卻積欠乙租金新臺幣3 萬元，乙於108 年9 月催告後甲仍不為給付，乙便於109 年8 月訴請甲給付租金，於110 年9 月獲勝訴判決確定。下列何者正確？", ["乙租車公司的租金請求權時效本為5 年", "乙於108 年9 月催告後6 個月內未起訴，仍生中斷時效之效力", "乙於109 年8 月訴請甲給付租金時，時效不完成", "判決確定後，時效重新起算5 年"], "R11103", "租車公司收的租金是「以租賃動產為營業者之租價」，短期時效 2 年（第 127 條第 3 款），(A) 錯。催告後 6 個月內未起訴，視為不中斷（第 130 條）。經確定判決，原時效不滿 5 年者，重行起算的時效延長為 5 年（第 137 條第 3 項），所以 (D) 正確。", "", ""], ["C", "甲委託乙代為尋覓對象結婚，並承諾事成後給予乙報酬新臺幣10 萬元。關於婚姻居間契約，下列何者正確？", ["甲乙間的契約，無效", "乙得對甲請求給付報酬", "乙對甲無報酬請求權", "婚姻居間契約不得約定報酬"], "R11202", "婚姻居間約定報酬者，就其報酬無請求權（第 573 條），契約本身不是無效。", "", ""], ["D", "土地所有人非因故意或重大過失逾越地界建築房屋，而鄰地所有人知其越界，卻不即時提出異議者，下列何者正確？", ["鄰地所有人不為異議，即表示拋棄所有權利，不得再為主張", "土地所有人有權得請求購買越界之土地", "鄰地所有人得請求移去或變更越界建築之房屋，並請求支付償金", "鄰地所有人不得請求移去或變更越界建築之房屋，但得請求所受損害之償金"], "R11301", "非因故意或重大過失越界建屋，鄰地所有人知其越界而不即提出異議，不得請求移去或變更，但得請求購買越界部分土地或請求損害償金（第 796 條）。", "", ""], ["A", "關於民法區分所有建築物規定之敘述，下列何者錯誤？", ["專有部分與其所屬之共有部分及其基地之權利，得分離而為移轉或設定負擔", "就區分所有建築物共有部分及基地之應有部分，區分所有人得約定其比例", "專有部分得經其所有人之同意，依規約之約定供區分所有建築物之所有人共同使用", "共有部分除法律另有規定外，得經規約之約定供區分所有建築物之特定所有人使用"], "R11301", "專有部分不得與所屬共有部分及基地之權利分離而為移轉或設定負擔（第 799 條第 5 項）。", "", ""], ["C", "甲在其所有A 地上興建B 屋，但B 屋為未辦理建物所有權第一次登記的違章建物，嗣後甲與乙訂立A 地與B 屋的買賣契約，下列何者錯誤？", ["B 屋雖為違章建築亦為融通物，得為交易之客體", "甲應將A 地所有權辦妥移轉登記給乙，乙始取得A 地所有權", "興建B 屋時因未為建物所有權保存登記，故甲未取得B 屋所有權", "甲將Ｂ屋讓與乙，乙僅取得對Ｂ屋之事實上處分權"], "R11301", "違章建築原始起造人因建築完成即取得所有權（事實行為），不以保存登記為要件；但因無法登記，受讓人只取得事實上處分權。", "", ""], ["A", "關於善意占有人之敘述，下列何者錯誤？", ["善意占有人於本權訴訟敗訴時，自判決確定之日起，視為惡意占有人", "善意占有人自確知其無占有本權時起，為惡意占有人", "善意占有人因保存占有物所支出之必要費用，得向回復請求人請求償還", "善意占有人，因改良占有物所支出之有益費用，於其占有物現存之增加價值限度內，得向回復請求人，請求償還"], "R11302", "善意占有人於本權訴訟敗訴時，自「訴狀送達之日」起視為惡意占有人（第 959 條），不是判決確定日。", "", ""], ["B", "就法定夫妻財產制之敘述，下列何者錯誤？", ["夫或妻婚前財產，於婚姻關係存續中所生之孳息，視為婚後財產", "不能證明為夫或妻所有之財產，視為夫妻共有", "夫或妻之財產分為婚前財產與婚後財產，由夫妻各自所有", "夫妻各自對其債務負清償之責"], "R11401", "不能證明為婚前或婚後財產者，「推定」為婚後財產；不能證明為夫或妻所有者，推定為夫妻共有（第 1017 條）。題目說「視為」共有，錯。", "", ""], ["D", "關於 民法第1031 條之1 夫妻財產制中之特有財產之敘述，下列何者錯誤？", ["甲在婚前取得之受贈物A 屋，若贈與人甲父以書面聲明甲日後結婚時，該A 屋為特有財產，則該A 屋亦屬特有財產", "夫或妻在家中共同使用的茶杯、桌椅等動產，非特有財產", "夫是音樂家，則其演奏時所需之樂器為特有財產", "夫或妻雖以受贈之特有財產之金錢購買不動產一筆，惟該受贈物狀態已變更，則該不動產非特有財產"], "R11401", "特有財產因法律行為變更狀態（如以受贈特有財產的金錢購屋），依代位性仍屬特有財產，(D) 錯。", "", ""], ["C", "關於遺產繼承之敘述，下列何者錯誤？", ["非婚生子女非經生父認領或準正，不得繼承其生父之遺產", "遺產繼承人，除配偶外，其繼承順序為直系血親卑親屬、父母、兄弟姊妹、祖父母", "配偶與被繼承人直系血親尊親屬同為繼承時，其應繼分為遺產之三分之一", "特留分之規定，係為保障法定繼承人之權利免受侵害"], "R11402", "配偶與直系血親尊親屬（父母，第二順序）同為繼承時，配偶應繼分為 1/2，不是 1/3（第 1144 條第 2 款）。記法：與子女平均分；與父母或兄弟姊妹拿 1/2；與祖父母拿 2/3。", "", ""], ["A", "關於回復喪失繼承權之敘述，下列何者錯誤？", ["子女為了遺產而謀殺父親，即喪失對父親之繼承權，因被繼承人原諒繼承人之行為而回復繼承權", "偽造、變造、隱匿、湮滅被繼承人關於繼承之遺囑者，喪失繼承權，得因被繼承人原諒繼承人之行為而回復其繼承權", "對於被繼承人有重大之虐待或侮辱情事，經被繼承人表示其不得繼承時，喪失繼承權，但之後仍可因獲得被繼承人之原諒而回復繼承權", "以詐欺或脅迫妨害被繼承人為關於繼承之遺囑，或妨害其撤回或變更者，喪失繼承權，得因被繼承人原諒繼承人之行為而回復其繼承權"], "R11402", "故意致被繼承人於死而受刑之宣告者喪失繼承權，屬「絕對失權」，不因被繼承人宥恕而回復（第 1145 條第 2 項只適用第 2～4 款）。", "", ""], ["B", "關於拋棄繼承之敘述，下列何者錯誤？", ["應於知悉其得繼承之時起三個月內，以書面向法院為之", "拋棄繼承後，應通知因其拋棄而應為繼承之人。未為通知者，不生拋棄繼承之效力", "配偶拋棄繼承權者，其應繼分歸屬於與其同為繼承之人", "繼承之拋棄，溯及於繼承開始時發生效力"], "R11402", "拋棄繼承應以書面向法院為之，並以書面通知因其拋棄而應為繼承之人，但「不能通知者不在此限」；未通知不影響拋棄的效力（第 1174 條）。", "", ""]]}, {"id": "p111c", "label": "111年・民法概要", "year": 111, "subj": "R11", "qs": [["B", "依我國 民法第1173 條 有關歸扣之規定，下列何種被繼承人生前將財產贈與某特定繼承人，無須將該贈與價額，於遺產分割時，由該繼承人之應繼分中扣除？", ["因該特定繼承人結婚時之贈與", "因該特定繼承人重大災難生還時之贈與", "因該特定繼承人從家裡決定分居時之贈與", "因該特定繼承人決定經營事業時之贈與"], "R11402", "應歸扣的生前特種贈與只限因「結婚、分居、營業」而贈與（第 1173 條），重大災難生還時的贈與不在其列。", "", ""], ["A", "下列何種情況是非屬於近親禁止結婚之規範範圍？", ["與離婚後無依無靠之前小姨子結婚", "與終止收養後之前養女結婚", "與自己兒子離婚後之前媳婦結婚", "與叔叔死亡後孤苦守寡之叔母結婚"], "R11401", "姻親關係因離婚而消滅；禁婚範圍是旁系「五親等內」姻親輩分不相同者等。前小姨子是旁系二親等、輩分相同，離婚後可結婚。(B) 養親子終止收養後仍禁婚；(C) 直系姻親關係消滅後仍禁婚（第 983 條第 2 項）；(D) 叔母是旁系三親等姻親、輩分不同，仍禁婚。", "", ""], ["D", "下列何者得為被繼承人親屬中之法定繼承人？", ["被繼承人兄弟之配偶", "被繼承人父親之兄弟", "被繼承人母親之兄弟之配偶", "被繼承人所認領之非婚生子女"], "R11402", "非婚生子女經生父認領視為婚生子女，屬第一順序直系血親卑親屬。兄弟之配偶、叔伯（旁系三親等）、舅媽都不是法定繼承人。", "", ""], ["B", "下列敘述，何者錯誤？", ["使用借貸契約必須是無償的契約", "借用人得主張買賣不破使用借貸之抗辯", "借用物為動物時，飼養費原則上應由借用人承擔", "借用人對於借用物原則上並無轉租收益之權限"], "R11202", "「買賣不破租賃」（第 425 條）只適用租賃，使用借貸無此保護，借用人不得對抗新所有人。使用借貸為無償；借用人負擔通常保管費（含動物飼養費）；未經同意不得轉借或收益。", "", ""], ["B", "依現行民法之規定，下列何者非為不動產登記前，即能取得不動產之所有權？", ["不動產所有權因繼承而取得", "不動產所有權之時效取得", "不動產所有權因徵收而取得", "不動產所有權因強制執行而取得"], "R11301", "因繼承、強制執行、徵收、法院判決等「非因法律行為」取得，登記前即取得（第 759 條）；時效取得不動產所有權則須「請求登記為所有人」，登記後才取得（第 769、770 條）。", "", ""], ["D", "下列何種情形，債務人之原有債務不會發生消滅之效果？", ["債權人受領債務人以代物清償方式清償原有之債務", "債務人對債權人已屆清償期之債權行使抵銷權，彼此間在抵銷數額之債權債務", "債權與其債務發生混同之情形", "債務人以間接給付之方式清償原有之債務"], "R11201", "間接給付（新債清償）只是為清償而負擔新債務，舊債務在新債務履行前不消滅（第 320 條）。代物清償、抵銷、混同都會使債務消滅。", "", ""], ["D", "在無因管理之規定中，若管理人管理事務時，利於本人，且不違反本人明示或可得推知之意思者，管理人不得向本人主張下列那種請求權？", ["管理人管理本人事務之有益費用支出償還請求權", "清償管理人因管理事務所負債務之請求權", "管理人因管理事務所受損害之賠償請求權", "管理人管理本人事務之報酬請求權"], "R11201", "無因管理人可請求有益費用償還、代償債務、損害賠償（第 176 條），但沒有報酬請求權（無償性）。", "", ""], ["A", "有關現行民法代理制度之介紹，下列何者錯誤？", ["未經本人事前同意之自己代理，對於本人而言，係無效之代理行為", "民法第169 條表見代理效力之發生，須無本人之授予代理權為其要件", "間接代理人之代理行為不會對本人直接發生效力", "代理人為代理行為時，被相對人詐欺，本人得自行撤銷該代理行為"], "R11103", "自己代理、雙方代理未經本人許諾者，屬無權代理（效力未定），本人可事後承認，不是「無效」（第 106 條）。(D) 意思表示瑕疵以代理人為準決定（第 105 條），撤銷權歸本人。", "", ""], ["C", "對於民法上有關法人規定之說明，下列何者正確？", ["財團法人具有自律法人之性質", "社員資格須經社團之董事會特別決議同意，且有正當理由時，方能開除之", "財團法人之設立，得以遺囑為之", "社團法人以社團董事會為其最高意思機關"], "R11101", "財團法人可以遺囑捐助設立（第 60 條）。(A) 財團是他律法人；(B) 開除社員依章程規定，由總會決議；(D) 社團最高意思機關是「總會」。", "", ""], ["C", "依現行民法有關住所之規定，下列何者錯誤？", ["夫妻於雙方共同協議前，推定以共同戶籍地為其法定之住所", "意定住所之設定須具備久住之意思及居住之事實", "因特定行為選定居所，關於其行為，不得視為住所", "16 歲之年輕人，僅能以其父母之住所為法定住所"], "R11101", "因特定行為選定居所者，關於其行為「視為」住所（第 23 條），題目說不得視為，錯。", "", ""], ["A", "關於 民法第74 條 暴利行為之規定，下列敘述何者正確？", ["當事人無論於財產給付前或給付後，均得聲請撤銷該暴利行為", "撤銷權自該法律行為成立時起一年內不行使，罹於消滅時效而消滅", "行使暴利行為之撤銷權時，應以意思表示向相對人為之", "暴利行為自始當然無效"], "R11102", "暴利行為須於法律行為後 1 年內向法院聲請撤銷（第 74 條），給付前後都可聲請；1 年是除斥期間不是時效，也不能單以意思表示撤銷。", "", ""], ["D", "下列何者非法律明文規定屬於連帶債務之性質？", ["合夥財產不足清償合夥債務時，各合夥人對於該不足額之債務", "數人共同不法侵害他人權利所生之損害賠償債務", "共同繼承人對於被繼承人，於繼承所得遺產限度內之遺產債務", "共有人對於他共有人因分割而得之物，所負之擔保責任債務"], "R11201", "共有人因分割負的擔保責任是「按其應有部分」負擔（第 825 條），不是連帶債務。(A) 合夥第 681 條、(B) 共同侵權第 185 條、(C) 繼承第 1153 條都是法定連帶。", "", ""], ["D", "下列何者非屬贈與人或其繼承人，得主張撤銷贈與契約之原因？", ["附有負擔之贈與，贈與人已為給付而受贈人因過失不履行其負擔者", "受贈人對於贈與人有扶養義務而不履行義務者", "受贈人因故意不法行為致贈與人死亡者", "定期給付之贈與，而受贈人已死亡者"], "R11202", "定期給付的贈與因贈與人或受贈人死亡而「失其效力」（第 415 條），不是撤銷事由。(A)(B)(C) 分別為第 412、416 、417 條的撤銷原因。", "", ""], ["B", "關於共有不動產分管契約之敘述，下列何者正確？", ["分管契約應以共有人半數以上及其應有部分合計過半數，或應有部分合計逾三分之二之同意訂定之", "分管契約訂定後，若因情事變更難以繼續時，法院得因任何共有人之聲請，以裁定變更之", "共有人對於分管契約無法達成協議時，得訴請法院裁判定分管方式", "分管契約訂定後，對於應有部分之受讓人於受讓時知悉其情事者，亦具有效力"], "R11301", "分管契約訂定後因情事變更難以繼續，法院得因任何共有人聲請以裁定變更（第 820 條第 3 項）。(A) 是「共有人過半數」及應有部分合計過半數；(C) 管理無法協議是聲請法院裁定，不是訴請；(D) 受讓人「知悉或可得而知」亦受拘束。", "", ""], ["A", "甲與乙結婚，生有三個女兒丙、丁、戊。丙因未婚生有二子庚及辛，曾與其母乙發生重大爭吵及言語侮辱情事，而遭甲表示剝奪其繼承權。丁則於甲生前即已向甲表示，當甲百年後將拋棄繼承權。設甲死亡時留有遺產現金600 萬元，並未立有遺囑。問:甲之遺產依法應如何分配？", ["乙、丙、丁、戊各150 萬元", "乙、戊各200 萬元，庚、辛各100 萬元", "乙、丁、戊各150 萬元，庚、辛各75 萬元", "乙、戊各300 萬元"], "R11402", "丙侮辱的是母親乙，不是被繼承人甲，不構成喪失繼承權（第 1145 條第 1 項第 5 款）；丁生前預先拋棄繼承無效。所以乙、丙、丁、戊四人均分，各 150 萬元。", "", ""], ["B", "關於限定繼承之敘述，下列何者正確？", ["限定繼承係指繼承人自繼承開始時，僅承受被繼承人財產上之權利，而不繼承其債務", "繼承人縱未依法開具遺產清冊陳報法院，並不當然喪失限定繼承之利益", "繼承人隱匿被繼承人之遺產而情節重大者，仍可主張限定繼承之利益", "繼承人應先對受遺贈人交付遺贈，其次償還優先權之債務，再清償普通債務"], "R11402", "現行法採「當然限定責任」：繼承人以所得遺產為限負清償責任（第 1148 條第 2 項），即使未開具遺產清冊也不當然喪失；但隱匿遺產情節重大者不得主張（第 1163 條）。清償順序是優先權債務→普通債務→遺贈。", "", ""], ["C", "關於夫妻法定財產制之規定，下列敘述何者正確？", ["夫或妻之財產分為婚前財產與婚後財產，婚前財產由夫妻各自所有，婚後財產則由夫妻共有", "夫或妻於婚姻關係存續中就其婚後財產所為之無償行為，應將該財產追加計算，視為現存之婚後財產", "夫或妻各自管理、使用、收益及處分其婚前及婚後財產，並各自對其債務負清償之責", "剩餘財產差額分配請求權屬一身專屬性之權利，請求權人自法定財產制關係消滅時起，二年間不行使而消滅"], "R11401", "法定財產制下夫妻各自管理、使用、收益、處分其財產，各自對其債務負責（第 1018、1023 條）。(A) 婚後財產仍各自所有，不是共有；(B) 追加計算限於法定財產制關係消滅前 5 年內、有害他方之無償行為；(D) 時效是自知有剩餘財產差額時起 2 年，或自法定財產制關係消滅時起 5 年。", "", ""], ["B", "甲將其A 地設定地上權予乙，乙於A 土地上興建B 屋一棟。其後甲為貸款擔保而將其A 地設定抵押權予丙，乙亦因其貸款擔保而將B 屋設定抵押權予丁。下列敘述何者正確？", ["若丁實行抵押權拍賣B 屋時，A 地所有權應併付拍賣之", "若丁實行抵押權拍賣B 屋時，地上權應併付拍賣之", "若丙實行抵押權拍賣A 地所有權時，B 屋應併付拍賣之", "若丙實行抵押權拍賣A 地所有權時，地上權應併付拍賣之"], "R11302", "以建物設定抵押權者，於土地上之地上權併為抵押權之標的，拍賣建物時地上權應併付拍賣（第 877-1 條）。", "", ""], ["B", "甲無權占有乙之土地種植果樹，其果實歸屬於何人？", ["果實在與果樹分離前或分離後，均屬於甲所有", "果實在與果樹分離前或分離後，均屬於乙所有", "果實在與果樹分離前屬於甲所有，分離後屬於乙所有", "果實在與果樹分離前屬於乙所有，分離後屬於甲所有"], "R11301", "果實分離前是土地的一部分屬土地所有人；無權占有人非收取權人，分離後依第 766 條仍歸土地所有人乙。", "", ""], ["C", "特定物買賣，若因物有瑕疵而出賣人依法應負物之瑕疵擔保責任時，下列何者非買受人依法所得主張之權利？", ["解除買賣契約", "請求減少買賣價金", "請求另行交付無瑕疵之物", "故意不告知瑕疵時，請求損害賠償"], "R11202", "特定物買賣有瑕疵，買受人可解除或請求減少價金，故意不告知瑕疵可請求賠償；「另行交付無瑕疵之物」只適用種類之債（第 364 條）。", "", ""], ["D", "關於租賃法律關係之敘述，下列何者正確？", ["期限逾一年之不動產租賃契約，應以字據訂立之，否則契約無效", "定有期限之不動產租賃，因其價值之昇降，當事人得聲請法院增減其租金", "不動產之出租人就租金債權，對於承租人之物置於該不動產者，有法定質權", "租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記"], "R11202", "租用基地建築房屋，承租人得請求出租人為地上權之登記（第 422-1 條）。(A) 未立字據視為不定期租賃；(B) 須是「租賃物為不動產」且價值昇降時才可聲請增減，題目文義不完整；(C) 出租人就租金債權有「留置權」（第 445 條），不是質權。", "", ""], ["A", "二人互負債務而其給付種類相同，並均屆清償期者，得以其債務與他方之債務互為下列何項主張，以消滅其債務？", ["抵銷", "抵充", "免除", "混同"], "R11201", "二人互負同種類且均屆清償期的債務，可各以其債務與他方債務互相「抵銷」（第 334 條）。", "", ""], ["D", "滿17 歲且未受監護或輔助宣告之甲男，其所為之下列何種行為，依法須得法定代理人之同意始為有效？", ["訂立遺囑為遺贈之行為", "純獲法律上利益之行為", "就他人之物所為之無權處分行為", "授予他人代理權之行為"], "R11103", "代理權授與是有相對人的單獨行為，限制行為能力人未得允許者無效（第 78 條）。滿 16 歲可立遺囑；純獲法律上利益不須同意；無權處分是處分權欠缺問題，與行為能力無關。", "", ""], ["B", "關於財團法人之敘述，下列何者正確？", ["財團法人得為公益或營利之目的而設立", "財團法人於設立登記前，應得主管機關之許可", "財團法人之最高意思機關為總會，且為必設之機關", "財團法人若以營利為目的設立，其取得法人資格，依特別法之規定"], "R11101", "財團法人設立登記前應得主管機關許可（第 59 條）。財團只能為公益；沒有總會（社團才有）。", "", ""], ["A", "下列何者屬於當然無效之法律行為？", ["單獨虛偽意思表示而該情形為相對人所明知者", "詐欺之意思表示係由第三人所為，而相對人明知其事實或可得而知者", "無權利人就權利標的物為處分後，取得其權利者", "限制行為能力人用詐術使人信其為有行為能力人，所為之法律行為"], "R11102", "單獨虛偽意思表示（心中保留）原則有效，但相對人明知時無效（第 86 條）。(B) 得撤銷；(C) 無權處分後取得權利者，處分自始有效（第 118 條第 2 項）；(D) 用詐術者行為有效（第 83 條）。", "", ""]]}, {"id": "p110c", "label": "110年・民法概要", "year": 110, "subj": "R11", "qs": [["B", "甲與乙訂立買賣契約，契約條款記載「…價金新臺幣陸拾捌萬元整（NT$860,000）。前揭捌拾陸萬元價金應於訂約後10 日內支付。」若嗣後雙方就價金金額爭訟時，法院應如何決定價金？", ["應認為價金為最後書寫之文字：捌拾陸萬元", "應先探求當事人原意", "應認為價金為兩項金額之平均值：柒拾柒萬元", "如法院不能決定當事人原意，應以數字為準：NT$860,000"], "R11102", "解釋意思表示應探求當事人真意，不得拘泥於所用辭句（第 98 條）。文字與號碼不符而法院不能決定何者為真意時，才「以文字為準」（第 4 條）。", "", ""], ["B", "關於胎兒的敘述，下列何者正確？", ["人之權利能力，始於出生，終於死亡。胎兒無權利能力", "胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生", "胎兒為繼承人時，於胎兒出生前，他繼承人不得分割遺產", "胎兒為繼承人時，以其母為繼承人"], "R11101", "胎兒以將來非死產者為限，關於其個人利益之保護視為既已出生（第 7 條）。(C) 他繼承人可分割，但須保留胎兒應繼分（第 1166 條）；(D) 以其母為法定代理人，不是以其母為繼承人。", "", ""], ["A", "關於失蹤人的敘述，下列何者正確？", ["失蹤人失蹤滿七年後，法院得因利害關係人或檢察官之聲請，為死亡之宣告", "失蹤人為八十歲以上者，得於失蹤滿五年後，為死亡之宣告", "失蹤人為遭遇特別災難者，得於特別災難終了滿三個月後，為死亡之宣告", "失蹤人失蹤後，未受死亡宣告前，其財產之管理，除其他法律另有規定者外，依破產法之規定"], "R11101", "一般失蹤滿 7 年後，法院得因利害關係人或檢察官聲請為死亡宣告（第 8 條）。80 歲以上是滿 3 年；特別災難是災難終了滿 1 年；財產管理依家事事件法。", "", ""], ["D", "關於行為能力之敘述，下列何者錯誤？", ["受監護宣告之人之意思表示，無效，應由其法定代理人代為意思表示，並代受意思表示", "限制行為能力人未得法定代理人之允許，所為之單獨行為，無效", "未滿法定結婚年齡之男女，其結婚之法律效果並非無效，而是得撤銷", "為保障胎兒之行為能力，胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生"], "R11101", "第 7 條是關於胎兒「權利能力」的保護，不是行為能力，(D) 錯。(C) 未達結婚年齡者得撤銷結婚（第 989 條）。", "", ""], ["C", "關於代理的敘述，下列何者正確？", ["代理權係以法律行為授與者，其授與應向代理人或向代理人對之為代理行為之第三人，以書面授權方式代理為之", "代理人有數人者，其代理行為應單獨為之。但法律另有規定或本人另有意思表示者，不在此限", "由自己之行為表示以代理權授與他人，或知他人表示為其代理人而不為反對之表示者，對於第三人應負授權人之責任。但第三人明知其無代理權或可得而知者，不在此限", "代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生效力。而無代理權人以代理人之名義所為之法律行為則為無效"], "R11103", "(C) 是表見代理（第 169 條）原文。(A) 授權不以書面為必要；(B) 數代理人應「共同」為之；(D) 無權代理是「效力未定」，不是無效。", "", ""], ["B", "下列何種法律行為屬法定書面要式行為？", ["動產所有權之拋棄", "子女之收養", "贈與契約", "演藝經紀契約"], "R11102", "收養子女應以書面為之並聲請法院認可（第 1079 條），屬法定書面要式行為。贈與、動產拋棄、演藝經紀契約都是不要式。", "", ""], ["D", "關於意思表示不一致的敘述，下列何者正確？", ["表意人無欲為其意思表示所拘束之意，而為意思表示者，其意思表示無效", "表意人無欲為其意思表示所拘束之意，而為意思表示，其情形為相對人所明知者，其意思表示有效", "表意人與相對人通謀而為虛偽意思表示者，其意思表示不因之無效", "虛偽意思表示，隱藏他項法律行為者，適用關於該項法律行為之規定"], "R11102", "通謀虛偽意思表示隱藏他項法律行為者，適用關於該項法律行為之規定（第 87 條第 2 項）。(A)(B) 單獨虛偽原則有效、相對人明知才無效；(C) 通謀虛偽無效。", "", ""], ["B", "關於抵押權所擔保而得優先受償之利息，以於抵押權人實行抵押權聲請強制執行前幾年內發生及於強制執行程序中發生者為限？", ["二年", "五年", "十年", "十五年"], "R11302", "抵押權擔保的利息，以實行抵押權聲請強制執行前「5 年」內發生及執行程序中發生者為限（第 861 條第 2 項）。", "", ""], ["C", "依現行民法規定，下列何者須經登記始生法律效力？", ["遺產之繼承", "土地買賣契約", "設定抵押權之物權行為", "夫妻就共同財產制之約定"], "R11301", "設定抵押權屬依法律行為的不動產物權變動，須書面並經登記才生效（第 758 條）。繼承不待登記；土地買賣契約是債權契約；夫妻財產制契約登記只是對抗要件。", "", ""], ["B", "下列何者屬於授與代理權？", ["甲創作民法總則一書，授權乙出版社於五年間印製出版該書", "甲有一A 車，授權乙以甲本人名義買賣A 車", "甲為知名影星，授權乙週刊使用甲肖像照片", "甲有一昆蟲標本，授權乙予以拍攝"], "R11103", "授權他人「以本人名義」為買賣的法律行為，才是授與代理權；出版、肖像、拍攝授權屬著作權或人格權的授權利用。", "", ""], ["D", "民法於保證契約一節中規定，保證人於債權人未就主債務人之財產強制執行而無效果前，對於債權人得拒絕清償，概念上一般稱為？", ["同時履行抗辯", "撤銷訴權", "追索權抗辯", "先訴抗辯"], "R11202", "保證人於債權人未就主債務人財產強制執行而無效果前，得拒絕清償，稱「先訴抗辯權」（第 745 條）。", "", ""], ["C", "關於連帶債務的敘述，下列何者正確？", ["連帶債務人相互間，縱因債務人中之一人應單獨負責之事由所致之損害及支付之費用，仍應平均分擔義務", "連帶債務人中之一人，因清償、代物清償、提存、抵銷或混同，致他債務人同免責任者，得向他債務人請求償還各自分擔之部分，但不得請求利息", "連帶債務人中之一人，不能償還其分擔額者，其不能償還之部分，由求償權人與他債務人按照比例分擔之", "連帶債務人中之一人，不能償還其分擔額，而他債務人中之一人應分擔之部分已免責者，無須負其責任"], "R11201", "連帶債務人中一人不能償還分擔額，其不能償還部分由求償權人與他債務人按比例分擔（第 282 條）。(A) 因一人應單獨負責事由所生損害，由該人負擔（第 280 條但書）；(D) 已免責者仍須分擔。", "", ""], ["B", "下列何種情形，當事人一方須以向法院聲請撤銷方式為之？", ["因受詐欺所為之意思表示", "債務人所為之無償行為，有害及債權者", "締結違反公共秩序之契約", "違反民法第983 條特定親屬間禁止結婚規定之結婚行為"], "R11201", "債權人撤銷權（詐害債權，第 244 條）須向法院聲請撤銷。被詐欺只要對相對人撤銷；違反公序良俗的契約當然無效；違反近親禁婚也是無效。", "", ""], ["B", "關於合夥的敘述，下列何者正確？", ["各合夥人之出資及其他合夥財產，為合夥人全體之分別共有", "合夥人除有特別訂定外，無於約定出資之外增加出資之義務。因損失而致資本減少者，合夥人無補充之義務", "合夥財產不足清償合夥之債務時，各合夥人對於不足之額，無須負其責任", "合夥人退夥後，對於其退夥前合夥所負之債務，無須負其責任"], "R11202", "合夥人除另有約定外無增資義務，因損失致資本減少也無補充義務（第 669 條）。(A) 合夥財產是「公同共有」；(C) 不足額連帶負責；(D) 退夥前的債務仍須負責（第 690 條）。", "", ""], ["C", "關於買賣瑕疵擔保的敘述，下列何者正確？", ["買受人對於由他地送到之物，主張有瑕疵，不願受領者，買受人無暫為保管之責", "從物有瑕疵者，買受人得就主物併同從物，解除全部契約", "為買賣標的之數物中，一物有瑕疵者，買受人僅得就有瑕疵之物為解除，但當事人之任何一方，如因有瑕疵之物，與他物分離而顯受損害者，得解除全部契約", "買賣之物，僅指定種類者，如其物有瑕疵，買受人得不解除契約或請求減少價金，而即時請求另行交付無瑕疵之物。出賣人就另行交付之物，不負擔保責任"], "R11202", "數物中一物有瑕疵，原則只能就瑕疵物解除，但分離顯受損害者得解除全部（第 363 條）。(A) 買受人仍有暫為保管之責（第 358 條）；(B) 從物有瑕疵只能就從物解除（第 362 條）；(D) 出賣人對另行交付之物仍負擔保責任（第 364 條）。", "", ""], ["C", "關於果實自落於鄰地，而鄰地非為公用地者，下列何者正確？", ["視為遺失物", "視為無主物", "視為屬於鄰地所有人", "視為屬於原土地所有人"], "R11301", "果實自落於鄰地者，「視為」屬於鄰地所有人；鄰地為公用地者不在此限（第 798 條）。", "", ""], ["A", "地上權未定有期限者，存續期間逾多少年或地上權成立之目的已不存在時，法院得因當事人之請求，斟酌地上權成立之目的、建築物或工作物之種類、性質及利用狀況等情形，定其存續期間或終止其地上權。下列何者正確？", ["二十年", "十五年", "十年", "五年"], "R11302", "未定期限的地上權存續逾「20 年」或成立目的已不存在，法院得因請求定其存續期間或終止（第 833-1 條）。", "", ""], ["D", "依 民法第880 條 規定，實行抵押權期間以抵押權擔保之債權，其請求權已因時效而消滅，如抵押權人，於消滅時效完成後，幾年間不實行其抵押權者，其抵押權消滅？", ["一", "二", "三", "五"], "R11302", "抵押權擔保之債權請求權消滅時效完成後「5 年」間不實行抵押權者，抵押權消滅（第 880 條）。", "", ""], ["D", "關於夫妻財產制契約的敘述，下列何者正確？", ["夫妻得於結婚前以契約就民法所定之約定財產制中，選擇其一，為其夫妻財產制。結婚後則不行", "夫妻未以契約訂立夫妻財產制者，除民法另有規定外，以聯合財產制，為其夫妻財產制", "夫妻財產制契約之訂立、變更或廢止，非經登記，不生效力", "夫妻財產制契約之登記，不影響依其他法律所為財產權登記之效力"], "R11401", "夫妻財產制契約的登記，不影響依其他法律所為財產權登記之效力（第 1008 條第 3 項）。(A) 婚前婚後都可約定；(B) 法定財產制已非聯合財產制；(C) 登記是對抗要件。", "", ""], ["D", "分別財產制有關夫妻債務的敘述，下列何者正確？", ["夫妻於行為時明知有損於婚姻關係消滅後他方之剩餘財產分配請求權者，以受益人受益時亦知其情事者為限，他方得聲請法院撤銷之", "夫妻之一方以自己財產清償他方之債務時，於婚姻關係存續中，不得請求償還。但於婚姻關係消滅時，夫或妻現存之婚後財產，扣除婚姻關係存續所負債務後，如有剩餘，其雙方剩餘財產之差額，應平均分配", "夫妻之一方以自己財產清償他方之債務時，於婚姻關係存續中，不得請求償還。但於婚姻關係消滅時，應分別納入現存之婚後財產或婚姻關係存續中所負債務計算", "夫妻各自對其債務負清償之責"], "R11401", "分別財產制下夫妻各自對其債務負清償之責（第 1046 條）。(A)(B)(C) 是法定財產制的規定（第 1020-1、1023 條）。", "", ""], ["A", "關於共同財產所負之債務，而以共同財產清償者，下列何者正確？", ["不生補償請求權", "不生補償請求權，但於共同財產制關係消滅時，應分別納入現存之婚後財產或婚姻關係存續中所負債務計算", "有補償請求權，但於婚姻關係存續中，不得請求", "有補償請求權，雖於婚姻關係存續中，亦得請求"], "R11401", "共同財產制下，共同財產所負之債務以共同財產清償者，不生補償請求權（第 1038 條第 1 項）。", "", ""], ["A", "民法關於非婚生子女之規定，下列何者錯誤？", ["如有受推定為婚生子女情形，夫妻之一方或子女能證明子女非為婚生子女者，得提起認領之訴", "非婚生子女，其生父與生母結婚者，視為婚生子女", "非婚生子女經生父認領者，視為婚生子女", "非婚生子女或其生母，對於生父之認領，得否認之"], "R11401", "受推定婚生的子女應以「否認之訴」推翻（第 1063 條），不是認領之訴。(B) 準正；(C) 認領；(D) 非婚生子女或其生母得否認生父之認領（第 1066 條）。", "", ""], ["C", "甲早年父母雙亡，僅有一兄長乙，甲與配偶離異後獨自養育一子丙。某日甲死亡，於丙拋棄繼承前，乙亦不幸意外死亡，留下乙之配偶丁。下列何者錯誤？", ["甲之遺產繼承人順序，丙優先於乙", "配偶丁與乙有相互繼承遺產之權", "就甲之遺產，既然丙已拋棄繼承，應由次順序之乙繼承，雖然乙早於丙拋棄繼承前死亡，仍應由丁繼承乙所繼承自甲之遺產", "拋棄繼承權，應於知悉其得繼承之時起三個月內，以書面向法院為之"], "R11402", "依官方答案，(C) 錯。拋棄繼承雖溯及繼承開始時生效，但本題官方採「次順序繼承人須於先順序拋棄時仍生存」的見解：乙已在丙拋棄前死亡，不再由乙的配偶丁取得甲的遺產；配偶也不能代位繼承。", "", ""], ["A", "關於喪失繼承權情事的敘述，下列何者正確？", ["故意致被繼承人或應繼承人於死，或雖未致死因而受刑之宣告者", "以詐欺或脅迫使被繼承人為關於繼承之遺囑，或使其撤回或變更之，因而受刑之宣告者", "以詐欺或脅迫妨害被繼承人為關於繼承之遺囑，或妨害其撤回或變更之，因而受刑之宣告者", "偽造、變造、隱匿或湮滅被繼承人關於繼承之遺囑，因而受刑之宣告，但經被繼承人宥恕者"], "R11402", "故意致被繼承人或應繼承人於死，或雖未致死因而受刑之宣告者，喪失繼承權（第 1145 條第 1 項第 1 款）。(B)(C) 本身是事由但不須受刑之宣告；(D) 經宥恕者回復繼承權。", "", ""], ["D", "關於遺產分割的敘述，下列何者正確？", ["繼承人於服喪三年後得隨時請求分割遺產", "遺囑禁止遺產之分割者，其禁止之效力以二十年為限", "遺產分割後，各繼承人按其所得部分，對於他繼承人因分割而得之債權，就應清償時債務人之支付能力，負擔保之責", "繼承人之連帶責任，自遺產分割時起，如債權清償期在遺產分割後者，自清償期屆滿時起，經過五年而免除"], "R11402", "繼承人連帶責任自遺產分割時起，債權清償期在分割後者自清償期屆滿時起，經過 5 年免除（第 1171 條第 2 項）。(A) 隨時可請求分割；(B) 遺囑禁止分割以 10 年為限；(C) 原則以分割時支付能力為準。", "", ""]]}, {"id": "p114a", "label": "114年・不動產估價概要", "year": 114, "subj": "R12", "qs": [["C", "鄰近國小的店舖，做販賣文具及圖書生意使用，此為何種不動產估價原則之掌握？", ["外部性原則", "貢獻原則", "適合原則", "內部性原則"], "R12101", "不動產用途要與周圍環境配合才能發揮最大效用，是「適合原則」：學校旁開文具書店最適合。", "", ""], ["B", "以成本法進行不動產估價，下列何者非為總成本應包括之項目？", ["營造或施工費", "出售不動產之所得稅", "資本利息", "建築利潤"], "R12203", "成本法總成本包括營造施工費、規劃設計費、廣告銷售費、管理費、稅捐及其他負擔、資本利息、開發或建築利潤（技術規則第 48 條）；「出售不動產的所得稅」不屬之。", "", ""], ["C", "建築物屋齡10 年，重建成本2,000 萬元，若殘價率為10%，經濟耐用年數50 年，選擇等速折舊路徑的方法計算累積折舊額為多少萬元？", ["400", "40", "360", "36"], "R12203", "定額法累積折舊額＝重建成本×（1－殘價率）×經歷年數／經濟耐用年數＝2,000×0.9×10/50＝360 萬元。", "", ""], ["A", "比較標的為與法定用途不符之交易，應先作適當之調整才能採用，此為何種調整？", ["情況調整", "價格日期調整", "區域因素調整", "個別因素調整"], "R12201", "交易情況特殊（含與法定用途不符、急買急賣、親友交易等）先做「情況調整」，才能採用。", "", ""], ["D", "下列價格調整率何者符合不動產估價技術規則之規定？", ["區域因素總價格調整率為18%", "個別因素總價格調整率為18%", "個別因素內之任一單獨項目之價格調整率為18%", "情況、價格日期、區域因素及個別因素調整總調整率為18%"], "R12201", "技術規則第 25 條：區域因素、個別因素或其內任一單獨項目調整率大於 15%，或四項總調整率大於 30%，應排除。所以只有 (D) 總調整率 18% 符合。", "", ""], ["B", "勘估標的未來平均1 年期間之客觀淨收益為100 萬元，收益價格為2,000 萬元，收益資本化率為：", ["3%", "5%", "8%", "10%"], "R12202", "直接資本化法：收益價格＝淨收益／收益資本化率 → 收益資本化率＝100／2,000＝5%。", "", ""], ["B", "以投資為目的之不動產投資評估，最適合的估價方法為：", ["比較法", "折現現金流量分析法", "成本法", "土地開發分析法"], "R12202", "投資評估重在未來各期現金流量與期末處分價值，最適合「折現現金流量分析法（DCF）」。", "", ""], ["C", "債務保障比率為1.3、貸款常數為0.055、貸款資金占不動產價格比率為70%，收益資本化率約為：", ["3%", "4%", "5%", "6%"], "R12202", "債務保障比率法：收益資本化率＝債務保障比率 × 貸款常數 × 貸款資金占不動產價格比率＝1.3×0.055×0.7≈5%。", "", ""], ["C", "附著於土地之工事及水利土壤之改良，以何種方法估價為原則？", ["比較法", "收益法", "成本法", "土地殘餘法"], "R12203", "附著於土地之工事及水利土壤之改良，以成本法估價為原則（技術規則第 82 條）；但不能單獨估價者併入土地估價。", "", ""], ["C", "下列有關直接資本化法之敘述何者正確？", ["屬於比較法之一種", "應以勘估標的作最合理使用之客觀淨收益為基準", "應用價格日期當時適當之收益資本化率推算", "計算過程應另加計期末價值"], "R12202", "直接資本化法以「價格日期當時」適當之收益資本化率推算。(B) 應以「未來平均一年期間」客觀淨收益為基準；(D) 加計期末價值是 DCF 的做法；直接資本化屬收益法。", "", ""], ["D", "下列有關成本法之敘述何者正確？", ["建物估價以求取重置成本為原則", "預售收入之資金應計息", "建物折舊額計算應以物理耐用年數為主", "建物之殘餘價格率以不超過百分之十為原則"], "R12203", "建物殘餘價格率以不超過 10% 為原則（技術規則第 67 條）。(A) 建物估價以重建成本為原則；(B) 預售收入不計息；(C) 折舊以「經濟耐用年數」為主。", "", ""], ["C", "有關土地開發分析法之資本利息綜合利率之敘述何者正確？", ["資本利息綜合利率＝貸款利息年利率×（建物價值比率＋土地價值比率×1/2）× 開發年數", "資本利息綜合利率＝資本利息年利率×（建物價值比率＋土地價值比率×1/2）× 開發年數", "資本利息綜合利率＝資本利息年利率×（土地價值比率＋建物價值比率×1/2）× 開發年數", "資本利息綜合利率＝貸款利息年利率×（土地價值比率＋建物價值比率×1/2）× 開發年數 114 年 第 13 題 下列因素：(A)地區淹水 (B)捷運站設置 (C)利率變動 (D)離小學距離，那些是屬於影響不動產價格之區域因素？"], "R12204", "資本利息綜合利率＝資本利息年利率 ×（土地價值比率＋建物價值比率×1/2）× 開發年數（技術規則第 58 條）：土地一開始就全額投入，建物是陸續投入所以 ×1/2。", "", ""], ["A", "下列因素：①地區淹水 ②捷運站設置 ③利率變動 ④離小學距離，那些是屬於影響不動產價格之區域因素？", ["①②", "①③", "②③④", "①②③④"], "R12101", "區域因素影響「近鄰地區」整體價格水準：地區淹水、捷運站設置。利率變動是一般因素；離小學距離是該筆不動產本身條件，屬個別因素。", "", ""], ["B", "下列何者是個別因素之描述？", ["甲先生的房子位於重劃區內，房價水準很高", "乙小姐的房子距捷運站距離大約50 公尺", "X 大學特定區生活機能佳", "大巨蛋球場完工，周圍不動產房價跟著起漲"], "R12101", "距捷運站 50 公尺是該房屋本身的位置條件，屬個別因素。重劃區、大學特定區、大巨蛋周邊都是地區整體的區域因素。", "", ""], ["B", "下列各項原則中，何者最能說明畸零地價格偏高的現象？", ["預期原則", "貢獻原則", "適合原則", "外部性原則"], "R12101", "畸零地單獨使用效用低，但併入鄰地後能大幅提高整體效用，對相鄰地主的貢獻大，所以價格偏高，屬「貢獻原則」。", "", ""], ["D", "評估臺南孔廟的現值，依不動產估價技術規則之規定，其價格種類為下列何者？", ["正常價格", "限定價格", "特定價格", "特殊價格"], "R12101", "孔廟這類不具市場性的文化資產、宗教建築，價格種類屬「特殊價格」（技術規則第 2 條）。", "", ""], ["D", "不動產估價報告書中應註明價格日期與勘查日期，就時間發生的先後下列敘述何者正確？", ["價格日期先於勘查日期", "勘查日期先於價格日期", "勘查日期等於價格日期", "不一定"], "R12102", "價格日期與勘察日期沒有必然先後：一般是同日或相近，但可評估過去（追溯）或未來的價格日期，所以「不一定」。", "", ""], ["B", "勘估標的營造或施工費之求取得採直接法或間接法，下列各方法中何者相對精細？", ["工程造價比較法", "淨計法", "單位工程法", "單位面積比較法"], "R12203", "直接法分「淨計法」（逐一計算材料與人工數量×單價）與「單位工程法」，淨計法最精細；間接法有工程造價比較法、單位面積（或體積）比較法。", "", ""], ["D", "收益法中對於收益的資本化可採收益資本化率或折現率，下列對於兩者數值高低關係之敘述何者正確？", ["收益資本化率高於折現率", "收益資本化率低於折現率", "收益資本化率等於折現率", "不一定"], "R12202", "收益資本化率與折現率的大小取決於收益成長預期等條件，兩者高低「不一定」。", "", ""], ["C", "不動產相對一般性財貨具低流通、高風險、高增值及管理較難等特性；於採風險溢酬法決定收益資本化率時，上述特性中何者與收益資本化率高低呈反向變動？", ["流通性", "風險性", "增值性", "管理難度"], "R12202", "風險溢酬法：流通性低、風險高、管理難都會「提高」資本化率；增值性高則「降低」資本化率，呈反向變動。", "", ""], ["B", "以直接資本化法對同一不動產之土地、建物及不動產分別評估其價值，則三者之收益資本化率數值何者最高？", ["土地", "建物", "不動產", "不一定"], "R12202", "建物會折舊、耐用年限有限、風險較高，所以建物收益資本化率通常最高；土地最低，房地綜合介於兩者之間。", "", ""], ["D", "依不動產估價技術規則第130 條之規定，不動產租金估計以估計勘估標的之何種租金為原則？", ["經濟租金", "支付租金", "合理租金", "實質租金"], "R12204", "不動產租金估計，以估計勘估標的之「實質租金」為原則（技術規則第 130 條）。", "", ""], ["C", "依不動產估價技術規則第32 條之規定，若期末處分價值已知，以折現現金流量分析法計入該價值時，應採取那一種資本化率？", ["直接資本化率", "綜合資本化率", "折現率", "利率"], "R12202", "DCF 計入期末處分價值時，應以「折現率」折現（技術規則第 32 條）。", "", ""], ["D", "於不動產租金估計中有所謂的經濟租金與支付租金，兩者的大小關係為何？", ["經濟租金高於支付租金", "經濟租金低於支付租金", "經濟租金等於支付租金", "不一定"], "R12204", "經濟租金（理論上應得）與實際支付租金之間，受權利金、押金運用收益等影響，大小關係「不一定」。", "", ""], ["C", "估價事務所接受委託展開估價作業前應先確定估價基本事項，於下列各項中應包含那些項目？①確定勘估標的內容 ②確定勘查日期 ③確定價格種類 ④確定估價目的 ⑤確定估價條件", ["僅①③④", "①②③④", "①③④⑤", "①②③④⑤"], "R12102", "確定估價基本事項：勘估標的內容、價格日期、價格種類及條件、估價目的（技術規則第 9 條）。是「價格日期」不是勘查日期，故為 ①③④⑤。", "", ""]]}, {"id": "p113a", "label": "113年・不動產估價概要", "year": 113, "subj": "R12", "qs": [["B", "不動產市場循環受到諸多經濟因素的影響，評估不動產價格時都訂有價格日期，依價格日期評估時必須掌握那項原則？", ["預測原則", "變動原則", "收益分配原則", "外部性原則"], "R12101", "不動產價格隨市場循環不斷變動，所以評估時要訂價格日期，掌握的是「變動原則」。", "", ""], ["B", "王小姐住家旁有一個高壓電塔，電塔周遭的房子不太容易售出，價格也比較低，不動產估價師評估該嫌惡設施對於房屋價格的影響是基於那一項原則？", ["適合原則", "外部性原則", "貢獻原則", "競爭原則"], "R12101", "高壓電塔等嫌惡設施對周邊不動產價值的負面影響，屬「外部性原則」。", "", ""], ["D", "下列何者非屬於不動產估價範疇？", ["大鵬灣濕地", "地上權房屋，如101 大樓", "種植在山上的果樹", "從果樹上摘下來的果實"], "R12101", "不動產估價範疇包括土地、建物、定著物、農作改良物及其權利；已摘下的果實是動產，不屬之。", "", ""], ["B", "某預售建案因取得綠建築黃金級標章，每坪開價比附近未取得標章之建案貴，建商申請綠建築標章的行為是基於不動產估價之何種經濟原則？", ["最高最有效原則", "貢獻原則", "供需原則", "外部性原則"], "R12101", "取得綠建築標章這項投入能提高整體價值，判斷某部分投入對整體價值的貢獻，屬「貢獻原則」。", "", ""], ["B", "下列有關租金估計的敘述何者錯誤？", ["租金估價的價格種類包括正常租金與限定租金兩種", "名目租金，指承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數", "續訂租金與正常市場租金不同，故續訂租金屬於限定租金", "積算法用於評估正常租金"], "R12204", "承租人每期支付的租金加計押金、保證金、權利金等運用收益的總數，是「實質租金」的定義，不是名目（支付）租金。(C) 續訂租金屬限定租金。", "", ""], ["C", "不動產估價技術規則對不動產估價方法運用的規定，下列何者錯誤？", ["不動產估價師應兼採二種以上估價方法推算勘估標的價格", "不動產估價師應就不同估價方法估價所獲得之價格進行綜合比較，就其中金額顯著差異者重新檢討", "評估證券化不動產清算價格時，對於折現現金流量分析法之收益價格應賦予相對較大之權重", "對於各方法試算價格應視不同價格所蒐集資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度，決定勘估標的價格，並將決定理由詳予敘明"], "R12102", "以 DCF 收益價格賦予較大權重，是針對證券化不動產「一般價格」評估；評估「清算價格」性質不同，不適用此原則。其餘是技術規則第 14～16 條：兼採二種以上方法、顯著差異應重新檢討、依資料可信度決定權重。", "", ""], ["A", "有關比較法的敘述下列何者錯誤？", ["比較標的價格經情況調整、價格日期調整、區域因素調整及個別因素調整後所獲得之價格稱為比較價格", "比較法指以比較標的價格為基礎，經比較、分析及調整等，以推算勘估標的價格之方法", "價格日期調整是指比較標的之交易日期與勘估標的之價格日期因時間之差異，致價格水準發生變動，應以適當之變動率或變動金額，將比較標的價格調整為勘估標的價格日期之價格", "比較標的與勘估標的不在同一近鄰地區內時，為將比較標的之價格轉化為與勘估標的同一近鄰地區內之價格水準的調整稱為區域因素調整"], "R12201", "比較標的價格經情況、價格日期、區域及個別因素調整後得到的是「試算價格」；試算價格再經檢討、加權決定後才是「比較價格」。", "", ""], ["D", "不動產估價技術規則第26 條第1 項：經比較調整後求得之勘估標的試算價格，應就價格偏高或偏低者重新檢討，經檢討確認適當合理者，始得作為決定比較價格之基礎。檢討後試算價格之間差距仍達百分之二十以上者，應排除該試算價格之適用。若比較標的一、二、三之試算價格分別為79 萬元/坪，77 萬元/坪及95 萬元/坪，下列敘述何者正確？", ["三個試算價格之間皆符合排除條件", "三個試算價格之間皆不符合排除條件", "比較標的一與三之間符合排除條件", "比較標的二與三之間符合排除條件"], "R12201", "技術規則第 26 條：試算價格之間差距達 20% 以上應排除。依題目給的三個試算價格計算，只有比較標的二與三之間差距達 20%。", "", ""], ["C", "下列何者非屬營造或施工費的內含項目？", ["直接人工費", "間接材料費", "開發商的合理利潤", "資本利息"], "R12203", "營造或施工費包括直接材料、直接人工、間接材料、間接人工、管理費、稅捐、資本利息及營造施工利潤（技術規則第 50 條）；開發商（建商）的利潤屬總成本中的「開發或建築利潤」，不在營造施工費內。", "", ""], ["A", "有關營造或施工費的敘述何者錯誤？", ["營造或施工費屬於建物總成本的一部分，房屋愈舊，營造或施工費就愈低", "勘估標的之營造或施工費，得按直接法或間接法擇一求取之。功能性退化造成的折舊屬於房屋折舊的一部分", "淨計法屬於直接法的一種，是指就勘估標的所需要各種建築材料及人工之數量，逐一乘以價格日期當時該建築材料之單價及人工工資，並加計管理費、稅捐、資本利息及利潤", "單位工程法也屬於直接法，係以建築細部工程之各項目單價乘以該工程施工數量，並合計之"], "R12203", "營造施工費是以「價格日期當時」重新建造的成本計算，跟房屋新舊無關；房屋老舊反映在折舊，不是營造施工費變低。", "", ""], ["A", "中央銀行理監事會於113 年第3 季會議決議調升存款準備率及調整選擇性信用管制措施，此項宣布可能會影響不動產市場與價值，此為影響不動產價值之何種因素？", ["一般因素", "情況因素", "區域因素", "個別因素"], "R12101", "央行貨幣政策（存款準備率、信用管制）全面影響整個不動產市場，屬「一般因素」。", "", ""], ["A", "下列對於有效總收入與總收入之間關係的敘述何者正確？", ["總收入必定大於或等於有效總收入", "有效總收入與總收入只是說法上不同，兩者在實質的意義上一樣", "總收入減去總費用等於淨收益", "總收入=有效總收入+總費用"], "R12202", "有效總收入＝總收入－閒置損失－呆帳損失，所以總收入必定 ≥ 有效總收入。淨收益是「有效總收入」減總費用。", "", ""], ["C", "收益資本化率決定的方法中與銀行貸款成數相關的是那一個方法？", ["市場萃取法", "有效總收入乘數法", "債務保障比率法", "風險溢酬法"], "R12202", "債務保障比率法：收益資本化率＝債務保障比率×貸款常數×貸款資金占不動產價格比率，與銀行貸款成數相關。", "", ""], ["A", "有關收益法的公式，下列何者錯誤？", ["淨收益未扣除折舊提存費者，建物收益價格＝建物淨收益／建物收益資本化率", "直接資本化法之收益價格＝勘估標的未來平均一年期間之客觀淨收益／收益資本化率", "地上有建物者，土地收益價格＝（房地淨收益－建物淨收益）／土地收益資本化率", "淨收益已扣除折舊提存費者，房地綜合收益資本化率＝土地收益資本化率×土地價值比率＋建物收益資本化率×建物價值比率"], "R12202", "淨收益「未扣除」折舊提存費者，建物收益價格＝建物折舊前淨收益／（建物收益資本化率＋折舊提存率）；只除以建物資本化率是已扣除折舊提存費的公式。", "", ""], ["B", "有關特殊宗地估價敘述，下列何者錯誤？", ["農場或牧場之估價，以比較法估價為原則", "公共設施用地及公共設施保留地之估價，應考慮政府徵收土地之可能價格評估之", "高爾夫球場之估價，應考慮會員制度、球場設施、開發成本、收益及營運費用等因素", "鹽田之估價無買賣實例者，得以附近土地價格為基礎，考慮其日照、通風、位置及形狀等差異，比較推估之"], "R12204", "公共設施用地及保留地以比較法為原則，無買賣實例者比較毗鄰土地使用分區、使用強度及價值減損情況推算，不是以「政府徵收的可能價格」評估。", "", ""], ["C", "有關權利估價敘述，下列何者正確？", ["市地重劃前後土地估價係作為地主分配的依據，不屬於權利估價", "永佃權估價，不需要考慮佃租支付情形，依民間習慣估計之", "地上權估價，應考慮其用途、權利存續期間、支付地租之有無、權利讓與之限制及地上權設定之空間位置等因素估計之", "容積移轉估價，主要考慮捐贈公共設施用地的市場價格決定之"], "R12204", "地上權估價應考慮用途、存續期間、地租有無、讓與限制及設定的空間位置（技術規則第 113 條）。(A) 市地重劃前後地價估價屬特殊估價；(B) 永佃權要考慮佃租支付情形；(D) 容積移轉估價考量送出與接受基地價格。", "", ""], ["C", "下列那種情況評估的是特殊價格？", ["估價師受託辦理評估因都市計畫將公園變更為住宅用地之土地價格", "估價師受託辦理評估以土地租賃權與租賃地合併為目的之價格", "估價師受託辦理評估大甲鎮瀾宮的價格", "估價師受託辦理評估都市邊緣未來可能變更為建地的農地價格"], "R12101", "寺廟（大甲鎮瀾宮）這類不具市場性者，屬「特殊價格」。(A)(D) 為特定價格；(B) 租賃權與租賃地合併屬限定價格。", "", ""], ["B", "影響不動產價格的三大因素中區域因素甚為重要，下列敘述何者非屬區域因素的描述？", ["王小姐的房子位於信義計畫區內房價水準很高", "張先生的房子距離大安森林公園約50 公尺條件很好", "板橋埔墘生活圈生活機能很好", "中正紀念堂周遭的房子有很好的價值條件"], "R12101", "距大安森林公園 50 公尺是該房屋本身的條件，屬個別因素；信義計畫區、埔墘生活圈、中正紀念堂周遭都是近鄰地區整體條件。", "", ""], ["B", "A 把忠孝東路五段鄰近市政府的店面出租給一間連鎖咖啡店，每月租金100,000 元，押金2 個月，假設年利率2.5%，約定每年管理費120,000 元由咖啡店支付，請問其一年支付之實質租金為多少元？", ["1,200,000", "1,205,000", "1,085,000", "1,080,000"], "R12204", "實質租金＝支付租金 100,000×12＋押金運用收益（200,000×2.5%＝5,000）＝1,205,000 元。管理費由承租人直接支付給管委會，不計入付給出租人的租金。", "", ""], ["A", "某公寓因為隔壁基地正在興建危老建案造成外牆龜裂現象，此現象屬於那一種折舊類型？", ["物理性折舊", "功能性折舊", "經濟性折舊", "外部性折舊"], "R12203", "外牆龜裂是建物實體的損壞，屬「物理性折舊」。功能性是設計落伍；經濟性是外部環境使價值降低。", "", ""], ["B", "一棟屋齡30 年的公寓，假設現在重建成本是3,000 萬元，耐用年數為50 年，殘餘價格率為10%，以定額法計算折舊的情況下，目前公寓的價值是多少？", ["1,620 萬元", "1,380 萬元", "1,080 萬元", "1,200 萬元"], "R12203", "累積折舊＝3,000×0.9×30/50＝1,620 萬元，建物成本價格＝3,000－1,620＝1,380 萬元。", "", ""], ["B", "比較標的於112 年9 月以3,060 萬元售出，當時房價指數為102；勘估標的價格日期為113 年5月，房價指數上漲至105。假設其他條件相同，勘估標的經價格日期調整後的應該是多少？", ["2,970 萬元", "3,150 萬元", "3,240 萬元", "3,210 萬元"], "R12201", "價格日期調整＝3,060×105/102＝3,150 萬元。", "", ""], ["B", "依據不動產估價技術規則規定試算價格的價格決定，那一項不適用？", ["試算價格調整過程中，任一單獨項目之價格調整率大於15%時應排除", "試算價格調整過程中，總調整率大於20%應排除", "試算價格調整過程中，總調整率大於30%應排除", "試算價格調整過程中，試算價格之間差距達20%以上應排除"], "R12201", "依第 25、26 條：單項調整率大於 15% 排除、總調整率大於 30% 排除、試算價格之間差距達 20% 以上排除。「總調整率大於 20% 應排除」不是規定。", "", ""], ["B", "某一開發案自有資金比例是30%，其餘資金向銀行貸款，貸款利率為3%，自有資金報酬率為2%，其資本化率為何？", ["2.3%", "2.7%", "2.5%", "2.6%"], "R12202", "加權平均資本成本：30%×2%＋70%×3%＝0.6%＋2.1%＝2.7%。", "", ""], ["D", "某一棟四層樓公寓，各樓層面積皆相同，一樓單價每坪50 萬元，4 樓單價每坪40 萬元，假設4樓之樓層別效用比為100%，請問一樓的樓層別效用比是多少？", ["150%", "130%", "115%", "125%"], "R12204", "樓層別效用比與單價成正比：50/40×100%＝125%。", "", ""]]}, {"id": "p112a", "label": "112年・不動產估價概要", "year": 112, "subj": "R12", "qs": [["D", "不動產售屋廣告中「面對公園第一排」，對不動產之影響，是屬於不動產估價影響因素中之何種因素？", ["一般因素", "市場因素", "區域因素", "個別因素"], "R12101", "「面對公園第一排」是這間房子本身的位置條件，屬個別因素。", "", ""], ["B", "不動產估價師受託評估總統府價值，此屬於何種價格種類？", ["申報價格", "特殊價格", "特定價格", "限定價格"], "R12101", "總統府這類不具市場性的不動產，價格種類屬「特殊價格」。", "", ""], ["A", "各直轄市、縣（市）國土計畫於110 年4 月30 日公告實施，此為影響不動產價格之何種因素？", ["一般因素", "市場因素", "區域因素", "個別因素"], "R12101", "國土計畫公告實施是全面性的政策，對整個不動產市場產生影響，屬一般因素。", "", ""], ["C", "收益性不動產價值是由現在至將來所能帶給權利人之利潤總計，估價師求取將來的收益據以評估不動產價值，應重視何種不動產估價原則？", ["期日原則", "外部性原則", "預測原則", "內部性原則"], "R12101", "收益性不動產價值取決於未來收益，估價要預測將來收益，屬「預測原則」。", "", ""], ["B", "老舊公寓因加裝電梯設備，價格也因此提升，此為何種不動產原則？", ["收益分配原則", "貢獻原則", "均衡原則", "供需原則"], "R12101", "加裝電梯這項投入使整體價值提升，屬「貢獻原則」。", "", ""], ["A", "依不動產估價技術規則規定，比較標的為父親賣給兒子之交易，應進行何種調整？", ["情況調整", "價格日期調整", "區域因素調整", "個人因素調整"], "R12201", "親屬間交易屬特殊交易情況，應先做「情況調整」（技術規則第 23 條）。", "", ""], ["D", "下列之建物殘餘價格率，何者符合不動產估價技術規則之規定？", ["20%", "18%", "12%", "8%"], "R12203", "建物殘餘價格率以不超過 10% 為原則（技術規則第 67 條），只有 8% 符合。", "", ""], ["C", "有一不動產平均每年每坪之淨收益為3,000 元，若收益資本化率為5%，該不動產每坪之收益價格為：", ["8 萬元", "7 萬元", "6 萬元", "5 萬元"], "R12202", "收益價格＝淨收益／收益資本化率＝3,000／5%＝60,000 元＝6 萬元。", "", ""], ["C", "下列何者不是收益法推算勘估標的總費用之項目？", ["地價稅", "房屋稅", "土地增值稅", "維修費"], "R12202", "總費用包括地價稅（或地租）、房屋稅、保險費、管理費、維修費等（技術規則第 37 條）；土地增值稅是移轉時才發生，不是持有營運費用。", "", ""], ["B", "有一幢公寓每坪平均售價為60 萬元，1 樓每坪售價為75 萬元，4 樓每坪售價為50 萬元，建物價格占不動產價格之40%，若4 樓之樓層別效用比為100%，則1 樓之樓層別效用比為何？", ["175%", "150%", "120%", "102%"], "R12204", "樓層別效用比與單價成正比：75／50×100%＝150%。", "", ""], ["C", "目前銀行之一年期定存利率為1.57%，活存利率為0.58%，短期放款利率為7.11%，下列之敘述何者正確？", ["資金中自有資金之計息利率為7.11%", "資金中預售收入之計息利率為0.58%", "資金中自有資金之計息利率為1.52%", "資金中借款之計息利率為1.57%"], "R12204", "資本利息計算：自有資金按「一年期定期存款」利率計息、借款按借款利率、預售收入不計息（技術規則第 58 條）。依官方答案選 (C)。", "", ""], ["B", "就勘估標的所需要各種建築材料及人工之數量，逐一乘以價格日期當時該建築材料之單價及人工工資，並加計管理費、稅捐、資本利息及利潤，以求取勘估標的營造施工費之方法為何？", ["間接法", "淨計法", "工程造價比較法", "單位面積比較法"], "R12203", "逐一計算材料、人工數量乘以單價，再加計管理費、稅捐、資本利息及利潤，是直接法中的「淨計法」。", "", ""], ["C", "不動產租金估計，以估計勘估標的之何種租金為原則？", ["市場租金", "差額租金", "實質租金", "經濟租金"], "R12204", "不動產租金估計，以估計勘估標的之「實質租金」為原則（技術規則第 130 條）。", "", ""], ["B", "決定收益資本化率之方法中，選擇數個與勘估標的相同或相似之比較標的，以其淨收益除以價格後，以所得之商數加以比較決定之方法為何？", ["風險溢酬法", "市場萃取法", "債務保障比率法", "折現現金流量分析法"], "R12202", "選數個相同或相似比較標的，以其淨收益除以價格得出的商數比較決定，是「市場萃取法」。", "", ""], ["C", "依不動產估價技術規則之規定，有關特殊宗地估價之敘述，下列何者正確？", ["高爾夫球場之估價，以比較法估價為原則", "溫泉地之估價，以比較法估價為原則", "鹽田之估價，以比較法估價為原則", "林地之估價，以比較法估價為原則"], "R12204", "鹽田估價以比較法為原則（無買賣實例者以附近土地價格為基礎比較推估）。高爾夫球場要考量會員制度、開發成本及收益；溫泉地、林地也各有特殊考量，技術規則未規定以比較法為原則。", "", ""], ["B", "有關計量模型分析法之敘述，下列何者錯誤？", ["計量模型分析法截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率不得大於百分之五", "計量模型分析法只能用以推算各主要影響價格因素之調整率", "計量模型分析法可求出各主要影響價格因素與比較標的價格二者之關係式", "計量模型分析採迴歸分析者，其調整後判定係數不得低於零點七"], "R12201", "計量模型分析法求出的關係式，可推算各主要影響價格因素的「調整率及調整額」，不只調整率。(A)(D) 是技術規則第 21 條的檢定門檻。", "", ""], ["A", "有關不動產租金估計之敘述，下列何者正確？", ["不動產租金估計，以估計勘估標的之承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數為原則", "新訂租約之租金估計得以勘估標的預估契約租金之淨收益，估計租金未來變動趨勢調整後，再加計必要費用", "續訂租約之租金估計得以勘估標的價格乘以租金收益率，以估計淨收益，再加計必要費用", "不動產之租金估計不應考慮使用目的"], "R12204", "不動產租金估計以實質租金為原則，(A) 即實質租金的定義。(B)(C) 把新訂與續訂租約的方法對調了。", "", ""], ["B", "當債務保障比率要求為1.5 倍，貸款常數為0.1，不動產價格為新臺幣60 億元，自有資金為新臺幣15 億元，不足資金則跟銀行貸款。請問在前述情況下收益資本化率（折現率）為何？", ["15%", "11.25%", "5%", "3.75%"], "R12202", "貸款比率＝(60－15)/60＝75%；收益資本化率＝1.5×0.1×0.75＝11.25%。", "", ""], ["A", "在宗地估價中，公共設施用地及公共設施保留地之估價，以下列那一種方法估價為原則？", ["比較法", "收益法", "成本法", "土地開發分析法"], "R12204", "公共設施用地及公共設施保留地以比較法估價為原則（技術規則第 80 條）。", "", ""], ["A", "下列何者不屬於土地建築開發之間接成本項目？", ["建築開發之施工人員施工費用", "建築開發之規劃設計費", "建築開發之管理費", "建築開發之銷售費"], "R12203", "施工人員的施工費屬「直接成本」（營造施工費）；規劃設計費、管理費、銷售費是間接成本。", "", ""], ["A", "有關房地成本價格之計算公式，下列何者正確？", ["房地成本價格＝土地總成本＋建物成本價格", "房地成本價格＝土地總成本＋建物總成本", "房地成本價格＝土地價格＋建物成本價格－建物累積折舊額", "房地成本價格＝土地價格＋建物成本價格＋建物累積折舊額"], "R12203", "房地成本價格＝土地總成本＋建物成本價格（建物成本價格＝建物總成本－累積折舊額）。", "", ""], ["C", "下列那一種方法不屬於計算收益資本化率或折現率之方法？", ["加權平均資金成本法", "有效總收入乘數法", "折現現金流量分析法", "風險溢酬法"], "R12202", "決定收益資本化率的方法：風險溢酬法、市場萃取法、加權平均資金成本法、債務保障比率法、有效總收入乘數法；DCF 是估價方法，不是決定資本化率的方法。", "", ""], ["B", "比較法估價試算價格之調整運算過程中，區域因素調整、個別因素調整或區域因素及個別因素內之任一單獨項目之價格調整率大於（甲），或情況、價格日期、區域因素及個別因素調整總調整率大於（乙）時，判定該比較標的與勘估標的差異過大，應排除該比較標的之適用。請問（甲）與（乙）各為多少？", ["（甲）為百分之十五，（乙）為百分之十五", "（甲）為百分之十五，（乙）為百分之三十", "（甲）為百分之三十，（乙）為百分之十五", "（甲）為百分之三十，（乙）為百分之三十"], "R12201", "單項或區域／個別因素總調整率大於 15%，或四項總調整率大於 30%，應排除（技術規則第 25 條）。", "", ""], ["D", "如果一開發案開發後預期總銷售金額為新臺幣10 億元，適當之利潤率為10%，開發所需之直接成本為新臺幣6 億元，開發所需之間接成本為新臺幣2 億元，開發所需總成本之資本利息綜合利率為5%。請問下列何者最接近此一開發案之土地開發分析價格？", ["新臺幣2 億元", "新臺幣1.5 億元", "新臺幣1.091 億元", "新臺幣0.658 億元"], "R12204", "土地開發分析價格＝總銷售金額÷(1＋利潤率)÷(1＋資本利息綜合利率)－(直接成本＋間接成本)＝10÷1.1÷1.05－8≈0.658 億元。", "", ""], ["D", "有關一宗土地內有數種不同法定用途時之估價敘述，下列何者錯誤？", ["估價前應先考量其最有效使用再決定估價方式", "在考量宗地狀況後可以視不同法定用途採分別估價", "估價前應先考量各種用途之相關性及分割之難易度再決定估價方式", "估價時無須考量是否有數種不同法定用途，只需依其主要用途估價"], "R12204", "一宗土地有數種法定用途，應考量最有效使用、用途相關性及分割難易度，決定分別估價或依主要用途估價；不能一律只依主要用途。", "", ""]]}, {"id": "p111a", "label": "111年・不動產估價概要", "year": 111, "subj": "R12", "qs": [["B", "平均地權條例近日研議抑制炒房之修法動向，其對不動產市場之影響，是屬於不動產估價影響因素中之下列何種因素？", ["市場因素", "一般因素", "區域因素", "個別因素"], "R12101", "平均地權條例修法是全國性政策，屬一般因素。", "", ""], ["D", "不動產估價應敘明價格種類，當不動產估價師受託辦理龜山島估價，您認為應屬於何種價格種類？", ["正常價格", "限定價格", "特定價格", "特殊價格"], "R12101", "龜山島不具市場性，屬「特殊價格」。", "", ""], ["D", "收益資本化率或折現率應綜合評估最適宜之方法決定，如採用債務保障比率方式決定，其計算式債務保障比率除了乘以貸款資金占不動產價格比率外，應再乘以下列何者？", ["債務保障常數", "市場常數", "存款常數", "貸款常數"], "R12202", "債務保障比率法：收益資本化率＝債務保障比率×貸款常數×貸款資金占不動產價格比率。", "", ""], ["D", "依據不動產估價技術規則之規定，在一宗土地內有不同法定用途時，應如何估價？", ["應考量不同用途之合併或分割前後之價格變動情形，予酌量增減", "應以合併用途後估價，並以合併用途前各筆土地價值比例分算其土地價格", "應考慮不同用途之建築物對宗地價格造成之影響，予以酌量增減", "應考量其最有效使用及各種用途之相關性及分割之難易度後，決定分別估價或依主要用途估價"], "R12204", "一宗土地內有數種不同法定用途時，應考量其最有效使用及各種用途之相關性、分割之難易度後，決定分別估價或依主要用途估價。", "", ""], ["D", "不動產估價原則是估價之根基，不動產估價技術規則對「最有效使用」原則有所定義，請問下列敘述何者錯誤？", ["得以獲致最高利益之使用", "基於合法、實質可能前提", "正當合理、財務可行前提下者", "具有超凡意識及使用能力者"], "R12101", "最有效使用：客觀上具有良好意識及通常之使用能力者，在合法、實質可能、正當合理、財務可行前提下所作得獲致最高利益之使用。是「良好意識及通常使用能力」，不是「超凡」。", "", ""], ["A", "利用計量模型分析法進行估價，應蒐集相當數量具代表性之比較標的，在計量模型的影響不動產價格之因素中，現有6 項區域因素，5 項個別因素，因此至少要蒐集多少數量以上之比較標的才符合不動產估價技術規則之規定？", ["55 筆以上", "40 筆以上", "30 筆以上", "25 筆以上"], "R12201", "計量模型分析法：比較標的數量須為影響因素數量的 5 倍以上，(6＋5)×5＝55 筆以上（技術規則第 21 條）。", "", ""], ["C", "不動產估價成本法對勘估標的之營造或施工費，其中「指以類似勘估標的之比較標的或標準建物之單位面積（或體積）營造或施工費單價為基礎，經比較並調整價格後，乘以勘估標的之面積（或體積）總數，以求取勘估標的營造或施工費。」方法，係指何方法？", ["單位工程法", "淨計法", "單位面積（或體積）比較法", "工程造價比較法"], "R12203", "以類似比較標的或標準建物的單位面積（體積）單價為基礎比較調整，再乘以總面積（體積），是「單位面積（或體積）比較法」，屬間接法。", "", ""], ["D", "不動產估價作業程序依不動產估價技術規則規定，總共有八項作業程序，其中第七個步驟為何？", ["製作估價報告書", "整理、比較、分析資料", "運用估價方法推算勘估標的價格", "決定勘估標的價格"], "R12102", "估價八步驟：確定估價基本事項→擬定計畫→蒐集資料→確認勘估標的狀態→整理比較分析資料→運用方法推算→決定價格→製作報告書。第 7 步是「決定勘估標的價格」。", "", ""], ["A", "目前內政部積極推動試辦電腦估價，所應用計量模型分析法係指「蒐集相當數量具代表性之比較標的，透過計量模型分析，求出各主要影響價格因素與比較標的價格二者之關係式，以推算各主要影響價格因素之調整率及調整額之方法。」請問應用時應符合條件中，截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率不得大於多少？", ["百分之五", "百分之六", "百分之七", "百分之八"], "R12201", "計量模型：截距項以外各主要影響因素係數同時為零的顯著機率不得大於 5%；迴歸分析調整後判定係數不得低於 0.7。", "", ""], ["C", "不動產估價應就不同估價方法估價所獲得之價格進行綜合比較，視不同價格所蒐集資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度，決定勘估標的價格。若以契約約定租金作為不動產證券化受益證券信託利益分配基礎者，何種方法應視前項情形賦予相對較大之權重？", ["比較法", "直接資本化法之收益價格", "折現現金流量分析法之收益價格", "成本法"], "R12102", "以契約約定租金作為證券化受益證券信託利益分配基礎者，DCF 收益價格應視前條情形賦予相對較大權重（技術規則第 16 條）。", "", ""], ["D", "不動產估價比較法經比較調整後求得之勘估標的試算價格，應就價格偏高或偏低者重新檢討，經檢討確認適當合理者，始得作為決定比較價格之基礎。檢討後試算價格之間差距仍達多少以上者，應排除該試算價格之適用？", ["百分之五", "百分之十", "百分之十五", "百分之二十"], "R12201", "試算價格之間差距經檢討後仍達 20% 以上者，應排除（技術規則第 26 條）。", "", ""], ["D", "不動產估價之限定價格指具有市場性之不動產，在下列限定條件之一所形成之價值，並以貨幣金額表示者。請問下列何者非屬限定條件？", ["以不動產所有權以外其他權利與所有權合併為目的", "以不動產合併為目的", "以違反經濟合理性之不動產分割為前提", "經適當市場行銷及正常交易條件形成"], "R12101", "「經適當市場行銷及正常交易條件形成」是正常價格的定義。限定價格限定條件：權利合併、不動產合併、違反經濟合理性的分割。", "", ""], ["C", "不動產估價，應註明其價格種類；以何種價格估價時應敘明其估價條件，並同時估計其正常價格？", ["限定價格", "特殊價格", "特定價格", "特別價格"], "R12101", "以「特定價格」估價者，應敘明估價條件並同時估計其正常價格（技術規則第 6 條）。", "", ""], ["D", "不動產估價比較法於市場成交資訊充足時廣為運用，有關比較法之敘述，下列何者錯誤？", ["通常採用三件以上比較標的", "試算價格之調整運算過程中，任一單獨項目之價格調整率大於百分之十五，應排除該比較標的之適用", "試算價格之調整運算過程中，總調整率大於百分之三十時，應排除該比較標的之適用", "其調整以差額法為原則"], "R12201", "比較法調整以「百分率法」為原則，差額法為例外（技術規則第 24 條）。", "", ""], ["D", "某建物於五年前取得使用執照，目前重建成本1,000 萬元，殘餘價格率5%，經濟耐用年數50 年，請問以定額法估算之建物成本價格為何？", ["850 萬元", "865 萬元", "895 萬元", "905 萬元"], "R12203", "折舊＝1,000×(1－5%)×5/50＝95 萬元；成本價格＝1,000－95＝905 萬元。", "", ""], ["A", "某開發商擬於新開發區開發建築，預計興建樓板面積2,000 坪。若推定銷售單價平均60 萬元/坪，利潤率20%、資本利息綜合利率5%、直接成本2 億元、間接成本4 千萬元，請問土地開發分析價格多少萬元？", ["71,238", "69,526", "64,878", "62,106"], "R12204", "總銷售＝2,000 坪×60 萬＝120,000 萬；V＝120,000÷1.2÷1.05－(20,000＋4,000)＝95,238－24,000＝71,238 萬元。", "", ""], ["B", "某公寓為談危老改建，經委託不動產估價師就1 至4 樓之單價分別查估為80、60、55、50 萬元/坪，若全棟建物成本價格占全棟房地總價格比率為30%，請問1 至4 樓之樓層別效用比分別為？", ["170%、130%、120%、100%", "160%、120%、110%、100%", "150%、110%、105%、100%", "140%、120%、110%、100%"], "R12204", "以 4 樓為 100%，樓層別效用比＝各樓單價／4 樓單價：80/50＝160%、60/50＝120%、55/50＝110%。", "", ""], ["B", "不動產估價人員應針對不動產勘估標的之價格日期當時的價值進行估價，而所謂價格日期是指：", ["估價人員撰寫估價報告書之日期", "勘估標的價格之基準日期", "至勘估標的現場從事調查的日期", "勘估標的交易之日期"], "R12102", "價格日期是表示不動產價格的基準日期；至現場調查的日期是「勘察日期」。", "", ""], ["D", "以收益法估價時，對於客觀淨收益的計算應以何種情形為計算基準？", ["以比較標的作最有效使用為計算基準", "以勘估標的作最大效益使用為計算基準", "以比較標的作最大效益使用為計算基準", "以勘估標的作最有效使用為計算基準"], "R12202", "客觀淨收益應以「勘估標的」作「最有效使用」之客觀淨收益為基準（技術規則第 31 條）。", "", ""], ["A", "某高鐵站周圍地區的新建住宅大樓平均成交價格，由三年前每坪35 萬元上漲到現今每坪接近50萬元，此現象可以不動產估價中那一原則加以解釋？", ["變動原則", "預期原則", "貢獻原則", "日期原則"], "R12101", "價格隨時間（高鐵通車、市場循環）持續變動，屬「變動原則」。", "", ""], ["B", "依據不動產估價技術規則，在進行不動產估價作業程序時，下列何者屬於估價要確定的基本事項？", ["作業所需時間", "估價目的", "勘估標的之狀態", "勘估標的相關交易、收益及成本資料"], "R12102", "確定估價基本事項：勘估標的內容、價格日期、價格種類及條件、估價目的。", "", ""], ["B", "科學園區附近的農業用地，未來可能變更為建地，土地所有權人要求估價人員針對其農地未來可能變更為建地情況進行估價，請問該筆土地的價格屬於何種類？", ["正常價格", "特定價格", "限定價格", "特殊價格"], "R12101", "以農地未來可能變更為建地的條件估價，是基於特定條件下形成的價值，屬「特定價格」。", "", ""], ["C", "某甲有一棟5 層透天住宅，其中第一層到第四層為合法建築物，頂樓層為違章建築物，某甲委託估價人員進行房地估價，並要求估價人員對所有樓層進行估價，估價人員應如何估價較為恰當？", ["僅針對合法建築物進行估價", "拒絕對建築物估價", "就合法建築物與違章建築物分別標示各該部分之價格", "合法建築物以成本法估價，違章建築物則以加速折舊方式估價"], "R12204", "建物有違章部分，應就合法建物與違章建物「分別標示」各該部分之價格（技術規則第 76 條）。", "", ""], ["D", "有一比較標的於110 年10 月以800 萬元成交，當時的價格指數為103.6%，不動產勘估標的之價格日期為111 年3 月，當時的價格指數為100.3%。假設其他條件相同，請問該勘估標的經價格日期調整後的價格為多少？", ["834.7 萬元", "826.3 萬元", "789.6 萬元", "774.5 萬元"], "R12201", "價格日期調整＝800×100.3/103.6≈774.5 萬元（指數下跌，價格也下調）。", "", ""], ["C", "在土地開發分析法之估價程序中，應進行現況勘查與環境發展程度調查與分析，下列何者不屬於要勘查與調查分析的事項：", ["影響總銷售金額、成本及費用等因素", "勘估標的之工程進度、施工及環境狀況", "比較標的之工程進度、施工及環境狀況", "週遭環境土地建物及公共設施開發程度"], "R12204", "土地開發分析法要調查的是「勘估標的」本身的工程進度、施工及環境狀況，不是比較標的。", "", ""]]}, {"id": "p110a", "label": "110年・不動產估價概要", "year": 110, "subj": "R12", "qs": [["B", "政府宣布實價登錄2.0 新制自110 年7 月1 日施行，此為影響不動產價格之何種因素？", ["情況因素", "一般因素", "區域因素", "個別因素"], "R12101", "實價登錄 2.0 是全國性制度變革，屬一般因素。", "", ""], ["C", "不動產所在地區對外連絡道路為中山路，路寬30 公尺，並有兩線捷運經過。請問此為影響不動產價格之何種因素？", ["情況因素", "一般因素", "區域因素", "個別因素"], "R12101", "所在地區的聯外道路、捷運等交通條件，影響近鄰地區整體價格水準，屬區域因素。", "", ""], ["D", "不動產因鄰近殯儀館，造成價格之減損，此屬於何種原則？", ["競爭原則", "供需原則", "替代原則", "外部性原則"], "R12101", "殯儀館等嫌惡設施造成周邊價值減損，屬「外部性原則」。", "", ""], ["B", "公寓因加裝電梯而價格提昇，此屬於何種不動產估價原則？", ["外部性原則", "貢獻原則", "替代原則", "遞增原則"], "R12101", "加裝電梯使整體價值提升，屬「貢獻原則」。", "", ""], ["B", "建物總成本1,000 萬元，經濟耐用年數50 年，建物殘餘價格率10%。若每年折舊額皆相同，請問每年折舊率為何？", ["1.5%", "1.8%", "2%", "2.2%"], "R12203", "定額法每年折舊率＝(1－殘價率)／經濟耐用年數＝0.9／50＝1.8%。", "", ""], ["B", "有一500 坪建地可興建大樓出售，預期新大樓之總銷售金額為10 億元，若營建施工費為3 億元、管理銷售費用等間接成本為9 千萬元、要求的利潤率為18%、資本綜合利率為5%。請問該建地每坪價格約為多少？", ["100.5 萬元", "83.4 萬元", "65.8 萬元", "41.7 萬元"], "R12204", "V＝10÷1.18÷1.05－(3＋0.9)≈8.071－3.9＝4.171 億元；每坪≈4.171 億÷500≈83.4 萬元。", "", ""], ["D", "對不具市場性之不動產所估計之價值，並以貨幣金額表示者，為何種價格？", ["正常價格", "限定價格", "特定價格", "特殊價格"], "R12101", "對不具市場性之不動產所估計的價值，是「特殊價格」。", "", ""], ["D", "勘估標的之營造或施工費，依不動產估價技術規則之規定，不包含下列那一項目？", ["間接材料費", "稅捐", "資本利息", "廣告費"], "R12203", "營造施工費含直接／間接材料費、人工費、管理費、稅捐、資本利息、營造施工利潤；廣告費屬「廣告銷售費」，是總成本中的另一項間接成本。", "", ""], ["B", "就同一供需圈內近鄰地區或類似地區中，選擇與勘估標的類似之比較標的或標準建物，經比較與勘估標的營造或施工費之條件差異並作價格調整，以求取勘估標的營造或施工費的方法為何？", ["直接法", "間接法", "淨計法", "單位工程法"], "R12203", "以類似比較標的或標準建物比較調整求取營造施工費，屬「間接法」（含工程造價比較法、單位面積比較法）。", "", ""], ["B", "100 坪之辦公室出租，每月每坪正常租金為1,000 元，推估該辦公室合理空置率為8%，每年之地價稅、房屋稅、保險費、管理費及維修費為120,000 元，貸款支出為200,000 元。該辦公室每年之淨收益為多少？", ["1,080,000 元", "984,000 元", "880,000 元", "784,000 元"], "R12202", "總收入 100×1,000×12＝1,200,000；扣空置 8% 得有效總收入 1,104,000；減總費用 120,000＝984,000 元。貸款本息是融資支出，不列總費用。", "", ""], ["B", "依不動產估價技術規則規定，以不動產證券化為估價目的者，其折現現金流量分析法之總費用應依何種資料加以推算？", ["市場相關資料", "信託計畫資料", "類似產品資料", "歷史費用資料"], "R12202", "以不動產證券化為估價目的，DCF 總費用應依「信託計畫資料」加以推算（技術規則第 41 條）。", "", ""], ["C", "比較標的於110 年1 月以2,000 萬元成交，當時之價格指數為95；勘估標的之價格日期為110 年9 月，價格指數為101。假設其他條件皆相同，請問勘估標的經價格日期調整後之價格約為多少？", ["2,020 萬元", "2,105 萬元", "2,126 萬元", "2,188 萬元"], "R12201", "價格日期調整＝2,000×101/95≈2,126 萬元。", "", ""], ["C", "依不動產估價技術規則規定，下列有關租金之兩種敘述，何者正確？", ["不動產租金估計，以估計勘估標的之實質租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以勘估標的之經濟租金計算為原則", "不動產租金估計，以估計勘估標的之契約租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以勘估標的之經濟租金計算為原則", "不動產租金估計，以估計勘估標的之實質租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以勘估標的之契約租金計算為原則", "不動產租金估計，以估計勘估標的之契約租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益亦以勘估標的之契約租金計算為原則"], "R12204", "租金估計以實質租金為原則；證券化以 DCF 估價時，依信託計畫或契約約定的租金推估（依官方答案為 (C) 的組合）。", "", ""], ["C", "都市更新權利變換前之透天厝（僅有一所有權人）房地總價為1,500 萬元，房地價值比為1:9。若該基地素地價格經評估為1,300 萬元整，請問該基地之權利價值依不動產估價技術規則規定應為多少？", ["1,500 萬元", "1,400 萬元", "1,350 萬元", "1,300 萬元"], "R12204", "權利變換前透天厝，土地權利價值＝房地總價×土地價值比率＝1,500×9/10＝1,350 萬元（高於素地價時採此）。", "", ""], ["B", "依不動產估價技術規則規定，下列有關特殊宗地之估價，何者敘述錯誤？", ["公共設施保留地之估價，以比較法估價為原則", "林地之估價，以比較法估價為原則", "農場之估價，以比較法估價為原則", "墓地之估價，以比較法估價為原則"], "R12204", "林地估價須視林木生長情形選擇方法，技術規則並未規定「以比較法為原則」，(B) 錯。公共設施保留地、農場或牧場、墓地則以比較法估價為原則。", "", ""], ["B", "土地承租人欲購買所承租土地供未來繼續使用，委託不動產估價師進行估價，其價格種類為何？", ["正常價格", "限定價格", "特定價格", "特殊價格"], "R12101", "承租人購買所承租土地，屬「所有權以外權利與所有權合併為目的」，是限定價格。", "", ""], ["A", "近年受疫情影響，各地商圈人潮減少、店面空置率提高，此屬於何種價格影響因素？", ["一般因素", "區域因素", "個別因素", "總體因素"], "R12101", "疫情對全國各地商圈的影響，屬一般因素。", "", ""], ["D", "勘估標的乙之價格日期、勘察日期分別為110 年8 月15 日、110 年9 月15 日，若比較標的交易日期為110 年7 月10 日（經查110 年7 至9 月不動產指數分別為：106%、108%、107%），其價格日期調整百分率為何？", ["98%", "99%", "101%", "102%"], "R12201", "價格日期調整率＝價格日期（8 月，108%）／交易日期（7 月，106%）≈101.9%，約 102%。注意要用價格日期，不是勘察日期。", "", ""], ["B", "勘估標的若為未完工之建物，應依何種方式估價？", ["未完工之建物應依比準建物進行估價", "未完工之建物應依實際完成部分估價", "未完工之建物應待完工後再進行估價", "未完工之建物無法產生正常報酬，不予估計"], "R12204", "未完工建物依實際完成部分估價（技術規則第 77 條）。", "", ""], ["B", "某房地之淨收益100 萬元/年，其中建物淨收益60 萬元/年。假設土地、建物之收益資本化率分別為2%、4%，請問土地收益價格為？", ["1,000 萬元", "2,000 萬元", "2,500 萬元", "5,000 萬元"], "R12202", "土地淨收益＝100－60＝40 萬元；土地收益價格＝40／2%＝2,000 萬元。", "", ""], ["C", "依據不動產估價技術規則第43 條規定，收益資本化率應考慮之因素不包括下列何者？", ["貨幣變動之狀況", "銀行定期存款利率", "不動產投資之損益", "不動產價格變動趨勢"], "R12202", "收益資本化率應考慮銀行定存利率、政府公債利率、不動產投資之「風險性」、貨幣變動狀況及不動產價格變動趨勢（第 43 條）；不是「投資之損益」。", "", ""], ["C", "勘估標的丙之市場價格1,000 萬元，經分析當地同類型不動產之租金收益率5%，必要費用20 萬元/年，租賃所得稅約2 萬元。若丙為新訂租約，根據上開資料估計之年租金為？", ["50 萬元", "52 萬元", "70 萬元", "72 萬元"], "R12204", "新訂租約可用積算法：年租金＝價格×租金收益率＋必要費用＝1,000×5%＋20＝70 萬元。", "", ""], ["A", "續訂租約之租金估計方法中，差額分配法係指下列何種差額？", ["市場經濟租金與原契約租金之差額", "原實質租金與市場經濟租金之差額", "市場正常租金與原實質租金之差額", "原契約租金與市場正常租金之差額"], "R12204", "續訂租金的差額分配法，是將「市場經濟租金與原契約租金之差額」中歸屬出租人的部分，加計原契約租金。", "", ""], ["D", "實際建築使用之容積率超過法定容積率之房地，應以何種方式估價？", ["以原規定之法定容積進行估價", "以原規定法定容積的上限進行估價", "以實際建築使用部分之現況進行估價", "以實際建築使用合法部分之現況估價"], "R12204", "實際容積超過法定容積的房地，以實際建築使用「合法部分」之現況估價（技術規則第 78 條）。", "", ""], ["C", "某區分所有建物位於住宅大樓十樓，其樓層別效用比為110%，平均樓層別效用比為105%。假設全棟建物成本價格占全棟房地總價格比率為40%，該區分所有建物之地價分配率為何？", ["65%", "66%", "68%", "70%"], "R12204", "地價分配率＝樓層別效用比－平均樓層別效用比×建物成本價格占全棟房地總價比率＝110%－105%×40%＝68%。", "", ""]]}, {"id": "p114l", "label": "114年・土地法與土地相關稅法概要", "year": 114, "subj": "R13", "qs": [["B", "因土地登記有錯誤致人民受有損害，地政機關負損害賠償後，於登記人員未盡下列那一種注意義務時，得對登記人員行使求償權？", ["抽象輕過失責任", "重大過失責任", "具體輕過失責任", "通常事變責任"], "R13102", "土地法第 68、70 條：登記錯誤致受損害，由地政機關負賠償責任；如因登記人員「重大過失」所致，由該人員償還（求償）。", "", ""], ["D", "甲為A 地之登記名義人，與乙成立附條件的A 地贈與契約，則甲與乙可以對A 地申請做下列那一種土地登記？", ["假處分登記", "第一次登記", "註記登記", "預告登記"], "R13102", "為保全土地權利移轉、消滅或內容變更的請求權（含附條件、期限者），可申請「預告登記」（土地法第 79-1 條）。", "", ""], ["A", "辦理土地徵收時，徵收事業經行政院核定為重大建設，徵收範圍內之特定農業區農牧用地，如土地所有權人對於土地列入徵收範圍有爭議，經說明後仍有異議，則中央目的事業主管機關應辦理那一項民眾參與方式？", ["聽證", "說明會", "公聽會", "陳述意見"], "R13202", "特定農業區經行政院核定為重大建設須辦理徵收，若有爭議，應依行政程序法舉行「聽證」（土地徵收條例第 10 條第 3 項）。", "", ""], ["C", "依土地稅法之規定，一般地價稅的基本稅率為多少？", ["百分之十", "百分之五", "千分之十", "千分之十五"], "R13301", "地價稅基本稅率千分之十（土地稅法第 16 條）；超過累進起點地價者依 15‰、25‰、35‰、45‰、55‰ 累進。", "", ""], ["C", "下列關於房屋稅納稅義務人的認定，何者錯誤？", ["以土地設定地上權之使用權房屋，為該使用權人", "共有房屋向共有人徵收，並由共有人推定一人繳納", "未辦建物所有權第一次登記且所有人不明者，優先向建造執照所載起造人徵收", "房屋為信託財產，在信託關係存續中，為受託人"], "R13303", "未辦建物第一次登記且所有人不明者，以「現住人或使用人」為納稅義務人（房屋稅條例第 4 條），不是起造人。", "", ""], ["B", "土地所有權移轉時，原則上權利人及義務人雙方應於訂定契約幾日內檢附契約影本及相關文件共同向主管稽徵機關申報土地移轉現值？", ["15 日", "30 日", "45 日", "60 日"], "R13302", "土地所有權移轉，權利人及義務人應於訂定契約之日起 30 日內共同申報土地移轉現值（土地稅法第 49 條）。", "", ""], ["C", "依土地法規定，所有權人欲以共有土地設定地上權，在不計共有人人數比例的情況下，至少應得到該共有土地應有部分多少比例之同意？", ["超過四分之三", "超過二分之一", "超過三分之二", "全體"], "R13101", "土地法第 34-1 條：共有人過半數及其應有部分合計過半數之同意；或「應有部分合計逾三分之二」者，人數不予計算。", "", ""], ["B", "下列有關公有土地撥用之敘述，何者錯誤？", ["無論國有或地方有之土地均有撥用的可能", "公有土地撥用需經財政部國有財產署核准", "各級政府機關有使用公有土地之需求均得申請撥用公有土地", "公有土地之撥用以無償為原則"], "R13101", "公有土地撥用須經「行政院」核准（土地法第 26 條），以無償為原則，不是國產署核准。", "", ""], ["B", "區段徵收地區如為經實施農地重劃者，此一地區抵價地總面積比例不得少於徵收總面積多少？", ["百分之四十", "百分之四十五", "百分之五十", "百分之五十五"], "R13202", "區段徵收抵價地以徵收總面積 50% 為原則，特殊情形不得少於 40%；曾經農地重劃者，該重劃地區部分不得少於 45%（土地徵收條例第 39 條）。", "", ""], ["A", "土地法第78 條第8 款所稱限制登記，謂限制登記名義人處分其土地權利所為之登記，下列何者非屬之？", ["更正登記", "假處分", "破產登記", "預告登記"], "R13102", "限制登記包括預告登記、查封、假扣押、假處分、破產登記及其他依法律所為禁止處分之登記；更正登記是改正錯誤的登記，不屬之。", "", ""], ["C", "依土地法規定，有關私有土地所有權取得之限制，土地若已成為私有者，政府得依法以何種方式處置？", ["公開標售", "照價收買", "徵收", "沒收"], "R13101", "土地法第 14 條第 2 項：不得私有之土地已成為私有者，得依法「徵收」。", "", ""], ["A", "對於土地權利之規定，我國係採「物權法定主義」，土地所有權以外之其他不動產物權，謂之他項權利，下列何者屬之？", ["耕作權", "通行權", "日照權", "畜牧權"], "R13101", "土地法第 11 條：土地所有權以外設定之他項權利，依民法外，另有「耕作權」（第 133 條承墾人取得）。", "", ""], ["C", "依土地法規定，有關優先購買權之敘述，下列何者正確？", ["基地出賣或房屋出賣時，優先購買權人，於接到出賣通知後15 日內不表示者，其優先購買權視為放棄", "耕地租用出租人出賣或出典耕地時，優先購買權人，於接到出賣通知後15 日內不表示者，其優先購買權視為放棄", "共有土地共有人出賣其應有部分時，優先購買權人，於接到出賣通知後15 日內不表示者，其優先購買權視為放棄", "區分所有建物之專有部分連同其基地應有部分之所有權一併移轉與同一人者，他共有人有優先購買權之適用"], "R13101", "依土地法第 34-1 條第 4 項，共有人出賣應有部分，他共有人有優先購買權；依執行要點，接到通知後 15 日內不表示者視為放棄。基地出賣、耕地出賣是 10 日（第 104、107 條）；(D) 區分所有連同基地一併移轉不適用。", "", ""], ["B", "在不動產贈與的情形下，有關契稅稅率，下列何者為是？", ["百分之四", "百分之六", "百分之二", "百分之五"], "R13303", "契稅稅率：買賣、贈與、占有 6%；典權 4%；交換、分割 2%（契稅條例第 3 條）。", "", ""], ["A", "依房屋稅條例規定，對於私有房屋免徵房屋稅，下列何者正確？", ["無償供政府機關公用或供軍用之房屋", "政府平價配售之平民住宅", "合法登記之工廠供直接生產使用之自有房屋", "受重大災害，毀損面積占整棟面積三成以上不及五成之房屋"], "R13303", "無償供政府機關公用或供軍用之房屋免徵房屋稅（房屋稅條例第 14 條）。(B)(C) 是減半徵收；(D) 毀損三成以上不及五成也是減半，五成以上才免徵。", "", ""], ["A", "依契稅條例規定，有關納稅義務人繳納契稅期限及罰則之規定，下列敘述何者正確？", ["納稅義務人應於稽徵機關核定繳款書送達後30 日內繳納", "納稅義務人不依規定期限申報者，每逾2 日，加徵應納稅額百分之二之怠報金", "納稅義務人不依規定期限繳納稅款者，每逾3 日，加徵應納稅額百分之二之滯納金", "納稅義務人應納契稅，匿報或短報，經主管稽徵機關查得，或經人舉發查明屬實者，除應補繳稅額外，並加處以應納稅額一倍以上二倍以下之罰鍰"], "R13303", "契稅繳納期限為繳款書送達後 30 日內（契稅條例第 18 條）。逾期申報加徵怠報金、逾期繳納加徵滯納金，(B)(C) 的天數與比例都不對。", "", ""], ["C", "依土地稅法規定，納稅義務人藉變更、隱匿地目等則或於適用特別稅率、減免地價稅或田賦之原因、事實消滅時，未向主管稽徵機關申報者，應依規定辦理，下列敘述何者正確？", ["規避繳納實物者，除追補應納部分外，處應繳田賦實物額二倍之罰鍰", "土地買賣未辦竣權利移轉登記，再行出售者，處再行出售移轉現值百分之三以下之罰鍰", "逃稅或減輕稅賦者，除追補應納部分外，處短匿稅額或賦額三倍以下之罰鍰", "應追補之稅額或賦額、隨賦徵購實物及罰鍰，納稅義務人應於通知繳納之日起2 個月內繳納之"], "R13301", "逃稅或減輕稅賦者，除追補外處短匿稅額或賦額「三倍以下」罰鍰（土地稅法第 54 條）。(B) 未辦竣移轉再行出售處移轉現值 2% 罰鍰；(D) 通知繳納之日起 1 個月內繳納。", "", ""], ["A", "依都市計畫法規定，有關都市計畫之內容與實施，下列敘述何者正確？", ["主要計畫其實施進度以5 年為一期，最長不得超過25 年", "細部計畫圖，其比例尺不得小於一千五百分之一", "主要計畫圖，其比例尺不得小於一萬五千分之一", "主要計畫經核定或備案後，當地直轄市、縣（市）政府應於接到核定或備案公文之日起20 日內，將主要計畫書及主要計畫圖發布實施"], "R13203", "主要計畫實施進度以 5 年為一期，最長不得超過 25 年（都市計畫法第 15 條）。主要計畫圖比例尺不得小於一萬分之一；細部計畫圖不得小於一千二百分之一；核定後 30 日內發布實施。", "", ""], ["B", "依國土計畫法規定，關於中央主管機關應辦理之事項，下列敘述何者正確？", ["國土功能分區之劃設", "國土保育地區或海洋資源地區之使用許可、許可變更及廢止之核定", "農業發展地區及城鄉發展地區之使用許可、許可變更及廢止之核定", "直轄市、縣（市）國土計畫之擬訂、公告、變更及執行"], "R13203", "國土保育地區或海洋資源地區的使用許可由「中央主管機關」核定（國土計畫法第 24 條）；農業發展與城鄉發展地區由直轄市、縣（市）主管機關辦理。", "", ""], ["B", "有關自辦土地重劃，依相關法規之規定，下列敘述何者正確？", ["重劃會組織、職權、重劃業務、獎勵措施等事項之辦法，由地方主管機關定之", "重劃會辦理市地重劃時，應由重劃區內私有土地所有權人半數以上，而其所有土地面積超過重劃區私有土地總面積半數以上者之同意，並經主管機關核准後實施之", "自辦農地重劃，應經重劃區內私有土地所有權人半數以上，而其所有面積亦達私有土地面積半數以上者之同意，就重劃區全部土地辦理重劃，並經該管直轄市或縣（市）主管機關核准", "重劃會辦理農村社區土地重劃時，應經重劃區內私有土地所有權人合計超過三分之二，且其所有面積合計超過私有土地面積三分之二者之同意，就重劃區全部土地辦理重劃，並經該管直轄市或縣（市）主管機關核准後實施"], "R13201", "自辦市地重劃須經重劃區內私有土地所有權人半數以上，且其所有土地面積超過私有土地總面積半數者之同意（平均地權條例第 58 條）。重劃會辦法由中央主管機關定之。", "", ""], ["C", "依土地法規定，下列何種土地非屬於不得移轉、設定負擔或租賃於外國人之土地？", ["林地", "鹽地", "農地", "水源地"], "R13101", "土地法第 17 條：林地、漁地、狩獵地、鹽地、礦地、水源地、要塞軍備區域及領域邊境之土地，不得移轉、設定負擔或租賃於外國人。「農地」已不在列舉範圍內。", "", ""], ["A", "下列何者並非土地法中的農作改良物？", ["置於農地上的盆栽", "附著於農地上的芒果樹", "農田的灌溉設施", "農地上所施加的肥料"], "R13101", "土地法第 5 條：附著於土地之農作物及其他植物與水利土壤之改良為農作改良物。盆栽可以隨時移動，不附著於土地。", "", ""], ["C", "依土地徵收條例規定，有關得為區段徵收之情形，下列何項非屬之？", ["舊都市地區為公共安全、衛生、交通之需要或促進土地之合理使用實施更新者", "非都市土地實施開發建設者", "興辦國營事業或公安事業者", "農村社區為加強公共設施、改善公共衛生之需要或配合農業發展之規劃實施更新者"], "R13202", "得為區段徵收的情形：新設都市、舊都市更新、都市土地農業區或保護區變更為建地、非都市土地開發建設、農村社區更新等（土地徵收條例第 4 條）。興辦國營事業屬一般徵收。", "", ""], ["C", "依土地稅法規定，土地所有權人申請自用住宅用地，其地價稅按千分之二計徵，下列敘述何者正確？", ["都市土地面積未超過五公畝部分", "非都市土地面積未超過十公畝部分", "國民住宅及企業或公營事業興建之勞工宿舍，自動工興建或取得土地所有權之日起，其用地之地價稅", "土地所有權人與其配偶及未成年之受扶養親屬，適用自用住宅用地稅率繳納地價稅者，以一次為限"], "R13301", "國民住宅及企業或公營事業興建之勞工宿舍，自動工或取得土地之日起適用 2‰（土地稅法第 17 條）。自用住宅面積是都市 3 公畝、非都市 7 公畝；適用以「一處」為限。", "", ""], ["B", "政府為解決因經費問題無法於短期內徵收公共設施保留地，以至於影響土地所有權人之權益，於是採取若干措施，依相關法規之規定，下列敘述何者正確？", ["都市計畫公共設施保留地，在保留期間仍為建築使用者，除自用住宅用地依平均地權條例第20 條之規定外，統按千分之十計徵地價稅", "公共設施保留地未作任何使用並與使用中之土地隔離者，免徵地價稅", "依都市計畫法指定之公共設施保留地尚未被徵收前之移轉，減半徵收土地增值稅", "公共設施保留地因繼承或因配偶、直系血親間之贈與而移轉者，減半徵收遺產稅或贈與稅"], "R13301", "公共設施保留地未作任何使用並與使用中之土地隔離者，免徵地價稅（土地稅法第 19 條）。(A) 仍為建築使用者按 6‰；(C) 保留地徵收前移轉「免徵」土地增值稅；(D) 繼承或配偶、直系血親間贈與「免徵」遺產稅或贈與稅。", "", ""]]}, {"id": "p113l", "label": "113年・土地法與土地相關稅法概要", "year": 113, "subj": "R13", "qs": [["C", "依平均地權條例規定，預售屋或新建成屋買賣契約之買受人，於簽訂買賣契約後，不得讓與或轉售買賣契約與第三人，但經其他中央主管機關公告得讓與或轉售之情形並經直轄市、縣（市）主管機關核准者，不在此限。買受人據此得讓與或轉售之戶（棟）數為何？", ["全國每一年以一戶（棟）為限", "全國每一年以二戶（棟）為限", "全國每二年以一戶（棟）為限", "全國每二年以三戶（棟）為限"], "R13201", "平均地權條例第 47-3 條：預售屋或新建成屋買受人原則不得換約轉售；經核准得讓與或轉售者，全國每二年以一戶（棟）為限。", "", ""], ["A", "依平均地權條例規定，權利人及義務人應於買賣案件申請所有權移轉登記時，申報登錄資訊，未共同申報登錄資訊者，直轄市、縣（市）主管機關應令其限期申報登錄資訊；屆期未申報登錄資訊，買賣案件已辦竣所有權移轉登記者，處多少罰鍰，並令其限期改正？", ["新臺幣三萬元以上十五萬元以下罰鍰", "新臺幣六萬元以上三十萬元以下罰鍰", "新臺幣十五萬元以上五十萬元以下罰鍰", "新臺幣三十萬元以上一百萬元以下罰鍰"], "R13201", "買賣案件已辦竣移轉登記而屆期未申報登錄，處新臺幣 3 萬元以上 15 萬元以下罰鍰，並令限期改正（平均地權條例第 81-2 條）。", "", ""], ["B", "依平均地權條例規定，有關私法人買受供住宅使用之房屋，下列何者正確？", ["應檢具切結書，經中央主管機關許可", "中央主管機關審核其使用計畫，以合議制方式辦理", "私法人取得之房屋，於登記完畢後十年內不得辦理預告登記", "許可之文件有效期限為二年"], "R13201", "私法人購買住宅採許可制，中央主管機關審核使用計畫以「合議制」辦理（平均地權條例第 79-1 條）。取得後 5 年內不得移轉、讓與或預告登記；許可文件有效期限 1 年。", "", ""], ["A", "依都市計畫法規定，有關主要計畫之核定，下列何者正確？", ["鎮及鄉街之主要計畫由內政部核定", "直轄市之主要計畫由行政院核定", "特定區計畫由縣（市）政府擬定者，由內政部核定，轉報行政院備案", "特定區計畫由內政部訂定者，由行政院核定"], "R13203", "鎮及鄉街之主要計畫由內政部核定（都市計畫法第 20 條）。首都主要計畫由內政部核定轉報行政院備案；直轄市也由內政部核定。", "", ""], ["B", "依土地徵收條例規定，有關徵收之撤銷或廢止之敘述，下列何者錯誤？", ["撤銷或廢止徵收，由需用土地人向中央主管機關申請之", "在未依徵收計畫完成使用前，需用土地人應每年檢討其興辦事業計畫，並由該管直轄市或縣（市）政府列管", "依徵收計畫開始使用前，開發方式改變，應廢止徵收", "因作業錯誤，致原徵收之土地不在工程用地範圍內，應撤銷徵收"], "R13202", "在未依徵收計畫完成使用前，需用土地人應每年檢討興辦事業計畫，並由其「上級事業主管機關」列管（土地徵收條例第 49 條），不是地方政府。", "", ""], ["D", "依土地徵收條例規定，有關徵收補償費，下列何者正確？", ["在都市計畫區內之公共設施保留地，應按照徵收當期之市價補償其地價", "徵收補償之地價，由不動產估價師評定之", "建築改良物之補償費，按徵收當時該建築改良物之重置價格估定之", "農作改良物之補償費，於農作改良物被徵收時與其孳息成熟時期相距在一年以內者，按成熟時之孳息估定之"], "R13202", "農作改良物被徵收時與孳息成熟期相距在一年以內者，按成熟時之孳息估定（第 31 條）。(A) 公設保留地按毗鄰非保留地之平均市價補償；(B) 地價由地價評議委員會評定；(C) 建物按「重建價格」。", "", ""], ["A", "依土地徵收條例規定，有關直轄市或縣（市）主管機關應於國庫設立土地徵收補償費保管專戶部分，下列何者錯誤？", ["自通知送達發生效力之日起，逾十年未領取之補償費，歸屬國庫", "應於規定應發給補償費之期限屆滿次日起三個月內存入專戶保管", "保管未受領之徵收補償費，不適用提存法之規定", "未受領之徵收補償費，依規定繳存專戶保管時，視同補償完竣"], "R13202", "保管專戶內的補償費，自通知送達發生效力之日起逾「15 年」未領取者，歸屬國庫（土地徵收條例第 26 條）。", "", ""], ["C", "依土地徵收條例規定，有關徵收之程序，下列何者正確？", ["特定農業區經行政院核定為重大建設須辦理徵收者，應依行政程序法舉行聽證", "需用土地人於事業計畫報請目的事業主管機關許可後，應舉行公聽會", "協議價購時，依其他法律規定有優先購買權者，無優先購買權之適用", "需用土地人於所有權人拒絕參與協議或經開會未能達成協議時，則改申請徵收"], "R13202", "協議價購時，依其他法律規定有優先購買權者，無優先購買權之適用（第 11 條）。(A) 須「有爭議」才應舉行聽證；(B) 公聽會應在事業計畫報請許可「前」舉行。", "", ""], ["A", "依都市計畫法規定，主要計畫擬定後經該管政府都市計畫委員會審議修正，或經內政部指示修正者，後續如何辦理？", ["免再公開展覽及舉行說明會", "再公開展覽", "再舉行說明會", "再公開展覽及舉行說明會"], "R13203", "主要計畫經都委會審議修正或經內政部指示修正者，免再公開展覽及舉行說明會（都市計畫法第 19 條）。", "", ""], ["A", "依土地法規定，逾期未辦繼承之土地於標售時，有關優先購買權人之順序依序為何？", ["繼承人、合法使用人、其他共有人", "其他共有人、合法使用人、繼承人", "合法使用人、繼承人、其他共有人", "繼承人、其他共有人、合法使用人"], "R13102", "逾期未辦繼承土地標售時，優先購買權順序為：繼承人、合法使用人、其他共有人（土地法第 73-1 條）。", "", ""], ["C", "依土地法規定，依法得分割之共有土地，共有人不能自行協議分割者，任何共有人得申請該管直轄市、縣（市）地政機關調處，不服調處者，應於接到調處通知後幾日內向司法機關訴請處理，屆期不起訴者，依原調處結果辦理之？", ["七日", "十日", "十五日", "三十日"], "R13101", "共有土地分割不能協議者，可申請地政機關調處；不服調處應於接到調處通知後 15 日內向司法機關訴請處理（土地法第 34-2 條）。", "", ""], ["D", "依土地法規定，關於地權及地權限制，下列何者正確？", ["台灣糖業股份有限公司所有土地為公有土地", "私有土地，因天然變遷成為湖澤或可通運之水道時，其所有權絕對消滅", "湖澤及可通運之水道及岸地，如因水流變遷而自然增加時，其接連地之使用權人，有優先依法取得其所有權或使用受益之權", "私有土地所有權之移轉、設定負擔或租賃，妨害基本國策者，中央地政機關得報請行政院制止之"], "R13101", "私有土地所有權之移轉、設定負擔或租賃妨害基本國策者，中央地政機關得報請行政院制止之（土地法第 20 條）。(A) 台糖是公司，土地屬私有；(B) 是「視為」消滅，回復原狀時回復；(C) 優先取得的是接連地「所有權人」。", "", ""], ["B", "都市計畫地區範圍內，應視實際情況，分別設置公共設施用地，其設置標準之規定，下列何者正確？", ["應就人口分布、所得及納稅能力、地價高低、產業進駐情形等現狀，決定其項目、位置與面積，以增進市民活動之便利，及確保良好之都市生活環境", "中小學校、社教場所、社會福利設施、市場、郵政、電信、變電所、衛生、警所、消防、防空等公共設施，應按閭鄰單位或居民分布情形適當配置之", "公園、體育場所、綠地、廣場及兒童遊樂場，應依計畫人口密度及自然環境，作有系統之布置，除具有特殊情形外，其占用土地總面積不得少於全部計畫面積百分之二十", "道路系統、停車場所及加油站，應按土地使用分區及交通情形與預期之發展配置之。鐵路、公路通過實施都市計畫之區域者，應以市區中心為規劃重點，以增進市民活動之便利"], "R13203", "中小學校、社教、社福、市場、郵政、電信、變電所、衛生、警所、消防、防空等公共設施，應按閭鄰單位或居民分布情形適當配置（都市計畫法第 42、46 條）。", "", ""], ["D", "依都市計畫法規定，下列有關公共設施保留地之使用管制規定，何者錯誤？", ["公共設施保留地在未取得前，得申請為臨時建築使用", "不得為妨礙其指定目的之使用，但得繼續為原來之使用或改為妨礙目的較輕之使用", "私有公共設施保留地得申請與公有非公用土地辦理交換，不受土地法、國有財產法及各級政府財產管理法令相關規定之限制", "地上物除准修繕外，不得增建或改建。當地政府認有必要時，得令其清除地上物或遷移，且不得請求補償"], "R13203", "公共設施保留地上的地上物，政府認有必要令其清除或遷移時，「應給予補償」（都市計畫法第 51 條），不是不得請求補償。", "", ""], ["D", "依土地法規定，下列有關建築基地出賣時行使優先購買權之敘述，何者錯誤？", ["地上權人、典權人或承租人有依同樣條件優先購買之權", "優先購買權人，於接到出賣通知後十日內不表示者，其優先權視為放棄", "出賣人未通知優先購買權人而與第三人訂立買賣契約者，其契約不得對抗優先購買權人", "基地承租人與基地共有人行使優先購買權發生競合時，其順序以登記之先後定之"], "R13101", "基地承租人依土地法第 104 條的優先購買權具物權效力，優先於共有人依第 34-1 條的優先購買權，不是以登記先後定順序。", "", ""], ["C", "依土地法規定，下列有關逾期未辦繼承登記案件應由地政機關書面通知繼承人之情形，何者正確？", ["自繼承開始之日起逾一年未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於六個月內聲請登記，並以書面通知繼承人", "列冊管理期間為十五年，列冊管理期間該管直轄市或縣市地政機關應每年清查並書面通知繼承人辦理繼承登記", "列冊管理期間屆滿，逾期仍未聲請登記者，由地政機關書面通知繼承人及將該土地或建築改良物清冊移請財政部國有財產署公開標售", "標售土地或建築改良物前應公告三個月，並書面通知繼承人、共有人或合法使用人依序行使優先購買權"], "R13102", "列冊管理期滿仍未聲請登記者，由地政機關書面通知繼承人並將清冊移請財政部國有財產署公開標售（土地法第 73-1 條）。公告繼承人的期間是 3 個月；標售前公告 30 日。", "", ""], ["B", "甲乙丙丁戊共有A 地，持分各五分之一。甲乙丙三人擬依土地法第34 條之1 規定，將A 地出售予戊，下列敘述何者正確？", ["不適法，出售為有償讓與行為，應依民法規定，經共有人全體同意始得為之", "不適法，共有人不得為受讓人", "適法，甲乙丙三人已符合共有人過半數及其應有部分合計過半數之同意的行使要件", "適法，買賣契約業經甲乙丙戊同意，縱使戊未經計算在同意人數及應有部分內，仍得依土地法第34 條之1 辦理"], "R13101", "依土地法第 34-1 條執行要點，共有人依該條處分共有物時，受讓人不得為共有人；甲乙丙出售給共有人戊，不適法。", "", ""], ["C", "依土地徵收條例規定，有關區段徵收範圍內土地，經規劃整理後之處理方式，下列何者正確？", ["抵費地發交被徵收土地所有權人領回", "零售市場無償登記為當地直轄市有、縣（市）有或鄉（鎮、市）有", "標租時，其期限不得逾九十九年", "安置原住戶土地得以標售"], "R13202", "區段徵收後土地標租時期限不得逾 99 年（土地徵收條例第 44 條）。(A) 應為「抵價地」發交領回；(B) 零售市場是有償讓售或撥用；(D) 安置原住戶土地是讓售。", "", ""], ["B", "依房屋稅條例規定，起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，其房屋稅之稅率為何？", ["最低不得少於其房屋現值百分之一點二，最高不得超過百分之二點四", "最低不得少於其房屋現值百分之二，最高不得超過百分之三點六", "最低不得少於其房屋現值百分之二，最高不得超過百分之四點八", "最低不得少於其房屋現值百分之三，最高不得超過百分之五"], "R13303", "113 年 7 月起（房屋稅 2.0），起造人待銷售住家用房屋於起課 2 年內，稅率最低 2%、最高 3.6%（房屋稅條例第 5 條）。", "", ""], ["B", "依契稅條例規定，有關申報契稅之起算日期，下列何者正確？", ["向政府機關標購公產，以政府機關核准產權移轉之日為申報起算日", "不動產移轉發生糾紛時，以法院判決確定之日為申報起算日", "向法院標購拍賣之不動產，以承買人拍定之日為申報起算日", "建築物於建造完成前，因交換以承受人為建造執照原始起造人者，以主管建築機關核發使用執照之日為申報起算日"], "R13303", "不動產移轉發生糾紛時，以法院判決確定之日為申報起算日（契稅條例第 16 條）。標購公產以核發產權移轉證明書之日；法院拍賣以發給權利移轉證書之日；建造完成前交換以核准變更起造人之日。", "", ""], ["D", "依土地稅法規定，有關累進起點地價，下列何者正確？", ["累進起點地價，以各該直轄市或縣（市）土地七公畝之平均地價為準。只有工業用地、礦業用地及農業用地不包括在內", "土地所有權人之地價總額未超過戶籍所在地直轄市或縣（市）累進起點地價者，其地價稅按基本稅率徵收", "累進起點地價以百元為單位，以下四捨五入", "累進起點地價，應於舉辦規定地價或重新規定地價後當年地價稅開徵前計算完竣，並報請財政部及內政部備查"], "R13301", "累進起點地價應於舉辦規定地價或重新規定地價後當年地價稅開徵前計算完竣，並報財政部及內政部備查（土地稅法施行細則）。(A) 還不包括免稅土地；(B) 地價總額是按各直轄市、縣（市）轄區歸戶，不是戶籍所在地；(C) 以千元為單位。", "", ""], ["C", "依土地稅法規定，非都市土地供公共設施使用者，在滿足規定要件下，其尚未被徵收前之移轉，免徵土地增值稅。下列有關免稅要件之敘述，何者錯誤？", ["經需用土地人開闢完成或依計畫核定供公共設施使用", "依法完成使用地編定", "依法完成徵收公告", "經需用土地人證明"], "R13302", "非都市土地供公共設施使用，尚未被徵收前移轉免徵土地增值稅的要件：依法完成使用地編定、經需用土地人開闢完成或依計畫核定供公共設施使用、並經需用土地人證明（土地稅法第 39 條）；不須完成徵收公告。", "", ""], ["A", "下列有關契稅納稅義務人之敘述，何者正確？", ["受託人依信託本旨移轉信託財產與委託人以外之歸屬權利人時，由歸屬權利人申報納稅", "買賣契稅，應由出賣人申報納稅", "典權契稅，應由出典人申報納稅", "交換有給付差額價款者，其差額價款，應由出賣人申報納稅"], "R13303", "信託財產移轉給委託人以外的歸屬權利人時，由歸屬權利人申報繳納契稅（契稅條例第 7-1 條）。買賣由「買受人」申報；典權由「典權人」申報。", "", ""], ["C", "依房屋稅條例規定，下列有關自住使用之住家用房屋適用1.2%計徵房屋稅之要件，何者錯誤？", ["無出租或供營業情形", "房屋所有人本人、配偶或直系親屬於該屋辦竣戶籍登記", "房屋所有人本人、配偶及未成年子女於全國僅持有一戶房屋且房屋現值在一定金額以下", "房屋所有人本人、配偶或直系親屬實際居住使用"], "R13303", "自住住家用 1.2% 的要件：無出租或營業、本人配偶或直系親屬實際居住且設籍、本人配偶及未成年子女全國合計 3 戶以內。(C)「全國僅持有一戶且現值在一定金額以下」是適用 1% 的要件。", "", ""], ["C", "依所得稅法規定，個人以自有土地與營利事業合作興建房屋，自土地取得之日起算五年內完成並銷售該房屋、土地者，其所得稅稅率為何？", ["百分之十", "百分之十五", "百分之二十", "百分之二十五"], "R13304", "個人以自有土地與營利事業合建房屋，自土地取得之日起 5 年內完成並銷售者，稅率 20%（所得稅法第 14-4 條）。", "", ""]]}, {"id": "p112l", "label": "112年・土地法與土地相關稅法概要", "year": 112, "subj": "R13", "qs": [["A", "都市計畫公共設施保留地，未作任何使用並與使用中之土地隔離者，其地價稅之計徵，下列何者正確？", ["免徵", "按千分之六稅率計徵", "按千分之十稅率計徵", "按千分之二稅率計徵"], "R13301", "公共設施保留地未作任何使用並與使用中之土地隔離者，免徵地價稅；仍作建築使用者按 6‰（自用住宅 2‰）（土地稅法第 19 條）。", "", ""], ["B", "關於土地所有權人出售自用住宅用地時，土地增值稅適用「一生一次」之優惠稅率，下列何者正確？", ["土地增值稅之優惠稅率為千分之二", "僅限於都市土地面積未超過三公畝部分或非都市土地面積未超過七公畝部分", "土地於出售前一年內，曾供營業使用或出租", "出售前應持有該土地三年以上"], "R13302", "「一生一次」：都市土地未超過 3 公畝、非都市土地未超過 7 公畝部分，按 10% 計徵；出售前 1 年內不得供營業或出租；沒有持有 3 年的要求（土地稅法第 34 條）。", "", ""], ["D", "依土地稅法規定，已規定地價之土地設定典權時之預繳土地增值稅，下列何者正確？", ["典權人回贖時，原繳之土地增值稅，應加計利息退還", "典權人回贖時，原繳之土地增值稅，應無息退還", "出典人回贖時，原繳之土地增值稅，應加計利息退還", "出典人回贖時，原繳之土地增值稅，應無息退還"], "R13302", "設定典權時預繳的土地增值稅，於「出典人」回贖時無息退還（土地稅法第 29 條）。", "", ""], ["B", "土地所有權經法院判決移轉登記者，土地增值稅申報移轉現值之審核標準，下列何者正確？", ["以法院判決日當期之公告土地現值為準", "以申報人向法院起訴日當期之公告土地現值為準", "以法院判決送達日當期之公告土地現值為準", "以申報人向主管稽徵機關申報日當期之公告土地現值為準"], "R13302", "經法院判決移轉登記者，以申報人「向法院起訴日」當期之公告土地現值為準（土地稅法第 30 條）。", "", ""], ["C", "依土地稅法規定，地價稅之稅率，下列何者錯誤？", ["地價稅之基本稅率為千分之十", "土地所有權人之地價總額未超過土地所在地直轄市或縣（市）累進起點地價者，其地價稅按千分之十稅率徵收", "土地所有權人之地價總額超過土地所在地直轄市或縣（市）累進起點地價五倍者，就其超過部分課徵千分之十五", "土地所有權人之地價總額超過土地所在地直轄市或縣（市）累進起點地價十五倍至二十倍者，就其超過部分課徵千分之四十五"], "R13301", "地價總額超過累進起點地價未達 5 倍者，超過部分 15‰；5～10 倍 25‰；10～15 倍 35‰；15～20 倍 45‰；20 倍以上 55‰。題目說超過 5 倍課 10‰，錯。", "", ""], ["C", "依土地法規定，關於共有土地之處分，下列何者正確？", ["應以共有人半數及其應有部分半數之同意行之", "應有部分合計三分之二者，其人數不予計算", "共有人不能以書面通知他共有人者，應公告之", "共有人不得單獨處分其應有部分"], "R13101", "共有物處分應事先以書面通知他共有人；不能以書面通知者，應公告之（土地法第 34-1 條第 2 項）。(A) 是「過半數」；(B) 是「逾三分之二」；(D) 應有部分可單獨處分。", "", ""], ["C", "有關土地總登記，經聲請而逾限未補繳證明文件者之情形，下列何者錯誤？", ["其土地視為無主土地", "由該管直轄市或縣（市）地政機關公告之", "公告期間不得少於十五日", "公告期滿，無人提出異議，即為國有土地之登記"], "R13102", "土地總登記逾限未補繳證明文件者，視為無主土地，由地政機關公告，公告期間不得少於「30 日」，期滿無人異議即為國有登記（土地法第 57、58 條）。", "", ""], ["C", "依土地法規定，有關繼承登記，下列何者正確？", ["繼承登記應於繼承開始之日起一個月內為之，否則視為逾期登記", "繼承開始之日起逾三個月未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於一年內聲請登記", "逾期未聲請繼承登記之土地，經地政機關列冊管理十五年，逾期仍未聲請繼承登記者，由地政機關將該土地清冊移請財政部國有財產署公開標售", "標售逾期未辦繼承登記土地所得之價款，逾十五年無繼承人申請提領該價款者始得歸屬國庫"], "R13102", "逾期未辦繼承登記：繼承開始逾 1 年未辦理者公告，再列冊管理 15 年，期滿仍未申請者移請國產署公開標售（土地法第 73-1 條）。(A) 繼承登記期限是 6 個月；(D) 標售價款保管逾 10 年才歸國庫。", "", ""], ["A", "依平均地權條例之規定，預售屋或新建成屋買賣契約之買受人，於簽訂買賣契約後，不得讓與或轉售買賣契約與第三人，並不得自行或委託刊登讓與或轉售廣告，但於下列何種情形不在此限？", ["配偶、直系血親或二親等內旁系血親間之讓與或轉售", "配偶、直系姻親或二親等內旁系姻親間之讓與或轉售", "配偶、直系姻親或二親等內旁系血親間之讓與或轉售", "配偶、直系血親或二親等內旁系姻親間之讓與或轉售"], "R13201", "預售屋或新建成屋換約轉售的例外：配偶、直系血親或二親等內旁系血親間之讓與或轉售（平均地權條例第 47-3 條）。注意是「血親」不是「姻親」。", "", ""], ["C", "依平均地權條例之規定，委託不動產經紀業代銷預售屋者，應於何時向直轄市、縣（市）主管機關申報登錄資訊？", ["應於簽訂買賣契約之日起至少十日內申報", "應於簽訂買賣契約之日起至少十五日內申報", "應於簽訂買賣契約之日起三十日內申報", "應於簽訂買賣契約之日起四十五日內申報"], "R13201", "代銷預售屋者，應於簽訂買賣契約書之日起 30 日內申報登錄（平均地權條例第 47 條）。", "", ""], ["C", "依市地重劃實施辦法之規定，土地所有權人重劃後應分配土地面積已達重劃區最小分配面積標準二分之一，經主管機關按最小分配面積標準分配後，如申請放棄分配土地而改領現金補償，下列何者正確？", ["以其重劃前原有面積按原位置評定重劃後地價發給現金補償", "以其重劃前原有面積按原位置評定重劃前地價發給現金補償", "以其應分配權利面積，按重劃後分配位置之評定重劃後地價予以計算補償", "以其應分配權利面積，按重劃後分配位置之評定重劃前地價予以計算補償"], "R13201", "依市地重劃實施辦法，達最小分配面積 1/2 而按最小分配面積分配後申請放棄改領現金者，以其應分配權利面積，按重劃後分配位置之評定重劃後地價計算補償。", "", ""], ["C", "以下關於契稅之敘述，何者正確？", ["買賣契稅應由出賣人申報納稅", "贈與契稅應由贈與人估價立契，申報納稅", "典權契稅，應由典權人申報納稅", "占有契稅稅率為其契價百分之二"], "R13303", "典權契稅由典權人申報（契稅條例第 6 條）。買賣由買受人、贈與由受贈人申報；占有契稅 6%。", "", ""], ["C", "依土地徵收條例規定，因受領遲延、拒絕受領或不能受領之補償費，下列何者正確？", ["依提存法提存於直轄市或縣（市）主管機關於國庫設立之土地徵收補償費保管專戶", "直轄市或縣（市）主管機關應於補償費發給期限屆滿之日起三個月內存入專戶保管", "保管專戶儲存之補償費應給付利息", "已依規定繳存專戶保管之徵收補償費，自徵收公告期滿之日起，逾十五年未領取者，歸屬國庫"], "R13202", "保管專戶儲存的補償費應給付利息（土地徵收條例第 26 條）。(A) 保管專戶不適用提存法；(D) 是自「通知送達發生效力之日」起逾 15 年。", "", ""], ["B", "已公告徵收之土地，依徵收計畫開始使用前，興辦之事業改變時，依土地徵收條例之規定，下列何者正確？", ["應撤銷徵收", "應廢止徵收", "土地所有權人得行使收回權", "應舉行聽證"], "R13202", "依徵收計畫開始使用前，興辦事業改變、計畫變更或已無徵收必要者，應「廢止」徵收（土地徵收條例第 49 條）；作業錯誤等自始違法情形才是撤銷。", "", ""], ["D", "依土地登記規則之規定，於何種情形下登記機關應以書面敘明理由或法令依據，通知申請人於接到通知書之日起十五日內補正，下列何者錯誤？", ["申請人之資格不符或其代理人之代理權有欠缺", "登記申請書不合程式，或應提出之文件不符或欠缺", "未依規定繳納登記規費", "登記之權利人、義務人或其與申請登記之法律關係有關之權利關係人間有爭執"], "R13102", "權利關係人間「有爭執」屬應駁回的事由（土地登記規則第 57 條），不是通知補正。資格不符、文件欠缺、未繳規費等是補正事由（第 56 條）。", "", ""], ["D", "我國物權係採法定主義，於土地所有權以外之其他不動產物權，謂之他項權利，依民法及土地法之規定，下列何者非屬物權？", ["抵押權", "農育權", "耕作權", "租賃權"], "R13101", "租賃權是債權，不是物權。抵押權、農育權（民法）、耕作權（土地法）都是物權。", "", ""], ["A", "依土地法之規定，外國人為供自用、投資或公益之目的使用，得取得所需之土地，其面積及所在地點，應受該管直轄市或縣（市）政府依法所定之限制，下列何種用途不屬之？", ["長照機構", "住宅", "醫院", "營業處所、辦公場所、商店及工廠"], "R13101", "外國人可取得土地的用途：住宅、營業處所、辦公場所、商店、工廠、教堂、醫院、外僑子弟學校、使領館及公益團體會所、墳場、重大投資等（土地法第 19 條）；長照機構不在列舉。", "", ""], ["D", "依土地法第三十四條之一執行要點規定，有關共有人權利之行使，下列何者錯誤？", ["部分共有人就共有土地或建築改良物為處分、變更及設定地上權、農育權、不動產役權或典權，應就共有物之全部為之", "部分共有人依本法條規定為處分、變更或設定負擔前，應先行通知他共有人", "出賣共有土地或建築改良物時，他共有人得以出賣之同一條件共同或單獨優先購買", "他共有人於接到出賣通知後二十日內不表示者，其優先購買權視為放棄"], "R13101", "共有人出賣共有物時，他共有人接到通知後「15 日」內不表示者，優先購買權視為放棄（土地法第 34-1 條執行要點）。", "", ""], ["B", "依土地法規定，有關地籍測量之相關規定，下列何者錯誤？", ["地籍測量時，土地所有權人應設立界標，並永久保存之", "地籍測量，如由該管直轄市或縣（市）政府辦理，其實施計畫應經該地方之地政機關核定", "重新實施地籍測量時，土地所有權人應於地政機關通知之限期內，自行設立界標，並到場指界", "重新實施地籍測量之結果，應予公告，其期間為三十日"], "R13102", "地籍測量如由直轄市或縣（市）政府辦理，其實施計畫應經「中央地政機關」核定（土地法第 47 條），不是地方地政機關。", "", ""], ["C", "依土地法之規定，有關土地登記之損害賠償，下列何者錯誤？", ["因登記錯誤遺漏或虛偽致受損害者，由該地政機關負損害賠償責任", "登記人員或利害關係人，於登記完畢後，發見登記錯誤或遺漏時，非以書面聲請該管上級機關查明核准後，不得更正", "地政機關所負之損害賠償，如因登記人員之重大過失所致者，由該人員及地政機關負連帶損害賠償責任，撥歸登記儲金", "損害賠償之請求，如經該地政機關拒絕，受損害人得向司法機關起訴"], "R13102", "地政機關賠償後，如因登記人員重大過失所致，由該人員「償還」，撥歸登記儲金（土地法第 70 條），不是連帶賠償。", "", ""], ["A", "依平均地權條例規定，對私有空地之處置，下列何者錯誤？", ["規定照價收買者，以收買當期之平均市價為準", "逾期未建築、增建、改建或重建者，按該宗土地應納地價稅基本稅額加徵二倍至五倍之空地稅或照價收買", "依規定限期建築、增建、改建或重建之土地，其新建之改良物價值不及所占基地申報地價百分之五十者，直轄市或縣（市）政府不予核發建築執照", "直轄市或縣（市）政府對於私有空地，得視建設發展情形，分別劃定區域，限期建築、增建、改建或重建"], "R13201", "照價收買以收買當期之「申報地價」為準（平均地權條例第 31 條），不是平均市價。空地稅為基本稅額 2～5 倍。", "", ""], ["C", "依都市計畫法之規定，市鎮計畫之主要計畫書，除用文字、圖表說明外，應附主要計畫圖，其比例尺不得小於多少？", ["五百分之一", "一千分之一", "一萬分之一", "一萬五千分之一"], "R13203", "主要計畫圖比例尺不得小於一萬分之一（都市計畫法第 15 條）；細部計畫圖不得小於一千二百分之一。", "", ""], ["C", "依所得稅法之規定，個人依第14 條之4 前2 項規定計算之房屋、土地交易所得，減除當次交易依土地稅法第30 條第1 項規定公告土地現值計算之土地漲價總數額後之餘額，不併計綜合所得總額，按相關規定稅率計算應納稅額，其在中華民國境內居住之個人應納稅額，下列何者正確？", ["持有房屋、土地之期間在二年以內者，稅率為百分之三十五", "持有房屋、土地之期間超過二年，未逾五年者，稅率為百分之二十五", "因財政部公告之調職、非自願離職或其他非自願性因素，交易持有期間在五年以下之房屋、土地者，稅率為百分之二十", "個人以自有土地與營利事業合作興建房屋，自土地取得之日起算五年內完成並銷售該房屋、土地者，稅率為百分之二十五"], "R13304", "因調職、非自願離職或其他非自願性因素，交易持有 5 年以下之房地，稅率 20%。2 年內是 45%、2～5 年 35%（所得稅法第 14-4 條）。", "", ""], ["A", "依土地稅法之規定，主管稽徵機關得指定土地使用人負責代繳其使用部分之地價稅或田賦，下列何項非屬所規範者？", ["土地進行訴訟者", "權屬不明者", "納稅義務人行蹤不明者", "土地所有權人申請由占有人代繳者"], "R13301", "得指定土地使用人代繳地價稅的情形：納稅義務人行蹤不明、權屬不明、無人管理、土地所有權人申請由占有人代繳（土地稅法第 4 條）；「進行訴訟」不在其中。", "", ""], ["C", "有關土地利用計畫之通盤檢討相關規定，下列何者正確？", ["全國國土計畫每五年通盤檢討一次", "直轄市、縣（市）國土計畫每十年通盤檢討一次", "都市計畫每三年內或五年內至少應通盤檢討一次", "區域計畫每十年通盤檢討一次"], "R13203", "都市計畫每 3 年內或 5 年內至少通盤檢討一次（都市計畫法第 26 條）。全國國土計畫每 10 年、直轄市縣（市）國土計畫每 5 年通盤檢討；區域計畫每 5 年。", "", ""]]}, {"id": "p111l", "label": "111年・土地法與土地相關稅法概要", "year": 111, "subj": "R13", "qs": [["D", "下列有關未辦繼承登記不動產處理方式之敘述，何者正確？", ["未辦繼承登記不動產，於繼承開始之日起逾六個月未辦理繼承登記者，該管直轄市或縣市地政機關於查明後，應即公告繼承人於一個月內聲請登記", "未辦繼承登記不動產，由該管直轄市或縣市地政機關列冊管理期間為十年", "未辦繼承登記不動產，逾期仍未辦繼承而由該管直轄市或縣市地政機關公開標售時，土地或建築改良物租賃期間未超過五年者，於標售後以五年為限", "逾期未辦繼承登記不動產於經公開標售之價款儲存設立在國庫專戶時，繼承人得依其法定應繼分申請領取"], "R13102", "逾期未辦繼承之不動產標售後，價款存入國庫專戶，繼承人得依其法定應繼分申請領取（土地法第 73-1 條）。(A) 是逾 1 年；(B) 列冊管理 15 年。", "", ""], ["B", "下列有關共有不動產處分等之敘述，何者錯誤？", ["共有土地或建築改良物的處分、變更及設定地上權、農育權、不動產役權或典權，應有共有人過半數及其應有部分合計過半數之同意", "共有土地或建築改良物的處分、變更或設定負擔，共有人應事先以書面通知他共有人；如不能以書面通知時，應依法公示催告之", "共有人對共有土地或建築改良物的處分、變更及設定地上權、農育權、不動產役權或典權，對於他共有人應得之對價或補償，負連帶清償責任", "甲乙丙公同共有一筆土地，甲依法得出賣該共有土地時，乙丙得以同一價格單獨優先承購"], "R13101", "依土地法第 34-1 條，處分前應先以書面通知他共有人，不能以書面通知者「應公告之」；選項 (B) 的通知方式與規定不符。(D) 公同共有準用第 34-1 條，他共有人可優先承購。", "", ""], ["D", "依土地稅法規定，土地所有權人辦理土地移轉繳納土地增值稅時，在其持有土地期間內，因重新規定地價增繳之地價稅，准予抵繳其應納之土地增值稅之總額，以不超過土地移轉時應繳增值稅總額多少為限？", ["百分之一", "百分之二", "百分之三", "百分之五"], "R13302", "持有期間因重新規定地價增繳的地價稅，准予抵繳土地增值稅，以不超過應繳增值稅總額 5% 為限（土地稅法第 31 條）。", "", ""], ["D", "依房屋稅條例之規定，下列有關房屋稅納稅義務人之敘述，何者錯誤？", ["原則上向房屋所有人徵收之", "未辦建物所有權第一次登記且所有人不明之房屋，向使用執照所載起造人徵收之", "未辦建物所有權第一次登記且所有人不明之房屋，無使用執照者，向建造執照所載起造人徵收之", "未辦建物所有權第一次登記且所有人不明之房屋，無使用執照、亦無建造執照者，暫不徵收之"], "R13303", "未辦第一次登記且所有人不明，依序向使用執照、建造執照所載起造人徵收；都沒有者向「現住人或管理人」徵收，不是暫不徵收（房屋稅條例第 4 條）。", "", ""], ["A", "依契稅條例之規定，下列敘述何者錯誤？", ["買賣契稅，應由出賣人申報納稅", "典權契稅，應由典權人申報納稅", "買賣契稅之稅率為其契價百分之六", "分割契稅之稅率為其契價百分之二"], "R13303", "買賣契稅由「買受人」申報納稅（契稅條例第 4 條）。", "", ""], ["B", "依契稅條例之規定，以不動產為信託財產時，在信託關係人間移轉所有權時，何種情形須課徵契稅？", ["因信託行為成立，委託人與受託人間", "信託契約明定信託財產之歸屬人為第三人者，信託關係消滅時，委託人與歸屬人間", "因信託行為不成立，委託人與受託人間", "信託關係存續中受託人變更時，原受託人與新受託人間"], "R13303", "信託契約明定歸屬人為第三人（非委託人）者，信託關係消滅時委託人與歸屬人間移轉，要課契稅（契稅條例第 7-1 條）；其他信託關係人間的形式移轉不課。", "", ""], ["C", "依契稅條例之規定，下列何種契約的契稅稅率最低？", ["買賣契約", "典權契約", "分割契約", "贈與契約"], "R13303", "契稅稅率：分割、交換 2% 最低；典權 4%；買賣、贈與 6%。", "", ""], ["A", "依規定，非都市土地甲種建築用地之建蔽率為百分之六十，容積率為百分之二百四十。倘甲有1筆100 坪的甲種建築用地想規劃蓋1 棟豪宅自住，請問甲的房屋每層樓最大建坪有幾坪？可蓋幾層樓高？", ["最大建坪60 坪，4 層樓高", "最大建坪60 坪，5 層樓高", "最大建坪100 坪，2 層樓高", "最大建坪100 坪，3 層樓高"], "R13203", "建蔽率 60%：每層最大建築面積 100×60%＝60 坪；容積率 240%：總樓地板 240 坪 ÷60＝4 層。", "", ""], ["A", "依都市計畫法指定供公用事業設施使用之公共設施保留地，應由各該事業機構依法徵收或購買；其餘由公用事業設施所屬政府或鄉、鎮、縣轄市公所依何種方式取得？", ["徵收、區段徵收、市地重劃", "協議價購、公私土地交換、都市更新", "都市更新、市地重劃、區段徵收", "徵收、協議價購、公私土地交換"], "R13203", "公共設施保留地，除公用事業機構徵收或購買外，由政府以徵收、區段徵收或市地重劃方式取得（都市計畫法第 48 條）。", "", ""], ["D", "下列何類徵收事業之需用土地人在補償費未發給完竣前，或未核定發給抵價地前，因公共安全急需，得先進入被徵收土地內工作？", ["國防事業、平價住宅事業、水利事業", "交通事業、水利事業、社會福利事業", "高齡化事業、少子化事業、防疫事業", "國防事業、交通事業、水利事業"], "R13202", "國防、交通、水利事業因公共安全急需，得在補償費發給完竣前先進入被徵收土地工作（土地徵收條例第 27 條但書）。", "", ""], ["C", "依土地徵收條例之規定，下列敘述何者正確？", ["撤銷或廢止徵收者，徵收前原設定之他項權利及耕地租約得予回復", "撤銷或廢止徵收者，如原土地所有權人及他項權利人申請於發給之抵價地上設定抵押權或典權時，其原抵押權或典權不予回復", "撤銷或廢止徵收，由需用土地人向中央主管機關申請之", "撤銷或廢止徵收，由該管直轄市或縣（市）主管機關單獨向中央主管機關申請之"], "R13202", "撤銷或廢止徵收，由需用土地人向中央主管機關申請（土地徵收條例第 49 條）。", "", ""], ["D", "都市計畫地區於訂定分區發展優先次序後，第一期發展地區應於主要計畫發布實施後，多久期限完成細部計畫？並於細部計畫發布後，多久期限完成公共設施建設？", ["五年內完成細部計畫，細部計畫發布後二年內完成公共設施建設", "四年內完成細部計畫，細部計畫發布後三年內完成公共設施建設", "三年內完成細部計畫，細部計畫發布後四年內完成公共設施建設", "二年內完成細部計畫，細部計畫發布後五年內完成公共設施建設"], "R13203", "第一期發展地區應於主要計畫發布後「2 年內」完成細部計畫，細部計畫發布後「5 年內」完成公共設施（都市計畫法第 17 條）。", "", ""], ["D", "依土地法第34 條之1 規定，共有土地之處分、變更，下列何比例之同意，方得行之？", ["共有人三分之一及其應有部分合計過二分之一之同意", "共有人二分之一及其應有部分合計過三分之一之同意", "共有人合計逾三分之二之同意", "應有部分合計逾三分之二之同意"], "R13101", "應有部分合計逾三分之二者，人數不予計算（土地法第 34-1 條）。", "", ""], ["B", "依土地法第17 條規定，下列何項土地得租賃於外國人？", ["林地", "牧地", "漁地", "鹽地"], "R13101", "不得移轉、設定負擔或租賃於外國人：林地、漁地、狩獵地、鹽地、礦地、水源地、要塞軍備區域及領域邊境土地（土地法第 17 條）；牧地不在其中。", "", ""], ["C", "依土地法規定，私有土地所有權之移轉或租賃，妨害基本國策者，下列何者得報請行政院制止之？", ["監察院", "國有財產署", "中央地政機關", "不動產經紀人員獎懲委員會"], "R13101", "妨害基本國策者，由「中央地政機關」報請行政院制止（土地法第 20 條）。", "", ""], ["C", "依土地法規定，租用建築房屋之基地，發生下列何種情形時，出租人不得收回？", ["承租人以基地供違反法令之使用時", "承租人轉租基地於他人時", "承租人積欠租金額，除以擔保現金抵償外，達二個月以上時", "承租人違反租賃契約時"], "R13103", "基地承租人積欠租金除以擔保現金抵償外達「2 年」以上，出租人才得收回（土地法第 103 條）；2 個月不得收回。", "", ""], ["D", "依土地徵收條例規定，區段徵收範圍內土地，經規劃整理後，有關其處理方式，下列敘述何者錯誤？", ["抵價地發交被徵收土地所有權人領回", "國民住宅用地得以讓售", "安置原住戶所需土地得以讓售", "可供建築土地依規定標租時，其期限不得逾二十五年"], "R13202", "區段徵收可供建築土地標租，期限不得逾 99 年（土地徵收條例第 44 條），不是 25 年。", "", ""], ["D", "甲為中華民國境內居住之個人，他在A 市持有已長達10 年的1 筆面積為300 坪土地，於民國（下同）107 年間參加自辦市地重劃。該自辦市地重劃區於110 年6 月1 日完成分配公告程序後，在110 年10 月1 日完成重劃土地登記，在110 年10 月20 日完成土地交接，甲取回150 坪土地，重劃後評定價格每坪為30 萬元。甲在111 年5 月1 日趁土地高價時將150 坪土地全數出售，每坪售價40 萬元。請問甲依法要繳多少稅率的房地交易所得稅？", ["稅率為百分之四十五", "稅率為百分之三十五", "稅率為百分之二十", "稅率為百分之十五"], "R13304", "本題考選部一律給分：自辦重劃領回土地的取得日認定有爭議。若以原持有超過 10 年計，房地合一稅率為 15%。", "ABCD", "考選部公告：本題一律給分（重劃取得土地之持有期間認定有爭議）。"], ["B", "依土地徵收條例規定，已公告徵收之土地，因作業錯誤，致原徵收之土地不在工程用地範圍內者，應如何處理？", ["應辦理廢止徵收", "應辦理撤銷徵收", "應辦理徵收收回", "應辦理徵收失效"], "R13202", "因作業錯誤致原徵收土地不在工程用地範圍內者，應「撤銷」徵收（土地徵收條例第 49 條）。", "", ""], ["C", "聲請為土地權利變更登記之案件，在登記尚未完畢前，登記機關接獲法院為何種囑託登記時，應即改辦之？", ["查封登記、預告登記", "假處分登記、滅失登記", "假扣押登記、破產登記", "輔助宣告登記、監護宣告登記"], "R13102", "登記未完畢前接獲法院查封、假扣押、假處分或破產登記之囑託，應即改辦（土地登記規則第 141 條）；預告登記非法院囑託。", "", ""], ["B", "徵收土地或土地改良物應發給之補償費，需用土地人應於公告期滿後十五日內將補償費繳交該管直轄市或縣（市）主管機關發給完竣，逾期者該部分土地或土地改良物之法律效力為何？", ["仍具徵收效力", "徵收從此失其效力", "被徵收之所有權人得申請撤銷徵收", "需用土地人得申請保留徵收"], "R13202", "補償費應於公告期滿後 15 日內發給，逾期未發給者，該部分徵收從此失其效力（土地徵收條例第 20 條）。", "", ""], ["D", "依平均地權條例規定，土地所有權移轉或設定典權時，有關申報移轉現值之審核標準，下列敘述何者正確？", ["遺贈之土地，以遺贈人簽立遺囑當期之公告土地現值為準", "申報人逾訂定契約之日起三十日始申報者，以訂約日當期之公告土地現值為準", "依法院判決移轉登記者，以法院終局判決日當期之公告土地現值為準", "經法院拍賣之土地，以拍定日當期之公告土地現值為準"], "R13302", "法院拍賣之土地，以拍定日當期公告土地現值為準。(A) 遺贈以遺贈人「死亡日」；(B) 逾 30 日申報以「受理申報機關收件日」；(C) 法院判決以「起訴日」。", "", ""], ["B", "依平均地權條例規定，實施市地重劃時，重劃區內供公共使用之道路等十項用地，應優先以下列何種土地抵充？", ["原廣場、綠地、停車場、零售市場地", "原公有道路、溝渠、河川及未登記地", "原兒童遊樂場、鄰里公園、國民小學、國民中學地", "原國有地、學產地、直轄市縣（市）有地、鄉鎮（市）有地"], "R13201", "市地重劃區內道路等共同負擔用地，以原公有道路、溝渠、河川及未登記地優先抵充（平均地權條例第 60 條）。", "", ""], ["D", "下列何者不屬於平均地權條例獎勵土地所有權人自行辦理市地重劃事業之獎勵事項？", ["優先興建重劃區之公共設施", "免收或減收換發權利書狀費用", "免徵或減徵地價稅與田賦", "給予免息之重劃貸款"], "R13201", "自辦市地重劃獎勵包括：給予「低利」重劃貸款、免收或減收地籍整理規費及換發書狀費、優先興建公共設施、免徵或減徵地價稅與田賦等（平均地權條例第 58 條）；不是免息貸款。", "", ""], ["D", "依平均地權條例規定，下列銷售預售屋者相關規定之敘述，何者錯誤？", ["應於銷售前將預售屋買賣定型化契約，報請預售屋坐落基地所在之直轄市、縣（市）主管機關備查", "原則上應於簽訂買賣契約書之日起三十日內，向直轄市、縣（市）主管機關申報登錄資訊", "向買受人收受定金，應以書面契據確立買賣價金等事項，並不得約定不利於買受人之事項", "向買受人收受定金所訂立之書面契據，得轉售予第三人"], "R13201", "預售屋買受人取得的定金書面契據「不得」轉售予第三人（平均地權條例第 47-4 條）。", "", ""]]}, {"id": "p110l", "label": "110年・土地法與土地相關稅法概要", "year": 110, "subj": "R13", "qs": [["B", "依土地法規定，外國人投資有助於國內重大建設、整體經濟或農牧經營而需要取得土地時，應先經下列何者程序？", ["中央地政機關備查", "中央目的事業主管機關同意", "該直轄市或縣（市）民意機關同意", "該直轄市或縣（市）政府層請行政院同意"], "R13101", "外國人為重大建設、整體經濟或農牧經營投資而取得土地，應先經「中央目的事業主管機關」同意（土地法第 19 條）。", "", ""], ["A", "有關重新實施地籍測量時，依土地法規定，下列敘述何者正確？", ["土地所有權人發生界址爭議時，應由該管直轄市或縣（市）地政機關予以調處", "土地所有權人不服界址爭議調處者，應於接到調處通知後三十日內，向司法機關訴請處理", "土地所有權人認為測量結果有錯誤時，得於重測結果公告期滿三十日內聲請複丈", "重測結果未經聲請複丈者，地政機關應即據以辦理土地更正登記"], "R13102", "重新實施地籍測量發生界址爭議，由地政機關調處（土地法第 46-2 條）。不服調處 15 日內訴請處理；公告期間內聲請複丈；未聲請複丈者據以辦理「標示變更登記」。", "", ""], ["B", "依土地法之規定，無保管或使用機關之公有土地及因地籍整理而發現之公有土地，應如何處理？", ["由該管直轄市或縣（市）地政機關囑託登記，其所有權人欄註明為國有", "由該管直轄市或縣（市）地政機關逕為登記，其所有權人欄註明為國有", "由該管直轄市或縣（市）地政機關囑託登記，其所有權人欄註明為直轄市或縣（市）有", "由該管直轄市或縣（市）地政機關逕為登記，其所有權人欄註明為直轄市或縣（市）有"], "R13102", "無保管或使用機關之公有土地及因地籍整理發現之公有土地，由地政機關「逕為登記」，所有權人欄註明為國有（土地法第 52 條）。", "", ""], ["C", "依土地法規定，聲請為土地權利變更登記，應繳納登記費，下列敘述何者正確？", ["由權利人與義務人雙方共同按公告地價或權利價值千分之一繳納登記費", "由權利人按公告現值或權利價值千分之二繳納登記費", "由權利人按申報地價或權利價值千分之一繳納登記費", "由義務人按公告現值或權利價值千分之二繳納登記費"], "R13102", "權利變更登記由權利人按申報地價或權利價值「千分之一」繳納登記費（土地法第 76 條）；總登記是千分之二。", "", ""], ["D", "依土地法規定，房屋租用相關規定，下列何者錯誤？", ["城市地方房屋之租金，以不超過土地及其建築物申報總價年息百分之十為限", "約定房屋租金，超過土地法規定者，該管直轄市或縣（市）政府得依土地法所定標準強制減定之", "房屋租金擔保之金額，不得超過二個月房屋租金之總額", "以現金為租賃之擔保者，其現金視為租金之一部"], "R13103", "以現金為租賃擔保者，其現金「利息」視為租金之一部（土地法第 99 條），不是現金本身。租金上限為申報總價年息 10%，擔保金不得超過 2 個月租金。", "", ""], ["C", "依土地法之規定，遇有荒歉，直轄市或縣（市）政府得按照當地當年收穫實況為減租或免租之決定。但應經何機關同意？", ["行政院", "財政部", "民意機關", "農業發展委員會"], "R13103", "遇有荒歉，地方政府得為減租或免租決定，但應經「民意機關」同意（土地法第 123 條）。", "", ""], ["B", "依平均地權條例規定，應納地價稅額因公告地價調整致納稅義務人繳納困難者，得於規定繳納期間內，向稅捐稽徵機關申請延期繳納，延期繳納期間最長不得逾多久？", ["3 個月", "6 個月", "1 年", "3 年"], "R13301", "因公告地價調整致繳納困難者，得申請延期繳納，延期最長不得逾 6 個月（依官方答案）。", "", ""], ["A", "平均地權條例第
