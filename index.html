35 條之1 規定，私人捐贈予財團法人供興辦社會福利事業使用之土地，免徵土地增值稅；但有三種情形之一者，除追補應納之土地增值稅外，並處應納土地增值稅額二倍之罰鍰。下列何者不是規範中的情形？", ["未辦理用地變更者", "未按捐贈目的使用土地者", "違反各該事業設立宗旨者", "土地收益未全部用於各該事業者"], "R13302", "私人捐贈社福土地免徵土地增值稅，若未按捐贈目的使用、違反設立宗旨、收益未全部用於該事業，追補並處二倍罰鍰（平均地權條例第 35-1 條）；「未辦理用地變更」不在其中。", "", ""], ["B", "有關平均地權條例對違反申報登錄之規定中，直轄市、縣（市）主管機關應先令其限期改正，屆期未改正者，處新臺幣六千元以上三萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰的情形係指下列何種狀況？", ["申報登錄價格資訊不實", "申報登錄價格以外資訊不實", "未依限申報登錄資訊、申報登錄價格或交易面積資訊不實", "金融機構、權利人、義務人、地政士或不動產經紀業規避、妨礙或拒絕查核"], "R13201", "申報登錄「價格以外資訊」不實，先限期改正，屆期未改正處 6,000～30,000 元，並按次處罰（平均地權條例第 81-2 條）。", "", ""], ["C", "依平均地權條例規定，預售屋買受人將已付定金，確立買賣標的物及價金等事項之書面契據，轉售予第三人時，由直轄市、縣（市）主管機關按戶（棟）處罰新臺幣多少元？", ["三萬元以上十五萬元以下罰鍰", "六萬元以上三十萬元以下罰鍰", "十五萬元以上一百萬元以下罰鍰", "三十萬元以上一百萬元以下罰鍰"], "R13201", "預售屋買受人將定金書面契據轉售予第三人，按戶（棟）處 15 萬元以上 100 萬元以下罰鍰（平均地權條例第 81-3 條）。", "", ""], ["B", "下列有關平均地權條例對以經營土地買賣，違背土地法律，從事土地壟斷、投機者處罰規定之敘述，何者正確？", ["處一年以下有期徒刑，並得併科五千元以下罰金", "處三年以下有期徒刑，並得併科七千元以下罰金", "處一年以下有期徒刑，並得併科八千元以下罰金", "處三年以下有期徒刑，並得併科一萬元以下罰金"], "R13201", "以經營土地買賣違背土地法律從事壟斷、投機者，處 3 年以下有期徒刑，並得併科 7,000 元以下罰金（平均地權條例第 83 條）。", "", ""], ["C", "拒絕受領之徵收補償費，依土地徵收條例規定存入專戶保管，並通知應受補償人。自通知送達發生效力之日起，最長逾幾年未領取之補償費，歸屬國庫？", ["5 年", "10 年", "15 年", "20 年"], "R13202", "存入專戶的補償費，自通知送達發生效力之日起逾 15 年未領取者，歸屬國庫（土地徵收條例第 26 條）。", "", ""], ["C", "依土地徵收條例規定，建築改良物之補償費，按徵收當時該建築改良物之下列何種價格估定之？", ["市價", "重置價格", "重建價格", "房屋評定現值"], "R13202", "建築改良物補償費，按徵收當時該建築改良物之「重建價格」估定（土地徵收條例第 31 條）。", "", ""], ["A", "依土地法規定，未辦理繼承登記之土地經列冊管理達多久後，逾期仍未聲請登記者，該土地應如何處理？", ["列冊管理期間為15 年，由財務部國有財產署公開標售", "列冊管理期間為15 年，由地政機關公開標售", "列冊管理期間為20 年，由法院公開拍賣", "列冊管理期間為20 年，逕登記為國有土地"], "R13102", "未辦繼承登記列冊管理 15 年，期滿仍未申請者，移請財政部國有財產署公開標售（土地法第 73-1 條）。", "", ""], ["D", "土地權利關係人依都市計畫法第 24 條規定自行擬定或變更細部計畫時，主管機關得要求土地權利關係人提供或捐贈都市計畫變更範圍內之那些回饋項目予當地直轄市、縣（市）政府或鄉、鎮、縣轄市公所？①公共設施用地 ②可建築土地 ③樓地板面積 ④一定金額", ["僅①④", "僅①②③", "僅②③④", "①②③④"], "R13203", "自行擬定或變更細部計畫時，得要求提供或捐贈的回饋項目：公共設施用地、可建築土地、樓地板面積或一定金額（都市計畫法第 27-1 條），四項全部。", "", ""], ["C", "私有公共設施保留地得申請與公有非公用土地辦理交換，依都市計畫法之規定，不受下列那些法規相關規定之限制？①土地法 ②所得稅法 ③國有財產法 ④各級政府財產管理法令", ["②④", "②③④", "①③④", "①②③④"], "R13203", "私有公共設施保留地與公有非公用土地交換，不受土地法、國有財產法及各級政府財產管理法令之限制（都市計畫法第 50-2 條）；所得稅法不在其中。", "", ""], ["B", "非都市土地經劃定使用分區並編定使用地類別，應依其容許使用之項目及許可使用細目使用。但中央目的事業主管機關認定為重大建設計畫所需之臨時性設施，經徵得使用地之中央主管機關及有關機關同意後，得核准為臨時使用。中央目的事業主管機關於核准時，應函請直轄市或縣（市）政府將臨時使用用途及期限等資料，依相關規定程序登錄於何處？", ["土地登記謄本", "土地參考資訊檔", "土地使用分區證明", "非都市土地許可使用書"], "R13203", "重大建設計畫所需的臨時性設施核准臨時使用時，中央目的事業主管機關應將核准內容通知地政機關登錄於「土地參考資訊檔」。", "", ""], ["B", "依非都市土地使用管制規則規定，土地使用編定後，其原有使用或原有建築物不合土地使用分區規定者，其使用限制，下列敘述何者錯誤？", ["在政府令其變更使用或拆除建築物前，得為從來之使用", "原有建築物除准修繕和增建外，不得改建", "若該土地或建築物，對公眾安全、衛生及福利有重大妨礙者，該管直轄市或縣（市）政府應限期令其變更或停止使用、遷移、拆除或改建", "政府令其變更或停止使用，所受損害應予適當補償"], "R13203", "不合分區規定的原有建築物，除准修繕外，不得「增建」或改建（非都市土地使用管制規則第 8 條）。", "", ""], ["A", "依土地稅法規定，土地所有權人第一次出售其自用住宅用地，其適用自用住宅用地特別稅率之要件，下列敘述何者正確？", ["都市土地面積未超過三公畝部分和非都市土地面積未超過七公畝部分", "其土地增值稅統就該部分之土地漲價總數額按百分之十徵收之", "需土地於出售前5 年內，不曾供營業使用或出租者", "土地所有權人與其配偶及未成年直系親屬需於該地辦竣戶籍登記"], "R13302", "一生一次自用住宅稅率：都市土地未超過 3 公畝、非都市土地未超過 7 公畝部分（土地稅法第 34 條）。(B) 稅率是 10% 沒錯但不是統就漲價總數額全部；(C) 是出售前「1 年」內；(D) 設籍要件是本人、配偶或直系親屬。", "", ""], ["A", "依土地稅法免徵土地增值稅之土地，主管稽徵機關依相關規定核定其移轉現值並發給免稅證明，以憑辦理土地所有權移轉登記，下列有關移轉現值核定之敘述何者正確？", ["各級政府出售之公有土地，以實際出售價額為準", "各級政府贈與或受贈之土地，以土地點交日之公告土地現值為準", "區段徵收抵價地，以區段徵收時實際測量及登記完竣之地價為準", "私人捐贈供興辦社會福利事業之土地，以社會福利事業核准日之公告土地現值為準"], "R13302", "免徵土地增值稅土地的移轉現值核定：各級政府出售之公有土地，以實際出售價額為準（土地稅法施行細則）。", "", ""], ["A", "平均地權條例第74 條規定，依第26 條規定限期建築之土地，有下列三種情形之一者，土地所有權人應於接到限期使用通知後，與承租人、借用人或地上權人協議建築、增建或改建；協議不成時，得終止租約、借貸或撤銷地上權。下列何者是規範中的情形？", ["土地所有權人將其土地出租、貸與或設有地上權者", "土地所有權人將其土地設定典權或設定不動產役權者", "土地所有權人將其所有之農作改良物出租或貸與他人使用者", "土地承典人或地役權人將其所有建築改良物出租或貸與他人使用者"], "R13201", "限期建築之土地，如土地所有權人將土地出租、貸與或設有地上權者，應與承租人等協議建築；協議不成得終止租約、借貸或撤銷地上權（平均地權條例第 74 條）。", "", ""], ["C", "依契稅條例規定，以不動產為信託財產，受託人乙依信託本旨移轉信託財產與委託人甲以外之歸屬權利人丙時，應由何人估價立契，在規定之期限申報契稅？又其契稅稅率為何？", ["由乙申報契稅，稅率為6%", "由乙申報契稅，稅率為2%", "由丙申報契稅，稅率為6%", "由甲申報契稅，稅率為2%"], "R13303", "信託財產移轉給歸屬權利人，由歸屬權利人丙申報，依贈與契稅稅率 6% 課徵（契稅條例第 7-1 條）。", "", ""], ["D", "有關中華民國境內居住之個人，依所得稅法規定計算之房屋、土地交易所得，減除當次交易依土地稅法第30 條第1 項規定公告土地現值計算之土地漲價總數額後之餘額，不併計綜合所得總額，其稅率計算下列何者正確？", ["持有房屋、土地之期間在三年以內者，稅率為百分之四十五", "持有房屋、土地之期間超過三年，未逾五年者，稅率為百分之三十五", "持有房屋、土地之期間超過五年，未逾十年者，稅率為百分之三十", "持有房屋、土地之期間超過十年者，稅率為百分之十五"], "R13304", "房地合一 2.0：持有 2 年內 45%、2～5 年 35%、5～10 年 20%、超過 10 年 15%（所得稅法第 14-4 條）。", "", ""], ["B", "依所得稅法規定，個人出售自住房屋、土地，依規定繳納之稅額，申請房地合一所得稅重購退稅之敘述，下列何者錯誤？", ["需自完成移轉登記之日起算二年內，重購自住房屋、土地者", "得於重購自住房屋、土地完成移轉登記次日起算二年內，申請退稅", "申請按重購價額占出售價額之比率，自所繳納稅額計算退還", "重購之自住房屋、土地，於重購後五年內改作其他用途或再行移轉時，應追繳原退還稅額"], "R13304", "重購退稅：出售後 2 年內重購（或先購後售）自住房地，得於重購完成移轉登記次日起「5 年內」申請退稅（所得稅法第 14-8 條），不是 2 年。", "", ""], ["B", "依所得稅法規定，陳先生在110 年10 月以900 萬元出售其於107 年以700 萬元購入之房地產，110 年當期土地之公告現值為800 萬元，陳先生個人未提示因取得、改良及移轉而支付之費用時，稽徵機關得以多少元計算其費用？", ["24 萬元", "27 萬元", "30 萬元", "45 萬元"], "R13304", "未提示取得、改良及移轉費用者，按成交價額 3% 計算，最高 30 萬元：900 萬×3%＝27 萬元。", "", ""]]}, {"id": "p114b", "label": "114年・不動產經紀相關法規概要", "year": 114, "subj": "R14", "qs": [["B", "公寓大廈頂樓平台漏水之原因，為年久失修導致防水層破損。此時應由誰負修繕義務？", ["依區分所有權人會議決議", "公寓大廈管理委員會", "頂樓住戶", "頂樓住戶和管理委員會共同負責"], "R14201", "頂樓平台屬共用部分，其修繕由管理負責人或管理委員會為之，費用由公共基金支付或由區分所有權人按應有部分分擔（公寓大廈管理條例第 10 條）。", "", ""], ["A", "舉行公寓大廈區分所有權人會議時，何種事項在會議中，不得以臨時動議提出？", ["管理委員選任之事項", "公共區域禁止吸煙之事項", "公共設施緊急維修之事項", "調整收取社區管理費之事項"], "R14201", "管理委員的選任事項，應在開會通知中載明並公告，「不得以臨時動議提出」（第 30 條）。", "", ""], ["C", "依公寓大廈管理條例，下列有關公寓大廈管理委員任期之敘述，何者正確？", ["管理委員之任期不可以規定在規約中，要召開區分所有權人會議決定", "管理委員會會議得決議各管理委員任期為1 年或2 年", "主任委員、財務管理委員及監察業務委員之任期屆滿，連選得連任一次", "管理委員會的各管理委員之任期屆滿，連選得連任"], "R14201", "主任委員、管理負責人、負責財務管理及監察業務之委員，連選得連任「一次」；其餘委員連選得連任（第 29 條）。任期依規約，但不得逾 2 年。", "", ""], ["D", "甲在公寓大廈1 樓開店營業，向管理委員會表示想要於該大樓1、2 樓外牆設置廣告物，甲要取得何者之同意，才能設置廣告物？", ["管理委員會開會同意", "管理委員會會議及區分所有權人會議決議同意", "2 樓區分所有權人同意", "區分所有權人會議決議同意及1 樓、2 樓區分所有權人同意"], "R14201", "外牆屬共用部分，設置廣告物受規約或區分所有權人會議決議限制（第 8 條），且涉及 1、2 樓外牆，還須該樓層區分所有權人同意。", "", ""], ["D", "依消費者保護法之規定，企業經營者對消費者保證商品或服務之品質時，應主動出具書面保證書。該保證書應載明之事項中，不包括那一項？", ["商品或服務之名稱、種類、數量，其有製造號碼或批號者，其製造號碼或批號", "保證期間及其起算方法", "由經銷商售出者，經銷商之名稱、地址", "各期價款與其他附加費用合計之總價款與現金交易價格之差額"], "R14301", "保證書應載明：商品名稱種類數量及製造號碼、保證內容、保證期間及起算方法、製造商名稱地址、經銷商名稱地址、交易日期（消保法第 25 條）。「總價款與現金交易價格之差額」是分期付款買賣契約應載事項（第 21 條）。", "", ""], ["C", "訪問交易之消費者，關於行使解除契約之敘述，下列何者為正確？", ["消費者行使解除權，唯有直接退回商品給企業經營者之方式", "經企業經營者同意，可以用口頭通知企業經營者的方式來解除契約", "消費者解除買賣契約，無須說明理由且無庸負擔任何費用或價款", "消費者行使解除權的7 天猶豫期，可以以特約排除猶豫期間"], "R14301", "訪問交易、通訊交易消費者可於收受商品後 7 日內，以退回商品或書面通知解除契約，無須說明理由及負擔任何費用或對價（消保法第 19 條）；猶豫期不得以特約排除。", "", ""], ["B", "甲建商所銷售預售屋的車位位置、規格，不符合預售屋買賣定型化契約應記載及不得記載事項時，地方政府主管機關應優先適用何種法律，裁處罰鍰？", ["公平交易法", "平均地權條例", "消費者保護法", "不動產經紀業管理條例"], "R14102", "預售屋定型化契約違反應記載及不得記載事項，依平均地權條例第 47-3 條按戶（棟）處罰，優先於消保法適用。", "", ""], ["D", "公平交易法有關事業間聯合行為之敘述，下列何者錯誤？", ["行為主體須為二以上彼此具競爭關係之同一產銷階段事業", "事業間具有以契約、協議或其他方式之合意或相互約束事業活動之行為", "效果須足以影響生產、商品交易或服務供需之市場功能", "主管機關不得以相當依據推定事業間具有聯合行為之合意"], "R14401", "聯合行為之合意，得依市場狀況、商品特性、成本利潤考量、行為之經濟合理性等「相當依據之因素推定之」（公平交易法第 15 條第 3 項），(D) 錯。", "", ""], ["D", "下列何者不屬於 公平交易法第21 條 不實廣告之行為態樣？", ["甲公司在網頁宣稱驗屋人員有專業證照，惟該等證照並非與執行驗屋業務相關的證照", "乙建商在廣告文宣傳單上，對於使用分區為科技商務專用區之建案使用一般住宅用語", "丙仲介人員在公司窗戶上貼單，刊載多筆房屋賀成交資訊，惟部分成交紀錄並非均為該公司所成交", "代銷業者刊登廣告招徠客人，對來購屋消費者表示須先給付定金始提供房屋買賣契約書攜回審閱"], "R14401", "要求先付定金才提供契約書攜回審閱，屬第 25 條「足以影響交易秩序之顯失公平行為」，不是第 21 條的不實廣告。其餘三項都是對商品或服務品質、成交資訊等作虛偽不實或引人錯誤表示。", "", ""], ["A", "事業向公平交易委員會申請許可進口玉米之聯合行為，經該會附加負擔後予以許可，並在期限屆滿前，再向主管機關申請期限延展。下列敘述何者錯誤？", ["主管機關對許可及其有關之條件、負擔、期限，不得主動公開", "事業向主管機關申請其延展期限，每次不得逾5 年", "主管機關對申請展延所為之許可，得附加條件或負擔", "事業如有正當理由，得於期限屆滿前3 個月至6 個月期間內申請"], "R14401", "主管機關對聯合行為的許可及其條件、負擔、期限，應「主動公開」（公平交易法第 17 條）。延展每次不得逾 5 年，應於期限屆滿前 3～6 個月申請。", "", ""], ["A", "有關不動產說明書應記載及不得記載事項之擬定與公告，下列敘述何者正確？", ["由內政部擬定相關規範，並向行政院報請核定公告", "由消費者保護處擬定相關規範，並向行政院報請核定公告", "由法務部擬定相關規範，並向司法院報請核定公告", "由仲介業全聯會擬定相關規範，並向司法院報請核定公告"], "R14102", "不動產說明書應記載及不得記載事項由中央主管機關（內政部）擬定，報請行政院核定後公告。", "", ""], ["D", "甲不動產仲介經紀有限公司，A 營業處所之經紀人離職缺人，因而僱用剛考取不動產經紀人考試及格者丁，承辦仲介業務並於委託銷售契約書上簽章。下列甲違反不動產經紀業管理條例規定之敘述，何者錯誤？", ["甲違反經紀業設立之營業處所至少應置經紀人一人", "甲違反不動產之委託契約書應由經紀業指派經紀人簽章", "甲違反不得僱用未具備經紀人員資格者從事仲介業務", "甲違反規定受停止執行業務處分累計達3 次以上者，廢止其經營許可"], "R14101", "丁剛考取尚未領得經紀人證書，不具經紀人員資格。甲違反的是置經紀人、簽章及僱用資格等規定；「停止執行業務」是對經紀人員的懲戒，不是經紀業的處分，(D) 錯。", "", ""], ["D", "依據不動產經紀業管理條例，關於經營仲介業務者之規定，下列敘述何者正確？", ["向主管機關申請許可，經審查後即得經營仲介業務", "以商號之型態辦理登記後，即得開始經營仲介業務", "所僱用的經紀人員可以用個人名義執行不動產買賣", "經營國外不動產仲介業務，應以公司型態辦理登記"], "R14101", "經營國外不動產仲介或代銷業務者，應以「公司型態」組織辦理登記（經紀業管理條例第 5 條）。(A)(B) 許可後還要辦妥登記、繳存保證金、置經紀人員、加入公會才能營業；(C) 經紀人員不得以個人名義執行業務。", "", ""], ["D", "甲剛搬來社區不久，即受到鄰居推薦，並順利當選社區管理委員會之委員。依公寓大廈管理條例之規定，該管理委員會有那一種能力？", ["權利能力", "行為能力", "意思能力", "當事人能力"], "R14201", "管理委員會有「當事人能力」（公寓大廈管理條例第 38 條），可以為原告或被告。", "", ""], ["A", "依公寓大廈管理條例之規定，關於共用部分之敘述，何者錯誤？", ["各區分所有權人對建築物之共用部分及其基地有使用收益之權利，按其共有之應有部分比例，不得另行約定之", "住戶對共用部分之使用方法，可以另外約定調整之", "共用部分及其相關設施之拆除、重大修繕或改良，應依區分所有權人會議之決議為之", "專有部分不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉或設定負擔"], "R14201", "各區分所有權人按應有部分比例對共用部分有使用收益權，「但另有約定者從其約定」（第 9 條），(A) 說不得另行約定，錯。", "", ""], ["D", "甲買了一個社區的房子，剛好到了要召開區分所有權人會議的時間。依公寓大廈管理條例之規定，區分所有權人會議至少多久應召開定期會議一次？", ["每3 個月", "每季", "每半年", "每年"], "R14201", "區分所有權人會議由全體區分所有權人組成，「每年」至少應召開定期會議一次（第 25 條）。", "", ""], ["C", "區分所有權人會議之決議，依公寓大廈管理條例，除規約另有規定，應有區分所有權人⑴以上及其區分所有權比例合計 ⑵以上出席，以出席人數 ⑶以上及其區分所有權比例占出席人數區分所有權 ⑷以上之同意行之。上述⑴⑵⑶⑷之比例，依序應為多少？", ["二分之一、二分之一、三分之二、三分之二", "二分之一、三分之二、三分之二、四分之三", "三分之二、三分之二、四分之三、四分之三", "三分之二、四分之三、四分之三、五分之四"], "R14201", "重大事項（規約訂定變更、重大修繕等）的決議：區分所有權人 2/3 以上及其區分所有權比例 2/3 以上出席，以出席人數 3/4 以上及其比例 3/4 以上同意（第 31 條）。", "", ""], ["B", "依不動產經紀業管理條例之規定，經紀人員違反下列那一選項之規定，不僅應依規定懲戒，經紀業亦將依規定處罰？", ["經紀人員未專任一經紀業，違法為他經紀業執行仲介或代銷業務", "經紀人員收取差價或其他報酬", "經紀人員在執行業務過程中，未以不動產說明書向與委託人交易之相對人解說", "經紀人員無故洩漏因業務知悉或持有之他人秘密"], "R14102", "經紀業或經紀人員不得收取差價或其他報酬（第 19 條）；違反時經紀業依第 29 條處罰、經紀人員依第 31 條懲戒。其他選項只對經紀人員懲戒。", "", ""], ["A", "依不動產經紀業管理條例之規定，下列關於不動產經紀營業員之敘述，何者正確？", ["不動產經紀人考試及格，並向中央主管機關指定之機構、團體登錄及領有不動產經紀營業員證明者，得充任不動產經紀營業員", "經紀營業員訓練不得少於20 個小時，其證明有效期限為4 年", "期滿時，經紀營業員應檢附完成訓練30 個小時以上之證明文件，向中央主管機關指定之機構、團體重新辦理登錄", "經紀營業員經驗之認定，得以本條例施行後，已實際從事仲介或代銷業務之所得扣繳資料證明"], "R14102", "經紀營業員資格：經營業員訓練合格或經紀人考試及格，並向指定機構登錄、領有營業員證明（第 13 條）。訓練不得少於 30 小時；證明有效期 4 年，期滿須檢附 4 年內完成 20 小時以上訓練證明重新登錄。", "", ""], ["B", "依不動產經紀業管理條例之規定，經紀業應完成相關程序後方得營業。下列敘述，何者錯誤？", ["經紀業經主管機關之許可，並辦妥公司登記或商業登記", "加入戶籍所在地之同業公會", "依中央主管機關規定繳存營業保證金", "應於6 個月內開始營業；逾期未開始營業者，由主管機關廢止其許可"], "R14101", "經紀業經許可、辦妥公司或商業登記、繳存營業保證金、置經紀人員，並加入「登記所在地」的同業公會後方得營業；應於 6 個月內開始營業（第 7 條）。不是戶籍所在地。", "", ""], ["B", "依公平交易法之規定，法院因事業違反該法之規定，致侵害他人權益者，被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償。但不得超過已證明損害額之幾倍？", ["二倍", "三倍", "五倍", "十倍"], "R14401", "事業故意違反公平交易法致侵害他人權益，法院得依侵害情節酌定損害額以上之賠償，但不得超過已證明損害額之「三倍」（第 31 條）。", "", ""], ["D", "依不動產經紀業管理條例之規定，下列那一項關於簽章之敘述錯誤？", ["經紀人員在執行業務過程中，不動產說明書於提供解說前，應經委託人簽章", "雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由相對人在不動產說明書上簽章", "委由經紀業仲介或代銷者，不動產租賃、買賣契約書文件應由經紀業指派經紀人簽章", "經營經紀業者，向主管機關申請許可之應備文件應由經紀業指派經紀人簽章"], "R14102", "應由經紀人簽章的是：委託契約書、要約書、定金收據、廣告稿、不動產說明書、租賃或買賣契約書（第 22 條），不包括申請許可的文件。", "", ""], ["A", "不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，依不動產經紀業管理條例之規定，相關文件應由經紀業指派經紀人簽章。下列何者於經營代銷業務者不適用之？", ["不動產出租、出售委託契約書", "定金收據", "不動產廣告稿", "不動產說明書"], "R14102", "第 22 條第 1 項第 1 款（出租出售委託契約書）及第 2 款（承租承購要約書），於經營代銷業務者不適用。", "", ""], ["A", "依公平交易法之規定，下列那一個定義之內容錯誤？", ["廣告薦證者，指廣告主於廣告中反映其對商品或服務之意見、信賴、發現或親身體驗結果", "獨占，指事業在相關市場處於無競爭狀態，或具有壓倒性地位，可排除競爭之能力者", "競爭，指二以上事業在市場上以較有利之價格、數量、品質、服務或其他條件，爭取交易機會之行為", "控制性持股，指前項之人或團體及其關係人持有他事業有表決權之股份或出資額，超過他事業已發行有表決權之股份總數或資本總額半數者"], "R14401", "廣告薦證者是指「廣告主以外」，於廣告中反映其對商品或服務之意見、信賴、發現或親身體驗結果之人或機構（第 21 條），(A) 錯。", "", ""], ["C", "依消費者保護法之規定，下列敘述何者正確？", ["定型化契約條款：指以企業經營者提出之定型化契約條款作為契約內容之全部或一部而訂立之契約", "邀約交易：指企業經營者未經邀約而與消費者在其住居所、工作場所、公共場所或其他場所所訂立之契約", "分期付款：指買賣契約約定消費者支付頭期款，餘款分期支付，而企業經營者於收受頭期款時，交付標的物與消費者之交易型態", "通訊交易：指企業經營者以廣播、電視、電話、傳真、型錄、報紙、雜誌、網際網路、傳單或其他類似之方法，消費者於檢視商品或服務之後，而與企業經營者所訂立之契約"], "R14301", "(C) 即分期付款的定義（消保法第 2 條）。(A) 是定型化契約而非條款的定義；(B) 未經邀約在住居所等場所訂約是「訪問交易」；邀約交易不是法律用語。", "", ""]]}, {"id": "p113b", "label": "113年・不動產經紀相關法規概要", "year": 113, "subj": "R14", "qs": [["C", "不動產說明書係不動產交易過程中極為重要之資訊揭露文件，下列關於不動產說明書之敘述，何者與不動產經紀業管理條例之規定不符？", ["不動產之買賣如委由經紀業代銷者，不動產說明書應由經紀業指派經紀人簽章", "經紀人員在執行業務過程中，應以不動產說明書向與委託人交易之相對人解說", "經紀人員於提供解說後，應將不動產說明書交由委託人簽章", "雙方當事人簽訂買賣契約書後，不動產說明書視為買賣契約書之一部分"], "R14102", "不動產說明書應於「提供解說前」經委託人簽章（經紀業管理條例第 23 條），不是解說後。簽約後不動產說明書視為契約之一部分。", "", ""], ["D", "依不動產經紀業管理條例規定，中華民國國民經不動產經紀人考試及格並領有不動產經紀人證書者，得充不動產經紀人。下列有關不動產經紀人證書之敘述，何者正確？", ["經不動產經紀人考試及格者，應具備一年以上經紀營業員經驗，始得向考試院考選部請領不動產經紀人證書", "不動產經紀人證書有效期限為四年，期滿時，經紀人應檢附其於四年內在中央主管機關認可之機構、團體完成專業訓練二十個小時以上之證明文件，向中央主管機關指定之機構、團體辦理換證", "不動產經紀人受申誡處分三次者，應廢止其經紀人證書", "不動產經紀人受監護宣告成為無行為能力人，應廢止其經紀人證書"], "R14102", "受監護宣告者不得充任經紀人員，已充任者應廢止其證書（第 6 條）。(A) 證書向直轄市、縣（市）主管機關請領；(B) 換證須完成 30 小時以上專業訓練；(C) 申誡 3 次是視為停止執行業務 6 個月，不是廢止。", "", ""], ["A", "經紀人員違反業務規範時，應負之法律責任，下列敘述何者錯誤？", ["未經所屬經紀業同意為他經紀業執行業務，而為自己或他經紀業執行仲介或代銷業務者，應予以六個月以上三年以下之停止執行業務之懲戒處分", "在執行業務過程中，未向與委託人交易之相對人解說不動產說明書之內容者，應予申誡", "對於因業務知悉或持有之他人秘密，無故洩漏者，應予申誡", "執行業務因故意或過失不法侵害交易當事人致其受有損害者，應與經紀業負連帶賠償責任"], "R14102", "未經所屬經紀業同意為他經紀業執行業務違反第 16 條專任規定，懲戒是「申誡」（第 31 條），不是停止執行業務。停止執行業務 6 個月～3 年的是違反第 19 條第 1 項、第 21 條第 2 項、第 22 條第 2 項。", "", ""], ["C", "有關公寓大廈專有部分、共用部分之修繕義務及費用負擔，下列敘述何者錯誤？", ["專有部分之修繕，由各該區分所有權人為之，並負擔其費用", "共用部分之修繕，由管理負責人或管理委員會為之。其費用由公共基金支付或由區分所有權人按其共有之應有部分比例分擔之", "共用部分之修繕，係因可歸責於區分所有權人之事由所致者，由區分所有權人為之，並負擔其費用。但規約另有規定者，從其規定", "共用部分之重大修繕，應依區分所有權人會議之決議為之。其費用，由公共基金支付或由區分所有權人按其共有之應有部分比例分擔"], "R14201", "共用部分的修繕由管理負責人或管理委員會為之；因可歸責於區分所有權人或住戶之事由所致者，「費用」由該區分所有權人或住戶負擔（第 10 條），不是由其自行修繕。", "", ""], ["C", "按公寓大廈之共有部分為區分所有人所分別共有。下列關於共有部分之使用、收益及處分權能之說明，何者與公寓大廈管理條例之規定不符？", ["各區分所有權人按其共有之應有部分比例，對建築物之共用部分有使用收益之權。但另有約定者從其約定", "共用部分得約定供特定區分所有權人使用。但有違法令使用限制之規定者，不得約定專用", "共用部分之應有部分應隨同專有部分一併移轉或設定負擔。但另有約定者從其約定", "共用部分之拆除，應依區分所有權人會議之決議為之"], "R14201", "專有部分不得與其所屬共用部分應有部分及基地權利分離而為移轉或設定負擔（第 4 條），沒有「另有約定者從其約定」的例外。", "", ""], ["B", "某老舊公寓社區因近來地震頻繁嚴重毀損，有危害公共安全之虞。經召開臨時區分所有權人會議，在符合公寓大廈管理條例第30 條及第31 條規定下，決議同意重建。惟甲自始即反對重建，於臨時會議時，亦投下反對票。依公寓大廈管理條例之規定，應如何處理？", ["因未經全體區分所有權人之同意，該公寓社區不得進行重建", "管理負責人或管理委員會得訴請法院命甲出讓其區分所有權及其基地所有權應有部分", "管理負責人或管理委員會得訴請法院將甲強制遷離", "管理負責人或管理委員會得請求主管機關為必要之處置"], "R14201", "依第 13 條決議重建後，不同意者經訴請法院判決，得命其出讓區分所有權及基地應有部分（第 14 條）。", "", ""], ["A", "依公寓大廈管理條例規定，起造人於符合下列何種情形後三個月內，應召集區分所有權人召開區分所有權人會議，成立管理委員會或推選管理負責人，並向直轄市、縣（市）主管機關報備？", ["公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計半數以上", "公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計三分之二以上", "公寓大廈建築物所有權登記之區分所有權人達三分之二以上及其區分所有權比例合計半數以上", "公寓大廈建築物所有權登記之區分所有權人達三分之二以上及其區分所有權比例合計三分之二以上"], "R14201", "區分所有權人登記達半數以上及其區分所有權比例合計半數以上時，起造人應於 3 個月內召集區分所有權人會議成立管委會（第 28 條）。", "", ""], ["A", "內政部公告之「預售屋買賣定型化契約應記載及不得記載事項」及「不動產說明書應記載或不得記載事項（預售屋部分）」，均要求預售屋之買賣須具備履約擔保制度。試問：由建商或起造人將建案土地及興建資金信託予某金融機構或經政府許可之信託業者執行履約管理。興建資金應依工程進度專款專用。簽定預售屋買賣契約時，賣方應提供上開信託之證明文件或影本予買方。此係屬何種履約擔保？", ["不動產開發信託", "價金返還保證", "價金信託", "同業連帶擔保"], "R14102", "由建商或起造人將建案土地及興建資金信託予金融機構或信託業者執行履約管理，稱「不動產開發信託」。", "", ""], ["C", "甲建商於預售屋銷售廣告單中表示：「現場簽約，贈送德國進口高級廚衛設備」。首次購屋者乙於建商接待中心看完樣品屋後，隨即與銷售人員丙簽定預售屋買賣契約書。惟交屋時，始發現建商所贈送者，係國產中等品質設備，與廣告內容不符。就此案例，下列敘述，何者正確？", ["廣告係要約引誘，對甲並不具拘束力", "廣告內容若未經甲、乙合意成為個別磋商條款，並訂入預售屋買賣契約中，對甲不生效力", "廣告內容即為契約內容，於契約成立後，甲應確實履行", "甲得以廣告內容係媒體經營者所為，未註記其公司名稱，主張免除履約責任"], "R14301", "企業經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容（消保法第 22 條），廣告即視為契約內容。", "", ""], ["B", "下列關於公平交易法之敘述，何者錯誤？", ["維護消費者利益為本法立法目的之一", "依照著作權法、商標法、專利法或其他智慧財產權法規行使權利之行為，不適用本法之規定", "事業關於競爭之行為，優先適用本法之規定。但其他法律另有規定且不牴觸本法立法意旨者，不在此限", "本法規定事項，涉及其他部會之職掌者，由主管機關商同各該部會辦理之"], "R14401", "依智慧財產權法規「行使權利之正當行為」才不適用公平交易法（第 45 條），選項漏了「正當」。", "", ""], ["B", "不動產開發業者或不動產經紀業者銷售預售屋時，其所為之下列何種行為，並不構成 公平交易法第25 條 「其他足以影響交易秩序之欺罔或顯失公平之行為」？", ["在向買方收取斡旋金前，未以書面告知買方得選擇支付斡旋金或採用內政部版「要約書」", "向買方收取斡旋金後，因未能締結預售屋買賣契約，而拒絕返還", "要求購屋人須給付定金或一定費用始提供預售屋買賣契約書攜回審閱", "締結預售屋買賣契約後，要求繳回契約書"], "R14401", "依公平會規範，收取斡旋金前未告知可選擇要約書、要求先付費才提供契約審閱、簽約後要求繳回契約書，都屬第 25 條顯失公平。未成立買賣而斡旋金應否返還，屬契約關係問題，官方答案認定不構成第 25 條。", "", ""], ["D", "不動產業者因炒作房地產所涉及之不實廣告、不當銷售行為，下列何者非屬內政部主管法規所及，應由公平交易委員會依公平交易法相關規定辦理？", ["散布不實成交價格、市場成交行情、銷售量，影響不動產交易價格", "違規潛銷預售屋（未領得建造執照即廣告銷售）", "利用人頭排隊、假客戶付訂金、簽訂虛假購屋預約單或不動產買賣契約書等與他人通謀或為虛偽交易，營造不動產交易活絡之表象", "對服務品質、企業形象、行銷策略等內容之廣告，有虛偽不實或引人錯誤者"], "R14401", "散布不實成交行情、違規潛銷預售屋、人頭排隊炒作等，屬內政部平均地權條例管轄；對服務品質、企業形象、行銷策略的不實廣告，仍由公平會依公平交易法處理。", "", ""], ["A", "事業申報結合，經公平交易委員會禁止其結合而仍為結合者，公平交易委員會除得處新臺幣二十萬元以上五千萬元以下罰鍰外，並得為一定之處分。下列何者不包括在內？", ["停止營業", "限期令分設事業", "處分全部或部分股份", "轉讓部分營業"], "R14401", "違法結合者，公平會得禁止結合、限期令分設事業、處分股份、轉讓部分營業、免除擔任職務或為其他必要處分（第 39 條）；不包括停止營業。", "", ""], ["A", "公平交易法原則禁止事業為聯合行為，但有益於整體經濟與公共利益，經申請主管機關許可者，不在此限。不動產經紀業者相互間之何種聯合行為應予以禁止，不在得申請公平交易委員會許可之列？", ["共同劃分經營區域、共同劃分交易對象", "為降低成本、改良品質或增進效率，而統一服務之規格或型式", "為促進事業合理經營，而分別作專業發展", "為促進產業發展、技術創新或經營效率所必要之共同行為"], "R14401", "可申請許可的聯合行為類型限於統一規格、共同研發、專業分工、輸出輸入、不景氣、中小企業、產業發展等（第 15 條）；共同劃分區域、交易對象不在其內。", "", ""], ["C", "有關不動產經紀業廣告，下列敘述何者正確？", ["經紀業於臉書社群網路平台刊登不動產銷售廣告，僅註明加盟於知名連鎖不動產經紀業「○○不動產」並使用其服務標章", "主打買地送屋，實際卻沒有房屋處分權", "廣告及相關銷售文宣註明不動產經紀業名稱", "廣告使用未經明確定義之「使用面積」、「受益面積」、「銷售面積」等名詞"], "R14102", "經紀業刊登的廣告及銷售文宣，應註明經紀業名稱（第 21 條），加盟店須註明自己的名稱，不能只寫加盟品牌。", "", ""], ["B", "下列何者不違反 公平交易法第21 條 廣告不實？", ["不動產代銷業者於售屋網站公告35 米泳池，而該泳池設置處於竣工圖為景觀水池", "不動產代銷業者於售屋廣告，標示近捷運站", "不動產代銷業者於售屋廣告，對於使用分區為乙種工業區之建案使用一般住宅之用語及圖示說明", "不動產代銷業者於銷售屬科技工業區之建案時，使用可供住家使用之傢俱配置參考圖"], "R14401", "如果實際上確實靠近捷運站，就不構成虛偽不實或引人錯誤。其餘把景觀水池稱泳池、工業區建案用住宅用語，都是不實廣告。", "", ""], ["A", "甲透過仲介公司看房，對某一間公寓頗為滿意，想請父母看房再決定，仲介公司業務員請他先付10 萬元斡旋，可保留優先購買之權利，於是甲支付10 萬元，並簽訂「不動產購買意願書」，下列何者錯誤？", ["仲介業者如提出斡旋金要求，應主動告知消費者亦可選擇採用內政部所訂定之要約書，並需支付斡旋費用", "斡旋金是當消費者中意某房屋，欲與屋主進行議價時，仲介業常要求消費者支付一定金額，作為斡旋差價之用", "如消費者選擇交付斡旋金，則仲介業者應以書面明定交付斡旋金之目的，明確告知消費者之權利義務", "仲介業者未遵行公平交易委員會對斡旋金規範而有欺罔或顯失公平情事，將違反公平交易法第25 條之規定"], "R14401", "仲介要求斡旋金時，應告知消費者可選擇內政部版要約書，而要約書「不需支付任何費用」；選項說要約書也要付斡旋費用，錯。", "", ""], ["D", "不動產經紀業違反不動產經紀業管理條例相關規定時，下列何種情形，直轄市、縣（市）主管機關應先令其限期改正，屆期未改正，始處一定金額之罰鍰？", ["設立之營業處所未置經紀人", "僱用未具備經紀人員資格者從事仲介或代銷業務", "收取差價或其他報酬", "未將其仲介或代銷相關證照及許可文件連同經紀人證書揭示於營業處所明顯之處"], "R14101", "未將證照、許可文件及經紀人證書揭示於營業處所明顯處，主管機關應先令限期改正，屆期未改正才處罰鍰（第 29 條）。", "", ""], ["B", "不動產經紀業者告知消費者「今天不簽約就沒機會」、「不簽約就不能看契約」、並在契約中記載「已確實攜回本契約書審閱5 日以上無誤或是已詳閱並充分瞭解本契約書及附件內容，無須5 日以上審閱期，本約簽訂後，確認即生契約效力無誤」，請問此定型化契約條款效力為何？", ["有效", "無效", "效力未定", "部分有效，部分無效"], "R14301", "企業經營者以定型化契約條款使消費者拋棄合理審閱期間者，該條款無效（消保法第 11-1 條）。", "", ""], ["A", "預售屋買賣定型化契約應記載及不得記載事項規定，接通自來水、電力之管線費及其相關費用（例如安裝配置設計費、施工費、道路開挖費、復原費及施工人員薪資等）應由誰負擔？", ["賣方", "買方", "買賣雙方平均分配", "買賣雙方議定"], "R14301", "接通自來水、電力之管線費及相關費用由賣方負擔（預售屋應記載事項）。", "", ""], ["D", "下列何者不是定型化契約條款推定顯失公平之情形？", ["違反平等互惠原則者", "條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者", "契約之主要權利或義務，因受條款之限制，致契約之目的難以達成者", "定型化契約中之定型化契約條款牴觸個別磋商條款之約定者"], "R14301", "推定顯失公平：違反平等互惠、與排除之任意規定立法意旨顯相矛盾、主要權利義務受限制致目的難以達成（消保法第 12 條）。定型化條款牴觸個別磋商條款，是「牴觸部分無效」（第 15 條），不是推定顯失公平。", "", ""], ["C", "1 樓露台屬於全體住戶共有，為了有效利用露台空間，住戶間常會將露台給該特定住戶使用，此露台稱為？", ["專有部分", "共用部分", "約定專用部分", "約定共用部分"], "R14201", "共用部分經規約約定供特定區分所有權人使用者，稱「約定專用部分」（第 3 條）。", "", ""], ["A", "大樓規約約定1 樓露台屬於1 樓甲使用，嗣後3 樓所有權人乙將其房地產權出售並過戶給丙，請問該規約對丙繼受人有無效力？", ["依公寓大廈管理條例第24 條規定，區分所有權之繼受人丙，應於繼受後遵守原區分所有權人依規約所定之一切權利義務事項", "丙未在規約簽章，對其不生效力", "丙不知有該規約約定，對其不生效力", "該規約僅能拘束原區分所有權人乙"], "R14201", "區分所有權之繼受人，應於繼受後遵守原區分所有權人依規約所定之一切權利義務事項（第 24 條）。", "", ""], ["D", "3 樓住戶因浴室漏水，經抓漏後發現是3、4 樓樓地板內之管線自然損壞導致漏水，請問修繕費用由誰負擔？", ["3 樓", "4 樓", "3、4 樓之住戶共同負擔", "3、4 樓之區分所有權人共同負擔"], "R14201", "樓地板內的管線維修費用，由樓地板上下方的「區分所有權人」共同負擔（第 12 條）；但因可歸責於一方者由其負擔。", "", ""], ["B", "依現行公寓大廈管理條例規定，公寓大廈住戶可以飼養動物？", ["原則可以，但社區管委會有權禁止住戶飼養動物", "原則可以，但規約另有禁止飼養之規定時，則依規約約定", "原則禁止，但社區管委會有權開放住戶飼養動物", "原則禁止，但規約有權開放住戶飼養動物"], "R14201", "住戶飼養動物不得妨礙公共衛生、公共安寧及公共安全；法令或規約另有禁止飼養之規定時，從其規定（第 16 條）。", "", ""]]}, {"id": "p112b", "label": "112年・不動產經紀相關法規概要", "year": 112, "subj": "R14", "qs": [["B", "有關不動產經紀業營業保證金之敘述，下列何者錯誤？", ["營業保證金由中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會統一於指定之金融機構設置營業保證基金專戶儲存", "經紀業未依規定繳存營業保證金者，應予停止營業處分，其停止營業期間達一年者，應撤銷其許可", "營業保證金獨立於經紀業及經紀人員之外，除不動產經紀業管理條例另有規定外，不因經紀業或經紀人員之債務債權關係而為讓與、扣押、抵銷或設定負擔", "經紀業申請解散者，得自核准註銷營業之日滿一年後二年內，請求退還原繳存之營業保證金"], "R14101", "經紀業未依規定繳存營業保證金者，應予停止營業處分，停止營業期間達 1 年者，應「廢止」其許可（第 29 條）；不是撤銷。(D) 解散者得自核准註銷營業之日滿 1 年後 2 年內請求退還。", "", ""], ["C", "有關外國人任職不動產經紀業之規定，下列何者正確？", ["外國人得依中華民國法律參加營業員訓練，經內政部許可後得應不動產經紀人考試", "經內政部許可後，始得受僱於經紀業為經紀人員；如為大陸地區人民，尚須經大陸委員會許可", "經內政部或其認可之機構、團體舉辦不動產經紀營業員訓練合格或不動產經紀人考試及格，並向內政部指定之機構、團體登錄及領有不動產經紀營業員證明者，得充任不動產經紀營業員", "外國人經許可在中華民國充任經紀人員者，其有關業務上所為之文件、圖說，可不限以中華民國文字為之"], "R14102", "外國人經營業員訓練合格或經紀人考試及格，並向指定機構登錄、領有證明，即得充任經紀人員；其業務文件、圖說應以中華民國文字為之（第 13、14 條）。", "", ""], ["D", "經營代銷業務者，下列何種文件不適用經紀業指派經紀人簽章規定？", ["不動產說明書", "不動產廣告稿", "不動產租賃、買賣契約書", "不動產出租、出售委託契約書"], "R14102", "代銷業務不適用：出租出售委託契約書、承租承購要約書（第 22 條第 1 項但書）。", "", ""], ["C", "有關不動產說明書之敘述，下列何者正確？", ["不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，不動產說明書應由經紀業指派經紀營業員簽章", "經紀人員應以不動產說明書向與委託人交易之相對人解說。提供解說前，應經委託人交易之相對人簽章", "雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人", "不動產說明書應記載及不得記載事項，由所在地主管機關定之"], "R14102", "簽約時，經紀人應將不動產說明書交付相對人，並由「相對人」在說明書上簽章（第 24 條）。(A) 應由「經紀人」簽章；(B) 解說前應經「委託人」簽章；(D) 由中央主管機關定之。", "", ""], ["B", "根據不動產經紀業管理條例第24 條之1 之現行規定，下列何者正確？", ["中華民國一百零九年十二月三十日修正之條文施行前，提供查詢之申報登錄資訊，於修正施行後，維持以區段化、去識別化方式，提供查詢", "中華民國一百零九年十二月三十日修正之條文施行前，提供查詢之申報登錄資訊，於修正施行後，應依同條第三項規定，除涉及個人資料外，重新提供查詢", "經營代銷業務，受起造人或建築業委託代銷預售屋者，應於簽訂買賣契約之日起三十日內，將委託代銷契約及買賣契約相關書件報請所在地直轄市、縣（市）主管機關備查", "經營仲介業務者，對於居間或代理成交之租賃案件，應於租賃物交付後，承租人占有中之日起三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊"], "R14101", "109 年修法（實價登錄 2.0）前已提供查詢的資訊，修正施行後應依新法規定，除涉及個人資料外重新提供查詢（第 24-1 條）；即門牌、地號由區段化改為完整揭露。", "", ""], ["A", "不動產經紀業管理條例之「用辭定義」，下列何者正確？", ["不動產︰指土地、土地定著物或房屋及其可移轉之權利", "成屋︰指領有建造執照之建築物", "經紀人員︰經紀營業員之職務為執行仲介或代銷業務", "營業處所︰指經紀業經營仲介或代銷業務之店面、辦公室或常態之非固定場所"], "R14101", "「不動產」指土地、土地定著物或房屋及其可移轉之權利（第 4 條）。成屋是領有「使用執照」或實施建管前完成之建物；營業處所是店面、辦公室或「非常態之固定場所」。", "", ""], ["D", "依據不動產經紀業管理條例之規定，直轄市、縣（市）同業公會關於會員入會、停權、退會情形應如何處理？", ["報請所在地主管機關核定", "報請所在地主管機關備查", "報請所在地主管機關層轉中央主管機關核定", "報請所在地主管機關層轉中央主管機關備查"], "R14101", "同業公會關於會員入會、停權、退會情形，應報請所在地主管機關層轉中央主管機關備查（第 35 條）。", "", ""], ["A", "有關公寓大廈周圍上下、外牆面設置防墜設施之規定，下列何者錯誤？", ["須公寓大廈有十二歲以下兒童或六十歲以上老人之住戶", "須於外牆開口部或陽臺設置", "防墜設施須不妨礙逃生且不突出外牆面", "防墜設施設置後，設置理由消失且不符公寓大廈管理條例之限制者，區分所有權人應予改善或回復原狀"], "R14201", "現行法已刪除「有 12 歲以下兒童或 65 歲以上老人」的要件：外牆開口部或陽臺得設置不妨礙逃生且不突出外牆面之防墜設施（第 8 條）。", "", ""], ["B", "依公寓大廈管理條例之規定，有關公寓大廈管理委員會職務之敘述，下列何者正確？", ["住戶大會決議事項之執行", "住戶違規情事之制止及相關資料之提供", "共有及共用部分之清潔、維護、重大修繕及改良", "住戶共同事務應興革事項之決定與管理"], "R14201", "管委會職務包括：區權會決議事項之執行、共用部分清潔維護修繕及「一般」改良、住戶違規之制止及相關資料之提供、興革事項之「建議」等（第 36 條）。重大修繕由區權會決議。", "", ""], ["B", "有關公寓大廈公共基金之設置，下列何者錯誤？", ["起造人就公寓大廈領得使用執照一年內之管理維護事項，應按工程造價一定比例或金額提列", "起造人於該公寓大廈使用執照申請時，應提出繳交公庫代收之證明；於公寓大廈召開區分所有權人會議時，由公庫代為撥付", "公共基金應設專戶儲存，並由管理負責人或管理委員會負責管理", "公共基金經區分所有權人會議決議交付信託者，其運用應依區分所有權人會議之決議為之"], "R14201", "起造人提列的公共基金，於成立管委會或推選管理負責人並完成報備後，才由公庫代為撥付（第 18 條），不是召開區權會時。", "", ""], ["C", "依公寓大廈管理條例規定，有關起造人責任之敘述，下列何者錯誤？", ["就公寓大廈領得使用執照一年內之管理維護事項，起造人應按工程造價一定比例或金額提列公共基金", "公寓大廈之起造人，非經領得建造執照，不得辦理銷售", "公寓大廈之起造人於申請建造執照時，應檢附專有部分、共用部分、約定專用部分、約定共用部分標示之詳細圖說及規約", "起造人應將公寓大廈共用部分、約定共用部分與其附屬設施設備等，確認其功能正常無誤後，移交管理委員會或管理負責人"], "R14201", "起造人申請建造執照時，應檢附詳細圖說及「規約草約」（第 56 條）；依官方答案，(C) 與條文文字不符。", "", ""], ["B", "關於公寓大廈住戶之權利義務，下列何者正確？", ["區分所有權人除法律另有限制外，對其共有部分，得自由使用、收益、處分，並排除他人干涉", "區分所有權人對專有部分之利用，不得有妨害建築物之正常使用及違反區分所有權人共同利益之行為", "專有部分不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉，但設定負擔則可分別為之", "於住戶因維護、修繕專有部分、約定專用部分或設置管線，必須進入或使用他住戶專有部分或約定專用部分時，應經管理負責人或管理委員會之同意後方得為之"], "R14201", "區分所有權人對專有部分之利用，不得有妨害建築物正常使用及違反共同利益之行為（第 5 條）。(C) 專有部分與共用部分應有部分不得分離移轉或設定負擔，沒有但書。", "", ""], ["D", "關於公寓大廈管理維護公司之執業，下列何者正確？", ["應經直轄市、縣（市）政府許可及辦理公司登記，並向直轄市、縣（市）政府申領登記證後，始得執業", "應經直轄市、縣（市）政府許可及辦理公司登記，並向中央主管機關申領登記證後，始得執業", "應經中央主管機關許可及辦理公司登記，並向直轄市、縣（市）政府申領登記證後，始得執業", "應經中央主管機關許可及辦理公司登記，並向中央主管機關申領登記證後，始得執業"], "R14201", "公寓大廈管理維護公司應經「中央主管機關」許可、辦理公司登記，並向「中央主管機關」申領登記證後始得執業（第 42 條）。", "", ""], ["A", "採加盟經營方式之不動產經紀業者如以不正當限制加盟店服務報酬標準，作為成立或持續加盟經營關係之條件，而有限制競爭之虞者，屬於下列何種違反公平交易法之情事？", ["以不正當限制交易相對人之事業活動為條件，而與其交易之行為", "相互約束事業活動之行為，而足以影響生產、商品交易或服務供需之市場功能，構成公平交易法之聯合行為", "以脅迫、利誘或其他不正當方法，使他事業不為價格之競爭、參與結合、聯合或為垂直限制競爭之行為", "以損害特定事業為目的，促使他事業對該特定事業斷絕供給、購買或其他交易之行為"], "R14401", "加盟業者以不正當限制加盟店服務報酬為加盟條件，屬第 20 條第 5 款「以不正當限制交易相對人之事業活動為條件而與其交易」。", "", ""], ["B", "下列何者應以公平交易法之規定處理？", ["不動產經紀業加盟店，未於廣告、市招及名片等明顯處，標明加盟店或加盟經營字樣者", "不動產經紀業者對於涉及事業服務品質、企業形象、行銷策略等內容之廣告，有虛偽不實或引人錯誤者", "不動產經紀業者與委託人簽訂委託契約後，刊登之廣告及銷售內容與事實不符者", "不動產經紀業者未依成屋買賣定型化契約書應記載及不得記載事項製作契約書者"], "R14401", "對服務品質、企業形象、行銷策略的不實廣告，由公平會依公平交易法處理；簽約後廣告內容與事實不符、加盟店未標明加盟字樣等，由內政部依經紀業管理條例處理。", "", ""], ["D", "下列何者屬於限制競爭之行為，事業不得為之？", ["以著名之他人姓名、商號或公司名稱於同一或類似之商品，為相同或近似之使用，致與他人商品混淆", "事業為競爭之目的，而陳述或散布足以損害他人營業信譽之不實情事", "事業以不當提供贈品、贈獎之方法，爭取交易之機會", "無正當理由，對他事業給予差別待遇之行為"], "R14401", "無正當理由對他事業給予差別待遇，屬限制競爭行為（第 20 條）。仿冒、損害他人信譽、不當贈品贈獎，屬「不公平競爭」。", "", ""], ["D", "關於聯合行為，下列何者正確？", ["事業不得為聯合行為。但為降低成本、改良品質或增進效率，而統一商品或服務之規格或型式，有益於個別經濟與股東利益，經申請主管機關許可者，不在此限", "許可應附期限，其期限不得逾三年", "事業對於主管機關就其聯合行為之許可及其有關之條件、負擔、期限，應主動公開", "聯合行為經許可後，因經濟情況變更者，主管機關得廢止該許可"], "R14401", "聯合行為許可後，因許可事由消滅、經濟情況變更或事業逾越許可範圍，主管機關得廢止許可（第 16 條）。(A) 要有益於「整體經濟與公共利益」；(B) 期限不得逾 5 年；(C) 是主管機關應主動公開。", "", ""], ["B", "主管機關對於事業涉有違反公平交易法規定之行為進行調查時，下列何者正確？", ["事業承諾在主管機關所定期限內，採取具體措施停止並改正涉有違法之行為者，主管機關得終止調查", "主管機關作成中止調查之決定係基於事業提供不完整或不真實之資訊，應恢復調查", "裁處權時效自終止調查之日起，停止進行", "主管機關恢復調查者，裁處權時效自恢復調查之翌日起，重新起算"], "R14401", "事業承諾改正時主管機關得「中止」調查；中止決定係基於事業提供不完整或不真實資訊者，應恢復調查（第 28 條）。中止期間裁處權時效停止進行，恢復調查後與停止前經過期間合併計算。", "", ""], ["D", "關於事業以不當提供贈品、贈獎之方法，爭取交易之機會，下列何者正確？", ["構成獨占地位之濫用", "構成事業之結合", "構成限制轉售價格", "構成不公平競爭"], "R14401", "事業不得以不當提供贈品、贈獎之方法爭取交易機會（第 23 條），屬「不公平競爭」。", "", ""], ["C", "有關消費資訊之規範，依消費者保護法規定，下列何者錯誤？", ["企業經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容", "企業經營者之商品或服務廣告內容，於契約成立後，應確實履行", "媒體經營者刊登或報導廣告之內容與事實不符者，就消費者因信賴該廣告所受之損害與企業經營者負連帶責任", "輸入之商品或服務，應附中文標示及說明書，其內容不得較原產地之標示及說明書簡略"], "R14301", "媒體經營者須「明知或可得而知」廣告內容與事實不符，才與企業經營者負連帶責任（消保法第 23 條）。", "", ""], ["B", "依消費者保護法規定，有關定型化契約應記載或不得記載事項之規定，下列何者正確？", ["應公告後報請行政院備查", "中央主管機關為預防消費糾紛，保護消費者權益，促進定型化契約之公平化，得選擇特定行業擬訂之", "違反公告之定型化契約，其定型化契約條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容", "中央主管機關公告應記載之事項，雖未記載於定型化契約，經消費者主張，仍構成契約之內容"], "R14301", "中央主管機關為預防消費糾紛，得選擇特定行業擬訂定型化契約應記載或不得記載事項，報請行政院核定後公告（消保法第 17 條）。(C) 違反者條款「無效」；(D) 應記載事項未記載仍構成契約內容，不須消費者主張。", "", ""], ["B", "消費者保護團體依消費者保護法提起消費者損害賠償訴訟之要件，下列何者正確？", ["消費者保護團體許可設立三年以上", "消費者保護團體申請行政院評定優良者", "得委任律師代理訴訟", "消費者保護團體不得向消費者請求報酬，但得請求預付或償還必要費用"], "R14301", "消保團體提起團體訴訟要件：許可設立 2 年以上、置有消費者保護專門人員、且經「行政院」評定優良者（消保法第 49 條），且應委任律師代理訴訟。", "", ""], ["A", "依消費者保護法之規定，關於小額消費爭議，當事人之一方無正當理由，不於調解期日到場者，下列何者錯誤？", ["調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，此方案應經參與調解委員過半數之同意", "該解決方案之送達，不適用公示送達規定", "當事人對該解決方案，得於送達後十日之不變期間內，提出異議；未於異議期間內提出異議者，視為已依該解決方案成立調解", "當事人於異議期間提出異議，經調解委員另定調解期日，無正當理由不到場者，視為依該解決方案成立調解"], "R14301", "小額消費爭議一造不到場時，調解委員提出的解決方案，應經「全體」調解委員過半數之同意（消保法第 45-4 條），不是參與委員過半數。", "", ""], ["C", "關於輸入商品或服務之企業經營者，下列何者錯誤？", ["視為該商品之設計、生產、製造者或服務之提供者", "於提供商品流通進入市場，或提供服務時，應確保該商品或服務，符合當時科技或專業水準可合理期待之安全性", "消費者保護團體主張企業經營者不符合當時科技或專業水準可合理期待之安全性者，就其事實應負舉證責任", "企業經營者違反相關規定，致生損害於消費者或第三人時，應負連帶賠償責任"], "R14301", "企業經營者主張其商品於流通時符合當時科技或專業水準可合理期待之安全性者，就其主張之事實負舉證責任（消保法第 7-1 條），舉證責任在企業經營者，不在消保團體。", "", ""], ["C", "關於消費者保護團體，下列何者正確？", ["消費者保護團體以社團法人、財團法人或行政法人為限", "消費者保護團體之任務為監督消費者保護主管機關及指揮消費者保護官行使職權", "消費者保護團體從事商品或服務檢驗，發表檢驗結果而有錯誤時，應使相關企業經營者有澄清之機會", "消費者保護團體為商品或服務之調查、檢驗時，請求政府予以協助時，政府不應允許"], "R14301", "消保團體從事商品或服務檢驗，發表結果有錯誤時，應使相關企業經營者有澄清之機會（消保法第 30 條）。(A) 以社團法人或財團法人為限；(D) 政府應予協助。", "", ""]]}, {"id": "p111b", "label": "111年・不動產經紀相關法規概要", "year": 111, "subj": "R14", "qs": [["D", "依不動產經紀業管理條例規定，不動產經紀業得請求退還原繳存之營業保證金之情形，不包含那一項？", ["公司組織申請解散者", "商號組織申請歇業者", "營業項目經變更登記後，該公司或商號已無不動產仲介經紀業及不動產代銷經紀業而組織仍存續者", "退出所在地或鄰近直轄市或縣（市）仲介經紀業同業公會"], "R14101", "得請求退還營業保證金的情形：公司解散、商號歇業、變更營業項目後已無不動產經紀業務而組織仍存續（第 9 條）。退出同業公會不在其中。", "", ""], ["C", "不動產經紀業管理條例對不動產經紀人員之規定，下列敘述何者正確？", ["經不動產經紀人考試及格者，應具備半年以上經紀營業員經驗，始得向直轄市或縣（市）政府請領經紀人證書", "經紀人證書有效期限為三年", "經紀營業員訓練不得少於三十個小時", "未具備經紀人員資格者，於簽訂專任約後，經紀業得僱用其從事仲介或代銷業務"], "R14102", "經紀營業員訓練不得少於 30 小時（第 13 條）。(A) 經紀人考試及格應有「1 年」以上營業員經驗才能請領證書；(B) 證書有效期限 4 年；(D) 不得僱用未具資格者。", "", ""], ["A", "依不動產經紀業管理條例之規定，經營仲介業務者應揭示於營業處所明顯之處的文件，不包含那一項？", ["不動產經紀人員之經歷與獲獎資料", "不動產經紀人證書", "報酬標準及收取方式", "仲介相關證照及許可文件"], "R14101", "應揭示於營業處所明顯處的：仲介或代銷相關證照及許可文件、經紀人證書、報酬標準及收取方式（第 18 條）。經歷與獲獎資料不需要。", "", ""], ["B", "依不動產經紀業管理條例之規定，雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由何人在不動產說明書上簽章？", ["不動產經紀人", "相對人", "地政士", "公司代表人"], "R14102", "簽約時經紀人應將不動產說明書交付相對人，並由「相對人」在說明書上簽章（第 24 條）。", "", ""], ["C", "依不動產經紀業管理條例關於獎懲之規定，下列敘述何者錯誤？", ["非經紀業而經營仲介或代銷業務者，主管機關應禁止其營業，並處公司負責人、商號負責人或行為人罰鍰", "經紀業開始營業後自行停止營業連續六個月以上者，直轄市或縣（市）主管機關得廢止其許可", "中央主管機關對於經紀人員獎懲事項，應設置獎懲委員會處理之", "依本條例所處罰鍰，經通知繳納而逾期不繳納者，移送法院強制執行"], "R14102", "經紀人員獎懲事項由「直轄市、縣（市）主管機關」設置不動產經紀人員獎懲委員會處理（第 33 條），不是中央。", "", ""], ["A", "依公平交易法之規定，下列定義何者錯誤？", ["競爭指一以上事業在市場上以較有利之價格、數量、品質、服務或其他條件，爭取交易機會之行為", "相關市場指事業就一定之商品或服務，從事競爭之區域或範圍", "交易相對人指與事業進行或成立交易之供給者或需求者", "事業所組成之同業公會視為本法所稱事業"], "R14401", "競爭是指「二以上」事業在市場上以較有利條件爭取交易機會之行為（公平交易法第 4 條）。", "", ""], ["B", "公平交易法關於結合之規定，下列敘述何者錯誤？", ["直接或間接控制他事業之業務經營或人事任免屬於結合之一種", "事業因結合而使其市場占有率達四分之一應先向主管機關提出申報", "對於事業結合之申報，如其結合，對整體經濟利益大於限制競爭之不利益者，主管機關不得禁止其結合", "主管機關就事業結合之申報，得徵詢外界意見，必要時得委請學術研究機構提供產業經濟分析意見"], "R14401", "結合申報門檻：結合後市占率達「三分之一」、參與結合之一事業市占率達四分之一、或銷售金額超過主管機關公告金額（第 11 條）。", "", ""], ["C", "甲建商為廣告主，委託乙廣告代理業製作廣告，請來丙明星擔任廣告薦證者，在丁廣告媒體業之電子媒體刊登引人錯誤之廣告，下列敘述何者錯誤？", ["乙廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與甲建商負連帶損害賠償責任", "甲建商不得在商品或廣告上，或以其他使公眾得知之方法，對於與商品相關而足以影響交易決定之事項，為虛偽不實或引人錯誤之表示或表徵", "丙明星明知或可得而知其所從事之薦證有引人錯誤之虞，而仍為薦證者，與乙廣告代理業負連帶損害賠償責任", "丁廣告媒體業在明知或可得而知其所傳播或刊載之廣告有引人錯誤之虞，仍予傳播或刊載，與甲建商負連帶損害賠償責任"], "R14401", "明知或可得而知仍為薦證者，是與「廣告主」（甲建商）負連帶損害賠償責任（第 21 條），不是與廣告代理業。", "", ""], ["D", "主管機關收到對於涉有違反公平交易法規定之檢舉，而發動調查得進行之程序敘述，何者錯誤？", ["通知當事人及關係人到場陳述意見", "通知當事人及關係人提出帳冊、文件及其他必要之資料或證物", "派員前往當事人及關係人之事務所、營業所或其他場所為必要之調查", "因被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償"], "R14401", "酌定損害額以上之賠償是民事損害賠償（第 31 條），由法院依被害人請求決定，不是主管機關的調查程序。調查程序包括通知到場陳述、提出帳冊文件、派員實地調查（第 27 條）。", "", ""], ["A", "當事人對主管機關依公平交易法所為之處分或決定不服者，應如何處理？", ["直接適用行政訴訟程序", "依訴願法提起訴願", "對主管機關提出民事訴訟", "直接適用國家賠償程序"], "R14401", "不服公平會的處分或決定，直接適用行政訴訟程序（第 48 條），免經訴願。", "", ""], ["C", "企業經營者未經邀約而與消費者在其住居所、工作場所、公共場所或其他場所所訂立之契約，依消費者保護法之規定，屬於下列何者之定義？", ["通訊交易", "定型化契約", "訪問交易", "個別磋商契約"], "R14301", "企業經營者未經邀約，在消費者住居所、工作場所、公共場所等地訂立之契約，是「訪問交易」（消保法第 2 條）。", "", ""], ["D", "甲建商與乙消費者訂立預售屋定型化契約前，並沒有給合理期間供乙審閱全部條款內容，依消費者保護法之規定，乙可以如何主張權利？", ["要求甲建商回收該批商品或停止其服務", "主張甲建商應負損害賠償責任", "主張除去其危害", "主張其條款不構成契約之內容。但乙得主張該條款仍構成契約之內容"], "R14301", "未提供合理審閱期間者，其條款不構成契約之內容；但消費者得主張該條款仍構成契約之內容（消保法第 11-1 條第 3 項）。", "", ""], ["D", "中央主管機關得擬訂特定行業定型化契約應記載或不得記載事項。下列應記載或不得記載事項之敘述何者錯誤？", ["中央主管機關公告應記載之事項，雖未記載於定型化契約，仍構成契約之內容", "違反中央主管機關公告之定型化契約應記載或不得記載事項之定型化契約，其定型化契約條款無效", "企業經營者使用定型化契約者，主管機關得隨時派員查核", "不得記載事項得包括預付型交易之履約擔保"], "R14301", "預付型交易之履約擔保屬「應記載」事項，不是不得記載事項（消保法第 17 條）。", "", ""], ["B", "企業經營者與消費者簽訂定型化之分期付款買賣契約，依消費者保護法規定，該契約書應載明之事項不包含下列那一項？", ["頭期款", "企業經營者保留契約內容或期限之變更權或解釋權", "各期價款與其他附加費用合計之總價款與現金交易價格之差額", "利率"], "R14301", "分期付款買賣契約應載明頭期款、各期價款與附加費用合計之總價款與現金交易價格之差額、利率（消保法第 21 條）。企業經營者保留變更權或解釋權是「不得記載」事項。", "", ""], ["C", "企業經營者對於消費者之申訴，依消費者保護法規定，應於申訴之日起，至多幾日內妥適處理之？", ["七日", "十日", "十五日", "三十日"], "R14301", "企業經營者應於申訴之日起 15 日內妥適處理（消保法第 43 條）。", "", ""], ["A", "企業經營者在提供契約條款供他人參考時，下列那一種表示內容不會屬於定型化契約條款之一部分？", ["以書面傳真提供給單一個別客戶之優惠條款內容", "以電視字幕放映提供之廣告字幕", "以書面產品型錄提供之內容", "以網際網路提供之廣告資訊"], "R14301", "定型化契約條款不限書面，以放映字幕、張貼、牌示、網際網路等方法表示者亦屬之（消保法第 2 條）；但針對單一個別客戶個別磋商的內容，不是定型化條款。", "", ""], ["D", "依公寓大廈管理條例之規定，下列之定義何者正確？", ["約定專用部分：指公寓大廈專有部分經約定供共同使用者", "管理負責人：指由區分所有權人會議決議執行建築物管理維護事務之公寓大廈管理服務人員或管理維護公司", "專有部分：指數人區分一建築物而各有其專有部分，並就其共用部分按其應有部分有所有權", "公寓大廈：指構造上或使用上或在建築執照設計圖樣標有明確界線，得區分為數部分之建築物及其基地"], "R14201", "公寓大廈：指構造上或使用上或在建築執照設計圖樣標有明確界線，得區分為數部分之建築物及其基地（第 3 條）。(A) 描述的是「約定共用部分」；(B) 管理負責人是未成立管委會時推選的住戶。", "", ""], ["C", "公寓大廈共用部分不得獨立使用供做專有部分。依公寓大廈管理條例之規定，其為特定情形者，並不得為約定專用部分。下列情形非屬前述之特定情形？", ["公寓大廈本身所占之地面", "公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造", "其他有固定使用方法，並屬區分所有權人生活利用上不可或缺之專用部分", "連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄"], "R14201", "不得約定專用的共用部分：建物本身所占地面、連通走廊樓梯通路、巷道防火巷、基礎樑柱承重牆樓地板屋頂、其他有固定使用方法且為區分所有權人生活利用上不可或缺之「共用部分」（第 7 條）。選項寫成「專用部分」，錯。", "", ""], ["B", "依公寓大廈管理條例之規定，區分所有權人或住戶積欠應繳納之公共基金或應分擔或其他應負擔之費用，至少逾多少期或達相當金額，經定相當期間催告仍不給付者，管理負責人或管理委員會得訴請法院命其給付應繳之金額及遲延利息？", ["一期", "二期", "三期", "六期"], "R14201", "積欠公共基金或應分擔費用已逾「二期」或達相當金額，經定期催告仍不給付者，管委會得訴請法院命其給付（第 21 條）。", "", ""], ["D", "規約除應載明專有部分及共用部分範圍外，有特定之情形，非經載明於規約者，不生效力。下列敘述何者非屬之？", ["違反義務之處理方式", "禁止住戶飼養動物之特別約定", "財務運作之監督規定", "他住戶因維護、修繕專有部分，必須進入或使用其專有部分或約定專用部分時，不得拒絕"], "R14201", "非經載明於規約不生效力的事項包括：約定專用與共用範圍、違反義務之處理方式、禁止飼養動物之特別約定、財務運作之監督規定等（第 23 條）。(D) 住戶不得拒絕他住戶進入修繕，是法律直接規定（第 6 條），不需規約。", "", ""], ["C", "下列有關定型化契約條款敘述中那幾項是正確的？①企業經營者在定型化契約中所用之定型化契約條款如有疑義時，條款內容應本公平之解釋，不應偏向企業經營者或消費者 ②企業經營者在與消費者訂立定型化契約前，須至少提供三十日以內之合理審閱期間，供消費者審閱全部條款內容 ③企業經營者以定型化契約條款訂定之使消費者拋棄合理審閱期間之條款為有效條款 ④定型化契約中之主要權利或義務條款，因受條款之限制，致契約之目的難以達成者顯失公平，故為無效", ["②③", "①③", "②④", "①②④"], "R14301", "疑義應為「有利於消費者」之解釋，① 錯；拋棄審閱期的條款無效，③ 錯。② 審閱期 30 日以內合理期間、④ 契約目的難以達成者顯失公平而無效，正確。", "", ""], ["B", "依 消費者保護法第17 條 之規定，定型化契約應記載事項，依契約之性質及目的，其內容不包括下列那一項？", ["預付型交易之履約擔保", "企業經營者之義務或責任之免除", "契約之終止權", "違反契約之法律效果"], "R14301", "應記載事項包括重要權利義務、違約法律效果、預付型交易履約擔保、解除權終止權及其效果等（消保法第 17 條）。「企業經營者義務或責任之免除」屬不得記載事項。", "", ""], ["C", "如果有一交易違反公平交易法，下列有關於行使損害賠償之敘述何者正確？", ["自此一交易日起二年不行使請求權，請求權時效消滅", "被害人不論何時得知損害，自得知之日起逾二年不行使請求權，請求權時效消滅", "自此一交易日起逾十年，請求權時效消滅", "被害人自此一交易日起，其請求權之行使沒有時效限制"], "R14401", "違反公平交易法的損害賠償請求權，自請求權人知有行為及賠償義務人時起 2 年間不行使而消滅；自為行為時起逾 10 年者亦同（第 32 條）。", "", ""], ["B", "對經紀人違反不動產經紀業管理條例規定之懲戒，下列何者正確？", ["經紀人員違反規定收取差價或其他報酬，應予申誡", "經紀人員在執行業務過程中，未以不動產說明書向與委託人交易之相對人解說，應予申誡", "經紀人員無故洩漏對於因業務知悉或持有之他人秘密，應予六個月以上三年以下之停止執行業務處分", "經紀人員受申誡處分三次者，應廢止其經紀人員證書或證明"], "R14102", "未以不動產說明書向相對人解說，應予申誡（第 31 條、第 23 條）。(A) 收取差價是停止執行業務 6 個月～3 年；(C) 洩漏秘密是申誡；(D) 申誡 3 次視為停止執行業務 6 個月。", "", ""], ["D", "經紀業尚未與委託人簽訂委託契約書便刊登廣告及銷售時，依規定由直轄市、縣（市）主管機關處多少罰鍰？", ["新臺幣六千元以上三萬元以下罰鍰", "新臺幣一萬元以上五萬元以下罰鍰", "新臺幣三萬元以上十五萬元以下罰鍰", "新臺幣六萬元以上三十萬元以下罰鍰"], "R14102", "經紀業未與委託人簽訂委託契約書即刊登廣告及銷售，處新臺幣 6 萬元以上 30 萬元以下罰鍰（第 29 條）。", "", ""]]}, {"id": "p110b", "label": "110年・不動產經紀相關法規概要", "year": 110, "subj": "R14", "qs": [["D", "依據公寓大廈管理條例有關起造人之規定，下列敘述何者錯誤？", ["公寓大廈建築物之起造人有召集第1 次區分所有權人會議之義務", "公寓大廈建築物起造人要領得建造執照，始可辦理公寓大廈銷售", "公寓大廈建築物起造人負有移交共用部分等之義務及移交期限", "公寓大廈建築物之起造人於申請使用執照時，應檢附規約草約"], "R14201", "起造人應於申請「建造執照」時檢附規約草約（第 56 條），不是使用執照時。", "", ""], ["D", "住戶違反公寓大廈管理條例第9 條第2 項關於公寓大廈變更使用限制規定，以下敘述何者錯誤？", ["直轄市、縣（市）主管機關得令住戶限期改善；屆期不改善者，得連續處罰之", "住戶經制止而不遵從者，由直轄市、縣（市）主管機關處4 萬元以上20 萬元以下罰鍰", "管理委員會應予制止，並得按其性質請求各該主管機關為必要之處置。如有損害並得請求損害賠償", "由管理委員會促請住戶改善，住戶於3 個月內仍未改善者，由管理委員會決議訴請法院強制其遷離"], "R14201", "違反第 9 條第 2 項變更使用限制，由管委會制止並報請主管機關處理，住戶不從者處 4～20 萬元罰鍰（第 49 條）。強制出讓是違反規約情節重大等情形，且須依「區分所有權人會議決議」訴請法院（第 22 條）。", "", ""], ["B", "依據公寓大廈管理條例規定，下列敘述何者正確？", ["在住戶互相協議同意之下，住戶在樓梯間即得放置雜物", "未經申請主管建築機關之核准，住戶為修繕時不得破壞建築物之主要構造", "住戶對於退縮空地，不得依規約或區分所有權人會議決議供營業使用", "依規約或區分所有權人會議決議，住戶即可在公共走道加設鐵門"], "R14201", "住戶未經主管建築機關核准，不得破壞或變更建築物之主要構造。(A) 樓梯間不得堆置雜物；(C) 退縮空地在核准範圍內得依規約或區權會決議供營業使用；(D) 共同走廊不得設置門扇。", "", ""], ["C", "有關公寓大廈區分所有權人會議決議之特別生效要件，下列何者正確？", ["無線電台基地台等類似強波發射設備，設置於屋頂者，應經頂層住戶同意；設置其他樓層者，應經該樓層住戶同意", "約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經區分所有權人會議決議者，不在此限", "專有部分經依區分所有權人會議約定為約定共用部分者，應經該專有部分區分所有權人同意", "共用部分經依區分所有權人會議約定為約定專用部分者，應經該專有部分區分所有權人同意"], "R14201", "專有部分經區權會約定為約定共用部分者，應經該專有部分區分所有權人同意（第 33 條）。(A) 基地台須頂層或該樓層「區分所有權人」同意，不是住戶。", "", ""], ["B", "下列何者不是公寓大廈管理委員會之職務？", ["管理服務人之委任、僱傭及監督", "共用部分、約定專用部分及其附屬設施設備之點收及保管", "公寓大廈發生重大事故有及時處理之必要，請求召開區分所有權人臨時會議", "住戶違規情事之制止及相關資料之提供"], "R14201", "管委會負責點收及保管的是「共用部分、約定共用部分」及其附屬設施設備（第 36 條），不包括約定專用部分。", "", ""], ["B", "公寓大廈之區分所有權人因違反規約情節重大者，管理委員會如何要求區分所有權人出讓其區分所有權及其基地所有權應有部分？", ["依管理委員會議之決議訴請法院命其強制出讓", "依區分所有權人會議之決議訴請法院命其強制出讓", "依管理委員會議之決議報請直轄市、縣（市）政府強制執行", "依區分所有權人會議之決議報請直轄市、縣（市）政府強制執行"], "R14201", "違反規約情節重大經促請改善仍未改善者，管委會得依「區分所有權人會議之決議」訴請法院命其出讓（第 22 條）。", "", ""], ["D", "公寓大廈公共基金之來源及運用、管理方式，下列何者正確？", ["起造人就公寓大廈領得建造執照一年內之管理維護事項，應按工程造價一定比例或金額提列為公共基金", "區分所有權人依管理委員會決議繳納公共基金", "公共基金經區分所有權人會議決議交付信託者，由管理委員會主任委員交付信託", "公共基金應設專戶儲存，並由管理負責人或管理委員會負責管理"], "R14201", "公共基金應設專戶儲存，由管理負責人或管理委員會負責管理（第 18 條）。(A) 是領得「使用執照」一年內的管理維護事項；(B) 依區權會決議繳納。", "", ""], ["A", "依不動產經紀業管理條例規定，對經營仲介業務者申報登錄資訊之敘述，下列何者錯誤？", ["經營仲介業務者對於仲介成交買賣案件之申報登錄案件，應於簽訂買賣契約書並辦竣所有權移轉登記後三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊", "經營仲介業務者對於經手所成交之租賃案件，應於簽訂租賃契約書之日起三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊", "直轄市、縣（市）主管機關為查核經營仲介業務者申報登錄資訊，得向經營仲介業者要求查詢、取閱有關文件或提出說明", "直轄市、縣（市）主管機關為查核經營仲介業務者申報登錄資訊，得委任所屬機關辦理"], "R14101", "實價登錄 2.0（110.7.1）後，買賣案件改由買賣雙方於申請移轉登記時一併申報，仲介業者不再於移轉登記後 30 日內申報；租賃案件仍由仲介於簽訂租約後 30 日內申報。", "", ""], ["D", "依不動產經紀業管理條例規定，有關不動產經紀營業員之敘述，下列何者正確？", ["經中央主管機關或其認可之機構、團體舉辦不動產經紀營業員訓練合格者，即得充任不動產經紀營業員", "領有不動產經紀人考試及格證書者，即得充任不動產經紀營業員", "取得不動產經紀營業員資格訓練不得少於二十個小時，其證明有效期限為四年", "不動產經紀營業員證明因受破產之宣告尚未復權而被撤銷者，於原因消滅後，得重新請領證明"], "R14102", "營業員證明因受破產宣告尚未復權而被撤銷者，於原因消滅後得重新請領（第 6 條）。(A)(B) 都還要向指定機構登錄並領有營業員證明；(C) 訓練不得少於 30 小時。", "", ""], ["C", "依不動產經紀業管理條例規定，經營代銷業務的公司甲，若有申報登錄價格、交易面積資訊不實之情形，直轄市、縣（市）主管機關得為何種處分？", ["令公司甲限期改正並處新臺幣一萬元以上五萬元以下罰鍰", "令公司甲限期改正；屆期未改正，處新臺幣六千元以上三萬元以下罰鍰", "按公司甲申報之戶（棟）處新臺幣三萬元以上十五萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰", "按違規情形，停止公司甲之營業處分或併科新臺幣三萬元以上十五萬元以下罰鍰"], "R14101", "代銷業者申報登錄價格、交易面積資訊不實，按戶（棟）處 3 萬元以上 15 萬元以下罰鍰，並令限期改正，屆期未改正按次處罰（第 29 條）。", "", ""], ["B", "有關不動產經紀人請領或換發、補發證書之相關規定，下列敘述何者正確？", ["不動產經紀人考試及格後，並領取其考試及格證書，即得請領不動產經紀人證書", "不動產經紀人辦理換發證書時，應於證書有效期限屆滿前六個月內申辦之", "不動產經紀人換發之證書，其有效期限自原證書有效期限屆滿之日起算四年", "不動產經紀人證書滅失、申請補發者，應敘明其滅失之原因，向中央機關申請之"], "R14102", "經紀人換證應於證書有效期限屆滿前 6 個月內申辦。(A) 還需具 1 年以上營業員經驗；(D) 補發向直轄市、縣（市）政府申請。", "", ""], ["B", "甲要委託A 房仲介公司不動產經紀營業員乙銷售自己的一戶房子。依不動產經紀業管理條例，下列敘述何者正確？", ["甲與乙一定要先口頭定約定委託銷售之事宜", "甲與A 房仲介公司必須簽訂委託銷售契約書", "乙刊登廣告及銷售內容，應與事實大致相符", "乙刊登銷售房子廣告要註明營業員乙的名稱"], "R14102", "經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售（第 21 條）；契約是委託人與「經紀業」簽，廣告要註明「經紀業名稱」，內容應與事實相符。", "", ""], ["D", "不動產經紀業者與委託人簽訂委託契約後，刊登之廣告及銷售內容與事實不符者，應由何機關依法處理？", ["由直轄市、縣（市）政府依公平交易法處理", "由行政院依消費者保護法處理", "由行政院公平交易委員會依公平交易法處理", "由內政部依不動產經紀業管理條例處理"], "R14102", "簽約後刊登的廣告及銷售內容與事實不符，由內政部（地方主管機關）依不動產經紀業管理條例處理。", "", ""], ["A", "消費爭議調解委員會於不違反消費爭議兩造當事人之主要意思範圍內，依職權所提出解決事件之方案，當事人得於該方案送達後幾日內，提出異議，就視為調解不成立？", ["10 日", "15 日", "20 日", "30 日"], "R14301", "當事人得於調解方案送達後 10 日之不變期間內提出異議；異議者視為調解不成立（消保法第 45-2 條）。", "", ""], ["A", "依消費者保護法規定，下列有關消費者保護團體提起團體訴訟之敘述，何者錯誤？", ["消費者保護團體許可設立二年以上，置有消費者保護專門人員，且申請內政部評定優良者，得以自己之名義提起訴訟", "消費者保護團體依規定提起訴訟者，應委任律師代理訴訟", "消費者保護團體對於同一之原因事件，致使眾多消費者受害時，得受讓二十人以上消費者損害賠償請求權後，以自己名義，提起訴訟", "消費者保護團體得以自己之名義，提起第50 條消費者損害賠償訴訟或第53 條不作為訴訟"], "R14301", "消保團體團體訴訟要件：許可設立 2 年以上、置有消保專門人員，且申請「行政院」評定優良者（第 49 條），不是內政部。", "", ""], ["C", "依消費者保護法規定，下列有關通訊交易或訪問交易之消費者解除契約之敘述，何者正確？", ["消費者得於收受商品或接受服務後十日內，以退回商品或書面通知方式解除契約，無須說明理由及負擔任何費用", "訪問交易有合理例外情事者，不適用消費者保護法之猶豫期間及解約權規定", "消費者依規定以書面通知解除契約者，除當事人另有個別磋商外，企業經營者應於收到通知之次日起十五日內，至原交付處所或約定處所取回商品", "企業經營者應於取回商品、收到消費者退回商品或解除服務契約通知之日起十五日內，返還消費者已支付之對價"], "R14301", "以書面通知解除契約者，企業經營者應於收到通知之次日起 15 日內至原交付處所或約定處所取回商品（消保法第 19-1 條）。(A) 猶豫期是 7 日。", "", ""], ["C", "定型化契約中之定型化契約條款於下列何種情形下，其條款不構成契約之內容，但消費者得主張該條款仍構成契約之內容？", ["定型化契約條款違反誠信原則，對消費者顯失公平", "定型化契約條款牴觸個別磋商條款之約定", "企業經營者與消費者訂立定型化契約前，未依法提供合理期間，供消費者審閱全部條款內容", "企業經營者以定型化契約條款使消費者拋棄契約審閱權利"], "R14301", "未提供合理審閱期間者，條款不構成契約內容，但消費者得主張仍構成契約內容（第 11-1 條）。(D) 使消費者拋棄審閱權的條款是「無效」。", "", ""], ["A", "依消費者保護法規定，各類企業經營者對消費者應負之損害賠償責任，下列敘述何者錯誤？", ["輸入商品或服務之企業經營者，視為該商品之設計、生產、製造者或服務之提供者，負製造者責任。但其對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限", "從事經銷之企業經營者，就商品或服務所生之損害，與設計、生產、製造商品或提供服務之企業經營者連帶負賠償責任。但其對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限", "從事設計、生產、製造商品或提供服務之企業經營者，違反消費者保護法規定致生損害於消費者或第三人時，應負連帶賠償責任。但企業經營者能證明其無過失者，法院得減輕其賠償責任", "從事經銷之企業經營者，改裝、分裝商品或變更服務內容者，違反消費者保護法規定致生損害於消費者或第三人時，應負連帶賠償責任。但企業經營者能證明其無過失者，法院得減輕其賠償責任"], "R14301", "輸入業者視為設計、生產、製造者，負製造者責任（消保法第 9 條），沒有「已盡相當注意可免責」的但書；該但書是經銷商（第 8 條）的規定。", "", ""], ["D", "依消費者保護法規定，關於小額消費爭議之調解，當事人之一方無正當理由，不於調解期日到場之處理方式為何？", ["調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。前項方案，應經參與調解委員過半數之同意", "調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。前項方案，應經全體調解委員過半數之同意", "調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，並送達於當事人。前項方案，應經參與調解委員過半數之同意", "調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，並送達於當事人。前項方案，應經全體調解委員過半數之同意"], "R14301", "小額消費爭議一造不到場，調解委員依到場一造請求或依職權提出解決方案並送達，方案應經「全體」調解委員過半數之同意（第 45-4 條）。", "", ""], ["C", "下列何者屬於公平交易法之適用範圍？", ["依照著作權法、商標法、專利法或其他智慧財產權法規行使權利之正當行為", "不動產仲介業與不動產買方有關斡旋金返還之糾紛處理", "不動產開發業者銷售預售屋時要求購屋人須給付定金始提供預售屋買賣契約書攜回審閱之情形", "不動產經紀業加盟店未於廣告中標明加盟店或加盟經營字樣之處理"], "R14401", "要求購屋人給付定金才提供契約書攜回審閱，屬公平交易法第 25 條顯失公平行為。(A) 智財權正當行使不適用；(B) 斡旋金返還糾紛屬民事；(D) 加盟店標示屬經紀業管理條例。", "", ""], ["A", "下列有關公平交易法對於事業聯合行為規定之敘述，何者錯誤？", ["主管機關對事業聯合行為原則上是採限制原則", "主管機關對事業聯合行為有益於整體經濟與公共利益時得例外許可", "主管機關對事業聯合行為之許可事項得附加條件", "主管機關對事業聯合行為許可事項及其有關之條件、負擔、期限，應主動公開"], "R14401", "公平交易法對聯合行為採「原則禁止、例外許可」（第 15 條），不是限制原則。", "", ""], ["B", "不動產經紀業者倘與具競爭關係之事業，以契約、協議共同決定服務之價格、交易對象、交易地區等相互約束事業活動之行為，而足以影響服務供需之市場功能者，將構成公平交易法之何種行為？", ["不公平競爭", "聯合行為", "欺罔或顯失公平", "違法結合"], "R14401", "與競爭事業以契約、協議共同決定價格、交易對象、交易地區等相互約束事業活動，足以影響市場功能，構成「聯合行為」（第 14 條）。", "", ""], ["B", "經營代銷業務者，依不動產經紀業管理條例之規定，應指派不動產經紀人簽章之文件，下列何者錯誤？", ["不動產廣告稿", "不動產出租、出售委託契約書", "不動產租賃、買賣契約書", "不動產說明書"], "R14102", "代銷業務不適用出租出售委託契約書及承租承購要約書的簽章規定（第 22 條）。", "", ""], ["C", "有關 公平交易法第22 條 對於事業仿冒行為要件之規定，下列敘述何者錯誤？", ["所使用之名稱或表徵必須達到著名之程度", "相同或近似之名稱或表徵必須使用於同一或類似的服務", "公司名稱或營業服務表徵限於依法取得註冊商標權者", "必須產生與他人提供之服務設施或活動混淆的結果"], "R14401", "公平交易法第 22 條保護的是「著名」而未依法註冊的名稱或表徵；已註冊商標者適用商標法，不適用本條。", "", ""], ["B", "依公平交易法規定，廣告相關業者與廣告主之間對於不實廣告應負之損害賠償責任，下列何者錯誤？", ["專業人士或機構之廣告薦證者明知或可得而知其所從事之薦證有引人錯誤之虞，而仍為薦證者，與廣告主負連帶損害賠償責任", "非屬知名公眾人物之廣告薦證者不知情其所從事之薦證有引人錯誤之虞，仍為薦證者，僅於受廣告主報酬十倍之範圍內，與廣告主負連帶損害賠償責任", "廣告媒體業在明知或可得而知其所傳播或刊載之廣告有引人錯誤之虞，仍予傳播或刊載，與廣告主負連帶損害賠償責任", "廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與廣告主負連帶損害賠償責任"], "R14401", "非知名公眾人物、專業人士或機構的薦證者，須「明知或可得而知」有引人錯誤之虞仍為薦證，才僅於受廣告主報酬 10 倍範圍內負連帶責任（第 21 條）；不知情者不負責。", "", ""]]}];
const ESSAYS=[{"year": 114, "subj": "R11", "qs": [{"pts": 25, "q": "甲為某公寓五樓住戶，該公寓之屋頂平台係屬全體十戶區分所有權人按其應有部分共有。甲於 20 多年前在屋頂平台上增建一處鋼構加蓋房屋，自用作倉庫與晾衣之用。歷年來其他區分所有權人均未對此提出異議。乙於 2 年前購得該公寓的四樓房屋後，發現該屋頂平台被甲占用，遂主張系爭增建物妨礙其共有物使用，請求甲拆除該增建物並返還占用部分予全體共有人。甲則抗辯稱：其占用屋頂平台已逾 20 年，其他共有人均未反對，已成立默示分管契約，而該分管契約對後來的買受人乙也有拘束力，故乙不得請求拆除或返還。試問，誰的主張有理由？（25 分）", "o": "爭點：默示分管契約是否成立、是否拘束受讓人乙。①共有物之管理（分管）依民法第 820 條須多數決；長期未異議不當然成立默示分管，須有足以推知同意之舉動（實務認單純沉默不足）。②縱成立，依第 826-1 條，分管契約未登記者，僅對「知悉或可得而知」之受讓人有效；乙購屋時能否得知屋頂增建（現況顯而易見→可得而知）。③頂樓平台屬共用部分，依公寓大廈管理條例第 7 條不得約定專用的範圍（屋頂構造）、第 8、16 條使用限制。④若無分管，乙可依第 821 條為全體利益請求拆除返還；已登記不動產返還請求權不罹時效。結論依論證取捨。"}, {"pts": 25, "q": "甲為 A 地之所有人。甲因資金需求，向乙借款新臺幣 500 萬元，並以 A 地設定抵押權予乙。其後，甲又就 A 地設定地上權予丙，以供丙在上建築房屋。再後，甲將 A 地所有權讓與其子丁，並完成移轉登記。試問：依物權之一般效力，乙、丙、丁三人間之法律關係為何？並說明各物權之優先順序及其效力範圍。（25 分）", "o": "爭點：同一不動產上抵押權、地上權、所有權移轉的優先與效力。①物權優先效力：成立在先者優先（乙抵押權先於丙地上權）；所有權讓與不影響已存在之他物權（追及效力），丁取得的是有負擔的所有權（第 867 條抵押物讓與不影響抵押權）。②抵押權設定後設定地上權，若影響抵押權實行，法院得除去地上權後拍賣（第 866 條）；地上權人丙在地上所建房屋，乙得聲請併付拍賣但對房屋價金無優先受償權（第 877 條）。③丙地上權對丁仍有效，丁應容忍丙使用；地租由丁收取。④效力範圍：抵押權及於土地、從物、從權利；地上權及於建築使用範圍。"}]}, {"year": 113, "subj": "R11", "qs": [{"pts": 25, "q": "甲於民國 112 年 2 月 23 日經由不動產經紀人員居間，以新臺幣 1,098 萬元向乙購買某建物二樓 A 屋，並簽立不動產買賣契約書。乙於簽約當時告知甲臥室原有滲漏水已修復，並保證 A 屋並無任何間隙裂痕情形，水、電管線亦均已更新等。詎料，同年 5 月底樓下鄰居通知甲其地板及浴室龜裂、漏水，已影響該鄰居住處天花板，雙方會同水電師傅勘查 A 屋，發現漏水原因為廚房排水管年久失修堵塞導致積水，進而造成全屋積水並滲漏至樓下一樓建物內。試問：甲能否對乙主張花費之修繕費用共計 30 萬元，以及終日憂心建物修繕情形之精神損害賠償 2 萬元？法律上依據為何？（25 分）", "o": "爭點：買賣物之瑕疵擔保與不完全給付、精神損害。①乙保證無裂痕且管線已更新→保證品質，依民法第 360 條買受人得請求不履行之損害賠償（修繕費 30 萬）；另可主張解除或減價（第 359 條），注意第 356、365 條通知與 6 個月／5 年期間。②亦可主張不完全給付（第 227 條），請求修繕費用。③精神損害：第 227-1 條準用第 195 條，限於人格權受侵害且情節重大；單純憂心財產修繕通常不構成人格權侵害，請求 2 萬元難獲支持。④結論：30 萬可請求，2 萬原則不可。"}, {"pts": 25, "q": "甲乙簽訂一般委託銷售契約書，甲委託乙出售其所有之 A 廠房土地，委託契約之報酬為委託銷售總價 2%，同日乙即媒介甲與丙公司簽立不動產買賣意向書，丙交付 100 萬元支票為定金，由乙保管作為嗣後丙履約時價金之一部或違約時之賠償；三週後，甲與丙公司以總價 7500 萬元簽訂不動產買賣契約書，惟丙公司並未依約給付第一期款，亦未開設履約專戶，甲丙簽訂和解契約，乙未得甲同意逕將作為定金之 100 萬支票退還給丙公司。試問：甲乙之法律關係為何？乙得否向甲主張服務報酬？（25 分）", "o": "爭點：委託銷售契約性質、受託人擅退定金的責任與報酬請求權。①一般委託銷售契約屬居間（第 565 條）兼具委任性質（代收定金屬委任事務）。②報酬：居間人於契約因其媒介而成立時得請求報酬（第 568 條），甲丙買賣契約已成立，原則可請求 2%（7500 萬×2%＝150 萬）；後續甲丙和解解除不影響已發生之報酬請求權（實務見解）。③但乙未經甲同意擅自退還定金，違反委任人指示（第 535、544 條）應負損害賠償；違反忠實義務者依第 571 條不得請求報酬。④不動產經紀業管理條例第 26 條經紀業與經紀人員連帶賠償。結論依是否構成違反忠實義務論斷。"}]}, {"year": 112, "subj": "R11", "qs": [{"pts": 25, "q": "甲與 A 公司簽訂靈骨塔買賣契約，約定甲享有其中四層樓之某塔位，A 公司並交付該樓層塔位之永久使用權狀予甲，A 公司所有之靈骨塔大樓嗣後因強制執行被 B 公司買得。試問甲對 B 公司主張其所購買之塔位有永久使用權存在，是否有理由？請附具理由說明。（25 分）", "o": "爭點：塔位永久使用權的性質及對拍定人 B 之效力。①物權法定主義（第 757 條），「永久使用權」非法律所定物權，屬債權（使用借貸或租賃性質之約定）。②債權僅具相對性，原則不得對抗第三人；強制執行拍定人 B 依第 759 條取得所有權，不受 A 與甲之債權約定拘束。③能否類推第 425 條買賣不破租賃？租賃須有租金且限定期間，永久使用權非典型租賃，強制執行亦非讓與，實務多否定。④結論：甲主張無理由，只能向 A 請求債務不履行損害賠償。"}, {"pts": 25, "q": "A 仲介公司受買方甲之委託媒介甲購買乙所有之土地，雙方簽訂居間契約，約定「於甲乙間土地買賣契約成立後，甲應依約給付 A 公司新臺幣一千萬的服務費」。後來甲與乙在 A 公司之媒合下簽訂土地買賣契約，甲於是給付 A 公司一千萬元。然嗣後甲乙間對於土地分區使用有所爭執，因而甲乙合意解除該買賣契約。甲因此對 A 公司主張，請求 A 公司返還所支付之一千萬服務費，是否有理？請附具理由說明之。（25 分）", "o": "爭點：買賣契約解除後居間報酬是否應返還。①居間人報酬於契約「因媒介而成立」時發生（第 568 條），契約成立即完成居間義務。②甲乙事後因分區使用爭執合意解除，係成立後之事由，不影響已發生之報酬請求權，A 受領報酬有法律上原因，無不當得利（第 179 條）。③例外：若契約因居間人違反據實報告義務（第 567 條）或忠實義務而成立或解除，依第 571 條不得請求報酬，甲可請求返還；若分區問題 A 依不動產說明書應告知而未告知，則有責任。④結論：原則無理由，視 A 有無違反報告義務而定。"}]}, {"year": 111, "subj": "R11", "qs": [{"pts": 25, "q": "甲出國進修期間將其名下 A 屋委託好友乙打掃照看，但乙卻未經甲同意，私自以自己名義將 A 屋出租給不知情的丙並按月收取租金一萬元，租期五年。三年後甲學成歸國，發現此事非常生氣，主張丙無權占有 A 屋，向丙請求返還 A 屋，並要求丙支付占有使用 A 屋三年之租金 36 萬元作為補償。丙認為自己是合法承租 A 屋且已按時向乙支付租金，斷然拒絕甲之請求。請問丙之主張是否有理由？（25 分）", "o": "爭點：出租他人之物的效力、真正所有人之返還與不當得利請求。①乙以自己名義出租 A 屋，租賃為債權契約，出租他人之物仍有效，但僅存於乙丙之間。②丙之租賃權不能對抗所有人甲，對甲屬無權占有，甲得依第 767 條請求返還。③不當得利：丙使用 A 屋受有相當於租金之利益，但丙已向乙支付租金，實務認丙對甲仍為無法律上原因受利益；亦有見解主張甲應向乙依不當得利或侵權（第 184 條）、不法管理（第 177 條第 2 項）請求乙交出所收租金 36 萬。④丙因甲取回而不能使用，可向乙主張權利瑕疵擔保或債務不履行。結論：丙之主張無理由。"}, {"pts": 25, "q": "A 地介於 B 地及 C 地中間，甲於其所有之 A 地起造二十層樓高之商辦大樓。大樓進行基礎工程施工期間，僅與 B 地相鄰部分有足夠空間能供工程車迴旋施工，但 B 地所有權人乙認為工程車體巨大影響通行，拒絕工程車停車施工；C 地所有權人丙因久居國外，返國始發現甲起造已進入內部裝潢收尾之大樓有部分建物越過地界至 C 地，丈量後約有 2 平方公尺，丙遂向甲主張拆屋還地。請問甲得如何向乙主張？又甲應如何向丙負責？（25 分）", "o": "爭點：鄰地使用權與越界建築。①對乙：依民法第 792 條，土地所有人因鄰地所有人在其地界或近旁營造或修繕建築物或其他工作物有使用其土地之必要，應許鄰地所有人使用；但受有損害者得請求償金。乙不得拒絕，甲應支付償金。②對丙：依第 796 條，非因故意或重大過失越界，鄰地所有人知越界而不即提出異議者不得請求移去；丙久居國外不知越界，不受此限，原則得請求移去。③但依第 796-1 條，法院得斟酌公共利益及當事人利益，免為全部或一部之移去（越界僅 2 平方公尺、大樓已近完工），甲應支付償金，丙並得請求甲以相當價額購買越界部分土地。"}]}, {"year": 110, "subj": "R11", "qs": [{"pts": 25, "q": "甲與乙共有一筆土地，甲持分 2/3，乙持分為 1/3。乙分別於 99 年 1 月 28 日、99 年 8 月 10 日、99 年 9 月 8 日設定最高限額抵押權與丙、丁、戊等人。嗣後甲與乙於 110 年 3 月 18 日訴請法院分割，兩人並因此取得因分割而形成單獨所有的土地，而上述三筆抵押權按應有部分比例移轉到甲與乙之土地上。甲不服該抵押權移轉到自己分得單獨所有的土地上，遂向法院起訴請求塗銷抵押權登記。請問甲之請求是否有理由？（25 分）", "o": "爭點：共有物分割後應有部分上抵押權之效力（第 824-1 條）。①原則：應有部分有抵押權者，其權利不因共有物分割而受影響，抵押權仍存在於共有物全部之原應有部分上（按比例存在於甲乙分得之土地）。②例外移存於抵押人乙分得部分：權利人同意分割、已參加分割訴訟、經共有人告知訴訟而未參加。③本題若丙丁戊均無上述情形，抵押權依原應有部分比例轉載於甲分得之土地並無不當，甲之請求無理由；但甲可依第 824-1 條第 4 項，就其所受損害對乙有法定抵押權。④若有例外情形，則甲之請求有理由。"}, {"pts": 25, "q": "甲為了避免債主追討以及法院強制執行拍賣其不動產，而與乙通謀虛偽意思表示進行土地買賣。乙因此取得甲所有之 A 地，並且完成移轉登記。乙於 99 年 1 月 28 日死亡、其子女丙與丁於 99 年 2 月 2 日辦妥繼承登記。請問㈠丙丁何時取得 A 地所有權？又嗣後甲向丙與丁請求塗銷登記，返還其所有之土地，請問㈡甲之請求是否有理由？（25 分）", "o": "爭點：通謀虛偽意思表示無效、繼承取得時點、善意第三人保護。①㈠繼承因被繼承人死亡開始（第 1147 條），丙丁於 99 年 1 月 28 日乙死亡時即取得（第 759 條非因法律行為，登記為處分要件）；但乙本即未取得有效所有權，丙丁繼承的是乙之地位。②㈡甲乙買賣及移轉均屬通謀虛偽無效（第 87 條），僅不得對抗善意第三人；丙丁係概括繼承人，非依法律行為取得，不受第 87 條但書及第 759-1 條善意保護。③甲得依第 767 條請求丙丁塗銷登記並返還 A 地。④結論：甲之請求有理由。"}]}, {"year": 114, "subj": "R12", "qs": [{"pts": 25, "q": "何謂實質租金？不動產租金之估計應考慮那些因素？（25 分）", "o": "①定義：實質租金指承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數（技術規則第 2 條）。②租金估計以實質租金為原則（第 130 條）。③應考慮因素（第 131 條）：契約內容、租期長短、使用目的、權利金、押金或保證金、租金調整方式、稅費負擔、附屬設施、承租人與出租人關係、市場租金水準等；續訂租金另考慮原契約租金、經過期間、租金變動趨勢。④方法：新訂租約用比較法、積算法、收益分析法；續訂租約用差額分配法、利率法、推移法、比較法。"}, {"pts": 25, "q": "依據不動產估價技術規則之規定，不動產估價方法之選取原則為何？請說明比較法、收益法及成本法等估價方法的適用時機？（25 分）", "o": "①選取原則（第 14 條）：應兼採二種以上估價方法；情況特殊不能採用者應於報告書敘明；就各方法所得價格綜合比較，顯著差異者重新檢討，再依資料可信度與價格形成因素相近程度決定。②比較法：市場交易活絡、比較標的資料充足時，如住宅、店面、一般土地。③收益法：具收益性之不動產，如辦公大樓、店面出租、商場、證券化標的；投資評估用 DCF。④成本法：新建或交易稀少、可估算成本者，如特殊用途建物、工廠、附著於土地之工事；亦常作驗證方法。⑤土地開發分析法：可建築土地之開發價值。"}]}, {"year": 113, "subj": "R12", "qs": [{"pts": 25, "q": "何謂折現現金流量分析法？又其與直接資本化法有何差異？（25 分）", "o": "①DCF 定義：勘估標的未來折現現金流量分析期間之各期淨收益及期末價值，以適當折現率折現後加總推算收益價格之方法（技術規則第 2、28 條）。公式：P＝Σ CFk/(1+Y)^k ＋ Pn'/(1+Y)^n。②適用：投資評估、證券化、收益不穩定或有變動預期者；期末價值以折現率折現。③差異比較：直接資本化法以未來平均一年期間客觀淨收益除以收益資本化率（P＝a/R）；DCF 考慮多期現金流量與期末處分價值、可反映收益成長與變化；所用率不同（資本化率 vs 折現率）；資料需求與適用標的不同。"}, {"pts": 25, "q": "請說明土地開發分析法之計算公式，又土地開發分析法之成本項目內容為何？（25 分）", "o": "①公式：V＝S÷(1＋R)÷(1＋i)－(C＋M)（技術規則第 70 條）。說明 S 總銷售金額、R 適當利潤率、i 資本利息綜合利率、C 開發或建築所需直接成本、M 間接成本。②資本利息綜合利率＝資本利息年利率×（土地價值比率＋建物價值比率×1/2）×開發年數。③成本項目：直接成本為營造或施工費；間接成本為規劃設計費、廣告費、銷售費、管理費、稅捐及其他負擔。④可附計算例說明；並說明估價程序（勘查、市場調查、開發計畫、估算總銷售、成本、利潤、資本利息、計算價格）。"}]}, {"year": 112, "subj": "R12", "qs": [{"pts": 25, "q": "一棟 12 層大樓的第 10 層擬出售，該樓層在前一年於梯廳位置曾發生過凶殺致死案，請問該事件屬於影響不動產價格因素的那一類？是否會影響該層樓之價格？（25 分）", "o": "①屬「個別因素」：凶殺事件發生於該樓層梯廳，影響的是該標的本身條件（凶宅、心理嫌惡）；若事件影響整棟或社區則亦可論及區域因素。②是否影響價格：會。依外部性原則與市場心理，非自然死亡事件影響買方意願，通常造成價格減損；不動產說明書應揭露（建物於產權持有期間是否曾發生非自然死亡）。③估價處理：比較法做個別因素調整，或以市場萃取、問卷等方法量化減價幅度；梯廳屬共用部分，程度可能較專有部分內發生者輕，並隨時間經過遞減。"}, {"pts": 25, "q": "有一屋齡 10 年的中古住宅，於建物重新建造成本 800 萬元、耐用年數 50 年、殘餘價格率 5%的條件下，依不動產估價技術規則的等速折舊路徑計算，建物的現在價值是多少？另請以專業人士的觀點，分析這個價格的合理性。（25 分）", "o": "①計算：定額法累積折舊＝800×(1－5%)×10/50＝152 萬元；建物現在價值＝800－152＝648 萬元。②合理性分析：(a) 經濟耐用年數 50 年是否反映實際（中古住宅可能考量維護狀況調整）；(b) 等速折舊假設各年耗損相同，實際前期折舊較快，可考慮定率法或觀察法；(c) 殘價率 5% 合理（≤10%）；(d) 應檢視功能性與經濟性折舊、整修情形；(e) 宜與比較法、收益法結果比對，綜合決定。"}]}, {"year": 111, "subj": "R12", "qs": [{"pts": 25, "q": "建物折舊額如何計算？建物累積折舊額又如何計算？請依不動產估價技術規則述說之。（25 分）", "o": "①依技術規則第 65～69 條：建物折舊額計算應以經濟耐用年數為主，必要時得以物理耐用年數計算；得採等速折舊型、初期加速折舊型或初期減速折舊型。②殘餘價格率以不超過 10% 為原則；建物耐用年數終止後確實無殘餘價格者，殘價率為零。③定額法：每年折舊額＝C×(1－s)/N；累積折舊額＝C×(1－s)×n/N。定率法：累積折舊額＝C×[1－(1－d)^n]。償債基金法等。④亦可依實際觀察之物理、功能、經濟折舊調整。"}, {"pts": 25, "q": "何謂重建成本？何謂重置成本？以成本法進行不動產估價時，請說明決定不動產勘估標的價格之程序與所需資料。（25 分）", "o": "①重建成本：使用與勘估標的相同或極類似之建材標準、設計、配置及施工品質，於價格日期重新複製建築所需之成本。重置成本：與勘估標的相同效用之建物，以現代建材標準、設計及配置，於價格日期建築所需之成本。建物估價以重建成本為原則，難以求取者得以重置成本代之。②成本法程序：蒐集資料→現況勘察→調查分析環境發展程度→估算營造施工費→估算規劃設計費、廣告銷售費、管理費、稅捐、資本利息、開發利潤→求取總成本→估算折舊→計算成本價格（房地＝土地總成本＋建物成本價格）。③所需資料：營造單價、物價指數、設計規範、耐用年數、利率、利潤率、土地取得成本等。"}]}, {"year": 110, "subj": "R12", "qs": [{"pts": 25, "q": "不動產市場因為世界各國疫情趨緩開始活絡，不動產買賣不論是新屋、中古屋都出現很特殊的交易案例現象，根據不動產估價技術規則規定，不動產估價時對於比較標的如果無法有效掌握，應不予採用的情況有那些？試說明之。（25 分）", "o": "①依技術規則第 23 條，比較標的有特殊交易情況（急買急賣、親友交易、含其他權利負擔、受迫、債務抵償等）應先作情況調整；情況無法有效掌握及量化調整者，應不予採用。②第 25 條：區域、個別因素或單項調整率大於 15%，或四項總調整率大於 30%，判定差異過大應排除。③第 26 條：試算價格之間差距達 20% 以上者應排除。④疫情後特殊交易：恐慌搶購、價格炒作、人頭交易等應審慎檢討，並於報告書敘明。"}, {"pts": 25, "q": "社會住宅包租代管的政策讓不動產經紀人投入租賃仲介，根據不動產估價技術規則規定，不動產經紀人要如何提供租戶租金估計建議？試敘述分析之。（25 分）", "o": "①依技術規則第 129～133 條：租金估計以實質租金為原則；應考慮契約內容、租期、使用目的、權利金押金、稅費負擔等。②新訂租約：比較法（以租賃實例比較調整）、積算法（價格×期待利率＋必要費用）、收益分析法（淨收益＋必要費用）。③續訂租約：差額分配法、利率法、推移法、比較法。④經紀人實務：蒐集實價登錄租賃資料、考慮社會住宅包租代管補助與市場行情、設備與管理費負擔、押金不得超過 2 個月等規範，提出合理區間並說明依據。"}]}, {"year": 114, "subj": "R13", "qs": [{"pts": 25, "q": "不動產經紀人員對不動產說明書依法負有「解說義務」。試以都市計畫法等法律之規定為例，列舉四項「判別基準」以解說都市計畫地區內「公共設施用地」與「公共設施保留地」兩者間之區別。（25 分）", "o": "判別基準：①依據：公共設施用地是都市計畫劃設供公共設施使用之土地（都市計畫法第 42 條）；公共設施保留地是其中「尚未取得」、留待將來取得者（第 48、50 條）。②權屬：保留地多為私有、未經政府取得；已取得開闢者為公有公共設施用地。③使用限制：保留地不得為妨礙目的之使用，但得繼續原使用、申請臨時建築（第 50、51 條）；已開闢者依設施用途使用。④取得方式與補償：保留地由政府以徵收、區段徵收、市地重劃取得，徵收按毗鄰非保留地平均市價補償；可申請容積移轉、公私地交換（第 50-2 條）。⑤稅賦：保留地未使用且隔離免地價稅、徵收前移轉免土增稅、繼承或配偶直系血親贈與免遺贈稅（第 50-1 條）。"}, {"pts": 25, "q": "甲所有位於 A 縣非都市土地一筆，擬出售予乙。雙方於訂定土地買賣契約之後，甲經他人告知得適用土地稅法第 39 條第 3 項本文規定而免徵土地增值稅，試說明該地所須具備之要件。（25 分）", "o": "依土地稅法第 39 條第 3 項：非都市土地供公共設施使用，尚未被徵收前之移轉，經需用土地人證明者，免徵土地增值稅。要件：①屬非都市土地；②依法完成使用地編定（編定為交通用地、水利用地等公共設施用地）；③經需用土地人開闢完成或依計畫核定供公共設施使用；④尚未被徵收前之移轉；⑤經需用土地人出具證明。但依法得徵收之土地已徵收者另適用徵收免稅。可說明政策目的：保障被劃設公共設施者之權益。"}]}, {"year": 113, "subj": "R13", "qs": [{"pts": 25, "q": "請依平均地權條例規定，試述公辦市地重劃之實施過程中，主管機關應盡公告通知之事項為何？所有權人表達異議之時機與方式？以及主管機關對異議如何處理？（25 分）", "o": "依平均地權條例第 56 條：①公告通知：主管機關應擬定市地重劃計畫書，送經上級主管機關核定後公告，並通知土地所有權人，公告期間 30 日；②異議：重劃區內私有土地所有權人半數以上，而其所有土地面積超過重劃區私有土地總面積半數者，於公告期滿前表示反對時，主管機關應予調處，並參酌反對理由修訂計畫書，重行報請核定後依核定結果辦理，免再公告；③重劃分配結果亦應公告 30 日，所有權人對分配結果有異議者，得於公告期間內以書面提出，主管機關予以查處；不服查處者得提起行政救濟。"}, {"pts": 25, "q": "甲在Ｔ市有一間無人設籍空置不為使用的 A「空屋」，以及一筆 B「空地」租給乙，請問 A 屋房屋稅如何課徵？又何謂「空地」？空地稅如何課徵？若 B 地經Ｔ市政府通知應限期建築使用，甲與乙之租約後續如何處理？請依房屋稅條例暨相關法令、土地稅法及平均地權條例詳述之。（25 分）", "o": "①A 屋：房屋稅以房屋現值為稅基；無人設籍空置，非自住住家用，依房屋稅條例（113.7 起）適用 2%～4.8% 全國歸戶累進稅率（地方政府訂定差別稅率）；若有囤房情形適用較高稅率。②空地定義（平均地權條例第 3 條）：已完成道路、排水及電力設施，於有自來水地區並已完成自來水系統，而仍未依法建築使用；或雖建築使用，而其建築改良物價值不及所占基地申報地價 10%，且經直轄市或縣（市）政府認定應增建、改建或重建之私有及公有非公用建築用地。③空地稅：限期建築使用逾期未建築者，按該宗土地應納地價稅基本稅額加徵 2～5 倍空地稅或照價收買（第 26 條、土地稅法第 21 條）。④租約處理：依第 74 條，出租之土地經限期建築，所有權人應與承租人協議建築；協議不成得終止租約，並依規定補償承租人。"}]}, {"year": 112, "subj": "R13", "qs": [{"pts": 25, "q": "甲所有位於某號都市計畫農業區內土地一筆農地（其上建有一間合法農舍），該農業區多年前因實施都市計畫定期通盤檢討變更而變更為住宅區（但未發布實施），其土地開發方式於日前始經核定採取「先行區段徵收」，甲之農地於此次都市計畫通盤檢討變更時變更為公共設施保留地（道路），其土地登記簿上載有積欠地價稅新臺幣 10 萬元之「禁止處分登記」。甲於獲悉上述資訊後隨即委託 A 仲介公司代為出售其地，乙對該地有承買意願。若你為 A 仲介公司之經紀營業員，依法應以該地之「不動產說明書」向乙為「解說」，請你從該地所涉及地用與地權法規及其影響之觀點，各提出一點以作為解說之重要內容，以利乙作為承買該地與否之重要依據。又上文所述「先行區段徵收」之意涵與目的各為何？又依法你亦有協助甲與乙公平合理地完成該地買賣契約簽約作業之義務，則應如何處理其上「禁止處分登記」？試依法分述之。（25 分）", "o": "①解說內容：地用面—該地已變更為公共設施保留地（道路），使用受都市計畫法第 50、51 條限制，未來將以區段徵收取得，買受人不能自由開發；地權面—土地登記簿有積欠地價稅之禁止處分登記，在塗銷前不得移轉登記。②先行區段徵收：都市計畫變更後，先由政府實施區段徵收（土地徵收條例第 4 條第 2 項），再發布細部計畫；目的在避免細部計畫發布後土地投機、確保公共設施用地取得及開發財源，並使地主以抵價地分享開發利益。③禁止處分登記處理：需由甲繳清欠稅，由稅捐機關囑託塗銷禁止處分登記後，才能辦理移轉；契約中可約定以價金履約保證專戶代繳欠稅、約定塗銷期限與違約責任。"}, {"pts": 25, "q": "按「房屋現值」為課徵房屋稅之稅基，而「房屋標準價格」又為「房屋現值」核計之基礎，則影響「房屋標準價格」之因素為何？有何問題？又若以「非自住住家用」之房屋為例，其徵收房屋稅之稅率為何？直轄市及縣（市）政府對該房屋稅「徵收率」應如何處理？有何問題？請依房屋稅條例等規定分述之。（25 分）", "o": "①影響房屋標準價格因素（房屋稅條例第 11 條）：按各種建造材料所建房屋，區分種類及等級；各類房屋之耐用年數及折舊標準；按房屋所處街道村里之商業交通情形及房屋之供求概況（路段率）。問題：評定偏離市價、多年未重評、地區差異、新舊屋稅負不公。②非自住住家用稅率：113.7.1 起為 2%～4.8%（全國總戶數歸戶），起造人待銷售房屋 2%～3.6%。③地方政府應訂定差別稅率（累進），依房屋所有人持有戶數訂定徵收率，提經同級民意機關通過並報財政部備查；問題：各縣市稅率不一、歸戶認定與資訊勾稽、是否達到抑制囤房之效等。"}]}, {"year": 111, "subj": "R13", "qs": [{"pts": 25, "q": "關於不動產優先購買權，於土地法中設有明文。請舉出其中三項規定，申述其所定優先購買權之行使要件，並說明其法律性質。（25 分）", "o": "①土地法第 34-1 條第 4 項：共有人出賣其應有部分時，他共有人得以同一價格共同或單獨優先承購；性質為債權效力（不得對抗第三人）。②第 104 條：基地出賣時，地上權人、典權人或承租人有依同樣條件優先購買之權；房屋出賣時基地所有權人亦同；接到通知 10 日內不表示視為放棄；出賣人未通知而與第三人訂約者，不得對抗優先購買權人→物權效力。③第 107 條：出租人出賣或出典耕地時，承租人有依同樣條件優先承受之權（準用第 104 條），物權效力。④第 73-1 條：逾期未辦繼承登記土地標售時，繼承人、合法使用人、其他共有人依序有優先購買權。說明行使要件：出賣、同樣條件、通知與期限。"}, {"pts": 25, "q": "試說明不動產交易所得稅、土地增值稅、契稅及房屋稅之課稅標的。（25 分）", "o": "①不動產交易所得稅（房地合一）：105 年 1 月 1 日以後取得之房屋、土地、預售屋及特定股權交易之所得（所得稅法第 4-4 條）。②土地增值稅：已規定地價之土地，於所有權移轉或設定典權時，就土地漲價總數額（移轉現值－原地價－改良費用）課徵（土地稅法第 28 條）。③契稅：不動產之買賣、承典、交換、贈與、分割或因占有而取得所有權者，就其契價課徵；在開徵土地增值稅區域之土地免徵契稅，故實務上以房屋為課稅標的（契稅條例第 2 條）。④房屋稅：附著於土地之各種房屋及有關增加該房屋使用價值之建築物，以房屋現值為稅基（房屋稅條例第 3 條）。"}]}, {"year": 110, "subj": "R13", "qs": [{"pts": 25, "q": "何謂「原地價」？「原地價」在課徵土地增值稅的作用為何？配偶相互贈與之土地，不課徵土地增值稅。但於再移轉依法應課徵土地增值稅時，其「原地價」為何？請依規定說明之。（25 分）", "o": "①原地價定義：規定地價後未經移轉之土地，於所有權移轉或設定典權時，以其規定地價為原地價；規定地價後曾經移轉之土地，以其前次移轉現值為原地價（土地稅法第 31 條）。②作用：土地漲價總數額＝申報移轉現值－原地價（按物價指數調整）－改良土地費用等，原地價是計算漲價總數額的基準。③配偶相互贈與不課徵土增稅（第 28-2 條），於再移轉第三人時，以該土地「第一次」贈與前之原地價或前次移轉現值為原地價，計算漲價總數額課徵（即前手的原地價延續）。"}, {"pts": 25, "q": "外國人在我國取得地權之基本條件與限制為何？請依規定說明之。（25 分）", "o": "①基本條件：平等互惠原則（土地法第 18 條）—依條約或其本國法律，中華民國人民得在該國享受同樣權利者為限。②絕對限制（第 17 條）：林地、漁地、狩獵地、鹽地、礦地、水源地、要塞軍備區域及領域邊境之土地，不得移轉、設定負擔或租賃於外國人。③用途限制（第 19 條）：住宅、營業處所辦公場所商店工廠、教堂、醫院、外僑子弟學校、使領館及公益團體會所、墳場、有助重大建設整體經濟或農牧經營之投資（須先經中央目的事業主管機關同意）。④面積與地點限制：受該管直轄市或縣（市）政府依法所定之限制；取得後應依核定用途使用。⑤程序：向地方政府申請核准；陸港澳人民另適用兩岸條例、港澳條例。"}]}, {"year": 114, "subj": "R14", "qs": [{"pts": 25, "q": "消費者向建商購買預售屋，因銀行核貸之借款金額不足，希望解除買賣契約及返還定金，致與建商發生消費爭議。試依消費者保護法規定說明：消費者就消費爭議如何提起申訴？得否不經申訴，逕行申請調解？消費爭議事件調解成立作成之調解書，經法院核定後，有何效力？（25 分）", "o": "①申訴：消費者與企業經營者因商品或服務發生消費爭議時，得向企業經營者、消費者保護團體或消費者服務中心或其分中心申訴；企業經營者應於申訴之日起 15 日內妥適處理；未獲妥適處理時，得向直轄市、縣（市）政府消費者保護官申訴（消保法第 43 條）。②調解：經申訴未獲妥適處理者，得向直轄市或縣（市）消費爭議調解委員會申請調解（第 44 條）；原則以申訴為前置程序，不得逕行申請調解。③調解書效力：調解成立作成調解書，經法院核定後，與民事確定判決有同一之效力（第 46 條、準用鄉鎮市調解條例）；當事人不得再就該事件起訴，可為執行名義。"}, {"pts": 25, "q": "甲不動產仲介公司經買賣雙方書面同意，同時接受雙方委託媒合土地買賣契約。契約締結後，甲收取買賣雙方之仲介服務費總額超過不動產實際成交價金百分之六；該公司經紀營業員乙並收取仲介服務費以外之其他報酬。試依不動產經紀業管理條例規定說明：甲與乙違反何種業務規範？會受到何種處罰？超收之報酬應如何處理？（25 分）", "o": "①違反規範：甲—仲介服務報酬超過內政部所定報酬標準（買賣雙方合計不得超過成交價 6%），違反第 19 條「經紀業不得收取差價或其他報酬；其經營仲介業務者並應依實際成交價金或租金按中央主管機關規定之報酬標準計收」；雙方委託雖經書面同意（第 24-2 條），仍應遵守報酬上限。乙—經紀人員收取仲介服務費以外之其他報酬，違反第 19 條。②處罰：甲依第 29 條處新臺幣 6 萬～30 萬元罰鍰；乙依第 31 條應予 6 個月以上 3 年以下停止執行業務處分。③超收之報酬：依第 19 條第 2 項，違反者應將差價或超收之佣金退還支付人。"}]}, {"year": 113, "subj": "R14", "qs": [{"pts": 25, "q": "依不動產經紀業管理條例規定，不動產經紀業應於營業處所明顯之處，揭示那些文件？那一文件代銷經紀業不適用之？違反此一規定者，應如何處罰之？（25 分）", "o": "①揭示文件（第 18 條）：仲介或代銷相關證照及許可文件、經紀人證書、報酬標準及收取方式。②代銷經紀業不適用：「報酬標準及收取方式」（代銷依委託契約向起造人收取報酬，不向消費者收取）。③處罰：違反第 18 條者，經直轄市、縣（市）主管機關限期改正，屆期未改正者處新臺幣 3 萬元以上 15 萬元以下罰鍰（第 29 條第 1 項第 4 款）。"}, {"pts": 25, "q": "依公寓大廈管理條例規定，區分所有權人會議之決議，除規約另有規定外，其出席人數、區分所有權比例及同意方式應依該條例規定如何辦理？另區分所有權人會議依前述方式未獲致決議、出席區分所有權人之人數或其區分所有權比例合計未達前述定額者，得如何處理？試分別詳細說明之。（25 分）", "o": "①一般決議（公寓大廈管理條例第 31 條）：除規約另有規定外，應有區分所有權人 2/3 以上及其區分所有權比例合計 2/3 以上出席，以出席人數 3/4 以上及其區分所有權比例占出席人數區分所有權 3/4 以上之同意行之。②重新召集（第 32 條）：未獲致決議或出席未達定額者，召集人得就同一議案重新召集會議；開議應有區分所有權人三人並 1/5 以上及其區分所有權比例合計 1/5 以上出席，以出席人數過半數及其區分所有權比例占出席人數區分所有權合計過半數之同意作成決議。③會議紀錄依第 34 條送達後，區分所有權人得於 7 日內以書面表示反對；書面反對未超過全體區分所有權人及比例合計半數者，決議視為成立；並說明重建、強制出讓等事項之限制。"}]}, {"year": 112, "subj": "R14", "qs": [{"pts": 25, "q": "建商甲在銷售建案時，於廣告文宣文字說明該建案公共設施中含有泳池等設備，並使用某飯店之無邊際泳池圖片，乙受廣告吸引購買該建案其中一戶，但完工交屋時，乙發現只有一個景觀水池，並無廣告中之泳池。請問乙如何主張其權利？請就公平交易法相關規定說明之。（25 分）", "o": "①構成公平交易法第 21 條不實廣告：建商於廣告中對建案公共設施為虛偽不實或引人錯誤之表示（以飯店泳池圖片、宣稱有泳池，實際為景觀水池）。②民事請求：依第 29 條請求除去侵害、防止侵害；依第 30 條請求損害賠償；故意者依第 31 條法院得酌定損害額以上、已證明損害額 3 倍以下之賠償；請求權時效 2 年／10 年（第 32 條）。③廣告代理業、媒體業、薦證者明知或可得而知者負連帶責任（第 21 條）。④另可檢舉由公平會處罰（第 42 條，5 萬～2,500 萬元罰鍰）；並得依消保法第 22 條主張建商對消費者義務不得低於廣告內容（補充）。"}, {"pts": 25, "q": "社區住戶甲以資源回收為業，經常將資源回收物堆放於樓梯間及梯廳，經管理委員會多次要求移置，仍未處理。嗣後，管理委員會再報請環保局罰鍰在案，依舊拒不處理。請問如何將此惡鄰居趕出社區？請依公寓大廈管理條例相關規定說明之。（25 分）", "o": "①管委會先制止：住戶不得於樓梯間、共同走廊等堆置雜物（公寓大廈管理條例第 16 條第 2 項）；管委會應予制止並報請主管機關處理，住戶經制止不遵從者處 4 萬～20 萬元罰鍰（第 49 條），並得連續處罰。②強制出讓（第 22 條）：住戶違反第 16 條等規定，經管委會促請改善，於 3 個月內仍未改善者，管委會得依區分所有權人會議之決議，訴請法院強制其遷離；若為區分所有權人，得訴請法院命其出讓區分所有權及基地應有部分，判決確定後 3 個月內不自行出讓並完成移轉登記者，得聲請法院拍賣。③區分所有權人會議決議依第 31、32 條門檻。"}]}, {"year": 111, "subj": "R14", "qs": [{"pts": 25, "q": "試依不動產經紀業管理條例及其施行細則說明，何謂加盟經營者？經紀業係加盟經營者，應於何處標明加盟經營字樣？經紀業違反規定者，直轄市、縣（市）主管機關如何處罰之？（25 分）", "o": "①加盟經營者（第 4 條）：經紀業之一方以契約約定使用他方所發展之服務、營運方式、商標或服務標章等，並受其規範或監督。②標明處所（施行細則）：經紀業係加盟經營者，應於廣告、市招及名片等明顯處，標明加盟店或加盟經營字樣。③處罰：違反者依第 29 條，由直轄市、縣（市）主管機關限期改正，屆期未改正者處新臺幣 3 萬元以上 15 萬元以下罰鍰（並說明屬內政部主管，非公平交易法）。"}, {"pts": 25, "q": "區分所有權人會議於何種情形時，應召開臨時會議？召集人為何？請依公寓大廈管理條例規定說明之。（25 分）", "o": "①臨時會議（公寓大廈管理條例第 25 條第 2 項）：發生重大事故有及時處理之必要，經管理負責人或管理委員會請求者；經區分所有權人 1/5 以上及其區分所有權比例合計 1/5 以上，以書面載明召集之目的及理由請求召集者。②召集人：由具區分所有權人身分之管理負責人、管理委員會主任委員或管理委員為召集人；管理負責人、主委或管委喪失區分所有權人資格日起，視同解任；無管理負責人或管委會，或無區分所有權人擔任時，由區分所有權人互推一人為召集人；召集人任期依規約，未規定者 1 年。③通知方式：開會前 10 日以書面載明開會內容通知；因重大事故召開臨時會議者，得以公告為之，公告期間不得少於 2 日。"}]}, {"year": 110, "subj": "R14", "qs": [{"pts": 25, "q": "請依不動產經紀業管理條例，110 年 7 月 1 日施行新制，詳述：（25 分） ㈠起造人或建築業委託代銷預售屋者，實價登錄由誰申報？申報時機為何？預售屋買賣案件未依限申報或申報不實，有何罰責？ ㈡經營仲介業務者應實價登錄之案件及申報時機為何？未依限申報或申報不實，有何罰責？", "o": "㈠預售屋：受託代銷者由代銷經紀業於簽訂買賣契約書之日起 30 日內申報登錄（經紀業管理條例第 24-1 條、平均地權條例第 47 條）；未依限申報或價格、面積不實，按戶（棟）處 3 萬～15 萬元罰鍰並限期改正，屆期未改正按次處罰；價格以外資訊不實先限期改正，屆期未改正處 6 千～3 萬元。㈡仲介業務：實價登錄 2.0 起，買賣案件改由買賣雙方於申請所有權移轉登記時一併申報，仲介業者應申報的是「租賃」案件，於簽訂租賃契約書之日起 30 日內申報；未依限申報或不實者，依第 29 條同樣分級處罰。"}, {"pts": 25, "q": "請依據公平交易法規定，論述下列問題：（25 分） ㈠第 2 條所稱事業有那些？ ㈡有建設公司委託地產公司代銷預售屋，在各樓層平面圖、各戶室內外面積、預售屋買賣契約書、房屋售價等相關商品資訊都尚未規劃完成前，就先辦理預售屋限量抽籤選戶禮賓活動，產生人潮擁擠爭相搶購的排隊現象，且當天禮賓活動營造出消費者中籤機不可失、不買可惜的氣氛，抽籤辦法規定只有 1 分鐘的選戶時間，超過時間就讓給下一組客人。請就公平交易法論述建設公司及地產公司有無違法？並說明依據的規定及理由。", "o": "㈠事業（公平交易法第 2 條）：公司、獨資或合夥之工商行號、其他提供商品或服務從事交易之人或團體；同業公會或其他依法設立促進成員利益之團體視為事業。㈡建設公司與代銷公司皆為事業。在重要交易資訊（平面圖、面積、契約書、價格）未提供前即辦理限量抽籤選戶，並限 1 分鐘選戶，使消費者在資訊不足、時間壓迫下作成交易決定，屬利用資訊不對稱之「足以影響交易秩序之顯失公平行為」，違反第 25 條；公平會得依第 42 條限期改正並處 5 萬～2,500 萬元罰鍰。另現行平均地權條例對預售屋炒作、虛偽排隊等亦有規範，可補充。"}]}];
const CHINESE=[["114", "一、〈在疑與不疑之間〉：就胡適「做學問要在不疑處有疑，待人要在有疑處不疑」作詮釋或駁論，舉自身經驗見聞印證或反證，並申述疑信之間的自處之道。二、〈賞心樂事〉：由李漁談蟹、談蓮的生活樂趣出發，寫自己熱愛的事物之美好與獨特感受。各 50 分。"], ["113", "一、由海龜鼻孔卡吸管、各國禁用吸管談起：㈠ 說明環保團體為何主張這件小題必須大作（150 字內，12 分）；㈡ 以〈生活中值得小題大作的事〉為題作文（38 分）。二、由「屏風表演班」創辦人的故事，分析「做好一件事」的意義，再就個人經驗闡述其對人生的意義（50 分）。"], ["112", "一、〈面對弱點〉：先分析狄摩西尼、珀金斯、蒙田三例面對弱點的態度並評論異同，再以自我經驗闡述己見。二、〈我的收藏〉：由姚謙《一個人的收藏》談起，書寫收藏的起源與過程，以及收藏對自己的意義與影響。各 50 分。"], ["111", "一、〈知味的人生〉：由《中庸》「人莫不飲食也，鮮能知味也」，先詮釋為何吃得「知味」不易、粗茶淡飯為何可能勝過山珍海味，再抒發體驗人生滋味的經歷。二、〈人己之間的觀察差異〉：解釋「我成功靠能力、你成功靠運氣」的雙重標準，探討原因並提出克服偏誤的建議。各 50 分。"], ["110", "一、〈在變動的世界中應確立的價值〉：由記者放棄「君子協定」談時代變遷下的價值取捨，舉實例論述自身專業工作應確立的價值。二、由塞凡提斯「沒有時間磨不掉的記憶」，表達是否認同，敘寫自己的記憶經驗與感悟。各 50 分。"]];

// ===== 測驗引擎 =====
// mode: 'instant' 立即對答案；'exam' 限時、交卷才對答案
function Quiz(el, qs, cfg){
  const st={i:0, sel:{}, done:false, start:Date.now()};
  const opts=qs.map(q=>cfg.shuffleOpts&&!q.src? shuffle([0,1,2,3]) : [0,1,2,3]); // 歷屆題保留官方選項順序
  const okk=k=>isOk(qs[k],st.sel[k]);
  const draw=()=>{
    if(st.done && cfg.mode==='exam') return drawResult();
    const q=qs[st.i], ord=opts[st.i], chosen=st.sel[st.i];
    const locked = cfg.mode==='instant' ? chosen!==undefined : false;
    let h=`<section class="quiz"><h3>${esc(cfg.title)}</h3><div class="qmeta"><span>第 ${st.i+1} / ${qs.length} 題</span>${q.src?`<span class="tag" style="background:#F2A58F;color:#2a120b;border-color:#F2A58F">${esc(q.src)} 第 ${q.no} 題</span>`:'<span class="tag">自編速記題</span>'}<span>${q.unit}</span><span>${esc(UNITS[q.unit].title)}</span>${cfg.mode==='exam'?'<span class="timer mono" id="tm"></span>':''}</div>`;
    h+=`<div class="qcard ${locked?'locked':''}"><div class="qtext">${esc(q.text)}</div>`;
    ord.forEach((oi,k)=>{
      let c='';
      if(locked){ if(oi===q.ans || (q.alt&&q.alt.includes(L[oi]))) c='ok'; else if(oi===chosen) c='no'; }
      else if(chosen===oi) c='sel';
      h+=`<button class="opt ${c}" data-opt="${oi}" ${locked?'disabled':''}><span class="L">${L[k]}</span><span>${esc(q.opts[oi])}</span></button>`;
    });
    if(locked) h+=`<div class="exp"><b>${isOk(q,chosen)?'答對了。':'正解是 '+L[ord.indexOf(q.ans)]+'。'}</b>${q.note?`<span class="pill ok" style="margin-right:6px">官方</span>${esc(q.note)} `:''}${esc(q.exp)} <a href="#u-${q.unit}">回 ${q.unit} 複習</a></div>`;
    h+=`</div><div class="ngrid">${qs.map((qq,k)=>{let c=k===st.i?'cur ':''; if(st.sel[k]!==undefined) c+= cfg.mode==='instant' ? (okk(k)?'ok':'no') : 'ans'; return `<button class="${c}" data-jump="${k}">${k+1}</button>`;}).join('')}</div>`;
    const answered=Object.keys(st.sel).length;
    h+=`<div class="run"><div class="actions"><button class="qbtn" data-nav="-1" ${st.i===0?'disabled':''}>上一題</button><button class="qbtn pri" data-nav="1" ${st.i===qs.length-1?'disabled':''}>下一題</button></div>`;
    if(cfg.mode==='exam') h+=`<button class="qbtn" data-submit>交卷（已答 ${answered}/${qs.length}）</button>`;
    else h+=`<span class="mono" style="font-size:12.5px">已答 ${answered}/${qs.length}・答對 ${qs.filter((qq,k)=>okk(k)).length}</span>`;
    h+=`</div><div id="cf"></div></section>`;
    el.innerHTML=h; tick();
  };
  const drawResult=()=>{
    const ok=qs.filter((q,k)=>okk(k)).length, score=Math.round(ok/qs.length*100);
    const mins=Math.round((Date.now()-st.start)/60000);
    const pts=qs.length===25?`測驗部分 ${ok*2}/50 分`:`答對率 ${score}%`;
    let h=`<section class="quiz"><h3>${esc(cfg.title)}・成績</h3><div class="result"><div class="score mono">${qs.length===25?ok*2:score}</div><div>答對 ${ok} / ${qs.length} 題・${pts}・用時約 ${mins} 分鐘</div><span class="passb ${score>=70?'y':'n'}">${score>=70?'達 70%：測驗穩定，申論拿一半單科就有 60':'未達 70%：先回單元補弱點'}</span><p class="note" style="color:var(--nav-mute)">及格門檻：國文×10%＋專業四科平均×90% ≥ 60，且專業平均 ≥ 50、無科目 0 分。答錯的題目已加入錯題本。</p></div>`;
    h+=qs.map((q,k)=>{const ch=st.sel[k];const ord=opts[k];return `<div class="qcard locked" style="margin-top:10px"><div class="qmeta" style="margin:0 0 6px"><span>第 ${k+1} 題</span><span>${q.unit}</span><span class="pill ${okk(k)?'ok':'no'}">${okk(k)?'答對':ch===undefined?'未作答':'答錯'}</span></div><div class="qtext">${esc(q.text)}</div>${ord.map((oi,j)=>`<div class="opt ${(oi===q.ans||(q.alt&&q.alt.includes(L[oi])))?'ok':oi===ch?'no':''}"><span class="L">${L[j]}</span><span>${esc(q.opts[oi])}</span></div>`).join('')}<div class="exp">${q.note?esc(q.note)+' ':''}${esc(q.exp)} <a href="#u-${q.unit}">回 ${q.unit} 複習</a></div></div>`;}).join('');
    h+=`</section>`;
    el.innerHTML=h;
  };
  const submit=()=>{
    if(st.done) return;
    st.done=true; stopTimer();
    qs.forEach((q,k)=>{ if(st.sel[k]!==undefined) record(q, okk(k)); else { S.wrong[q.id]={t:Date.now(),fixed:0}; } });
    const ok=qs.filter((q,k)=>okk(k)).length;
    S.hist.push({t:Date.now(), title:cfg.title, exam:cfg.exam, n:qs.length, ok, score:Math.round(ok/qs.length*100)}); if(S.hist.length>50) S.hist=S.hist.slice(-50);
    save(); renderSide(route()); updateChips(); drawResult();
    el.scrollIntoView({behavior:'smooth',block:'start'});
  };
  const tick=()=>{
    if(cfg.mode!=='exam') return;
    const tm=el.querySelector('#tm'); if(!tm) return;
    const left=Math.max(0, cfg.seconds*1000-(Date.now()-st.start));
    const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
    tm.textContent=`剩 ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    tm.classList.toggle('low', left<5*60000);
    if(left<=0) submit();
  };
  if(cfg.mode==='exam'){ stopTimer(); timerId=setInterval(tick,1000); }
  el.onclick=e=>{
    const b=e.target.closest('button'); if(!b||st.done&&cfg.mode==='exam') return;
    if(b.dataset.opt!==undefined){
      const oi=+b.dataset.opt, q=qs[st.i];
      if(cfg.mode==='instant'){ if(st.sel[st.i]!==undefined) return; st.sel[st.i]=oi; record(q, isOk(q,oi)); renderSide(route()); updateChips(); }
      else st.sel[st.i]=oi;
      draw();
    } else if(b.dataset.nav){ st.i=Math.min(qs.length-1,Math.max(0,st.i+ +b.dataset.nav)); draw(); }
    else if(b.dataset.jump!==undefined){ st.i=+b.dataset.jump; draw(); }
    else if(b.hasAttribute('data-submit')){
      const left=qs.length-Object.keys(st.sel).length;
      el.querySelector('#cf').innerHTML=`<div class="confirm"><span>${left?`還有 ${left} 題沒作答，`:''}確定要交卷嗎？交卷後無法修改。</span><div class="actions"><button class="qbtn pri" data-yes>確定交卷</button><button class="qbtn" data-no>繼續作答</button></div></div>`;
    }
    else if(b.hasAttribute('data-yes')) submit();
    else if(b.hasAttribute('data-no')) el.querySelector('#cf').innerHTML='';
  };
  draw();
}

// ===== 綁定事件 =====
function after(r){
  if(r.startsWith('u-')){
    const code=r.slice(2), qs=Q.filter(q=>q.unit===code);
    if(qs.length) Quiz($('#unitQuiz'), qs, {mode:'instant', shuffleOpts:true, title:`${code} 速記題（${qs.length} 題）`});
    const ub=$('#unitPastBtn'); if(ub) ub.onclick=()=>{ const pq=PQ.filter(q=>q.unit===code); Quiz($('#unitPast'), pq, {mode:'instant', title:`${code} 歷屆考題（${pq.length} 題）`}); $('#unitPast').scrollIntoView({behavior:'smooth'}); };
  }
  if(r==='home'){
    document.querySelectorAll('[data-plan]').forEach(cb=>cb.onchange=()=>{ S.plan[cb.dataset.plan]=cb.checked; save(); cb.closest('label').classList.toggle('done',cb.checked); });
  }
  if(r==='info'){
    const calc=()=>{
      const v=[0,1,2,3,4].map(i=>Math.max(0,Math.min(100,+$('#c'+i).value||0)));
      const pro=(v[1]+v[2]+v[3]+v[4])/4, total=v[0]*0.1+pro*0.9;
      const zero=v.some(x=>x===0), low=pro<50;
      const pass=total>=60&&!zero&&!low;
      let why=`總成績 ＝ ${v[0]}×10% ＋ ${pro.toFixed(2)}×90% ＝ <b>${total.toFixed(2)}</b> 分${total>=60?'（≥60 ✓）':'（未達 60）'}；專業平均 ${pro.toFixed(2)}${low?'（未滿 50 ✗）':'（≥50 ✓）'}${zero?'；有科目 0 分 ✗':''}。`;
      const need=Math.max(0,(60-v[0]*0.1)/0.9);
      $('#cv').innerHTML=`<b>${pass?'及格。':'不及格。'}</b> ${why} 以這個國文分數，專業四科平均需要 <b>${need.toFixed(1)}</b> 分。`;
    };
    [0,1,2,3,4].forEach(i=>$('#c'+i).oninput=calc); calc();
  }
  if(r==='practice'){
    const info=()=>{$('#pInfo').textContent=`符合條件 ${practicePool().length} 題`;};
    ['pSub','pTop','pPool','pN','pSrc','pYear'].forEach(id=>$('#'+id).onchange=info); info();
    $('#pStart').onclick=()=>{
      const pool=practicePool(); if(!pool.length){ $('#pQuiz').innerHTML='<section class="card"><p class="note" style="margin:0">這個條件下沒有題目，換個篩選試試。</p></section>'; return; }
      const qs=shuffle(pool).slice(0,+$('#pN').value);
      Quiz($('#pQuiz'), qs, {mode:'instant', shuffleOpts:true, title:`題庫練習（${qs.length} 題）`});
      $('#pQuiz').scrollIntoView({behavior:'smooth'});
    };
  }
  if(r==='past'){
    document.querySelectorAll('[data-pexam]').forEach(b=>b.onclick=()=>{ const e=PAST.find(x=>x.id===b.dataset.pexam); const qs=PQ.filter(q=>q.exam===e.id); Quiz($('#pastQuiz'), qs, {mode:'exam', title:e.label, seconds:40*60, exam:e.id}); $('#pastQuiz').scrollIntoView({behavior:'smooth'}); });
    document.querySelectorAll('[data-ppractice]').forEach(b=>b.onclick=()=>{ const e=PAST.find(x=>x.id===b.dataset.ppractice); const qs=PQ.filter(q=>q.exam===e.id); Quiz($('#pastQuiz'), qs, {mode:'instant', title:e.label+'（逐題解析）'}); $('#pastQuiz').scrollIntoView({behavior:'smooth'}); });
  }
  if(r==='mock'){
    document.querySelectorAll('[data-mock]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.mock; let qs, t, sec;
      if(k==='mini'){ qs=shuffle(ALLQ).slice(0,20); t='四科混合快速小考'; sec=25*60; }
      else { qs=shuffle(ALLQ.filter(q=>subjOf(q.unit)===k)).slice(0,25); t='模擬考・'+SUBJNAME[k]; sec=40*60; }
      Quiz($('#mQuiz'), qs, {mode:'exam', shuffleOpts:true, title:t, seconds:sec});
      $('#mQuiz').scrollIntoView({behavior:'smooth'});
    });
  }
  if(r==='account'){
    document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>doAuth(b.dataset.auth));
    const lo=$('#auOut'); if(lo) lo.onclick=doLogout;
    $('#bkCopy').onclick=async()=>{ const code=encodeBk(); $('#bkText').value=code; try{ await navigator.clipboard.writeText(code); $('#bkMsg').innerHTML='<p class="note">已複製到剪貼簿。</p>'; }catch(e){ $('#bkText').select(); $('#bkMsg').innerHTML='<p class="note">無法自動複製，請手動全選上方文字複製。</p>'; } };
    $('#bkLoad').onclick=()=>{ let d; try{ d=decodeBk($('#bkText').value); if(!d||typeof d.st!=='object') throw 0; }catch(e){ $('#bkMsg').innerHTML='<p class="note">備份碼格式不對，請確認有完整貼上。</p>'; return; }
      $('#bkMsg').innerHTML=`<div class="verdict">這會用備份碼取代目前的紀錄（備份內做過 ${Object.keys(d.st).length} 題）。確定嗎？<div class="actions" style="margin-top:8px"><button class="btn" id="bkYes">確定還原</button><button class="btn ghost" id="bkNo">取消</button></div></div>`;
      $('#bkYes').onclick=()=>{ S=Object.assign(blank(), d); save(); render(); };
      $('#bkNo').onclick=()=>{ $('#bkMsg').innerHTML=''; };
    };
  }
  if(r==='wrong'){
    const redo=$('#wRedo'); if(redo) redo.onclick=()=>{
      const qs=shuffle(Object.keys(S.wrong).filter(id=>QBY[id]).map(id=>QBY[id]));
      Quiz($('#wQuiz'), qs, {mode:'instant', shuffleOpts:true, title:`錯題重做（${qs.length} 題）`});
      $('#wQuiz').scrollIntoView({behavior:'smooth'});
    };
    const clr=$('#wClear'); if(clr) clr.onclick=()=>{
      $('#wConfirm').innerHTML='<div class="verdict" style="margin-top:10px">確定清空所有錯題？<div class="actions" style="margin-top:8px"><button class="btn" id="wYes">清空</button><button class="btn ghost" id="wNo">取消</button></div></div>';
      $('#wYes').onclick=()=>{ S.wrong={}; save(); render(); };
      $('#wNo').onclick=()=>{ $('#wConfirm').innerHTML=''; };
    };
  }
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const rd=e.target.closest('[data-read]'); if(rd){ const c=rd.dataset.read; S.read[c]=!S.read[c]; save(); rd.textContent=S.read[c]?'已讀 ✓（點擊取消）':'標記為已讀'; rd.classList.toggle('ghost',!!S.read[c]); renderSide(route()); updateChips(); return; }
  const rm=e.target.closest('[data-rm]'); if(rm){ delete S.wrong[rm.dataset.rm]; save(); render(); }
});
function closeSide(){ $('#side').classList.remove('open'); $('#ov').hidden=true; }
$('#menuBtn').onclick=()=>{ const o=$('#side').classList.toggle('open'); $('#ov').hidden=!o; };
$('#ov').onclick=closeSide;
$('#brandBtn').onclick=()=>go('home');
// ===== 深色／淺色模式（自動跟隨系統 → 淺色 → 深色）=====
const TKEY='rebroker-theme';
function applyTheme(m){
  if(m==='light'||m==='dark') document.documentElement.setAttribute('data-theme',m); else document.documentElement.removeAttribute('data-theme');
  $('#themeBtn').innerHTML = m==='dark'?'🌙<span class="hide-s"> 深色</span>':m==='light'?'☀️<span class="hide-s"> 淺色</span>':'◐<span class="hide-s"> 自動</span>';
  $('#themeBtn').title = m==='dark'?'目前：深色，點一下改回跟隨系統':m==='light'?'目前：淺色，點一下改深色':'目前：跟隨系統，點一下改淺色';
}
let THEME='auto'; try{ THEME=localStorage.getItem(TKEY)||'auto'; }catch(e){}
applyTheme(THEME);
$('#themeBtn').onclick=()=>{ THEME= THEME==='auto'?'light': THEME==='light'?'dark':'auto'; try{ localStorage.setItem(TKEY,THEME); }catch(e){} applyTheme(THEME); };
setInterval(updateChips,60000);
$('#syncChip').onclick=()=>go('account');
render();
setSync('init');
initCloud();
if(SB) SB.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'&&CLOUD){ CLOUD=null; } });

</script>
