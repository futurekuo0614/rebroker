<!DOCTYPE html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>不動產經紀人備考</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 版面：左側深青色目錄欄（像考試手冊的書背）＋右側紙張閱讀區；准考證式首頁卡片，朱紅印章當唯一強調色 */
:root{
  --paper:#F1F2EC; --paper-2:#E5E8DF; --card:#FFFFFF; --ink:#1B2523; --ink-2:#56625F; --line:#D4D8CC;
  --teal:#0F5A5E; --teal-deep:#0B3E41; --nav-ink:#E2EDEB; --nav-mute:#9DBDB9; --link:#0F5A5E;
  --seal:#B8432C; --seal-soft:#F7E3DB; --seal-line:#E7B6A6;
  --good:#2F7A4F; --good-bg:#E0F0E5; --bad:#B23A2D; --bad-bg:#F9E1DC; --hl:#FFF3C4;
  --quiz:#0B3E41; --quiz-ink:#E8EFEC; --quiz-card:rgba(255,255,255,.05); --quiz-line:rgba(255,255,255,.16);
  --f-display:'Noto Serif TC','Songti TC',serif;
  --f-body:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --shadow:0 1px 2px rgba(11,62,65,.08),0 4px 14px rgba(11,62,65,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111817; --paper-2:#18211F; --card:#1A2422; --ink:#E3EAE8; --ink-2:#A3B1AE; --line:#2B3735;
  --teal:#174C50; --teal-deep:#0B2527; --nav-ink:#DCE8E5; --nav-mute:#8FB0AC; --link:#86C7C4;
  --seal:#E5765D; --seal-soft:#3A231C; --seal-line:#6C3B2E;
  --good:#63C68E; --good-bg:#16312A; --bad:#EE8778; --bad-bg:#3A1D19; --hl:#3B3517;
  --quiz:#0B2527; --quiz-ink:#E0EAE7; --quiz-card:rgba(255,255,255,.04); --quiz-line:rgba(255,255,255,.13);
  --shadow:0 2px 10px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#111817; --paper-2:#18211F; --card:#1A2422; --ink:#E3EAE8; --ink-2:#A3B1AE; --line:#2B3735;
  --teal:#174C50; --teal-deep:#0B2527; --nav-ink:#DCE8E5; --nav-mute:#8FB0AC; --link:#86C7C4;
  --seal:#E5765D; --seal-soft:#3A231C; --seal-line:#6C3B2E;
  --good:#63C68E; --good-bg:#16312A; --bad:#EE8778; --bad-bg:#3A1D19; --hl:#3B3517;
  --quiz:#0B2527; --quiz-ink:#E0EAE7; --quiz-card:rgba(255,255,255,.04); --quiz-line:rgba(255,255,255,.13);
  --shadow:0 2px 10px rgba(0,0,0,.35); color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--teal-deep)}
a{color:var(--link)}
button{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--teal-deep);color:var(--nav-ink);display:flex;align-items:center;gap:12px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:900;font-size:16px;cursor:pointer;background:none;border:0;color:inherit;padding:0;white-space:nowrap}
.seal{width:28px;height:28px;border:2px solid var(--seal);color:var(--seal);border-radius:6px;display:grid;place-items:center;font:700 9.5px/1 var(--f-mono);transform:rotate(-6deg);flex:none}
.sp{flex:1}
.chip{font:600 12px var(--f-mono);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 11px;white-space:nowrap}
.chip b{color:#F2A58F}
.menu{display:none;background:none;border:1px solid rgba(255,255,255,.3);color:var(--nav-ink);border-radius:8px;padding:4px 10px;cursor:pointer}

.layout{display:grid;grid-template-columns:284px minmax(0,1fr);align-items:start}
#side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 48px);height:calc(100vh - 48px - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--teal);color:var(--nav-ink);padding:14px 10px 40px}
.navmain{display:grid;gap:5px}
.navmain button{display:flex;align-items:center;gap:8px;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--nav-ink);border-radius:9px;padding:8px 12px;font-weight:700;font-size:13.5px;cursor:pointer}
.navmain button:hover{background:rgba(255,255,255,.13)}
.navmain button.on{background:var(--seal);border-color:var(--seal);color:#fff}
.navmain .n{margin-left:auto;font:600 11px var(--f-mono);opacity:.85}
.nsub{font:700 11px var(--f-mono);letter-spacing:.08em;color:var(--nav-mute);margin:18px 8px 4px}
.ntop{font-size:12.5px;font-weight:700;margin:10px 8px 3px;display:flex;gap:6px;align-items:baseline}
.ntop .c,.nunit .c{font:700 10px var(--f-mono);color:#F2A58F}
.nunit{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;color:var(--nav-ink);opacity:.86;padding:5px 8px 5px 12px;border-radius:6px;font-size:12.8px;cursor:pointer;line-height:1.45}
.nunit:hover{background:rgba(255,255,255,.08);opacity:1}
.nunit.on{background:rgba(255,255,255,.14);border-left-color:#F2A58F;opacity:1}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:rgba(255,255,255,.22)}
.dot.read{background:#8FC9F0}.dot.ok{background:#6CCB9A}.dot.weak{background:#EBA28F}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--nav-mute);margin:16px 8px 0}
.legend span{display:flex;align-items:center;gap:5px}

main{padding-block:24px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:18px}
.crumb{font:500 11.5px var(--f-mono);color:var(--ink-2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;min-width:0}
.card>h3{font-size:17px;font-weight:900;margin-bottom:10px}
h2.pg{font-size:25px;font-weight:900}
.sub{color:var(--ink-2);font-size:13.5px;margin:4px 0 0}

/* 准考證 hero */
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 210px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.tk-main{padding:22px 26px;position:relative;min-width:0}
.tk-main .eb{font:700 11px var(--f-mono);letter-spacing:.12em;color:var(--seal)}
.tk-main h1{font-size:28px;font-weight:900;margin:6px 0 8px;line-height:1.3}
.tk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 18px;margin-top:14px;font-size:13px}
.tk-grid div{border-top:1px dashed var(--line);padding-top:6px}
.tk-grid small{display:block;font:600 10.5px var(--f-mono);letter-spacing:.06em;color:var(--ink-2)}
.tk-stamp{position:absolute;right:22px;top:18px;width:74px;height:74px;border:2.5px solid var(--seal);border-radius:50%;color:var(--seal);display:grid;place-items:center;text-align:center;font:900 13px/1.25 var(--f-display);transform:rotate(12deg);opacity:.85}
.tk-stub{background:var(--teal-deep);color:#EAF2F0;border-left:2px dashed rgba(255,255,255,.3);padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2px}
.tk-stub .big{font:900 56px/1 var(--f-display);color:#F2A58F}
.tk-stub .k{font:600 11px var(--f-mono);letter-spacing:.06em;color:#A9C6C2}
.tk-stub .t{font:700 13px var(--f-mono);margin-top:6px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px}
.stat .v{font:900 24px var(--f-display);font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--ink-2)}

.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.utile{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--card);cursor:pointer;text-align:left;color:var(--ink);display:grid;gap:4px}
.utile:hover{border-color:var(--seal)}
.utile .c{font:700 10.5px var(--f-mono);color:var(--seal)}
.utile .t{font-weight:700;font-size:13.5px;line-height:1.45}
.bar{height:6px;border-radius:6px;background:var(--paper-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.utile .m{font-size:11.5px;color:var(--ink-2)}
.gh{font:700 12px var(--f-mono);letter-spacing:.06em;color:var(--ink-2);margin:4px 0 8px}

.check{display:grid;gap:6px}
.check label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;padding:8px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14px}
.check label.done span{color:var(--ink-2);text-decoration:line-through}
.check input{margin-top:5px;accent-color:var(--seal)}
.check small{display:block;color:var(--ink-2);font-size:12px;text-decoration:none}

.tw{overflow-x:auto;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--paper-2);font-weight:700;white-space:nowrap}

/* lesson */
.lhead{position:relative;overflow:hidden}
.tab{position:absolute;top:0;right:0;background:var(--seal);color:#fff;font:700 12px var(--f-mono);padding:6px 14px 6px 18px;border-bottom-left-radius:12px}
.lhead h2{font-size:25px;font-weight:900;max-width:78%}
.lead{font-size:15.5px;font-weight:500;border-left:3px solid var(--seal);padding-left:13px;margin:12px 0 0}
.lesson h4{font-size:16px;margin:24px 0 6px;display:flex;align-items:center;gap:8px;color:var(--teal)}
:root[data-theme="dark"] .lesson h4{color:var(--link)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lesson h4{color:var(--link)}}
.lesson h4::before{content:"";width:7px;height:7px;background:var(--seal);transform:rotate(45deg);flex:none}
.lesson h4:first-child{margin-top:0}
.lesson p{margin:6px 0;max-width:68ch}
.lesson ul,.lesson ol{padding-left:22px;margin:6px 0}
.lesson li{margin:4px 0}
.lesson b{background:linear-gradient(transparent 62%,var(--hl) 62%)}
.flow{font-weight:700;color:var(--teal);background:var(--paper-2);border-radius:8px;padding:6px 10px;display:inline-block;line-height:1.6}
:root[data-theme="dark"] .flow{color:var(--link)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .flow{color:var(--link)}}
.analogy,.calc{background:var(--seal-soft);border:1px solid var(--seal-line);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14.5px}
.analogy>b:first-child,.calc>b:first-child{display:block;color:var(--seal);font-size:12px;letter-spacing:.06em;margin-bottom:3px;background:none}
.calc{background:var(--paper-2);border-color:var(--line);font-family:var(--f-body)}
.nest{margin:10px 0;font-size:13.5px}
.nest div{border:1.5px solid var(--teal);border-radius:10px;padding:8px 10px 10px}
.nest span{font-weight:700;display:block;margin-bottom:6px}
.nest .n2{border-color:var(--link);background:rgba(15,90,94,.04)}
.nest .n3{border-color:var(--seal)}
.nest .n4{border-style:dashed;border-color:var(--seal);color:var(--ink-2)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.steps div{background:var(--paper-2);border-radius:9px;padding:9px 11px;font-size:13.5px}
.steps b{display:block;color:var(--seal);background:none}
table.cm td,table.cm th{text-align:center}
.traps{display:grid;gap:8px}
.trap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:9px}
.trap .x{font:700 11px var(--f-mono);color:var(--bad);background:var(--bad-bg);border-radius:5px;padding:1px 6px;height:fit-content}
.trap .o{font:700 11px var(--f-mono);color:var(--good);background:var(--good-bg);border-radius:5px;padding:1px 6px;height:fit-content}
.trap s{color:var(--ink-2)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:9px 18px;font-weight:700;font-size:13.5px;cursor:pointer;background:var(--seal);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.dark{background:var(--teal-deep);color:#EAF2F0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12.5px;color:var(--ink-2)}
.pill{font:700 11px var(--f-mono);border-radius:999px;padding:2px 9px;display:inline-block}
.pill.ok{background:var(--good-bg);color:var(--good)}.pill.no{background:var(--bad-bg);color:var(--bad)}

/* quiz */
.quiz{background:var(--quiz);color:var(--quiz-ink);border-radius:var(--r);padding:20px 22px;min-width:0}
.quiz h3{font-size:17px;font-weight:900;color:#fff}
.qmeta{font:600 11.5px var(--f-mono);color:var(--nav-mute);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 12px}
.qcard{background:var(--quiz-card);border:1px solid var(--quiz-line);border-radius:12px;padding:16px 18px}
.qtext{font-size:15.5px;font-weight:700;color:#fff;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:rgba(255,255,255,.02);border:1px solid var(--quiz-line);color:var(--quiz-ink);border-radius:9px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;cursor:pointer;line-height:1.6}
.opt:hover{background:rgba(255,255,255,.08)}
.opt .L{font:700 12px var(--f-mono);width:23px;height:23px;border-radius:50%;border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;flex:none;margin-top:1px}
.opt.sel{border-color:#F2A58F;background:rgba(242,165,143,.16)}
.opt.sel .L{background:#F2A58F;border-color:#F2A58F;color:#2a120b}
.opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.opt.ok .L{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.opt.no .L{background:var(--bad);border-color:var(--bad);color:#fff}
.locked .opt{cursor:default}.locked .opt:not(.ok):not(.no){opacity:.5}
.qtext,.exp{white-space:pre-line}
.exp{font-size:14px;background:rgba(255,255,255,.07);border-radius:8px;padding:10px 12px;margin-top:6px}
.exp b{color:#F2A58F}
.exp a{color:#F2C8B9}
.tag{font:600 10.5px var(--f-mono);border:1px solid var(--quiz-line);border-radius:6px;padding:1px 6px;cursor:pointer;background:none;color:inherit}
.ngrid{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 4px}
.ngrid button{width:34px;height:30px;border-radius:7px;border:1px solid var(--quiz-line);background:transparent;color:var(--quiz-ink);font:600 11px var(--f-mono);cursor:pointer}
.ngrid button.cur{box-shadow:0 0 0 2px #F2A58F inset}
.ngrid button.ans{background:rgba(242,165,143,.25)}
.ngrid button.ok{background:var(--good);color:#fff;border-color:var(--good)}
.ngrid button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.run{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.timer{font:700 21px var(--f-mono);color:#F2A58F}
.timer.low{color:#FF8F7E}
.qbtn{border:1px solid var(--quiz-line);background:transparent;color:var(--quiz-ink);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:13.5px}
.qbtn.pri{background:#F2A58F;border-color:#F2A58F;color:#2a120b}
.result{text-align:center;padding:6px 0}
.result .score{font:900 60px/1.1 var(--f-display);color:#F2A58F}
.passb{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px}
.passb.y{background:var(--good);color:#fff}.passb.n{background:var(--bad);color:#fff}
.confirm{background:rgba(255,255,255,.08);border-radius:10px;padding:12px 14px;margin-top:10px;display:grid;gap:8px}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.filters label{font-size:12px;color:var(--ink-2);display:grid;gap:4px}
select,input[type=number]{font:inherit;font-size:14px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mock{border:1px solid var(--line);border-radius:12px;padding:15px 17px;background:var(--card);display:grid;gap:6px;align-content:start}
.mock .t{font-weight:900;font-size:16px;font-family:var(--f-display)}
.mock .s{font-size:13px;color:var(--ink-2)}
.witem{border-bottom:1px solid var(--line);padding:12px 0;font-size:14px;display:grid;gap:5px}
.witem:last-child{border-bottom:0}
.witem .meta{font:600 11px var(--f-mono);color:var(--ink-2)}
.witem .ans{color:var(--good);font-weight:700}
.rl a{display:block;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:700;font-size:14px}
.rl a:last-child{border-bottom:0}
.rl small{display:block;color:var(--ink-2);font-weight:400;font-size:12.5px}
.calcbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.verdict{margin-top:10px;padding:10px 12px;border-radius:9px;font-size:14px;background:var(--paper-2)}
.foot{text-align:center;font-size:11.5px;color:var(--ink-2);padding:20px 8px 0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 48px);bottom:0;height:auto;width:min(290px,86vw);z-index:55;transform:translateX(-105%);transition:transform .2s ease;padding-left:max(10px,env(safe-area-inset-left,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  #side.open{transform:none}
  .menu{display:inline-block}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ticket{grid-template-columns:1fr}
  .tk-stub{border-left:0;border-top:2px dashed rgba(255,255,255,.3);flex-direction:row;gap:14px;flex-wrap:wrap}
  .tk-stub .big{font-size:44px}
  .tk-stamp{width:58px;height:58px;font-size:11px;right:14px;top:14px}
  .tk-main h1{font-size:23px;padding-right:60px}
  .lhead h2{max-width:100%;padding-top:20px}
  .card{padding:16px}
  .quiz{padding:16px}
}

R11101:{title:'權利主體：自然人、法人與行為能力',lead:'民法第一題幾乎都從「人」開始：誰有權利能力、誰能自己有效締約、法人怎麼代表。考點是數字（年齡、年數）和「無效／得撤銷／效力未定」三種效果別搞混。',
html:`
<h4>權利能力：始於出生、終於死亡</h4>
<ul>
<li><b>胎兒</b>：以將來非死產為限，關於其個人利益之保護「視為既已出生」（第 7 條）。分割遺產要保留胎兒應繼分（第 1166 條）。</li>
<li><b>死亡宣告</b>（第 8 條）由法院因<b>利害關係人或檢察官</b>聲請：</li>
</ul>
<div class="tw"><table><tr><th>失蹤人</th><th>失蹤滿多久可聲請</th></tr>
<tr><td>一般</td><td><b>7 年</b></td></tr><tr><td>80 歲以上</td><td><b>3 年</b></td></tr><tr><td>遭遇特別災難</td><td>災難終了滿 <b>1 年</b></td></tr></table></div>
<ul><li>以判決內確定死亡之時「<b>推定</b>」死亡（第 9 條）；人其實活著時權利能力不受影響。撤銷死亡宣告也是向法院。</li>
<li>二人以上同時遇難、不能證明死亡先後：<b>推定同時死亡</b>（第 11 條），彼此不互相繼承。</li></ul>

<h4>行為能力三分法（112 年起 18 歲成年）</h4>
<div class="tw"><table><tr><th>類型</th><th>誰</th><th>所為法律行為效力</th></tr>
<tr><td>無行為能力</td><td>未滿 7 歲；受<b>監護宣告</b>者</td><td>意思表示<b>無效</b>，由法定代理人代為（第 75、76 條）</td></tr>
<tr><td>限制行為能力</td><td>7 歲以上未滿 18 歲</td><td>單獨行為未得允許<b>無效</b>；契約<b>效力未定</b>須承認（第 78、79 條）。純獲法律上利益、日常生活所必需者有效（第 77 條）；用<b>詐術</b>使人信其有能力者有效（第 83 條）</td></tr>
<tr><td>受輔助宣告</td><td>辨識能力「顯有不足」之成年人</td><td>原則有完全行為能力，但第 15-2 條所列重要行為（借貸、保證、贈與、不動產或汽車買賣等）須經輔助人同意，否則效力未定</td></tr></table></div>
<div class="analogy"><b>白話比喻</b>監護宣告＝「完全不能辨識」→ 像小孩，全部由大人代辦；輔助宣告＝「辨識能力顯有不足」→ 自己可以做，但大額、重要的事要有人陪簽。</div>
<ul><li>遺囑能力：滿 <b>16 歲</b>可自行立遺囑，不必法定代理人同意（第 1186 條）。</li>
<li>代理人不需要有完全行為能力（第 104 條）；但「授與代理權」本身是單獨行為，限制行為能力人授權須得允許。</li></ul>

<h4>法人</h4>
<div class="tw"><table><tr><th></th><th>社團法人</th><th>財團法人</th></tr>
<tr><td>組成</td><td>人的集合，有社員</td><td>財產的集合，無社員</td></tr>
<tr><td>最高機關</td><td><b>總會</b></td><td>無總會（他律法人，依捐助章程）</td></tr>
<tr><td>設立</td><td>營利依特別法；公益社團採<b>許可主義</b></td><td>設立登記前應得主管機關<b>許可</b>（第 59 條）；可以<b>遺囑捐助</b>（第 60 條）</td></tr>
<tr><td>目的</td><td>營利、公益、中間</td><td>只能公益</td></tr></table></div>
<ul><li>董事就法人一切事務對外代表法人；對董事代表權的限制<b>不得對抗善意第三人</b>（第 27 條）。</li>
<li>法人在法令限制內享權利，只排除專屬自然人者（身體、親屬權）；名譽、姓名等人格權仍可享有。解散清算中，於清算必要範圍內視為存續。</li></ul>

<h4>住所</h4>
<ul><li>意定住所：久住意思＋居住事實（第 20 條）；限制行為能力人以法定代理人住所為住所（第 21 條）。</li>
<li>夫妻住所由雙方協議，未協議前推定以共同戶籍地為住所（第 1002 條）；因特定行為選定居所者，關於該行為「<b>視為</b>」住所（第 23 條）。</li></ul>`,
traps:[['80 歲以上失蹤滿 7 年才能死亡宣告','錯。80 歲以上只要 3 年；特別災難是災難終了滿 1 年。'],['受死亡宣告就喪失權利能力','錯。只是推定死亡，本人活著時權利能力仍在；撤銷宣告找法院不是地檢署。'],['「辨識能力顯有不足」可聲請監護宣告','錯。那是輔助宣告；監護宣告是「不能」為或受意思表示、「不能」辨識效果。'],['限制行為能力人的契約一律無效','錯。原則效力未定，經承認生效；單獨行為才是無效。']]},

R11102:{title:'物、法律行為與意思表示瑕疵',lead:'這單元的題目最愛給一個生活情境，再問「有效、無效、得撤銷？」。把六種意思表示瑕疵的效果表背熟，就能秒殺大半題目。',
html:`
<h4>物：不動產、定著物、從物、孳息</h4>
<ul><li>不動產＝土地及其<b>定著物</b>（第 66 條）。定著物要件：<b>繼續附著</b>於土地＋有<b>獨立使用</b>價值。臨時搭的舞台、可移動的拼裝貨櫃屋都<b>不是</b>定著物。</li>
<li>不動產的出產物尚未分離者，為該不動產之部分（果實、樹木屬土地；未經同意種在他人土地上的樹也屬土地所有人）。</li>
<li>主物之處分及於從物（第 68 條）：買車效力及於備胎。</li>
<li>天然孳息（果實、小牛、魚苗）於<b>分離時</b>歸有收取權人（第 70、766 條）；無權占有人不是收取權人。</li></ul>

<h4>法律行為無效、得撤銷總表</h4>
<div class="tw"><table><tr><th>情形</th><th>效果</th><th>條文</th></tr>
<tr><td>違反強制或禁止規定</td><td>無效</td><td>71</td></tr>
<tr><td>背於公共秩序善良風俗</td><td>無效</td><td>72</td></tr>
<tr><td>暴利行為（乘人急迫輕率無經驗）</td><td>得<b>向法院聲請</b>撤銷，行為後 <b>1 年</b>內</td><td>74</td></tr>
<tr><td>心中保留（單獨虛偽）</td><td>原則<b>有效</b>；相對人明知者無效</td><td>86</td></tr>
<tr><td>通謀虛偽意思表示</td><td>無效，但不得對抗善意第三人；隱藏他項行為者適用該行為之規定</td><td>87</td></tr>
<tr><td>錯誤、誤傳</td><td>得撤銷（須表意人<b>無過失</b>、具交易上重要性）；撤銷者對善意相對人負信賴利益賠償</td><td>88、89、91</td></tr>
<tr><td>被詐欺、被脅迫</td><td>得撤銷；第三人詐欺須相對人明知或可得而知；詐欺之撤銷不得對抗善意第三人</td><td>92</td></tr></table></div>
<div class="calc"><b>除斥期間速記</b>錯誤／誤傳：自意思表示後 <b>1 年</b>。詐欺／脅迫：發見詐欺或脅迫終止後 <b>1 年</b>，但自意思表示後經過 <b>10 年</b>不得撤銷。暴利行為：法律行為後 <b>1 年</b>內向法院聲請。</div>
<ul><li>對「人」的錯誤（把丙誤認為乙）屬內容錯誤，契約有效但得撤銷。</li>
<li>被脅迫訂約是「得撤銷」不是「當然無效」，這是最常見的陷阱。</li>
<li>通謀虛偽離婚無效，婚姻關係仍存在。</li></ul>

<h4>契約解釋</h4>
<ul><li>應探求當事人真意，不得拘泥於所用辭句（第 98 條）。</li>
<li>文字與號碼不符、法院不能決定何者為真意時，<b>以文字為準</b>（第 4 條）；多次表示不符時以最低額為準（第 5 條）。</li></ul>

<h4>法定要式行為</h4>
<p>收養（書面＋法院認可）、不動產物權移轉或設定（書面）、夫妻財產制契約（書面）、遺囑、合會契約、期限逾 1 年的不動產租賃（未立字據視為不定期）等。贈與、動產所有權拋棄都是不要式。</p>`,
traps:[['被脅迫所訂的契約當然無效','錯。被詐欺、被脅迫都是「得撤銷」。'],['錯誤的撤銷期間是 2 年','錯。自意思表示後 1 年。'],['表意人自己有過失也能以錯誤撤銷','錯。須表意人無過失（第 88 條但書）。'],['暴利行為只要對相對人表示撤銷即可','錯。暴利行為要向法院聲請撤銷。']]},

R11103:{title:'代理與消滅時效',lead:'代理考「誰承擔效果」，時效考「幾年」。代理要分清無權代理（效力未定）、表見代理（本人負責）；時效要背 15／5／2 年三層，以及已登記不動產不罹時效。',
html:`
<h4>代理</h4>
<ul><li>代理人於代理權限內以<b>本人名義</b>所為意思表示，直接對本人生效（第 103 條）。以自己名義為之是間接代理，不直接對本人生效。</li>
<li>代理權授與向代理人或相對人表示即可，原則不要式；但處理事務之法律行為依法須以文字為之者（如不動產物權移轉），處理權之授與亦應以文字為之（第 531 條）。</li>
<li>數代理人原則應<b>共同</b>代理（第 168 條）。</li>
<li>意思表示瑕疵（被詐欺等）以<b>代理人</b>決之，但撤銷權屬本人；本人明知的事不得主張代理人不知（第 105 條）。</li>
<li><b>自己代理、雙方代理</b>：原則禁止，經本人許諾或專為履行債務者例外；違反者屬無權代理（效力未定），不是無效（第 106 條）。</li>
<li>代理權之限制及撤回，不得對抗<b>善意無過失</b>第三人（第 107 條）。</li></ul>
<div class="tw"><table><tr><th></th><th>無權代理</th><th>表見代理</th></tr>
<tr><td>情形</td><td>無代理權而以他人名義為法律行為</td><td>本人以自己行為表示授權他人，或知他人表示為其代理人而不為反對之表示</td></tr>
<tr><td>效力</td><td><b>效力未定</b>，非經本人承認對本人不生效力（第 170 條）</td><td>本人對第三人負<b>授權人責任</b>（第 169 條）；第三人明知或可得而知者除外</td></tr>
<tr><td>無權代理人責任</td><td>對善意相對人負損害賠償（第 110 條，無過失責任）</td><td>—</td></tr></table></div>

<h4>消滅時效</h4>
<div class="tw"><table><tr><th>期間</th><th>適用</th></tr>
<tr><td><b>15 年</b></td><td>一般請求權（第 125 條）</td></tr>
<tr><td><b>5 年</b></td><td>利息、紅利、租金、贍養費、退職金及其他 1 年或不及 1 年之定期給付（第 126 條）</td></tr>
<tr><td><b>2 年</b></td><td>旅店飲食費、運送費、<b>以租賃動產為營業者之租價</b>（租車費）、醫師律師報酬、商人供給之商品代價等（第 127 條）；侵權行為（知有損害及賠償義務人起 2 年，自行為時起 10 年）</td></tr></table></div>
<ul><li>中斷事由：請求（6 個月內不起訴視為不中斷）、承認、起訴等（第 129、130 條）。</li>
<li>經確定判決或與確定判決同一效力者，原時效不滿 5 年的，重行起算後為 <b>5 年</b>（第 137 條）。</li>
<li>時效完成，債務人取得拒絕給付抗辯權（第 144 條），權利本身不消滅。</li>
<li><b>已登記不動產</b>的所有物返還請求權<b>不罹於消滅時效</b>（釋字第 107、164 號）。</li>
<li>抵押權：擔保債權時效完成後 <b>5 年</b>間不實行，抵押權消滅（第 880 條）。</li></ul>
<div class="analogy"><b>時效 vs 除斥期間</b>時效是「請求權」過期，對方可以拒絕給付，可中斷；除斥期間是「形成權」（撤銷權、解除權）過期，權利直接消滅，不能中斷。</div>`,
traps:[['違反雙方代理禁止的契約無效','錯。屬無權代理，效力未定，本人可承認。'],['無權代理行為無效','錯。效力未定。'],['租車公司的租金請求權 5 年','錯。「以租賃動產為營業者之租價」是 2 年；房屋租金才是 5 年。'],['無權占有已登記土地 15 年，所有人就不能請求返還','錯。已登記不動產返還請求權不罹於時效。']]},

R11201:{title:'債之發生與效力',lead:'契約、無因管理、不當得利、侵權行為是債的四大發生原因。考題常在各制度的「例外」：緊急管理只負重大過失、不法原因給付不得請求返還、利率 16% 上限、債權讓與要通知。',
html:`
<h4>契約成立</h4>
<ul><li>要約＋承諾意思表示一致。將要約擴張、限制或變更而承諾者，視為拒絕原要約而為<b>新要約</b>（第 160 條）。</li>
<li>價目表之寄送不視為要約（第 154 條），屬要約之引誘。</li>
<li>一物二賣：買賣是債權契約，<b>兩個契約都有效</b>，先完成移轉登記者取得所有權。</li></ul>

<h4>無因管理（第 172～178 條）</h4>
<div class="tw"><table><tr><th>類型</th><th>管理人可請求</th><th>注意義務</th></tr>
<tr><td>適法管理（利於本人且不違反其意思）</td><td>必要或有益費用＋利息、清償代負債務、損害賠償（第 176 條）；<b>無報酬請求權</b></td><td>善良管理人注意</td></tr>
<tr><td>緊急管理（免除本人生命、身體、財產急迫危險）</td><td>同上</td><td>只就<b>惡意或重大過失</b>負責（第 175 條）</td></tr>
<tr><td>不適法管理</td><td>本人主張享有管理利益時，以本人<b>所得利益為限</b>償還（第 177 條）</td><td>—</td></tr></table></div>

<h4>不當得利不得請求返還（第 180 條）</h4>
<p>給付係履行道德上義務、債務人於未到期之債務因清償而為給付、明知無給付義務而為給付、因<b>不法原因</b>而為給付（行賄）。</p>

<h4>侵權行為</h4>
<ul><li>共同侵權連帶負責（第 185 條）。</li>
<li>限制行為能力人侵權：行為時有識別能力，與法定代理人連帶；<b>無識別能力</b>由法定代理人<b>單獨</b>負責（第 187 條）。</li>
<li>僱用人連帶責任，但選任監督已盡相當注意可免責（第 188 條）；定作人原則不負責，定作或指示有過失者除外（第 189 條）。</li>
<li>非財產上損害賠償請求權不得讓與或繼承，但已依契約承諾或已起訴者不在此限（第 195 條）。</li></ul>

<h4>債之效力與多數債務人</h4>
<ul><li>約定利率超過週年 <b>16%</b> 者，超過部分無效（第 205 條，110.7 起由 20% 下修）。</li>
<li>連帶債務以明示或法律規定為限（第 272 條）。法定連帶：共同侵權、合夥人對不足額、共同繼承人（以遺產為限）等；共有人分割後的擔保責任是<b>按應有部分</b>負擔，不是連帶。</li>
<li>連帶債務人中一人不能償還分擔額，由求償權人與他債務人按比例分擔（第 282 條）。</li></ul>

<h4>債之移轉與消滅</h4>
<ul><li>債權讓與不需債務人同意，但<b>非經通知</b>對債務人不生效力（第 297 條）；債務人不知讓與而向原債權人清償，債務消滅。</li>
<li>債務承擔須經債權人承認（第 301 條）。</li>
<li>代物清償、清償、提存、<b>抵銷</b>（互負同種類已屆期債務，第 334 條）、免除、混同 → 債消滅；<b>新債清償（間接給付）</b>在新債務履行前舊債不消滅（第 320 條）。</li>
<li>債務人有害及債權之無償行為，債權人得<b>聲請法院</b>撤銷（第 244 條）。</li></ul>`,
traps:[['無因管理人可以請求報酬','錯。無因管理無報酬請求權。'],['緊急管理人完全不負責','錯。仍就惡意或重大過失負責。'],['債權讓與須經債務人同意','錯。只要通知，不通知只是對債務人不生效力。'],['利率超過 20% 部分無效','錯。現行法是 16%。']]},

R11202:{title:'各種之債：買賣、租賃、贈與、委任、居間、合夥',lead:'不動產經紀人最貼近實務的就是租賃與買賣。重點是「買賣不破租賃」、轉租規則、贈與撤銷事由、瑕疵擔保的救濟，以及居間報酬何時可請求。',
html:`
<h4>買賣</h4>
<ul><li>債權出賣人應擔保其權利確係存在（第 350 條）；標的權利不存在不是契約無效，而是負<b>權利瑕疵擔保</b>。</li>
<li>物之瑕疵：買受人可<b>解除契約或請求減少價金</b>（第 359 條）；出賣人故意不告知瑕疵或保證品質者，可請求損害賠償（第 360 條）；只有<b>種類之債</b>可請求另行交付無瑕疵之物（第 364 條）。</li>
<li>從物有瑕疵只能就從物解除；數物中一物有瑕疵原則只就該物解除（第 362、363 條）。</li>
<li>買受人對他地送到之物主張瑕疵不願受領時，仍有暫為保管之責（第 358 條）。</li></ul>

<h4>租賃（必考）</h4>
<div class="tw"><table><tr><th>規則</th><th>內容</th></tr>
<tr><td>不動產租期逾 1 年</td><td>應以字據訂立，未訂立者<b>視為不定期租賃</b>（第 422 條），不是無效</td></tr>
<tr><td>買賣不破租賃</td><td>租賃物交付後所有權讓與第三人，租約對受讓人繼續存在（第 425 條）；未經公證之逾 5 年或未定期限租約不適用</td></tr>
<tr><td>房地同屬一人只賣房屋</td><td>「<b>推定</b>」有租賃關係（第 425-1 條）</td></tr>
<tr><td>基地租賃</td><td>承租人得請求出租人為<b>地上權登記</b>（第 422-1 條）</td></tr>
<tr><td>修繕</td><td>原則出租人負擔；催告不修繕，承租人才可自行修繕請求償還或扣租（第 429、430 條）</td></tr>
<tr><td>失火</td><td>承租人僅就<b>重大過失</b>負責（第 434 條）</td></tr>
<tr><td>轉租</td><td>房屋：除有反對約定，可轉租<b>一部分</b>；全部轉租需同意，違反時出租人得終止（第 443 條）。轉租契約本身有效</td></tr>
<tr><td>出租人權利瑕疵</td><td>第三人主張權利致不能使用，承租人得終止（第 436 條）</td></tr>
<tr><td>出租人法定權利</td><td>就租金債權對承租人置於不動產之物有<b>留置權</b>（第 445 條）</td></tr>
<tr><td>默示更新</td><td>期滿後仍為使用收益而出租人不即表示反對，視為<b>不定期</b>租賃（第 451 條）</td></tr></table></div>

<h4>贈與</h4>
<ul><li>諾成契約。贈與物未移轉前可撤銷，但經公證或為履行道德義務者不可（第 408 條）。</li>
<li>給付遲延時，受贈人不得請求遲延利息或其他不履行之損害（第 409 條）。</li>
<li>贈與人原則不負瑕疵擔保；故意不告知瑕疵或保證無瑕疵者負賠償（第 411 條）。</li>
<li>撤銷事由：受贈人對贈與人或其近親故意不法侵害（有刑罰）、<b>對贈與人有扶養義務而不履行</b>（第 416 條）；受贈人故意不法致贈與人死亡，繼承人可撤銷（第 417 條）。</li>
<li>定期給付之贈與，因一方死亡而<b>失其效力</b>（第 415 條）。</li></ul>

<h4>其他典型契約</h4>
<ul><li><b>消費借貸</b>是要物契約（交付才成立）；使用借貸必為無償，借用人不能主張買賣不破租賃。</li>
<li><b>居間</b>：契約因媒介而成立時才可請求報酬（第 568 條）；<b>婚姻居間</b>約定報酬者無請求權（第 573 條）；違反忠實義務者不得請求報酬。</li>
<li><b>合夥</b>：出資及合夥財產為全體<b>公同共有</b>（第 668 條）；無增資或補充義務（第 669 條）；合夥財產不足清償時連帶負責（第 681 條）；退夥前債務仍負責（第 690 條）。</li>
<li><b>保證</b>：先訴抗辯權（第 745 條）。</li></ul>`,
traps:[['逾 1 年租約沒寫書面就無效','錯。視為不定期租賃。'],['承租人可以把整間房子轉租','錯。房屋只能轉租一部分，全部轉租須出租人同意。'],['特定物買賣有瑕疵，可請求另行交付無瑕疵之物','錯。那是種類之債才有；特定物只能解除或減價。'],['合夥人出資的東西仍歸原出資人所有','錯。變成合夥人全體公同共有。']]},

R11301:{title:'物權變動、所有權、相鄰關係與共有',lead:'第 758 條（登記生效）和第 759 條（非法律行為取得）是整科最重要的兩條。共有、相鄰關係則幾乎每年都考，題目常是數字（5 年、1/10、2/3）。',
html:`
<h4>不動產物權變動</h4>
<div class="tw"><table><tr><th>取得原因</th><th>何時取得</th><th>條文</th></tr>
<tr><td>依法律行為（買賣、贈與、設定抵押）</td><td>書面＋<b>登記</b>才生效</td><td>758</td></tr>
<tr><td>繼承、強制執行、徵收、法院判決（形成判決如分割共有物）</td><td>登記前即取得，但<b>非經登記不得處分</b></td><td>759</td></tr>
<tr><td>時效取得</td><td>取得「請求登記」的權利，登記後才取得</td><td>769、770</td></tr></table></div>
<ul><li>登記推定力：登記之物權推定適法有此權利；公信力：信賴登記之善意第三人<b>依法律行為</b>取得者受保護（第 759-1 條）。因繼承取得者不受此保護。</li>
<li>違章建築：起造人因建築完成<b>原始取得</b>所有權；但無法登記，受讓人只取得<b>事實上處分權</b>。</li>
<li>動產交付四種：現實交付、<b>簡易交付</b>（受讓人已占有）、占有改定、指示交付（第 761 條）。動產可善意取得（第 801、948 條）。</li>
<li>取得時效：動產 10 年；未登記不動產 20 年（善意無過失 10 年）；<b>已登記</b>不動產不能時效取得所有權。</li></ul>

<h4>相鄰關係</h4>
<div class="tw"><table><tr><th>情形</th><th>規則</th></tr>
<tr><td>袋地通行（第 787 條）</td><td>法定通行權，免經同意但應支付償金；因<b>土地所有人任意行為</b>造成的袋地不適用</td></tr>
<tr><td>分割或一部讓與致成袋地（第 789 條）</td><td>只能通行他分割人或受讓人之土地，<b>無須支付償金</b></td></tr>
<tr><td>鄰地使用（第 792 條）</td><td>因營造修繕必要可使用鄰地，受損害者得請求償金（不能拒絕）</td></tr>
<tr><td>越界建屋（第 796 條）</td><td>非因故意或重大過失越界，鄰地所有人<b>知其越界而不即提出異議</b>者，不得請求移去，但得請求購買越界土地或償金</td></tr>
<tr><td>法院斟酌（第 796-1 條）</td><td>法院得斟酌公共利益免為移去；<b>故意越界</b>者不適用</td></tr>
<tr><td>果實自落鄰地（第 798 條）</td><td>「<b>視為</b>」屬於鄰地；鄰地為公用地者除外</td></tr></table></div>
<ul><li>拾得遺失物：招領 6 個月無人認領由拾得人取得；報酬不超過價值 <b>1/10</b>，6 個月不行使消滅；受領人為低收入或中低收入戶可不給（第 805 條）。</li></ul>

<h4>共有</h4>
<div class="tw"><table><tr><th>行為</th><th>要件</th></tr>
<tr><td>處分<b>應有部分</b></td><td>自由處分（第 819 條第 1 項）</td></tr>
<tr><td>處分共有物（民法）</td><td>全體同意（第 819 條第 2 項）；土地法第 34-1 條另有多數決</td></tr>
<tr><td>管理（分管契約）</td><td>共有人<b>過半數</b>及應有部分合計過半數，或應有部分合計<b>逾 2/3</b>（第 820 條）；情事變更時法院得因任何共有人聲請以裁定變更</td></tr>
<tr><td>對第三人請求返還</td><td>各共有人可為全體利益單獨請求（第 821 條）</td></tr>
<tr><td>不分割約定</td><td>最長 <b>5 年</b>（不動產另有管理約定者 30 年）；有重大事由仍可隨時請求分割（第 823 條）</td></tr>
<tr><td>裁判分割</td><td>以原物分配為原則（第 824 條）；判決確定時各共有人取得分得部分所有權</td></tr>
<tr><td>應有部分上的抵押權</td><td>原則不因分割受影響；抵押權人同意分割、參加訴訟或經告知未參加者，移存於抵押人分得部分（第 824-1 條）</td></tr>
<tr><td>分管契約對受讓人</td><td>已登記，或受讓人知悉或可得而知者，對受讓人有效（第 826-1 條）</td></tr></table></div>
<ul><li>區分所有：專有部分不得與其所屬共有部分及基地權利<b>分離</b>移轉或設定負擔（第 799 條）。</li></ul>`,
traps:[['買了房子付清價金就取得所有權','錯。依法律行為取得不動產，完成移轉登記才取得。'],['繼承的土地要辦完繼承登記才取得','錯。繼承開始即取得，只是未登記不得處分。'],['共有人約定 20 年不分割，期間內絕對不能請求分割','錯。最長 5 年，且有重大事由可隨時請求。'],['果實落到鄰地「推定」屬於鄰地','錯。是「視為」。']]},

R11302:{title:'用益物權、抵押權與占有',lead:'地上權（20 年、欠租 2 年）、抵押權（利息 5 年、時效後 5 年、併付拍賣）、占有（訴狀送達視為惡意）都是固定考點。數字背清楚就能穩拿分。',
html:`
<h4>地上權與其他用益物權</h4>
<ul><li>未定期限的地上權存續逾 <b>20 年</b>或成立目的已不存在，法院得因請求定存續期間或終止（第 833-1 條）。</li>
<li>積欠地租達 <b>2 年總額</b>，須先定相當期限<b>催告</b>，仍不支付才可終止（第 836 條）。</li>
<li>地租預付經<b>登記</b>者，得對抗土地受讓人（第 836-1 條）。</li>
<li>因不可抗力妨礙使用，<b>不得</b>請求免除或減少租金（第 837 條）。</li>
<li>以時效取得地上權：只取得請求登記為地上權人的權利（向地政機關申請）。</li>
<li>農育權期限不得逾 20 年；典權期限不得逾 30 年。</li></ul>
<div class="tw"><table><tr><th>房地分屬不同人</th><th>法律擬制</th></tr>
<tr><td>土地及房屋同屬一人，<b>只讓與房屋</b>（或分別讓與）</td><td>「推定」有<b>租賃</b>關係（第 425-1 條）</td></tr>
<tr><td>土地及房屋同屬一人，經<b>強制執行拍賣</b>致所有人不同</td><td>「視為」已有<b>地上權</b>之設定（第 838-1 條）</td></tr>
<tr><td>土地設定抵押後，抵押人在地上建屋，實行抵押權時</td><td>抵押權人可聲請<b>併付拍賣</b>，但對房屋價金無優先受償權（第 877 條）</td></tr>
<tr><td>以建物設定抵押，建物坐落在地上權上</td><td>地上權併為抵押權標的，拍賣建物時<b>地上權應併付拍賣</b>（第 877-1 條）</td></tr></table></div>

<h4>抵押權</h4>
<ul><li>擔保利息：實行抵押權聲請強制執行前 <b>5 年</b>內及執行程序中發生者（第 861 條）。</li>
<li><b>流抵約款</b>現行法有效，但非經登記不得對抗第三人（第 873-1 條），且實行時仍要清算。</li>
<li>抵押物滅失得受賠償金：抵押權人就該賠償請求權取得<b>權利質權</b>（物上代位，第 881 條）。</li>
<li>擔保債權時效完成後 <b>5 年</b>間不實行，抵押權消滅（第 880 條）。</li>
<li>設定抵押權後再設地上權或租賃，不影響抵押權；影響拍賣時法院可除去該權利。</li></ul>

<h4>占有</h4>
<ul><li>占有是<b>事實</b>不是權利；無權占有人被侵奪時也有占有物返還請求權（第 962 條，1 年內行使）。</li>
<li>善意占有人於本權訴訟敗訴時，自<b>訴狀送達之日</b>起視為惡意占有人（第 959 條）。</li></ul>
<div class="tw"><table><tr><th>費用</th><th>善意占有人</th><th>惡意占有人</th></tr>
<tr><td>必要費用</td><td>可請求償還（已就占有物取得孳息者不得請求通常必要費用）</td><td>依<b>無因管理</b>規定請求（第 957 條）</td></tr>
<tr><td>有益費用</td><td>現存增加價值限度內可請求</td><td>不得請求</td></tr></table></div>`,
traps:[['地上權未定期限逾 30 年才能請求法院終止','錯。是 20 年。'],['欠地租 2 年，土地所有人可直接終止','錯。須先定期催告。'],['併付拍賣後，抵押權人對房屋價金也可優先受償','錯。只能就土地價金優先受償。'],['惡意占有人支出的必要費用不能請求','錯。可依無因管理規定請求。']]},

R11401:{title:'夫妻財產制（含親屬基礎）',lead:'法定財產制的「推定」規則、剩餘財產分配不列入的財產、約定財產制只剩兩種，是每年 1～2 題的穩定考點。',
html:`
<h4>法定財產制（未約定時適用）</h4>
<ul><li>財產分<b>婚前財產</b>與<b>婚後財產</b>，由夫妻<b>各自所有</b>、各自管理使用收益處分（第 1017、1018 條），各自對其債務負清償責任（第 1023 條）。</li>
<li>不能證明為婚前或婚後財產者，<b>推定</b>為婚後財產；不能證明為夫或妻所有者，<b>推定</b>為夫妻共有。</li>
<li>婚前財產於婚姻關係存續中所生孳息（股利、利息），<b>視為</b>婚後財產。</li>
<li>夫妻一方以自己財產清償他方債務，<b>婚姻關係存續中也可請求償還</b>（第 1023 條第 2 項）。</li></ul>
<div class="calc"><b>剩餘財產分配（第 1030-1 條）</b>雙方現存婚後財產扣除婚姻關係存續中所負債務後，差額平均分配。<br>不列入：① 因<b>繼承</b>或其他<b>無償取得</b>之財產（受贈不需要書面聲明）② 慰撫金。<br>請求權時效：自知有剩餘財產差額時起 <b>2 年</b>，或自法定財產制關係消滅時起 <b>5 年</b>。<br>追加計算：法定財產制關係消滅前 <b>5 年</b>內故意處分婚後財產以減少他方分配者（第 1030-3 條）。</div>

<h4>約定財產制</h4>
<ul><li>只有<b>共同財產制</b>和<b>分別財產制</b>兩種（統一財產制已刪除）；結婚前、後都可約定。</li>
<li>夫妻財產制契約應以<b>書面</b>為之（第 1007 條）；<b>非經登記不得對抗第三人</b>（第 1008 條，登記是對抗要件不是生效要件）；此登記不影響依其他法律所為財產權登記之效力。</li>
<li>分別財產制：各自所有、管理、各自對債務負責（第 1044、1046 條）。</li>
<li>共同財產制：共同財產所負債務以共同財產清償者，不生補償請求權（第 1038 條）。</li>
<li>特有財產（第 1031-1 條）：專供個人使用之物、職業上必需之物（音樂家的樂器）、贈與人以書面聲明為特有財產者；以特有財產換得的財產仍為特有財產。</li></ul>

<h4>親屬基礎考點</h4>
<ul><li>禁婚：直系血親及直系姻親（姻親關係消滅後亦同）、旁系血親六親等內、旁系姻親五親等內<b>輩分不相同</b>者（第 983 條）。前小姨子（輩分相同）離婚後可以結婚。</li>
<li>婚姻存續中受胎者推定為婚生子女；推翻須提起<b>否認之訴</b>，只有夫、妻或子女可提起（第 1063 條），生父不行。</li>
<li>非婚生子女經生父認領或準正（生父與生母結婚）視為婚生子女；與生母之關係視為婚生，無須認領。</li></ul>`,
traps:[['婚後財產屬夫妻共有','錯。婚後財產仍各自所有，只是離婚時算剩餘財產差額。'],['婚後受贈財產要有贈與人書面聲明才不列入剩餘財產分配','錯。無償取得的財產本來就不列入。'],['夫妻財產制契約未登記就無效','錯。登記只是對抗要件。'],['我國約定財產制有共同、分別、統一三種','錯。統一財產制已刪除。']]},

R11402:{title:'繼承、拋棄、遺囑與特留分',lead:'繼承是民法裡最好拿分的單元：順序、應繼分、特留分三張表背起來，再加上拋棄繼承的「3 個月、書面、向法院」與歸扣的三種贈與，近五年每年都有 3～4 題。',
html:`
<h4>法定繼承人順序與應繼分</h4>
<div class="tw"><table><tr><th>與配偶同為繼承者</th><th>配偶應繼分</th><th>特留分（為應繼分的）</th></tr>
<tr><td>① 直系血親卑親屬（子女、孫）</td><td>與子女<b>平均</b></td><td>子女 1/2、配偶 1/2</td></tr>
<tr><td>② 父母</td><td><b>1/2</b></td><td>父母 1/2</td></tr>
<tr><td>③ 兄弟姊妹</td><td><b>1/2</b></td><td>兄弟姊妹 <b>1/3</b></td></tr>
<tr><td>④ 祖父母</td><td><b>2/3</b></td><td>祖父母 <b>1/3</b></td></tr>
<tr><td>無以上之人</td><td>全部</td><td>—</td></tr></table></div>
<ul><li>姻親（後母與前妻子女、兄弟之配偶、舅媽）沒有繼承權；養子女與養父母之親生子女互為兄弟姊妹（第三順序）；經認領的非婚生子女屬第一順序。</li>
<li><b>代位繼承</b>：第一順序繼承人於繼承開始前死亡或喪失繼承權，由其直系血親卑親屬代位（第 1140 條）。<b>拋棄繼承不發生代位</b>。</li>
<li>配偶再婚、子女出家都不影響已取得的繼承權。</li></ul>

<h4>喪失繼承權（第 1145 條）</h4>
<ul><li>① 故意致被繼承人或應繼承人於死或雖未致死因而受刑之宣告 → <b>絕對失權</b>，宥恕也不回復。</li>
<li>② 詐欺脅迫使被繼承人為、撤回或變更遺囑；③ 以詐欺脅迫妨害之；④ 偽造變造隱匿湮滅遺囑 → 經被繼承人<b>宥恕</b>可回復。</li>
<li>⑤ 對<b>被繼承人</b>有重大虐待或侮辱情事，經被繼承人表示其不得繼承 → 侮辱的對象必須是被繼承人本人。</li></ul>

<h4>概括繼承有限責任</h4>
<ul><li>繼承人自繼承開始承受被繼承人財產上一切權利義務（專屬者除外），但以<b>所得遺產為限</b>負清償責任（第 1148 條）；繼承人對債務以遺產為限負連帶責任（第 1153 條）。</li>
<li>未開具遺產清冊不當然喪失限定責任；但隱匿遺產情節重大等，不得主張（第 1163 條）。清償順序：優先權債權 → 普通債權 → 遺贈。</li>
<li>非財產上損害賠償請求權（未經承諾或起訴）不得繼承。</li></ul>

<h4>拋棄繼承（第 1174～1176 條）</h4>
<div class="calc"><b>三要件</b>知悉得繼承之時起 <b>3 個月</b>內 ＋ <b>書面</b> ＋ 向<b>法院</b>為之。<br>應以書面通知因其拋棄而應為繼承之人，但不能通知者不在此限（未通知不影響拋棄效力）。<br>溯及繼承開始時生效；生前預先拋棄無效；口頭表示拋棄不生效力。<br>拋棄者的應繼分歸屬於其他同為繼承之人；同順序全部拋棄由次順序繼承。<br>拋棄者對其所管理之遺產，應與處理自己事務為同一之注意繼續管理。</div>

<h4>遺產分割與歸扣</h4>
<ul><li>繼承人得隨時請求分割（第 1164 條）；遺囑禁止分割以 <b>10 年</b>為限。</li>
<li>歸扣：繼承開始前因<b>結婚、分居、營業</b>而受贈的財產，應由其應繼分中扣除；被繼承人贈與時有反對意思表示者不歸扣（第 1173 條）。</li>
<li>分割後各繼承人對他繼承人分得之債權，原則依分割時債務人支付能力負擔保責任；連帶責任自分割時（或清償期屆滿時）起經過 <b>5 年</b>免除（第 1171 條）。</li></ul>

<h4>遺囑</h4>
<ul><li>滿 16 歲有遺囑能力；方式：自書、公證、密封、代筆、口授。</li>
<li>受遺贈人於遺囑生效前死亡，遺贈不生效力（第 1201 條）；遺贈物生效時已不屬遺產者，遺贈無效（第 1202 條）。</li>
<li>繼承人得定期催告受遺贈人表示是否承認，期限屆滿不表示者，視為承認（第 1207 條）。</li></ul>`,
traps:[['配偶與父母同為繼承，配偶拿 1/3','錯。拿 1/2；與祖父母同為繼承才拿 2/3。'],['兄弟姊妹特留分為應繼分的 1/2','錯。兄弟姊妹、祖父母是 1/3。'],['拋棄繼承者的子女可代位繼承','錯。代位繼承只限繼承開始前死亡或喪失繼承權。'],['故意殺害被繼承人經宥恕可回復繼承權','錯。第 1 款是絕對失權。']]}
});

R12101:{title:'價格種類、估價原則與影響因素',lead:'估價這科每年有 6～8 題是「這是什麼原則／什麼因素／什麼價格」的辨識題。只要記住每個名詞的「判斷關鍵字」，幾乎都能秒答。',
html:`
<h4>四種價格（不動產估價技術規則第 2 條）</h4>
<div class="tw"><table><tr><th>價格</th><th>定義重點</th><th>考題例子</th></tr>
<tr><td><b>正常價格</b></td><td>具市場性，經適當市場行銷及正常交易條件形成的合理價值</td><td>一般買賣</td></tr>
<tr><td><b>限定價格</b></td><td>具市場性，在限定條件下形成：① 所有權以外其他權利與所有權<b>合併</b> ② 不動產<b>合併</b> ③ 以違反經濟合理性之不動產<b>分割</b>為前提</td><td>土地承租人買下承租的土地、地上權人買地</td></tr>
<tr><td><b>特定價格</b></td><td>具市場性，基於特定條件下形成；應<b>敘明估價條件並同時估計正常價格</b></td><td>農地未來可能變更為建地、公園變更為住宅用地</td></tr>
<tr><td><b>特殊價格</b></td><td>對<b>不具市場性</b>之不動產所估計的價值</td><td>孔廟、鎮瀾宮、總統府、龜山島</td></tr></table></div>
<p>租金也分正常租金、限定租金（續訂租金屬限定租金）。</p>

<h4>估價原則（看關鍵字作答）</h4>
<div class="tw"><table><tr><th>原則</th><th>關鍵概念</th><th>歷屆題目情境</th></tr>
<tr><td>最有效使用</td><td>客觀上具良好意識及<b>通常</b>使用能力者，在合法、實質可能、正當合理、財務可行前提下，得獲致最高利益之使用</td><td>「超凡意識」是錯的</td></tr>
<tr><td>貢獻原則</td><td>某部分對整體價值的貢獻</td><td>老公寓加裝<b>電梯</b>、<b>畸零地</b>價格偏高、取得綠建築標章</td></tr>
<tr><td>適合原則</td><td>與<b>外部</b>環境相配合</td><td>國小旁開文具書店</td></tr>
<tr><td>均衡原則</td><td><b>內部</b>各要素配置均衡</td><td>建物與基地規模配合</td></tr>
<tr><td>外部性原則</td><td>外部環境對價值的正負影響</td><td>高壓電塔、殯儀館（嫌惡設施）</td></tr>
<tr><td>變動原則</td><td>價格隨時間變動，所以要訂價格日期</td><td>高鐵站周邊 3 年由 35 萬漲到 50 萬</td></tr>
<tr><td>預測原則</td><td>價值取決於未來收益</td><td>收益性不動產求取將來收益</td></tr>
<tr><td>替代、競爭、供需、收益分配、收益遞增遞減</td><td>經濟學基本原理</td><td>—</td></tr></table></div>

<h4>三大影響因素</h4>
<div class="tw"><table><tr><th>因素</th><th>影響範圍</th><th>例子</th></tr>
<tr><td><b>一般因素</b></td><td>全面影響整個不動產市場</td><td>央行升息、信用管制、存款準備率、實價登錄 2.0、平均地權條例修法、國土計畫公告、疫情</td></tr>
<tr><td><b>區域因素</b></td><td>影響<b>近鄰地區</b>的價格水準</td><td>地區淹水、捷運站設置、聯外道路、重劃區、信義計畫區、大巨蛋周邊</td></tr>
<tr><td><b>個別因素</b></td><td>不動產本身條件造成的價格差異</td><td>這間距捷運站 50 公尺、面對公園第一排、離小學多遠</td></tr></table></div>
<div class="analogy"><b>快速判斷法</b>整個市場一起動 → 一般；整片地區一起動 → 區域；只有這一筆不一樣 → 個別。題目出現「該房子距離……」幾乎都是個別因素。</div>

<h4>估價範疇</h4>
<p>土地、建物、定著物、農作改良物（山上的果樹）及其權利；從樹上摘下的果實是動產，不屬不動產估價範疇。</p>`,
traps:[['承租人購買承租土地是特定價格','錯。權利與所有權合併，是限定價格。'],['寺廟、古蹟的價格是特定價格','錯。不具市場性，是特殊價格。'],['距捷運站 50 公尺是區域因素','錯。是這筆不動產本身的條件，屬個別因素；「設置捷運站」才是區域因素。'],['加裝電梯價格提高是適合原則','錯。是貢獻原則。']]},

R12102:{title:'估價程序、價格日期與方法運用',lead:'程序題考「八步驟第幾步」和「基本事項有哪些」；方法運用題考「兼採二種以上方法」與證券化 DCF 權重；特殊情況（違建、未完工、超過容積）也是固定考點。',
html:`
<h4>估價作業八步驟（技術規則第 8 條）</h4>
<ol><li>確定估價基本事項</li><li>擬定估價計畫</li><li>蒐集資料</li><li>確認勘估標的狀態</li><li>整理、比較、分析資料</li><li>運用估價方法推算勘估標的價格</li><li><b>決定勘估標的價格</b></li><li>製作估價報告書</li></ol>
<div class="calc"><b>確定估價基本事項（第 9 條）四款</b>① 勘估標的內容 ② <b>價格日期</b> ③ 價格種類及條件 ④ 估價目的<br>陷阱：是「價格日期」不是「勘察日期」；作業時間、交易資料都不是基本事項。</div>

<h4>價格日期 vs 勘察日期</h4>
<ul><li><b>價格日期</b>：表示不動產價格之<b>基準日期</b>。</li>
<li><b>勘察日期</b>：赴勘估標的現場從事調查分析之日期。</li>
<li>兩者先後「<b>不一定</b>」：可評估過去或未來的價格日期。價格日期調整要用價格日期的指數，不是勘察日期的指數。</li></ul>

<h4>估價方法運用（第 14～16 條）</h4>
<ul><li>應<b>兼採二種以上</b>估價方法推算（情況特殊不能採用者應敘明）。</li>
<li>各方法所得價格應綜合比較，就金額<b>顯著差異</b>者重新檢討。</li>
<li>視資料可信度、估價種類目的條件差異、價格形成因素相近程度，決定勘估標的價格（加權）。</li>
<li>以契約約定租金作為<b>證券化</b>受益證券信託利益分配基礎者，<b>DCF 收益價格</b>應賦予相對較大權重；但評估清算價格時不適用。</li>
<li>投資評估最適合 DCF。</li></ul>

<h4>特殊狀況怎麼估</h4>
<div class="tw"><table><tr><th>狀況</th><th>處理</th></tr>
<tr><td>建物有違章部分</td><td>合法與違章部分<b>分別標示</b>各該部分價格</td></tr>
<tr><td>未完工建物</td><td>依<b>實際完成部分</b>估價</td></tr>
<tr><td>實際容積超過法定容積</td><td>以實際建築使用<b>合法部分</b>之現況估價</td></tr>
<tr><td>一宗土地有數種法定用途</td><td>考量最有效使用、各用途相關性及分割難易度，決定<b>分別估價或依主要用途</b>估價</td></tr>
<tr><td>附著於土地之工事、水利土壤改良</td><td>以<b>成本法</b>估價為原則</td></tr></table></div>`,
traps:[['估價基本事項包括勘查日期','錯。是價格日期。'],['價格日期一定早於勘察日期','錯。不一定。'],['八步驟第 7 步是製作估價報告書','錯。第 7 步是決定價格，第 8 步才是報告書。'],['違章建築一律不估價','錯。合法與違章分別標示價格。']]},

R12201:{title:'比較法（含計量模型、樓層別效用比）',lead:'比較法每年必出 3～4 題：一題算價格日期調整，一題考排除門檻 15%／30%／20%，一題考四種調整的名稱。',
html:`
<h4>比較法流程</h4>
<p>蒐集比較標的（通常 <b>3 件以上</b>）→ ① <b>情況調整</b> → ② <b>價格日期調整</b> → ③ <b>區域因素調整</b> → ④ <b>個別因素調整</b> → 得「<b>試算價格</b>」→ 檢討、加權 → 決定「<b>比較價格</b>」。調整以<b>百分率法</b>為原則，差額法為輔。</p>
<div class="tw"><table><tr><th>調整</th><th>用途</th></tr>
<tr><td>情況調整</td><td>交易有特殊情況：親友或父子間交易、急買急賣、<b>與法定用途不符</b>、含其他權利或負擔</td></tr>
<tr><td>價格日期調整</td><td>比較標的交易日期與勘估標的價格日期之間價格水準變動</td></tr>
<tr><td>區域因素調整</td><td>比較標的不在同一近鄰地區時，轉化為同一近鄰地區價格水準</td></tr>
<tr><td>個別因素調整</td><td>兩者本身條件差異</td></tr></table></div>
<div class="calc"><b>價格日期調整公式</b>調整後價格 ＝ 比較標的價格 × 價格日期指數 ÷ 交易日期指數<br>例：3,060 萬 × 105/102 ＝ 3,150 萬；800 萬 × 100.3/103.6 ≈ 774.5 萬（指數下跌價格就下調）</div>

<h4>排除門檻（必背）</h4>
<div class="tw"><table><tr><th>情況</th><th>門檻</th><th>條文</th></tr>
<tr><td>區域因素總調整率、個別因素總調整率，或其內<b>任一單獨項目</b>調整率</td><td>大於 <b>15%</b> → 排除比較標的</td><td>第 25 條</td></tr>
<tr><td>情況、價格日期、區域、個別<b>四項總調整率</b></td><td>大於 <b>30%</b> → 排除</td><td>第 25 條</td></tr>
<tr><td>檢討後<b>試算價格之間</b>差距</td><td>達 <b>20%</b> 以上 → 排除該試算價格</td><td>第 26 條</td></tr></table></div>
<p>例外：勘估標的性質或區位特殊缺乏交易資料，並於報告書敘明者，不在此限。</p>

<h4>計量模型分析法（第 21 條）</h4>
<ul><li>比較標的數量須為影響因素數量的 <b>5 倍以上</b>（6 個區域因素＋5 個個別因素 → 55 筆以上）。</li>
<li>截距項以外各係數同時為零的顯著機率不得大於 <b>5%</b>；迴歸分析<b>調整後判定係數不得低於 0.7</b>。</li>
<li>可求出各主要影響因素與價格的關係式，推算各因素的<b>調整率及調整額</b>。</li></ul>

<h4>區分所有建物：樓層別效用比與地價分配率</h4>
<div class="calc"><b>公式</b>樓層別效用比：與各樓層單價成正比，以基準樓層為 100%。1 樓 75 萬、4 樓 50 萬 → 1 樓 ＝ 75/50 ＝ 150%。<br>地價分配率 ＝ 該層樓層別效用比 －（平均樓層別效用比 × 全棟建物成本價格占全棟房地總價比率）<br>例：110% － 105% × 40% ＝ 68%</div>`,
traps:[['經四項調整後得到的是比較價格','錯。是試算價格，再檢討加權後才是比較價格。'],['總調整率大於 20% 應排除','錯。四項總調整率是 30%；試算價格之間差距才是 20%。'],['區域因素總調整率 18% 仍可採用','錯。區域或個別因素總調整率大於 15% 就要排除。'],['父子間交易做個別因素調整','錯。是情況調整。']]},

R12202:{title:'收益法：直接資本化、DCF 與收益資本化率',lead:'收益法是計算題大宗：P＝a／R 一定要會倒推，債務保障比率法、加權平均資金成本法也幾乎每年出現。另外記住「建物資本化率最高」與「增值性使資本化率降低」。',
html:`
<h4>淨收益怎麼算</h4>
<div class="calc"><b>計算流程</b>總收入（滿租租金）－ 閒置及其他原因損失（空置率、呆帳）＝ <b>有效總收入</b>；有效總收入 － 總費用 ＝ <b>淨收益</b><br>例：100 坪 × 1,000 元 × 12 月 ＝ 1,200,000；空置 8% → 1,104,000；減總費用 120,000 → 淨收益 984,000（貸款本息不扣）</div>
<ul><li>總收入 ≥ 有效總收入（必然）。</li>
<li>總費用包括：地價稅或地租、房屋稅、保險費、管理費、維修費等；<b>不包括</b>土地增值稅、所得稅、貸款本息。</li>
<li>淨收益應以<b>勘估標的</b>作<b>最有效使用</b>之客觀淨收益為基準，取未來平均一年期間。</li>
<li>證券化估價的 DCF 總費用，依<b>信託計畫資料</b>推算。</li></ul>

<h4>兩種收益法</h4>
<div class="tw"><table><tr><th></th><th>直接資本化法</th><th>折現現金流量分析法（DCF）</th></tr>
<tr><td>公式</td><td>收益價格 ＝ 淨收益 ÷ 收益資本化率</td><td>各期淨收益折現加總＋期末價值折現</td></tr>
<tr><td>用的率</td><td>價格日期當時適當的<b>收益資本化率</b></td><td><b>折現率</b>（期末處分價值也用折現率折現）</td></tr>
<tr><td>適用</td><td>收益穩定的不動產</td><td>投資評估、證券化</td></tr></table></div>
<ul><li>收益資本化率與折現率孰高「不一定」。</li>
<li>土地殘餘法：土地收益價格 ＝（房地淨收益 － 建物淨收益）÷ 土地收益資本化率。例：(100－60)÷2% ＝ 2,000 萬。</li>
<li>淨收益<b>未扣除</b>折舊提存費者：建物收益價格 ＝ 建物折舊前淨收益 ÷（建物收益資本化率＋折舊提存率）。</li>
<li>土地、建物、房地綜合三者中，<b>建物</b>收益資本化率最高。</li></ul>

<h4>決定收益資本化率的方法</h4>
<div class="tw"><table><tr><th>方法</th><th>做法</th><th>例題</th></tr>
<tr><td>風險溢酬法</td><td>無風險利率＋各種風險溢酬</td><td>流通性低、風險高、管理難 → 提高；<b>增值性高 → 降低</b>（反向）</td></tr>
<tr><td>市場萃取法</td><td>數個相似比較標的「淨收益 ÷ 價格」的商數比較決定</td><td>—</td></tr>
<tr><td>加權平均資金成本法</td><td>自有資金比 × 自有報酬率 ＋ 貸款比 × 貸款利率</td><td>30%×2%＋70%×3%＝2.7%</td></tr>
<tr><td><b>債務保障比率法</b></td><td>債務保障比率 × <b>貸款常數</b> × 貸款資金占價格比率</td><td>1.3×0.055×0.7≈5%；1.5×0.1×75%＝11.25%</td></tr>
<tr><td>有效總收入乘數法</td><td>淨收益率 ÷ 有效總收入乘數</td><td>—</td></tr></table></div>
<p>DCF 是估價方法，不是決定資本化率的方法。第 43 條要求考慮：銀行定存利率、政府公債利率、不動產投資之<b>風險性</b>、貨幣變動狀況、不動產價格變動趨勢。</p>`,
traps:[['貸款本息要列入總費用','錯。融資支出不屬營運總費用。'],['DCF 計入期末價值時用直接資本化率','錯。用折現率。'],['增值性越高資本化率越高','錯。增值性與資本化率反向變動。'],['同一不動產土地的資本化率最高','錯。建物最高。']]},

R12203:{title:'成本法與折舊',lead:'成本法每年至少一題折舊計算（定額法），再搭配營造施工費的項目、直接法間接法分類、殘價率 10% 上限。',
html:`
<h4>基本公式</h4>
<div class="calc"><b>成本法</b>建物成本價格 ＝ 建物總成本 － 累積折舊額<br>房地成本價格 ＝ 土地總成本 ＋ 建物成本價格<br>定額法（等速折舊）：累積折舊 ＝ 重建成本 ×（1 － 殘價率）× 經歷年數 ÷ 經濟耐用年數<br>每年折舊率 ＝（1 － 殘價率）÷ 經濟耐用年數</div>
<div class="tw"><table><tr><th>歷屆題</th><th>算式</th><th>答案</th></tr>
<tr><td>重建成本 2,000 萬、殘價 10%、50 年、屋齡 10 年，累積折舊</td><td>2,000×0.9×10/50</td><td>360 萬</td></tr>
<tr><td>3,000 萬、殘價 10%、50 年、屋齡 30 年，現值</td><td>3,000－3,000×0.9×30/50</td><td>1,380 萬</td></tr>
<tr><td>1,000 萬、殘價 5%、50 年、屋齡 5 年，成本價格</td><td>1,000－1,000×0.95×5/50</td><td>905 萬</td></tr>
<tr><td>殘價 10%、50 年，每年折舊率</td><td>0.9/50</td><td>1.8%</td></tr></table></div>

<h4>總成本 vs 營造施工費</h4>
<div class="tw"><table><tr><th>建物總成本（第 48 條）</th><th>營造或施工費（第 50 條）</th></tr>
<tr><td>營造或施工費、規劃設計費、<b>廣告費、銷售費</b>、管理費、稅捐及其他負擔、資本利息、<b>開發或建築利潤</b></td><td>直接材料費、直接人工費、間接材料費、間接人工費、管理費、稅捐、資本利息、<b>營造或施工利潤</b></td></tr></table></div>
<p>出售不動產的所得稅不是成本項目；廣告費、開發商利潤不在營造施工費內。</p>

<h4>營造施工費求取方法</h4>
<div class="tw"><table><tr><th>類別</th><th>方法</th><th>說明</th></tr>
<tr><td rowspan="2">直接法</td><td><b>淨計法</b>（最精細）</td><td>各種材料及人工數量逐一乘以價格日期當時單價，加計管理費、稅捐、資本利息、利潤</td></tr>
<tr><td>單位工程法</td><td>細部工程各項目單價 × 施工數量</td></tr>
<tr><td rowspan="2">間接法</td><td>工程造價比較法</td><td>以同一供需圈類似比較標的或標準建物比較調整</td></tr>
<tr><td>單位面積（或體積）比較法</td><td>類似標的單位面積單價比較調整後 × 總面積</td></tr></table></div>

<h4>折舊與其他規則</h4>
<ul><li>建物估價以求取<b>重建成本</b>為原則（重置成本為例外）；營造施工費以價格日期當時計算，與屋齡無關，老舊反映在折舊。</li>
<li>折舊以<b>經濟耐用年數</b>為主；殘餘價格率以不超過 <b>10%</b> 為原則。</li>
<li>折舊三類：物理性（外牆龜裂、損耗）、功能性（設計落伍）、經濟性（外部環境使價值降低）。</li>
<li>資本利息：<b>自有資金</b>按一年期定存利率、<b>借款</b>按借款利率、<b>預售收入不計息</b>。</li></ul>`,
traps:[['建物估價以重置成本為原則','錯。以重建成本為原則。'],['殘價率 12% 符合規定','錯。以不超過 10% 為原則。'],['房屋越舊營造施工費越低','錯。營造施工費以價格日期當時重新建造計算，舊的是折舊。'],['預售收入資金也要計息','錯。預售收入不計息。']]},

R12204:{title:'土地開發分析法、租金估計與特殊估價',lead:'土地開發分析法的公式一定要背到能直接代入；租金估計記「以實質租金為原則」；特殊宗地與權利估價考的是「以什麼方法為原則」和「要考慮什麼」。',
html:`
<h4>土地開發分析法</h4>
<div class="calc"><b>公式</b>V ＝ S ÷（1＋R）÷（1＋i）－（C＋M）<br>S 總銷售金額、R 利潤率、i 資本利息綜合利率、C 直接成本（營造施工費）、M 間接成本（規劃設計、廣告銷售、管理、稅捐）<br>資本利息綜合利率 ＝ 資本利息年利率 ×（土地價值比率 ＋ 建物價值比率 × 1/2）× 開發年數</div>
<div class="tw"><table><tr><th>歷屆題</th><th>算式</th><th>答案</th></tr>
<tr><td>S＝10 億、R＝10%、i＝5%、C＝6 億、M＝2 億</td><td>10÷1.1÷1.05－8</td><td>0.658 億</td></tr>
<tr><td>S＝2,000 坪×60 萬、R＝20%、i＝5%、C＝2 億、M＝0.4 億</td><td>120,000÷1.2÷1.05－24,000</td><td>71,238 萬</td></tr>
<tr><td>S＝10 億、R＝18%、i＝5%、C＝3 億、M＝0.9 億，500 坪</td><td>(10÷1.18÷1.05－3.9)÷500</td><td>每坪約 83.4 萬</td></tr></table></div>
<ul><li>土地 ×1、建物 ×1/2：土地一開始就全額投入，建物是施工期間陸續投入。</li>
<li>施工人員的施工費屬直接成本；規劃設計費、管理費、銷售費屬間接成本。</li>
<li>勘查的是<b>勘估標的</b>的工程進度、施工及環境狀況，不是比較標的。</li></ul>

<h4>租金估計</h4>
<ul><li>不動產租金估計，以估計勘估標的之<b>實質租金</b>為原則（第 130 條）。</li>
<li><b>實質租金</b> ＝ 每期支付租金 ＋ 押金或保證金、權利金等之運用收益。例：月租 10 萬、押金 2 個月、利率 2.5% → 1,200,000＋200,000×2.5% ＝ 1,205,000。</li>
<li>經濟租金與支付租金大小「不一定」。</li>
<li>新訂租約：積算法（價格 × 租金收益率 ＋ 必要費用，例 1,000 萬×5%＋20 萬＝70 萬）、比較法、收益分析法。</li>
<li>續訂租約：差額分配法（<b>市場經濟租金與原契約租金之差額</b>中歸屬出租人部分）、利率法、推移法、比較法。</li></ul>

<h4>特殊宗地估價</h4>
<div class="tw"><table><tr><th>標的</th><th>原則</th></tr>
<tr><td>公共設施用地及保留地</td><td><b>比較法</b>；無買賣實例者比較毗鄰土地使用分區、使用強度及價值減損推算（不是用政府徵收價格）</td></tr>
<tr><td>農場、牧場、墓地、鹽田</td><td><b>比較法</b>為原則</td></tr>
<tr><td>高爾夫球場</td><td>考慮會員制度、球場設施、開發成本、收益及營運費用</td></tr>
<tr><td>林地、溫泉地</td><td>依林木生長、泉源條件等特性選方法，非以比較法為原則</td></tr></table></div>

<h4>權利估價</h4>
<ul><li>地上權：考慮用途、權利存續期間、支付地租之有無、權利讓與之限制、設定的空間位置。</li>
<li>都更權利變換前透天厝：土地權利價值可由房地總價 × 土地價值比率求得（1,500×9/10＝1,350 萬）。</li>
<li>市地重劃前後地價、容積移轉、永佃權、典權等也屬特殊估價。</li></ul>`,
traps:[['資本利息綜合利率＝年利率×（建物比＋土地比×1/2）×年數','錯。是土地比率全額、建物比率乘 1/2。'],['租金估計以契約租金為原則','錯。以實質租金為原則。'],['公共設施保留地以政府徵收價格評估','錯。以比較法，比較毗鄰土地條件推算。'],['續訂租金的差額分配法是正常租金與實質租金之差','錯。是市場經濟租金與原契約租金之差額。']]}
});

R13101:{title:'地權、外國人取得土地、共有處分與優先購買權',lead:'土地法第 34-1 條和優先購買權是這科出題最密集的地方。把「過半數＋過半數、逾 2/3 人數不計」「10 日／15 日」「誰優先」三件事記牢。',
html:`
<h4>地權基本規定</h4>
<ul><li>公有土地：國有、直轄市有、縣（市）有、鄉（鎮、市）有（第 4 條）。台糖等公營公司的土地屬<b>私有</b>。</li>
<li>不得私有之土地已成為私有者，得依法<b>徵收</b>（第 14 條）。</li>
<li>私有土地因天然變遷成為湖澤或可通運之水道，所有權「<b>視為</b>消滅」；回復原狀時回復（第 12 條）。湖澤及水道因水流變遷自然增加時，<b>接連地所有權人</b>有優先取得權（第 13 條）。</li>
<li>私有土地所有權之移轉、設定負擔或租賃妨害基本國策者，<b>中央地政機關</b>得報請行政院制止（第 20 條）。</li>
<li>公有土地撥用須經<b>行政院</b>核准，以無償為原則（第 26 條）。</li>
<li>他項權利（第 11 條）：地上權、農育權、不動產役權、典權、抵押權、<b>耕作權</b>；租賃權是債權。</li>
<li>土地改良物（第 5 條）：建築改良物（建物、工事）、農作改良物（附著於土地之農作物、植物、水利土壤之改良）；盆栽不附著不算。</li></ul>

<h4>外國人取得土地</h4>
<div class="tw"><table><tr><th>規定</th><th>內容</th></tr>
<tr><td>絕對禁止（第 17 條）</td><td>林地、漁地、狩獵地、鹽地、礦地、水源地、要塞軍備區域及領域邊境之土地，不得移轉、設定負擔或<b>租賃</b>於外國人（農地、牧地不在列舉內）</td></tr>
<tr><td>平等互惠（第 18 條）</td><td>依條約或其本國法律，中華民國人民得在該國享同樣權利者為限</td></tr>
<tr><td>可取得用途（第 19 條）</td><td>住宅、營業處所辦公場所商店工廠、教堂、醫院、外僑子弟學校、使領館及公益團體會所、墳場、有助重大建設整體經濟或農牧經營之投資（須先經<b>中央目的事業主管機關</b>同意）；面積及地點受地方政府限制</td></tr></table></div>

<h4>土地法第 34-1 條（共有土地多數決）</h4>
<div class="calc"><b>同意門檻</b>共有人<b>過半數</b>及其應有部分合計<b>過半數</b>；或應有部分合計<b>逾 2/3</b>者，其人數不予計算。<br>適用：處分、變更、設定地上權、農育權、不動產役權或典權。<br>程序：應<b>事先以書面通知</b>他共有人，不能以書面通知者<b>應公告</b>；對價或補償由同意之共有人為他共有人受領或提存。<br>他共有人於出賣時有優先承購權（接到通知後 <b>15 日</b>內不表示視為放棄）。依執行要點，<b>受讓人不得為共有人</b>。<br>公同共有準用之。</div>
<ul><li>共有土地分割不能協議，可申請地政機關調處；不服調處者於接到通知後 <b>15 日</b>內訴請司法機關（第 34-2 條）。</li></ul>

<h4>優先購買權比較</h4>
<div class="tw"><table><tr><th>條文</th><th>誰有</th><th>期限</th><th>效力</th></tr>
<tr><td>第 104 條基地或房屋出賣</td><td>基地出賣：地上權人、典權人、<b>承租人</b>；房屋出賣：基地所有權人</td><td>接到通知後 <b>10 日</b></td><td><b>物權效力</b>：未通知而訂約者不得對抗優先購買權人</td></tr>
<tr><td>第 107 條耕地出賣出典</td><td>承租人</td><td>10 日（準用第 104 條）</td><td>物權效力</td></tr>
<tr><td>第 34-1 條共有人出賣</td><td>他共有人</td><td><b>15 日</b></td><td>債權效力</td></tr></table></div>
<ul><li>第 104、107 條優先購買權<b>優先於</b>第 34-1 條共有人優先購買權，不是以登記先後定順序。</li>
<li>區分所有建物之專有部分連同基地應有部分一併移轉給同一人，他共有人<b>無</b>優先購買權。</li></ul>`,
traps:[['依 34-1 條，應有部分合計 2/3 即可處分','錯。須「逾」2/3。'],['基地出賣優先購買權人 15 日內不表示視為放棄','錯。基地、房屋、耕地是 10 日；共有人出賣才是 15 日。'],['公有土地撥用由國有財產署核准','錯。由行政院核准。'],['外國人不得承租農地','錯。現行第 17 條已不列農地。']]},

R13102:{title:'地籍測量與土地登記',lead:'登記題考法條細節：登記費千分之一或千分之二、預告登記與限制登記、補正與駁回、逾期未辦繼承登記的「1 年→公告→15 年→標售」流程。',
html:`
<h4>地籍測量</h4>
<ul><li>由直轄市或縣（市）政府辦理時，實施計畫應經<b>中央地政機關</b>核定（第 47 條）；土地所有權人應設立界標並永久保存。</li>
<li>重新實施地籍測量：所有權人限期自行設立界標並到場指界；界址爭議由地政機關<b>調處</b>，不服調處者 15 日內訴請處理；重測結果公告 <b>30 日</b>，公告期間內可聲請複丈；未聲請者據以辦理<b>標示變更登記</b>（第 46-1～46-3 條）。</li></ul>

<h4>土地總登記與登記費</h4>
<ul><li>逾期無人聲請或逾限未補繳證明文件 → 視為<b>無主土地</b>，公告不得少於 <b>30 日</b>，期滿無人異議即為國有登記（第 57、58 條）。</li>
<li>無保管或使用機關之公有土地、因地籍整理發現之公有土地 → 地政機關<b>逕為登記</b>，所有權人欄註明為<b>國有</b>（第 52 條）。</li>
<li>登記費：總登記按申報地價或權利價值<b>千分之二</b>；權利變更登記由<b>權利人</b>按申報地價或權利價值<b>千分之一</b>（第 65、76 條）。</li></ul>

<h4>登記錯誤的損害賠償</h4>
<ul><li>因登記錯誤、遺漏或虛偽致受損害者，由<b>地政機關</b>負損害賠償責任；但該地政機關證明其原因應歸責於受害人時不在此限（第 68 條）。</li>
<li>如因登記人員<b>重大過失</b>所致，由該人員償還，撥歸登記儲金（第 70 條）；不是連帶賠償。</li>
<li>登記完畢後發見錯誤或遺漏，非以書面聲請該管上級機關查明核准後，不得更正（第 69 條）；請求賠償遭拒絕，得向司法機關起訴（第 71 條）。</li></ul>

<h4>預告登記與限制登記</h4>
<ul><li>預告登記（第 79-1 條）：保全土地權利移轉、消滅、內容或次序變更的<b>請求權</b>，附條件或期限的請求權也可（如附條件贈與）。預告登記後，違反其內容之處分無效（徵收、法院判決、強制執行除外）。</li>
<li>限制登記：預告登記、查封、假扣押、假處分、破產登記及其他依法律所為禁止處分之登記；更正登記不屬之。</li>
<li>登記未完畢前接獲法院<b>查封、假扣押、假處分或破產登記</b>之囑託，應即改辦（土地登記規則第 141 條）。</li></ul>
<div class="tw"><table><tr><th>土地登記規則第 56 條：通知補正（15 日內）</th><th>第 57 條：駁回</th></tr>
<tr><td>申請人資格不符或代理權欠缺、申請書不合程式或文件不符欠缺、申請書記載與登記簿不符、未繳規費</td><td>不屬受理登記機關管轄、依法不應登記、<b>權利人義務人或權利關係人間有爭執</b>、逾期未補正</td></tr></table></div>

<h4>逾期未辦繼承登記（第 73-1 條）</h4>
<div class="calc"><b>流程</b>繼承開始逾 <b>1 年</b>未辦 → 地政機關查明後公告繼承人 <b>3 個月</b>內聲請 → 逾期<b>列冊管理 15 年</b> → 期滿仍未聲請，移請<b>財政部國有財產署公開標售</b>（標售前公告 30 日）<br>優先購買順序：<b>繼承人 → 合法使用人 → 其他共有人</b><br>標售價款存入國庫專戶保管，繼承人得依法定應繼分申請領取，逾 10 年無人申請歸屬國庫</div>
<p>一般繼承登記應自繼承開始之日起 6 個月內申請，逾期按月處罰鍰。</p>`,
traps:[['登記人員重大過失，人員與地政機關負連帶責任','錯。地政機關先賠，再由該人員償還。'],['權利變更登記費是千分之二','錯。變更登記千分之一，總登記千分之二。'],['權利關係人間有爭執應通知補正','錯。應駁回。'],['列冊管理期滿由地政機關標售','錯。移請國有財產署標售。']]},

R13103:{title:'土地使用：房屋與基地租用',lead:'出題比例較低，但條文數字好背：房屋租金上限年息 10%、擔保金 2 個月、基地欠租 2 年才能收回。',
html:`
<h4>房屋租用（土地法第 97～101 條）</h4>
<ul><li>城市地方房屋租金，以不超過土地及其建築物<b>申報總價年息 10%</b> 為限；超過者地方政府得強制減定。</li>
<li>擔保金不得超過 <b>2 個月</b>房屋租金總額；超過部分承租人得以之抵付房租（第 99 條）。</li>
<li>以現金為租賃擔保者，其現金之<b>利息</b>視為租金之一部（不是現金本身）。</li>
<li>出租人非有法定事由（收回自住或重建、承租人轉租、欠租除擔保金抵償外達 2 個月以上、違法使用、違約、損壞不賠）不得收回房屋（第 100 條）。</li></ul>

<h4>基地租用（第 102～103 條）</h4>
<ul><li>租用基地建築房屋，應由出租人與承租人於契約成立後 2 個月內聲請為<b>地上權登記</b>（第 102 條）。</li>
<li>出租人得收回情形：契約年限屆滿、承租人以基地供違反法令之使用、<b>轉租基地</b>於他人、積欠租金額除以擔保現金抵償外達 <b>2 年</b>以上、違反租賃契約（第 103 條）。欠租 2 個月不得收回。</li></ul>

<h4>耕地與其他</h4>
<ul><li>遇有荒歉，地方政府得按收穫實況為減租或免租之決定，但應經<b>民意機關</b>同意（第 123 條）。</li>
<li>耕地出租人出賣或出典耕地時，承租人有優先承受權（第 107 條）。</li></ul>`,
traps:[['房屋擔保金最多 3 個月','錯。不得超過 2 個月租金。'],['基地承租人欠租 2 個月出租人就能收回','錯。基地是 2 年；房屋才是 2 個月。'],['現金擔保本身視為租金一部','錯。是現金的利息視為租金一部。']]},

R13201:{title:'平均地權條例：地價、空地、市地重劃、實價登錄與預售屋管理',lead:'近三年最熱門的是 112 年 7 月修正的預售屋管理（禁止換約轉售、私法人購屋許可、炒作罰則）與實價登錄 2.0 罰則；市地重劃與照價收買則是老考點。',
html:`
<h4>規定地價與照價收買</h4>
<ul><li>公告地價供申報地價參考；土地所有權人申報地價以公告地價 80%～120% 為範圍，未申報者以公告地價 80% 為申報地價。公告土地現值每年 1 月 1 日公告，作為土地增值稅課徵依據。</li>
<li>照價收買以收買當期之<b>申報地價</b>為準（第 31 條）。</li>
<li>私有空地：劃定區域限期建築、增建、改建或重建；逾期未建築者，按應納地價稅基本稅額加徵 <b>2～5 倍空地稅</b>或照價收買（第 26 條）。限期建築的土地若出租、貸與或設有地上權，所有權人應先與承租人等協議建築，協議不成得終止租約或撤銷地上權（第 74 條）。</li></ul>

<h4>市地重劃</h4>
<ul><li>共同負擔：公共設施用地、工程費用、重劃費用、貸款利息，以土地折價抵付；共同負擔以不超過重劃區總面積 45% 為限。</li>
<li>十項共同負擔的公共用地，以原<b>公有道路、溝渠、河川及未登記地</b>優先抵充（第 60 條）。</li>
<li>自辦市地重劃：重劃區內私有土地所有權人<b>半數以上</b>，且其所有土地面積<b>超過</b>私有土地總面積半數者之同意（第 58 條）。</li>
<li>獎勵：給予<b>低利</b>重劃貸款、免收或減收地籍整理規費及換發書狀費、優先興建公共設施、免徵或減徵地價稅與田賦等。</li></ul>

<h4>實價登錄 2.0（110.7.1 起）</h4>
<div class="tw"><table><tr><th>案件</th><th>誰申報、何時</th></tr>
<tr><td>買賣</td><td><b>權利人及義務人</b>於申請所有權移轉登記時一併申報</td></tr>
<tr><td>預售屋（代銷或自售）</td><td>簽訂買賣契約之日起 <b>30 日</b>內</td></tr>
<tr><td>租賃（經紀業仲介）</td><td>簽訂租賃契約之日起 30 日內（經紀業管理條例第 24-1 條）</td></tr></table></div>
<div class="tw"><table><tr><th>違規</th><th>罰則（第 81-2 條）</th></tr>
<tr><td>買賣已辦竣移轉登記，屆期未申報</td><td>3 萬～15 萬元，令限期申報，按次處罰</td></tr>
<tr><td>申報價格或交易面積不實</td><td>按戶（棟）3 萬～15 萬元</td></tr>
<tr><td>申報價格以外資訊不實</td><td>先限期改正，屆期未改正處 6 千～3 萬元，按次處罰</td></tr></table></div>

<h4>預售屋與新建成屋管理（112.7.1 起）</h4>
<ul><li>銷售前應將坐落基地、建案名稱、銷售地點、期間、戶（棟）數及<b>預售屋買賣定型化契約</b>報請地方主管機關備查。</li>
<li>定型化契約違反應記載及不得記載事項，按戶（棟）處罰（第 47-3 條），優先於消保法適用。</li>
<li><b>禁止換約轉售</b>：預售屋或新建成屋買受人簽約後不得讓與或轉售，也不得刊登轉售廣告。例外：配偶、<b>直系血親或二親等內旁系血親</b>間；或經中央公告之情形並經地方核准，全國<b>每 2 年以 1 戶（棟）</b>為限。</li>
<li>收受定金應以書面契據確立買賣價金等事項，不得約定不利於買受人之事項；買受人<b>不得將定金契據轉售</b>予第三人，違者按戶（棟）處 15 萬～100 萬元（第 47-4 條）。</li>
<li><b>私法人購買住宅許可制</b>：檢具使用計畫經許可；中央主管機關以<b>合議制</b>審核；取得後 <b>5 年</b>內不得移轉、讓與或預告登記；許可文件有效期限 1 年（第 79-1 條）。</li>
<li>散布不實成交價格、人頭排隊、通謀虛偽交易等炒作行為，由主管機關依本條例重罰。</li></ul>

<h4>其他罰則</h4>
<ul><li>私人捐贈社福財團法人免徵土地增值稅的土地，未按捐贈目的使用、違反設立宗旨、收益未全部用於該事業 → 追補並處 2 倍罰鍰（第 35-1 條）。</li>
<li>以經營土地買賣違背土地法律從事壟斷、投機者，處 3 年以下有期徒刑，併科 7 千元以下罰金（第 83 條）。</li></ul>`,
traps:[['照價收買以收買當期平均市價為準','錯。以申報地價為準。'],['預售屋可轉售給姻親','錯。例外只限配偶、直系血親、二親等內旁系血親。'],['自辦重劃獎勵包括免息貸款','錯。是低利貸款。'],['買賣案件由仲介業者於移轉登記後 30 日內申報','錯。實價登錄 2.0 後由買賣雙方於申請登記時一併申報。']]},

R13202:{title:'土地徵收條例與區段徵收',lead:'徵收題考程序與數字：聽證的條件、補償費 15 日內發給、專戶保管 15 年歸國庫、撤銷與廢止的分別、區段徵收抵價地 50%／40%／45%。',
html:`
<h4>徵收程序</h4>
<ol><li>需用土地人於事業計畫報請目的事業主管機關許可<b>前</b>，應舉行<b>公聽會</b>。</li>
<li>特定農業區經行政院核定為重大建設須辦理徵收者，<b>若有爭議</b>，應依行政程序法舉行<b>聽證</b>（第 10 條）。</li>
<li>申請徵收前應先與所有權人<b>協議價購</b>或以其他方式取得；協議價購時，依其他法律有優先購買權者，<b>無</b>優先購買權之適用（第 11 條）。</li>
<li>中央主管機關核准 → 地方政府公告 30 日並通知。</li>
<li>補償費應於公告期滿後 <b>15 日</b>內發給，逾期未發給者，該部分徵收<b>從此失其效力</b>（第 20 條）。</li></ol>
<ul><li>補償費未發給完竣前，需用土地人不得進入被徵收土地工作；但<b>國防、交通、水利</b>事業因公共安全急需者不在此限（第 27 條）。</li>
<li>受領遲延、拒絕或不能受領的補償費：於應發給期限屆滿次日起 3 個月內存入<b>專戶保管</b>，<b>不適用提存法</b>，視同補償完竣，應給付利息；自通知送達發生效力之日起逾 <b>15 年</b>未領取者歸屬國庫（第 26 條）。</li></ul>

<h4>補償標準</h4>
<div class="tw"><table><tr><th>標的</th><th>補償基準</th></tr>
<tr><td>土地</td><td>徵收當期之<b>市價</b>，由<b>地價評議委員會</b>評定</td></tr>
<tr><td>公共設施保留地</td><td>按毗鄰非公共設施保留地之平均市價</td></tr>
<tr><td>建築改良物</td><td>徵收當時之<b>重建價格</b></td></tr>
<tr><td>農作改良物</td><td>與孳息成熟期相距 1 年以內者，按<b>成熟時之孳息</b>估定</td></tr></table></div>

<h4>撤銷 vs 廢止（第 49 條）</h4>
<div class="tw"><table><tr><th>撤銷（自始有瑕疵）</th><th>廢止（嗣後不需要）</th></tr>
<tr><td>因作業錯誤，致原徵收土地不在工程用地範圍內；公告徵收時都市計畫已規定以聯合開發等方式開發但未依規定辦理</td><td>因工程變更設計致原徵收土地不在範圍內；依徵收計畫開始使用前，<b>興辦事業改變</b>、計畫變更或已無徵收必要</td></tr></table></div>
<ul><li>撤銷或廢止由<b>需用土地人</b>向<b>中央主管機關</b>申請。未依徵收計畫完成使用前，需用土地人應每年檢討，並由其<b>上級事業主管機關</b>列管。</li></ul>

<h4>區段徵收</h4>
<ul><li>得為區段徵收：新設都市、舊都市更新、都市土地之農業區或保護區變更為建地、<b>非都市土地實施開發建設</b>、農村社區更新等（第 4 條）。興辦國營事業是一般徵收。</li>
<li>抵價地總面積以徵收總面積 <b>50%</b> 為原則，特殊情形不得少於 <b>40%</b>；曾經<b>農地重劃</b>者，該重劃地區部分不得少於 <b>45%</b>（第 39 條）。</li>
<li>規劃整理後：抵價地發交原所有權人領回；道路、溝渠、公園等無償登記為地方政府所有；國宅用地、安置原住戶土地<b>讓售</b>；其餘可建築土地標售、<b>標租（期限不得逾 99 年）</b>或設定地上權（第 44 條）。</li></ul>`,
traps:[['特定農業區重大建設徵收一律要聽證','錯。須「若有爭議」才應舉行聽證。'],['補償費逾 10 年未領歸屬國庫','錯。逾 15 年。'],['開始使用前興辦事業改變應撤銷徵收','錯。應廢止徵收。'],['區段徵收土地標租期限不得逾 25 年','錯。不得逾 99 年。']]},

R13203:{title:'都市計畫、國土計畫與非都市土地使用管制',lead:'都市計畫考數字（5 年一期最長 25 年、1/10000、2 年細部 5 年公設、3 或 5 年通盤檢討）與公共設施保留地的權益保障；國土計畫考誰核定使用許可。',
html:`
<h4>都市計畫法數字表</h4>
<div class="tw"><table><tr><th>規定</th><th>內容</th></tr>
<tr><td>主要計畫實施進度</td><td>以 <b>5 年</b>為一期，最長不得超過 <b>25 年</b>（第 15 條）</td></tr>
<tr><td>主要計畫圖比例尺</td><td>不得小於 <b>一萬分之一</b></td></tr>
<tr><td>細部計畫圖比例尺</td><td>不得小於 <b>一千二百分之一</b></td></tr>
<tr><td>第一期發展地區</td><td>主要計畫發布後 <b>2 年</b>內完成細部計畫；細部計畫發布後 <b>5 年</b>內完成公共設施（第 17 條）</td></tr>
<tr><td>公開展覽</td><td>30 日並舉行說明會；經都委會審議修正或內政部指示修正者，<b>免再</b>公開展覽及說明會（第 19 條）</td></tr>
<tr><td>通盤檢討</td><td>每 <b>3 年內或 5 年內</b>至少一次（第 26 條）</td></tr></table></div>
<ul><li>主要計畫核定（第 20 條）：首都由內政部核定轉報行政院備案；直轄市、市、縣政府所在地、縣轄市、<b>鎮及鄉街</b>主要計畫皆由<b>內政部核定</b>；特定區計畫由內政部訂定者報行政院備案。</li>
<li>自行擬定或變更細部計畫（第 24 條），得要求提供或捐贈回饋：公共設施用地、可建築土地、樓地板面積或一定金額（第 27-1 條）。</li>
<li>中小學校、社教、社福、市場、郵政、電信、變電所、衛生、警所、消防、防空等，應按<b>閭鄰單位或居民分布</b>情形適當配置。</li></ul>

<h4>公共設施保留地</h4>
<ul><li>取得方式：公用事業機構依法徵收或購買；其餘由政府以<b>徵收、區段徵收、市地重劃</b>取得（第 48 條）。</li>
<li>未取得前得申請臨時建築；不得為妨礙指定目的之使用，但得繼續為原來之使用或改為妨礙目的較輕之使用；地上物除准修繕外不得增建或改建，政府令其清除或遷移時<b>應給予補償</b>（第 50、51 條）。</li>
<li>私有保留地可與公有非公用土地<b>交換</b>，不受土地法、國有財產法及各級政府財產管理法令限制（第 50-2 條）。</li>
<li>稅賦：未作任何使用並與使用中之土地隔離者<b>免徵地價稅</b>；徵收前移轉<b>免徵土地增值稅</b>；因繼承或配偶、直系血親間贈與<b>免徵遺產稅或贈與稅</b>（第 50-1 條）。</li></ul>

<h4>國土計畫法</h4>
<ul><li>四種國土功能分區：國土保育地區、海洋資源地區、農業發展地區、城鄉發展地區。</li>
<li>使用許可：<b>國土保育地區或海洋資源地區</b>由<b>中央主管機關</b>核定；農業發展、城鄉發展地區由直轄市、縣（市）主管機關（第 24 條）。</li>
<li>通盤檢討：全國國土計畫每 10 年；直轄市、縣（市）國土計畫每 5 年。直轄市、縣（市）國土計畫已於 110 年 4 月 30 日公告實施。</li></ul>

<h4>非都市土地使用管制規則</h4>
<div class="tw"><table><tr><th>建築用地</th><th>建蔽率</th><th>容積率</th></tr>
<tr><td>甲種、乙種</td><td>60%</td><td>240%</td></tr>
<tr><td>丙種</td><td>40%</td><td>120%</td></tr>
<tr><td>丁種</td><td>70%</td><td>300%</td></tr></table></div>
<p>例：100 坪甲種建地 → 每層最大 60 坪，總樓地板 240 坪 → 可蓋 4 層。原有使用或建物不合分區規定者，得為從來之使用，除准修繕外不得增建或改建；有重大妨礙須變更或停止使用者，所受損害應予適當補償。重大建設臨時性設施核准臨時使用，應登錄於「土地參考資訊檔」。</p>`,
traps:[['主要計畫圖比例尺不得小於一萬五千分之一','錯。不得小於一萬分之一。'],['公設保留地上的地上物政府令其清除不得請求補償','錯。應給予補償。'],['農業發展地區使用許可由中央核定','錯。中央核定的是國土保育及海洋資源地區。'],['通盤檢討每 10 年一次（都市計畫）','錯。都市計畫每 3 年內或 5 年內。']]},

R13301:{title:'地價稅',lead:'地價稅每年 1～3 題：基本稅率 10‰、累進級距、自用住宅 2‰ 的面積與條件、公設保留地 6‰ 或免徵，以及代繳與罰則。',
html:`
<h4>稅率結構（土地稅法第 16～19 條）</h4>
<div class="tw"><table><tr><th>地價總額</th><th>稅率</th></tr>
<tr><td>未超過累進起點地價</td><td><b>10‰</b>（基本稅率）</td></tr>
<tr><td>超過累進起點地價未達 5 倍者，就超過部分</td><td>15‰</td></tr>
<tr><td>超過 5 倍至 10 倍者，就超過部分</td><td>25‰</td></tr>
<tr><td>超過 10 倍至 15 倍</td><td>35‰</td></tr>
<tr><td>超過 15 倍至 20 倍</td><td>45‰</td></tr>
<tr><td>超過 20 倍以上</td><td>55‰</td></tr></table></div>
<ul><li>累進起點地價：以各直轄市、縣（市）土地 <b>7 公畝</b>之平均地價為準，但不包括工業用地、礦業用地、農業用地及<b>免稅土地</b>；以<b>千元</b>為單位；於規定或重新規定地價後當年開徵前計算完竣，報財政部及內政部備查。</li>
<li>地價總額是指每一土地所有權人在<b>每一直轄市或縣（市）轄區內</b>之地價總額，不是戶籍所在地。</li></ul>

<h4>特別稅率</h4>
<div class="tw"><table><tr><th>土地</th><th>稅率</th><th>重點</th></tr>
<tr><td>自用住宅用地</td><td><b>2‰</b></td><td>都市土地 <b>3 公畝</b>、非都市土地 <b>7 公畝</b>為限；本人、配偶或直系親屬設籍；無出租或營業；本人、配偶及未成年受扶養親屬以<b>一處</b>為限</td></tr>
<tr><td>國民住宅、企業或公營事業興建之勞工宿舍</td><td>2‰</td><td>自動工興建或取得土地之日起</td></tr>
<tr><td>工業用地、礦業用地、私立公園、加油站、停車場等</td><td>10‰</td><td>—</td></tr>
<tr><td>公共設施保留地（仍建築使用）</td><td>6‰（自用住宅 2‰）</td><td><b>未作任何使用並與使用中土地隔離者免徵</b></td></tr></table></div>

<h4>代繳、罰則與其他</h4>
<ul><li>得指定土地使用人代繳：納稅義務人<b>行蹤不明</b>、<b>權屬不明</b>、<b>無人管理</b>、所有權人<b>申請由占有人代繳</b>（第 4 條）。</li>
<li>逃稅或減輕稅賦者，追補應納部分並處短匿稅額或賦額 <b>3 倍以下</b>罰鍰；規避繳納實物者處應繳田賦實物額 1 倍罰鍰；土地買賣未辦竣移轉登記再行出售者，處再行出售移轉現值 <b>2%</b> 罰鍰；應於通知繳納之日起 <b>1 個月</b>內繳納（第 54 條）。</li>
<li>田賦目前停徵。</li></ul>`,
traps:[['自用住宅地價稅都市土地以 5 公畝為限','錯。都市 3 公畝、非都市 7 公畝。'],['自用住宅 2‰ 以一次為限','錯。是以「一處」為限；土地增值稅才有一生一次。'],['累進起點地價以百元為單位','錯。以千元為單位，且不含免稅土地。'],['公設保留地一律免徵地價稅','錯。未作任何使用並與使用中土地隔離者才免徵。']]},

R13302:{title:'土地增值稅',lead:'土增稅考「審核標準用哪一天的公告現值」「自用住宅 10% 的一生一次與一生一屋」「重購退稅」「免徵與減徵」。把幾個日期與面積背好就能拿分。',
html:`
<h4>申報與審核標準</h4>
<ul><li>權利人及義務人應於訂定契約之日起 <b>30 日</b>內共同申報移轉現值（第 49 條）。</li></ul>
<div class="tw"><table><tr><th>情形</th><th>以哪一期公告土地現值為準</th></tr>
<tr><td>一般</td><td>訂約日當期</td></tr>
<tr><td>逾訂約日 30 日始申報</td><td>受理申報機關<b>收件日</b>當期</td></tr>
<tr><td>遺贈</td><td>遺贈人<b>死亡日</b>當期</td></tr>
<tr><td>依法院判決移轉登記</td><td>申報人向法院<b>起訴日</b>當期</td></tr>
<tr><td>經法院拍賣</td><td><b>拍定日</b>當期</td></tr>
<tr><td>各級政府出售之公有土地（免稅證明）</td><td>以<b>實際出售價額</b>為準</td></tr></table></div>

<h4>稅率</h4>
<ul><li>一般稅率：按漲價倍數 20%、30%、40% 累進；持有 20 年以上就超過第一級部分減徵 20%，30 年以上減徵 30%，40 年以上減徵 40%。</li>
<li>設定典權時預繳土增稅，<b>出典人回贖</b>時無息退還（第 29 條）。</li>
<li>持有期間因重新規定地價增繳的地價稅，可抵繳土增稅，以不超過應繳增值稅總額 <b>5%</b> 為限（第 31 條）。</li></ul>

<h4>自用住宅 10%</h4>
<div class="tw"><table><tr><th></th><th>一生一次（第 34 條第 1 項）</th><th>一生一屋（第 34 條第 5 項）</th></tr>
<tr><td>面積</td><td>都市 <b>3 公畝</b>、非都市 <b>7 公畝</b></td><td>都市 1.5 公畝、非都市 3.5 公畝</td></tr>
<tr><td>營業出租限制</td><td>出售前 <b>1 年</b>內無營業或出租</td><td>出售前 5 年內無營業或出租</td></tr>
<tr><td>其他</td><td>本人、配偶或直系親屬設籍；沒有持有年限要求；一生只能用一次</td><td>本人、配偶、未成年子女無該自住房屋以外之房屋；持有 6 年以上並設籍；不限次數</td></tr></table></div>

<h4>重購退稅、免徵與不課徵</h4>
<ul><li>重購退稅（第 35 條）：出售自用住宅用地、自營工廠用地、自耕農地，<b>2 年內</b>重購（或先購後售），新地地價超過原出售地價扣除土增稅後之餘額，可申請退還；重購土地 <b>5 年內</b>再行移轉或改作他用者追繳。</li>
<li>免徵：各級政府出售或依法贈與之公有土地、受贈之私有土地；私人捐贈供興辦社會福利事業之財團法人；被徵收土地；<b>公共設施保留地徵收前移轉</b>；非都市土地供公共設施使用（須依法完成使用地編定、經需用土地人開闢或核定、並經需用土地人證明，<b>不須徵收公告</b>）。</li>
<li>減徵 40%：區段徵收領回抵價地、市地重劃後第一次移轉。</li>
<li>不課徵（可申請）：農地農用移轉、配偶相互贈與、信託移轉。</li></ul>`,
traps:[['法院判決移轉以判決日之公告現值為準','錯。以起訴日。'],['遺贈以簽立遺囑日為準','錯。以遺贈人死亡日。'],['一生一次須持有 3 年以上','錯。沒有持有年限要求，只要求出售前 1 年無營業出租。'],['典權人回贖時退還預繳土增稅','錯。是出典人回贖時。']]},

R13303:{title:'房屋稅與契稅',lead:'房屋稅要以 113 年 7 月起的「房屋稅 2.0」為準（自住 1.2%、單一自住 1%、待銷售 2%～3.6%）；契稅記六種稅率、誰申報、申報起算日。',
html:`
<h4>房屋稅 2.0 稅率（113.7.1 起）</h4>
<div class="tw"><table><tr><th>房屋類別</th><th>稅率</th></tr>
<tr><td>自住住家用：無出租營業、本人配偶或直系親屬實際居住且設籍、本人配偶及未成年子女全國合計 <b>3 戶</b>以內</td><td><b>1.2%</b></td></tr>
<tr><td>其中本人、配偶及未成年子女全國<b>僅持有 1 戶</b>且房屋現值在一定金額以下</td><td><b>1%</b></td></tr>
<tr><td>起造人持有、使用執照所載為住家用之待銷售房屋，起課 2 年內</td><td><b>2%～3.6%</b></td></tr>
<tr><td>其他非自住住家用（全國歸戶累進，地方政府訂定）</td><td>2%～4.8%</td></tr>
<tr><td>公益出租人出租、以低於市場租金出租等</td><td>1.5%</td></tr>
<tr><td>非住家用：營業用</td><td>3%～5%</td></tr>
<tr><td>非住家用：私人醫院、人民團體等非營業用</td><td>1.5%～2.5%</td></tr></table></div>
<ul><li>新建、增建或改建房屋，按月比例計課。</li></ul>

<h4>房屋稅納稅義務人（第 4 條）</h4>

R14101:{title:'不動產經紀業：定義、設立、營業保證金與實價登錄',lead:'這是你未來執業的法律，題目很實務：設立要哪些步驟、保證金多少、什麼情況可退還、未簽委託契約就打廣告罰多少。',
html:`
<h4>用詞定義（第 4 條）</h4>
<div class="tw"><table><tr><th>名詞</th><th>定義</th></tr>
<tr><td>不動產</td><td>土地、土地定著物或房屋及其<b>可移轉之權利</b></td></tr>
<tr><td>成屋</td><td>領有<b>使用執照</b>，或於實施建築管理前建造完成之建築物</td></tr>
<tr><td>預售屋</td><td>領有建造執照尚未建造完成而以將來完成之建築物為交易標的之物</td></tr>
<tr><td>仲介業務</td><td>從事不動產買賣、互易、租賃之居間或代理業務</td></tr>
<tr><td>代銷業務</td><td>受起造人或建築業之委託，負責企劃並代理銷售不動產之業務</td></tr>
<tr><td>經紀人員</td><td>經紀人：執行仲介或代銷業務；經紀營業員：<b>協助</b>經紀人執行業務</td></tr>
<tr><td>差價</td><td>實際買賣交易價格與委託銷售價格之差額</td></tr>
<tr><td>營業處所</td><td>經紀業經營仲介或代銷業務之店面、辦公室或<b>非常態之固定場所</b></td></tr></table></div>

<h4>設立流程</h4>
<div class="calc"><b>五步驟</b>① 向主管機關申請<b>許可</b> → ② 辦妥<b>公司或商業登記</b> → ③ 繳存<b>營業保證金</b> → ④ 置<b>經紀人員</b> → ⑤ 加入<b>登記所在地</b>同業公會，才可營業<br>許可後應於 <b>6 個月</b>內開始營業，逾期廢止許可；開始營業後自行停止營業連續 6 個月以上，得廢止許可<br>經營<b>國外</b>不動產仲介或代銷業務者，應以<b>公司型態</b>組織辦理登記</div>
<ul><li>每一營業處所至少置經紀人 1 人；營業員超過 20 名者應增設經紀人 1 人。</li>
<li>應揭示於營業處所明顯處：仲介或代銷相關<b>證照及許可文件</b>、<b>經紀人證書</b>、<b>報酬標準及收取方式</b>（第 18 條）。</li>
<li>同業公會關於會員入會、停權、退會情形，報請所在地主管機關<b>層轉中央主管機關備查</b>。</li></ul>

<h4>營業保證金（第 7～9 條）</h4>
<ul><li>由全國聯合會統一於指定金融機構設置<b>營業保證基金</b>。仲介業每家 25 萬元（每增設一營業處所加 10 萬元）；代銷業每家 150 萬元（每增設一營業處所加 30 萬元）。</li>
<li>營業保證金<b>獨立於經紀業及經紀人員之外</b>，不因經紀業或經紀人員之債權債務關係而為讓與、扣押、抵銷或設定負擔。</li>
<li>未依規定繳存者應予停止營業處分，停止營業期間達 1 年者<b>廢止</b>許可。</li>
<li>得請求退還：公司組織<b>解散</b>、商號組織<b>歇業</b>、營業項目變更已無經紀業務而組織仍存續 → 自核准註銷營業之日滿 1 年後 2 年內請求。退出同業公會不能請求退還。</li></ul>

<h4>實價登錄（第 24-1 條）</h4>
<ul><li>經營<b>仲介</b>業務者：對居間或代理成交之<b>租賃</b>案件，於簽訂租賃契約書之日起 30 日內申報登錄（買賣案件自 110.7.1 起改由買賣雙方於申請登記時申報）。</li>
<li>經營<b>代銷</b>業務者：受託代銷預售屋，於簽訂買賣契約書之日起 30 日內申報登錄。</li>
<li>109 年修正施行前已提供查詢的資訊，應依新規定（除個資外）重新提供查詢，即門牌地號完整揭露。</li></ul>

<h4>罰則速記（第 29、32 條）</h4>
<div class="tw"><table><tr><th>違規</th><th>處罰</th></tr>
<tr><td>非經紀業而經營仲介或代銷</td><td>禁止營業，處公司負責人、商號負責人或行為人 10 萬～30 萬元</td></tr>
<tr><td>未與委託人簽訂委託契約書即刊登廣告及銷售；未置經紀人；僱用無資格者；收取差價</td><td>6 萬～30 萬元</td></tr>
<tr><td>申報登錄價格、交易面積不實</td><td>按戶（棟）3 萬～15 萬元，令限期改正，屆期未改正按次處罰</td></tr>
<tr><td>申報價格以外資訊不實</td><td>先限期改正，屆期未改正 6 千～3 萬元</td></tr>
<tr><td>未揭示證照、證書、報酬標準</td><td>先限期改正，屆期未改正才處罰</td></tr></table></div>`,
traps:[['經紀業加入戶籍所在地同業公會','錯。是登記所在地的同業公會。'],['未繳保證金停業達 1 年應撤銷許可','錯。應廢止許可。'],['退出同業公會可請求退還營業保證金','錯。只有解散、歇業、變更營業項目。'],['營業處所是常態之非固定場所','錯。是非常態之固定場所。']]},

R14102:{title:'經紀人員資格、簽章、不動產說明書、報酬與懲戒',lead:'這單元是本科最大宗：誰簽章、何時簽、說明書給誰看、收差價的後果、申誡和停止執行業務各對應哪些違規。',
html:`
<h4>經紀人 vs 營業員</h4>
<div class="tw"><table><tr><th></th><th>不動產經紀人</th><th>經紀營業員</th></tr>
<tr><td>資格</td><td>經紀人考試及格＋具 <b>1 年</b>以上營業員經驗，向直轄市、縣（市）主管機關請領證書</td><td>營業員訓練合格（不少於 <b>30 小時</b>）或經紀人考試及格，向中央指定機構團體<b>登錄</b>並領有證明</td></tr>
<tr><td>有效期限</td><td><b>4 年</b></td><td><b>4 年</b></td></tr>
<tr><td>換證／重新登錄</td><td>4 年內完成 <b>30 小時</b>專業訓練；屆滿前 6 個月內申辦</td><td>4 年內完成 <b>20 小時</b>訓練，重新登錄</td></tr></table></div>
<ul><li>消極資格：無行為能力或限制行為能力（受監護宣告）、受破產宣告尚未復權、特定犯罪判刑確定未逾一定期間、受停止執行業務處分未滿等；已充任者廢止證書。原因消滅後可重新請領。</li>
<li>外國人經訓練合格或考試及格並登錄，可充任經紀人員；業務文件、圖說應以<b>中華民國文字</b>為之。</li>
<li>專任：經紀人員應專任一經紀業，不得為自己或他經紀業執行業務；經所屬經紀業<b>同意</b>為他經紀業執行業務者除外（第 16 條）。經紀人員不得以個人名義執行業務。</li></ul>

<h4>委託契約與廣告</h4>
<ul><li>經紀業與委託人簽訂<b>委託契約書</b>後，方得刊登廣告及銷售；廣告及銷售內容應與事實<b>相符</b>，並註明<b>經紀業名稱</b>（第 21 條）。加盟店應標明加盟店或加盟經營字樣。</li>
<li>經紀業或經紀人員<b>不得收取差價或其他報酬</b>（第 19 條）。</li>
<li>報酬標準：買賣向買賣雙方收取報酬總額合計不得超過實際成交價金 <b>6%</b>；租賃合計不得超過 <b>1.5 個月</b>租金。</li>
<li>經買賣或租賃雙方書面同意，仲介業者可同時接受雙方委託，並負公平提供雙方資訊之義務（第 24-2 條）。</li></ul>

<h4>經紀人簽章的文件（第 22 條）</h4>
<div class="calc"><b>六種文件</b>① 不動產出租、出售<b>委託契約書</b> ② 不動產承租、承購<b>要約書</b> ③ <b>定金收據</b> ④ 不動產<b>廣告稿</b> ⑤ <b>不動產說明書</b> ⑥ 不動產租賃、買賣<b>契約書</b><br>代銷業務不適用 ① ②。申請許可的文件不需經紀人簽章。</div>

<h4>不動產說明書（第 23、24 條）</h4>
<ol><li>經紀人員應以不動產說明書向<b>與委託人交易之相對人</b>解說。</li>
<li>提供解說<b>前</b>，應經<b>委託人</b>簽章。</li>
<li>簽訂契約時，<b>經紀人</b>應將不動產說明書交付相對人，並由<b>相對人</b>在說明書上簽章。</li>
<li>簽約後，不動產說明書視為契約之一部分。</li></ol>
<p>不動產說明書應記載及不得記載事項，由內政部擬定、報行政院核定後公告。</p>

<h4>斡旋金與要約書（公平會規範）</h4>
<p>仲介要求斡旋金時，應主動以書面告知消費者也可選擇內政部版<b>要約書</b>（不必付任何費用），並書面明定斡旋金交付目的與權利義務；違反者屬公平交易法第 25 條顯失公平。</p>

<h4>賠償與懲戒</h4>
<ul><li>經紀人員執行業務因故意或過失不法侵害交易當事人，<b>經紀業與經紀人員負連帶賠償</b>責任；可由營業保證基金代為賠償，經紀業應於通知後限期補足（第 26 條）。</li>
<li>經紀人員應保守業務上知悉之秘密（第 25 條）。</li></ul>
<div class="tw"><table><tr><th>懲戒（第 31 條）</th><th>對應違規</th></tr>
<tr><td><b>申誡</b></td><td>違反專任（第 16 條）、簽章（第 22 條第 1 項）、<b>未以說明書解說</b>（第 23 條）、<b>洩漏秘密</b>（第 25 條）</td></tr>
<tr><td><b>停止執行業務 6 個月～3 年</b></td><td><b>收取差價</b>（第 19 條第 1 項）、廣告不實（第 21 條第 2 項）、簽章不實（第 22 條第 2 項）</td></tr>
<tr><td>累計</td><td>申誡 3 次視為停止執行業務 6 個月；停止執行業務累計達 5 年者廢止證書或證明</td></tr></table></div>
<p>獎懲委員會由<b>直轄市、縣（市）主管機關</b>設置。收取差價同時要處罰經紀業（6 萬～30 萬元），其他申誡事由只懲戒經紀人員。</p>`,
traps:[['不動產說明書於解說後由委託人簽章','錯。解說「前」經委託人簽章；簽約時交付相對人並由相對人簽章。'],['代銷業務的委託契約書也要經紀人簽章','錯。代銷不適用委託契約書與要約書。'],['未以說明書解說應停止執行業務','錯。是申誡；收取差價才是停止執行業務。'],['經紀人換證需 20 小時訓練','錯。經紀人 30 小時；營業員重新登錄才是 20 小時。']]},

R14201:{title:'公寓大廈管理條例',lead:'每年 6～8 題，是本科分量最重的單元。核心是專有／共用／約定專用的區分、修繕費誰出、區權會決議門檻、管委會職務與能力、規約效力。',
html:`
<h4>部分的區分（第 3、4、7 條）</h4>
<div class="tw"><table><tr><th>名稱</th><th>定義</th></tr>
<tr><td>專有部分</td><td>構造上及使用上可獨立且得單獨為所有權標的者</td></tr>
<tr><td>共用部分</td><td>專有部分以外之其他部分及不屬專有之附屬建築物，供共同使用者</td></tr>
<tr><td><b>約定專用部分</b></td><td><b>共用部分</b>經約定供特定區分所有權人使用者（1 樓露台給 1 樓住戶用）</td></tr>
<tr><td><b>約定共用部分</b></td><td><b>專有部分</b>經約定供共同使用者</td></tr></table></div>
<ul><li>專有部分得自由使用收益處分，但<b>不得與</b>其所屬共用部分之應有部分及基地所有權或地上權之應有部分<b>分離</b>而為移轉或設定負擔（第 4 條，無但書）。</li>
<li>不得約定專用的共用部分：建物本身所占之地面、連通數個專有部分之走廊樓梯及通往室外之通路門廳、社區巷道防火巷、基礎主要樑柱承重牆樓地板屋頂之構造、其他有固定使用方法並屬區分所有權人生活利用上不可或缺之<b>共用</b>部分（第 7 條）。</li>
<li>各區分所有權人按應有部分比例對共用部分有使用收益權，<b>但另有約定者從其約定</b>（第 9 條）。</li></ul>

<h4>修繕與費用</h4>
<div class="tw"><table><tr><th>標的</th><th>誰修</th><th>誰出錢</th></tr>
<tr><td>專有部分、約定專用部分</td><td>各該區分所有權人或約定專用人</td><td>同左</td></tr>
<tr><td>共用部分、約定共用部分（含頂樓平台防水）</td><td><b>管理負責人或管委會</b></td><td>公共基金，或區分所有權人按應有部分分擔；可歸責於某人者由其負擔</td></tr>
<tr><td>共用部分重大修繕或改良、拆除</td><td>依<b>區權會決議</b></td><td>同上</td></tr>
<tr><td>共同壁、樓地板及其內之管線</td><td>—</td><td>共同壁雙方或樓地板<b>上下方之區分所有權人</b>共同負擔（第 12 條）</td></tr></table></div>

<h4>住戶權利義務與使用限制</h4>
<ul><li>對專有部分之利用，不得妨害建築物正常使用及違反共同利益（第 5 條）；他住戶因維護修繕必須進入，不得拒絕（第 6 條）。</li>
<li>外牆、樓頂平台變更構造、顏色、設置<b>廣告物</b>、鐵鋁窗等，受規約或區權會決議限制（第 8 條）；外牆開口部或陽臺得設置<b>不妨礙逃生且不突出外牆面</b>之防墜設施（已無「兒童老人」要件）。</li>
<li>樓梯間、共同走廊、防火巷等不得堆置雜物、設置柵欄門扇或營業使用；<b>開放空間及退縮空地</b>在核准範圍內得依規約或區權會決議供營業使用（第 16 條）。</li>
<li>飼養動物：原則可以，但不得妨礙公共衛生、安寧、安全；規約另有禁止者從其規定。</li>
<li>住戶未經核准不得破壞或變更建築物主要構造。</li></ul>

<h4>區分所有權人會議</h4>
<div class="calc"><b>決議門檻（第 31 條，規約另有規定除外）</b>區分所有權人 <b>2/3</b> 以上及其區分所有權比例 <b>2/3</b> 以上出席，以出席人數 <b>3/4</b> 以上及其比例 <b>3/4</b> 以上同意。<br>未獲致決議 → 重新召集：區分所有權人三人並 1/5 以上及比例 1/5 以上出席，出席人數及比例過半數同意；會議紀錄送達後 7 日內書面反對未過半者，視為成立（第 32 條）。</div>
<ul><li>定期會議<b>每年至少一次</b>；臨時會議於發生重大事故有及時處理必要（經管委會請求）或區分所有權人 1/5 以上及比例 1/5 以上書面請求時召開（第 25 條）。</li>
<li><b>管理委員之選任</b>應在開會通知中載明並公告，<b>不得以臨時動議提出</b>（第 30 條）。</li>
<li>特別生效要件（第 33 條）：專有部分約定為約定共用 → 經該專有部分區分所有權人同意；約定專用部分變更 → 經使用該約定專用部分者同意；屋頂設置基地台等強波發射設備 → 經頂層區分所有權人同意（其他樓層經該樓層區分所有權人同意）。</li>
<li>起造人：區分所有權人登記達<b>半數</b>以上及比例合計<b>半數</b>以上時，應於 <b>3 個月</b>內召集區權會成立管委會（第 28 條）。</li></ul>

<h4>管理委員會</h4>
<ul><li>管委會有<b>當事人能力</b>（第 38 條），可以起訴、被訴。</li>
<li>任期依規約，但不得逾 2 年；主任委員、管理負責人、負責財務管理及監察業務之委員，連選得連任<b>一次</b>；其餘委員連選得連任（第 29 條）。</li>
<li>職務（第 36 條）：區權會決議事項之執行、共有及共用部分之清潔維護修繕及<b>一般</b>改良、<b>住戶違規情事之制止及相關資料之提供</b>、住戶共同事務興革事項之<b>建議</b>、共用部分及約定共用部分之點收保管、管理服務人之委任僱傭監督、重大事故請求召開臨時會等。</li>
<li>管理維護公司：經<b>中央主管機關</b>許可、辦理公司登記，並向<b>中央主管機關</b>申領登記證後始得執業。</li></ul>

<h4>公共基金與強制出讓</h4>
<ul><li>公共基金來源：起造人就領得<b>使用執照 1 年內</b>之管理維護事項按工程造價一定比例提列（申請使照時提出公庫代收證明，管委會成立並報備後由公庫撥付）、區分所有權人依區權會決議繳納、孳息等；應設<b>專戶</b>儲存，由管理負責人或管委會負責管理（第 18 條）。</li>
<li>積欠公共基金或分擔費用逾 <b>2 期</b>或達相當金額，經定期催告仍不給付，管委會得訴請法院命其給付（第 21 條）。</li>
<li>違規情節重大（含積欠達一定金額），促請改善 3 個月內仍未改善者，依<b>區權會決議</b>訴請法院命其<b>出讓</b>區分所有權及基地應有部分（第 22 條）。</li>
<li>重建：依第 13 條特別決議後，不同意者由管委會訴請法院命其出讓（第 14 條）。</li></ul>

<h4>規約</h4>
<ul><li>非經載明於規約者不生效力：約定專用與約定共用範圍及使用主體、共用部分使用之特別約定、<b>禁止飼養動物</b>之特別約定、<b>違反義務之處理方式</b>、<b>財務運作之監督規定</b>、區權會決議出席數及同意數之特別約定、糾紛之協調程序（第 23 條）。</li>
<li>區分所有權之<b>繼受人</b>，應於繼受後遵守原區分所有權人依規約所定之一切權利義務事項（第 24 條），不必簽章或知悉。</li>
<li>起造人申請<b>建造執照</b>時，應檢附專有、共用、約定專用、約定共用標示之詳細圖說及<b>規約草約</b>；非經領得建造執照不得辦理銷售（第 56、58 條）。</li></ul>`,
traps:[['頂樓平台漏水由頂樓住戶修繕','錯。頂樓平台是共用部分，由管委會修繕。'],['區權會決議門檻是過半數出席、過半數同意','錯。是 2/3 出席、3/4 同意（重新召集才放寬）。'],['管理委員選任可用臨時動議','錯。必須在開會通知中載明並公告。'],['強制出讓由管委會會議決議訴請法院','錯。要依區分所有權人會議之決議。']]},

R14301:{title:'消費者保護法（含定型化契約與預售屋）',lead:'消保法每年 4～6 題：定型化契約的審閱期、無效與不構成契約內容的區別、通訊與訪問交易 7 日解約、團體訴訟要件、懲罰性賠償金倍數。',
html:`
<h4>重要定義（第 2 條）</h4>
<ul><li><b>定型化契約條款</b>：企業經營者為與多數消費者訂立同類契約，所提出預先擬定之契約條款；<b>不限書面</b>，以放映字幕、張貼、牌示、網際網路或其他方法表示者亦屬之。對單一客戶的個別磋商內容不是定型化條款。</li>
<li><b>通訊交易</b>：以廣播、電視、電話、網際網路、型錄等方法，消費者於<b>未能檢視商品</b>下訂立之契約。</li>
<li><b>訪問交易</b>：企業經營者<b>未經邀約</b>而在消費者住居所、工作場所、公共場所等訂立之契約。</li>
<li><b>分期付款</b>：約定消費者支付頭期款，餘款分期支付，企業經營者於收受頭期款時交付標的物。</li></ul>

<h4>商品及服務責任</h4>
<ul><li>製造者、設計者、服務提供者負<b>無過失</b>責任；企業經營者主張其商品於流通時符合當時科技或專業水準可合理期待之安全性者，<b>由企業經營者負舉證責任</b>（第 7、7-1 條）。</li>
<li>經銷商與製造者連帶負責，但已盡相當之注意或縱加相當注意仍不免發生損害者不負責（第 8 條）。</li>
<li>輸入商品者，<b>視為</b>設計、生產、製造者，負製造者責任（第 9 條），沒有經銷商的免責但書。</li></ul>

<h4>定型化契約</h4>
<div class="tw"><table><tr><th>情形</th><th>效果</th><th>條文</th></tr>
<tr><td>條款有疑義</td><td>為<b>有利於消費者</b>之解釋</td><td>11</td></tr>
<tr><td>未提供 30 日以內合理審閱期間</td><td>條款<b>不構成契約內容</b>，但消費者得主張仍構成</td><td>11-1</td></tr>
<tr><td>以條款使消費者拋棄審閱期</td><td><b>無效</b>（「已審閱 5 日以上，無須審閱期」這類條款）</td><td>11-1</td></tr>
<tr><td>違反誠信、顯失公平</td><td>無效</td><td>12</td></tr>
<tr><td>牴觸個別磋商條款</td><td>牴觸部分無效</td><td>15</td></tr>
<tr><td>違反中央主管機關公告之應記載或不得記載事項</td><td>條款無效；應記載事項未記載仍構成契約內容（不須消費者主張）</td><td>17</td></tr></table></div>
<ul><li>推定顯失公平（第 12 條）：違反平等互惠原則、條款與其所排除不予適用之任意規定立法意旨顯相矛盾、契約之主要權利或義務因受條款限制致契約目的難以達成。</li>
<li>應記載或不得記載事項由中央主管機關擬訂、報請行政院核定後公告；應記載包括重要權利義務、違約法律效果、<b>預付型交易之履約擔保</b>、解除權終止權；不得記載包括企業經營者<b>保留變更權或解釋權</b>、限制或免除企業經營者之義務或責任。</li>
<li>實務審閱期：預售屋 5 日、成屋買賣 5 日、不動產委託銷售 3 日、住宅租賃 3 日。</li>
<li>預售屋應記載事項：須有履約保證（不動產開發信託、價金返還保證、價金信託、同業連帶擔保等）；接通自來水、電力之管線費等由<b>賣方</b>負擔。</li></ul>

<h4>特種交易與消費資訊</h4>
<ul><li>通訊交易、訪問交易：收受商品或接受服務後 <b>7 日</b>內，以退回商品或書面通知解除契約，<b>無須說明理由及負擔任何費用或對價</b>；不得以特約排除（第 19 條）。書面通知解約者，企業經營者應於收到通知次日起 15 日內取回商品。</li>
<li>分期付款買賣契約書應載明：頭期款、各期價款與附加費用合計之總價款與現金交易價格之差額、利率（第 21 條）。</li>
<li>企業經營者應確保廣告內容之真實，對消費者所負之義務<b>不得低於廣告之內容</b>（第 22 條）；建商廣告送德國廚具就要給德國廚具。</li>
<li>媒體經營者<b>明知或可得而知</b>廣告與事實不符，與企業經營者負連帶責任（第 23 條）。</li>
<li>書面保證書應載明：商品名稱種類數量及製造號碼、保證內容、保證期間及起算方法、製造商名稱地址、經銷商名稱地址、交易日期（第 25 條）。</li></ul>

<h4>消保團體、申訴調解、訴訟</h4>
<ul><li>消保團體以<b>社團法人或財團法人</b>為限；檢驗結果有錯誤時，應使企業經營者有澄清機會；政府應予協助。</li>
<li>團體訴訟：許可設立 <b>2 年</b>以上、置有消保專門人員、經<b>行政院</b>評定優良；受讓 <b>20 人</b>以上請求權；應委任律師；不得請求報酬（第 49、50 條）。</li>
<li>企業經營者應於申訴之日起 <b>15 日</b>內妥適處理（第 43 條）。</li>
<li>調解方案送達後 <b>10 日</b>不變期間內可提出異議（第 45-2 條）；小額消費爭議一造不到場，調解委員依職權提出方案，應經<b>全體</b>調解委員過半數同意（第 45-4 條）。</li>
<li>懲罰性賠償金（第 51 條）：<b>故意</b> 5 倍以下、<b>重大過失</b> 3 倍以下、<b>過失</b> 1 倍以下。</li></ul>`,
traps:[['定型化條款有疑義應公平解釋，不偏向任一方','錯。應為有利於消費者之解釋。'],['未給審閱期，該條款無效','錯。是「不構成契約內容」，消費者可主張仍構成；拋棄審閱期的條款才是無效。'],['訪問交易猶豫期 10 日','錯。7 日。'],['團體訴訟須經內政部評定優良','錯。經行政院評定優良。']]},

R14401:{title:'公平交易法（含不動產業適用）',lead:'題目兩大類：一是名詞與制度（聯合行為、結合門檻、許可期限），二是不動產實務（不實廣告、斡旋金、加盟限制）。記住「內政部管哪些、公平會管哪些」。',
html:`
<h4>基本概念</h4>
<ul><li><b>競爭</b>：<b>二以上</b>事業在市場上以較有利之價格、數量、品質、服務或其他條件，爭取交易機會之行為（第 4 條）。同業公會視為事業。</li>
<li>獨占：在相關市場處於無競爭狀態，或具有壓倒性地位可排除競爭。</li>
<li>依智慧財產權法規<b>行使權利之正當行為</b>不適用本法（第 45 條）；事業關於競爭之行為，優先適用本法（第 46 條）。</li></ul>

<h4>結合（第 10～13 條）</h4>
<ul><li>申報門檻：結合後市占率達 <b>1/3</b>；參與結合之一事業市占率達 <b>1/4</b>；銷售金額超過公告金額。</li>
<li>結合對整體經濟利益大於限制競爭之不利益者，不得禁止；可徵詢外界意見或委請學術機構分析。</li>

<h4>聯合行為（第 14～17 條）</h4>

const PAST=[{"id": "p114c", "label": "114年・民法概要", "year": 114, "subj": "R11", "qs": [["C", "依我國民法有關死亡宣告之規定，下述何者錯誤？", ["失蹤人遺留之與他人共有不動產之共有人，得聲請對失蹤人為死亡宣告", "失蹤人已年滿80 歲，其失蹤期間應滿3 年後，始得被聲請死亡宣告", "失蹤人受死亡宣告後，生存歸來時，得聲請地檢署撤銷死亡宣告", "受死亡宣告之失蹤人實際上仍生存時，其權利能力不因死亡宣告而喪失"], "R11101", "死亡宣告的撤銷由法院裁定（家事事件），不是向地檢署聲請。(A) 利害關係人（含共有人）可聲請；(B) 80 歲以上失蹤滿 3 年（民法第 8 條）；(D) 死亡宣告只是「推定」死亡，人實際活著，權利能力不因此喪失。", "", ""], ["B", "我國民法修正時，增訂有關監護宣告及輔助宣告制度之規定。依現行民法相關之規定，下列何者錯誤？", ["受監護宣告之成年人，無行為能力", "成年人因精神障礙或其他心智缺陷，致其辨識其意思表示效果之能力顯有不足者，得因聲請，對其為監護之宣告", "受監護宣告之成年人，仍保有完全之權利能力", "受輔助宣告之成年人逕自締結汽車之買賣契約，該契約不因欠缺輔助人之事前同意而無效"], "R11101", "「辨識能力顯有不足」是輔助宣告的要件（民法第 15-1 條）；監護宣告要件是「不能為意思表示、受意思表示或不能辨識其效果」（第 14 條）。受監護宣告者無行為能力、但仍有權利能力。", "", ""], ["C", "下列敘述，何者與民法法人之規定並不相容？", ["民法關於公益社團法人之設立，係採取許可主義", "法人解散後，在清算程序中，在清算之必要範圍內，仍具有法人格", "法人之權利能力，受到性質上之限制，因此無法享有民法賦予自然人所有之人格權利", "財團法人之設立，捐助人亦得以遺囑捐助之方式為之，且以此種方式設立之財團法人，無須訂立捐助章程"], "R11101", "法人在法令限制內享有權利，只排除「專屬自然人」者（如身體權、親屬權）；名譽、姓名、信用等人格權法人仍可享有，所以說「無法享有」錯。", "", ""], ["C", "甲當選A 法人董事，準備大顯身手，下列敘述何者錯誤？", ["就A 法人一切事務，甲可代表A 法人", "A 法人可僅設甲一位董事", "A 法人若對甲董事之代表權加以限制，其限制得對抗任何第三人", "若A 法人僅有甲與丙兩位董事，則該法人事務之執行，若兩人意見相左，則恐陷入表決的僵局"], "R11101", "民法第 27 條第 3 項：對董事代表權所加的限制，不得對抗「善意」第三人，不是任何第三人都能對抗。", "", ""], ["D", "有關自然人從事有效法律行為之情形，依現行民法規定，應以具備完全之行為能力為其要件。對此，下列相關之選項何者正確？", ["年滿16 歲之人，取得完全行為能力", "15 歲之人得逕行有效撤銷被他人詐欺而締結日常生活所需之買賣契約", "14 歲之未成年人得有效書立遺囑", "某成年人被法院為輔助之宣告，若未得輔助人事前同意，即締結消費借貸契約，其得於法院撤銷該輔助宣告後，承認該消費借貸契約，使之逕行生效"], "R11101", "受輔助宣告者未經同意的消費借貸，效力未定（準用第 79 條），輔助宣告撤銷後本人可自行承認使其生效。(A) 成年為 18 歲；(C) 遺囑能力是滿 16 歲（第 1186 條）。", "", ""], ["D", "民法規定權利客體中動產、不動產之定義、種類及變動之法定方式；依該規定之內容，下列何者屬於正確之敘述？", ["甲在所有A 地種植芭樂樹，樹上之芭樂成熟時，即已成為獨立之動產", "甲為慶祝關聖帝君生日臨時搭建完成之表演舞台，屬於甲獨立取得之定著物所有權", "甲移轉買賣標的物之A 地予乙，甲、乙完成A 地所有權讓與合意並交付A 地後，乙即成為A地之新所有權人", "甲在A 地池塘養殖金魚，池中金魚所生金魚苗，由甲取得該金魚苗之獨立動產物權"], "R11102", "天然孳息分離時歸收取權人（第 766 條），金魚苗屬甲。(A) 未分離的果實是土地的一部分；(B) 臨時舞台非定著物；(C) 不動產依法律行為取得須書面＋登記（第 758 條），交付不生效。", "", ""], ["C", "不同之權利主體以法律行為方式，形成了彼此間之法律關係。嗣後，當事人一方發現自己已為之意思表示發生錯誤，乃依 民法第88 條 規定行使撤銷權。下列相關之敘述，何者錯誤？", ["該錯誤之意思表示若因表意人之過失所致時，表意人不得撤銷其所為之意思表示", "該錯誤必須在交易上被認為具有重要性", "錯誤之表意人必須在意思表示後，於2 年內行使撤銷權，反之於除斥期間經過後，該法律關係即應繼續有效存續", "錯誤之表意人撤銷其意思表示後，對於相對人應承擔信賴該法律行為有效而生之損害賠償責任"], "R11102", "錯誤撤銷的除斥期間是自意思表示後「1 年」（民法第 90 條），不是 2 年。表意人有過失不得撤銷（第 88 條），撤銷後對善意相對人負信賴利益賠償（第 91 條）。", "", ""], ["C", "關於無因管理之制度，下列何者非屬我國民法相關規範之內容？", ["無因管理人誤將客觀上屬於自己事務當作他人之事務，而為事務之管理者，不成立民法之無因管理", "無因管理人違反本人明示或可得推知之意思，代本人繳納贈與稅捐，得依民法第176 條之規定，請求本人返還", "管理人為免除本人生命之急迫危險，因重大過失造成本人財產上之損害，亦無須負損害賠償的責任", "管理人明知為他人事務，卻違反本人明示或可得推知之意思或僅為自己利益，而為他人事務之管理者，本人主張管理事務之利益時，對管理人負第176 條第1 項之義務，以其所得利益為限"], "R11201", "民法第 175 條：為免除本人生命、身體或財產急迫危險而管理，只就「惡意或重大過失」負責，所以重大過失仍要賠，(C) 錯。", "", ""], ["D", "甲授與乙代理權，並委任乙與丙商談甲買受丙所有房屋及辦理移轉所有權之事宜。下列敘述何者錯誤？", ["本件代理權的授與和委任契約二者均須書面", "若丙自始至終不知道乙為甲的代理人，且債權契約和物權契約當事人簽乙的名字，則本件法律效果無法歸屬於甲", "若甲知道丙欺騙乙，把房屋的優點講得天花亂墜，但甲仍要乙代理他買下房屋，則甲事後不得主張受詐欺撤銷意思表示", "甲跟乙說好，最多出價1 億元，1 億元的事情沒寫在書面，乙和丙講價的結果，被丙說服用行情價1 億1 千萬簽訂契約。該買賣契約在1 億元價金的範圍內有效"], "R11103", "逾越代理權限的部分屬無權代理（第 170 條），且代理權的內部限制不得對抗善意第三人（第 107 條）；法律沒有「在 1 億元範圍內有效」這種切割，(D) 錯。", "", ""], ["C", "下述情形，何者不符合我國民法侵權行為之規定？", ["加害人因過失致直接被害人死亡，因直接被害人已喪失權利能力，無須對直接被害人負非財產上之損害賠償", "承攬人於執行承攬事務不法侵害他人之權利，除定作人於定作或指示有過失者，原則上定作人無須負損害賠償責任", "限制行為能力人不法侵害他人權利，且於行為時無識別能力，其法定代理人對被害人亦無須負擔賠償責任", "受僱人執行職務，因過失不法侵害他人之權利，如僱用人對於受僱人已盡選任、監督相當之注意義務，僱用人不負賠償責任"], "R11201", "限制行為能力人行為時無識別能力，由法定代理人「單獨」負賠償責任（第 187 條第 1 項後段），不是免責。", "", ""], ["C", "甲賣給乙一隻狗狗，名喚S，乙光看甲提供的S 犬照片就喜歡的不得了，馬上承諾以10 萬元的價金訂立契約。下列何者錯誤？", ["若S 實則在甲、乙訂立契約前已死亡，則甲、乙契約無效", "若S 身上有跳蚤，並傳染給乙的貓咪B 和乙家的環境，則甲應負加害給付責任", "若S 其實是甲母的狗，僅因甲母出國，暫時寄放於甲處，則乙即使已經把S 抱回家照顧，乙絕不可能取得S 的所有權", "若乙向甲主張交付S，甲得主張同時履行抗辯"], "R11202", "動產可以善意取得（第 801、948 條）：乙善意受讓並占有 S 犬，就可能取得所有權，「絕不可能」錯。(B) 跳蚤傳染屬加害給付；(D) 雙務契約可主張同時履行抗辯。", "", ""], ["B", "甲將房屋租給乙。下列何者正確？", ["租期若超過1 年，且未寫書面契約，則租賃契約無效", "若未特別約定，則乙有權將其中的房間分租給丙", "若未特別約定，則乙有權將承租人的地位債權讓與給丙", "若雙方約定租期3 年，3 年過後乙默默繳房租，甲默默收房租，則雙方均不得主張租賃契約默示更新"], "R11202", "民法第 443 條：房屋承租人除有反對約定外，可以把「一部分」轉租。(A) 未立書面的逾 1 年不動產租約視為不定期租賃，不是無效；(C) 承租人地位移轉需出租人同意；(D) 期滿續收租金依第 451 條視為不定期租賃。", "", ""], ["D", "對於權利主體間之贈與契約，依我國民法規定，下列何者為正確之論述？", ["在經公證之贈與契約，贈與人因可歸責之事由致給付遲延，受贈人得依民法第231 條之規定請求贈與人對於遲延給付造成之損害，負賠償責任", "依現行民法之規定，以不動產為標的之贈與契約，屬於具要物性之法律行為", "贈與人所贈與之標的物本身具有瑕疵，贈與人應負無過失之擔保責任", "贈與人所贈與之標的物具有瑕疵，造成受贈人之損害，僅於贈與人故意不告知其瑕疵或保證其無瑕疵時，始得請求賠償"], "R11202", "贈與原則不負瑕疵擔保，只有故意不告知瑕疵或保證無瑕疵時才賠（第 411 條）。(A) 贈與給付遲延不能請求遲延損害（第 409 條）；(B) 贈與是諾成契約。", "", ""], ["D", "甲、乙兩人合夥開了一家小麵館M，生意興隆。下列何者錯誤？", ["如甲在麵館以外之場所猥褻K，乙無須對K 負連帶損害賠償責任", "麵體供應商J 多次索取買賣價金均無果，J 得以M 為被告請求履行債務", "甲、乙兩人想把M 收起來，尚須經清算程序", "M 麵館的餐具是甲提供的、攤車是乙提供的，當麵館持續在營業時，餐具的所有權仍是甲的、攤車的所有權仍是乙的"], "R11202", "合夥人的出資屬合夥人「全體公同共有」（第 668 條），餐具、攤車已不再是甲或乙單獨所有。", "", ""], ["A", "依現行民法物權編有關不動產所有權相鄰關係規定之內容，下列之選項，何者正確？", ["土地所有人建築房屋故意逾越地界者，法院得斟酌公共利益後，能允許鄰地所有人請求移去或變更", "共有土地因分割，致其中一共有人所取得分得土地與公路無適宜之聯絡，無法為通常之使用，應支付償金，取得通行他分割人所有地之權利", "果實自落於鄰地，推定由鄰地所有人取得所有權", "鄰地所有人因營造或修繕建築物之必要，得使用土地所有人之土地及其上建物內部閒置之空間。但受有損害時，則得拒絕鄰地所有人之使用"], "R11301", "故意越界建屋，不適用第 796-1 條由法院斟酌免除移去的規定，鄰地所有人仍可請求移去。(B) 因分割致成袋地，通行他分割人土地「無須」支付償金（第 789 條）；(C) 果實自落鄰地是「視為」屬於鄰地（第 798 條）；(D) 受損害可請求償金，不能拒絕（第 792 條）。", "", ""], ["A", "甲、乙兩人共有A 地，應有部分甲為1/3、乙為2/3。下列何者錯誤？", ["若甲、乙協議20 年內不得分割，則在該期限內，不論發生任何事由，甲、乙均不得請求分割", "甲得在未經乙的同意下，將其應有部分贈與及移轉給丁", "若甲商請乙分割A 地未果，甲可聲請法院分割A 地，此時法院須優先考慮原物分配", "A 地由丙無權占有使用，乙得在未經甲的同意下請求丙返還A 地"], "R11301", "不分割約定最長 5 年（逾 5 年縮為 5 年），且有重大事由時仍得隨時請求分割（第 823 條）。(B) 應有部分可自由處分（第 819 條）；(D) 各共有人可為全體利益請求返還（第 821 條）。", "", ""], ["D", "依我國民法關於地上權之規定，下列何者正確之論述？", ["地上權未定有存續期間者，逾越30 年後，土地所有人始得向法院請求，定其後續之存續期間，或終止該地上權", "地上權人因不可抗力之事由導致妨礙其行使地上權使用時，得拒絕或減少地租之支付", "地上權人積欠地租達2 年總額時，除另有習慣外，土地所有人得逕行終止存續期限尚未屆至之地上權", "已設定地上權之土地所有權人，於地上權存續期間讓與該土地所有權與第三人，已預收之地租如已登記，地上權人得以該預付地租對抗受讓之第三人"], "R11302", "預付地租經登記，可以對抗土地受讓人（第 836-1 條）。(A) 未定期限的地上權是逾「20 年」或目的消滅後可請求（第 833-1 條）；(B) 不可抗力不得請求減免地租（第 837 條）；(C) 欠租達 2 年總額須先定期催告才能終止（第 836 條）。", "", ""], ["D", "關於占有，下列何者錯誤？", ["占有於我國為事實，而非占有權", "無權占有人亦有占有物返還請求權", "占有與取得時效有關", "惡意占有人，因保存占有物所支出之必要費用，不得請求償還"], "R11302", "惡意占有人為保存占有物支出的必要費用，仍可依無因管理規定請求償還（第 957 條），(D) 錯。", "", ""], ["B", "甲所有的A 地與乙所有的B 地相鄰。下列何者正確？", ["A 地兩面環山、第三面環河，僅能經過B 地通行於道路，則甲須經乙的同意，始得取得對B 地的通行權", "A 地一面環山、一面環河、一面接著大馬路、一面緊鄰B 地，甲聽信風水師的建議，將面臨大馬路的那一面築起無門的高牆因此無法通行，則甲須經乙的同意，始得取得對B 地的通行權", "袋地通行權性質上並非
